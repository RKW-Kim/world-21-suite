<style>
:root{
--acc:#FFC107;--acc-rgb:255,193,7;--on:#0A0A0A;--fg:#FAFAFA;--mut:#A1A1AA;--fnt:#71717A;
--up:#0ECB81;--down:#F6465D;--live:#FF375F;
--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.32,1.45,.45,1);
--fd:'Space Grotesk',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace;--fb:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:var(--fb);-webkit-font-smoothing:antialiased;user-select:none;color:var(--fg)}
svg{display:block}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
/* backdrops */
#bk{position:fixed;inset:0;z-index:0}
body.bk-studio #bk{background:radial-gradient(90% 70% at 50% 30%,#14161D,#07080B 74%)}
body.bk-bright #bk{background:linear-gradient(160deg,#E8EAEE,#B9BFCC 55%,#8E96A8)}
body.bk-market #bk{background:linear-gradient(115deg,#12102E,#2A1430 28%,#0E2233 55%,#14261F 78%,#241231);background-size:220% 220%;animation:bkflow 14s ease-in-out infinite alternate}
@keyframes bkflow{to{background-position:100% 100%}}
/* island */
#islw{position:absolute;top:24px;left:50%;transform:translateX(-50%);z-index:60;pointer-events:none}
#isl{position:relative;display:flex;align-items:center;padding-left:9px;overflow:hidden;border-radius:999px;max-width:calc(100vw - 40px);min-width:0;opacity:0;transform:translateY(-8px);background:linear-gradient(165deg,#16161B 0%,#060608 55%,#000 100%);box-shadow:0 24px 50px -16px rgba(0,0,0,.75),0 4px 16px rgba(0,0,0,.35);transition:opacity .5s ease,transform .6s var(--spring)}
#isl.on{opacity:1;transform:none}
#isl::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:4;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.07) 30%,rgba(255,255,255,.015) 55%,rgba(255,255,255,.10));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
#isl::after{content:"";position:absolute;top:0;left:-70%;width:42%;height:100%;z-index:3;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(255,255,255,.055),transparent);transform:skewX(-18deg);animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-70%}85%,100%{left:135%}}
#isl.bump{animation:bump .34s var(--spring)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.02)}100%{transform:scale(1)}}
#isl.liquid{background:linear-gradient(168deg,#FFD84E 0%,#FFC107 48%,#EDA400 100%)}
#isl.liquid::before{background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.25) 30%,rgba(255,255,255,.08) 60%,rgba(255,255,255,.4))}
#isl.liquid::after{display:none}
.bubs{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;border-radius:inherit;opacity:0;transition:opacity .6s ease}
#isl.bub .bubs{opacity:1}
.bubs i{position:absolute;bottom:-12px;border-radius:50%;background:rgba(255,255,255,.10);animation:bub 4.8s ease-in infinite}
#isl.liquid .bubs i{background:rgba(255,255,255,.38)}
@keyframes bub{0%{transform:translateY(0) scale(.5);opacity:0}12%{opacity:.55}100%{transform:translateY(-160px) scale(1.15);opacity:0}}
#punch{flex:none;display:grid;place-items:center;position:relative;z-index:2}
#punch .smk{width:28px;height:28px}
#stg{position:relative;flex:1 1 auto;min-width:0;height:100%;z-index:2;margin-left:10px}
.view{position:absolute;left:0;top:0;bottom:0;width:100%;display:flex;align-items:center;overflow:hidden;opacity:0;pointer-events:none}
.view.on{opacity:1}
.view.in{animation:vIn .45s var(--ease) both}
.view.in>*{animation:chIn .5s var(--ease) both;animation-delay:.1s}
.view.in>*:nth-child(2){animation-delay:.15s}
.view.in>*:nth-child(3){animation-delay:.2s}
.view.out{animation:vOut .14s ease forwards}
@keyframes vIn{0%{opacity:0;transform:scale(.94) translateY(5px);filter:blur(8px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes vOut{to{opacity:0;transform:scale(.965);filter:blur(6px)}}
@keyframes chIn{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:none}}
.measure{position:fixed;left:-9999px;top:0;bottom:auto;width:max-content;visibility:hidden;opacity:0;pointer-events:none}
/* idle — clustered, hugs content */
.view.idle{gap:13px;padding:0 18px 0 14px}
.lv{display:flex;align-items:center;gap:7px;font-family:var(--fd);font-weight:700;font-size:10.5px;letter-spacing:.18em;color:var(--live)}
.lv i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:softpulse 1.6s infinite}
@keyframes softpulse{0%,100%{opacity:1}50%{opacity:.3}}
.upt{font-size:12px;color:rgba(255,255,255,.75)}
.ihair{width:1px;height:14px;background:rgba(255,255,255,.14);flex:none}
.pairwrap{display:flex;align-items:baseline;gap:8px}
.psym{font-size:10.5px;color:rgba(255,255,255,.4);letter-spacing:.12em}
.ppx{font-size:13px;font-weight:700;color:#fff}
.ppc{font-size:11px;font-weight:700}
.roll{animation:tickUp .7s ease-out}
.roll.dn{animation-name:tickDown}
@keyframes tickUp{0%{color:var(--up)}100%{color:var(--fg)}}
@keyframes tickDown{0%{color:var(--down)}100%{color:var(--fg)}}
.sess{display:flex;gap:8px;align-items:center}
.sdt{display:flex;gap:4px;align-items:center;font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;color:rgba(255,255,255,.4)}
.sdt i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18)}
.sdt.open{color:rgba(255,255,255,.9)}
.sdt.open i{background:var(--up);box-shadow:0 0 6px var(--up)}
/* alert small — one dense row */
.view.as{gap:13px;padding:0 20px 0 14px;justify-content:space-between}
.aico{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;color:var(--acc);background:rgba(var(--acc-rgb),.13);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.35),inset 0 1px 0 rgba(255,255,255,.12);animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.atx{display:flex;flex-direction:column;gap:2px;min-width:0}
.atx b{font-family:var(--fd);font-weight:700;font-size:17px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.atx span{font-size:12px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aamt{flex:none;font-family:var(--fd);font-weight:700;font-size:14px;color:var(--acc);background:rgba(var(--acc-rgb),.12);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.38);border-radius:999px;padding:7px 14px}
/* alert large — two zones, message fills the rest */
.view.al{flex-direction:column;justify-content:center;gap:10px;padding:13px 20px 13px 14px}
.ahead{display:flex;align-items:center;gap:13px;min-width:0;width:100%}
.ahead .aico{width:40px;height:40px}
.amsg{flex:1;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.78);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%}
/* trade — three hairline bands, fills the slab */
.view.trade{flex-direction:column;justify-content:space-between;padding:0}
.tband{display:flex;align-items:center;gap:11px;padding:11px 20px 11px 14px}
.tband+.tband{border-top:1px solid rgba(255,255,255,.07)}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px rgba(255,193,7,.7);animation:softpulse 1.8s infinite;flex:none}
.tmkt{font-family:var(--fd);font-weight:700;font-size:17px;color:#fff}
.tside{font-size:9px;font-weight:800;letter-spacing:.16em;padding:4px 10px;border-radius:999px;flex:none}
.tside.long{color:var(--up);background:rgba(14,203,129,.15);box-shadow:inset 0 0 0 1px rgba(14,203,129,.4)}
.tside.short{color:var(--down);background:rgba(246,70,93,.15);box-shadow:inset 0 0 0 1px rgba(246,70,93,.4)}
.ttime{margin-left:auto;font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.08em}
.tmain{flex:1;min-height:0}
.tpnl{font-family:var(--fm);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1}
.tsub{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.55);margin-top:7px}
.tsub b{color:rgba(255,255,255,.8);font-weight:600}
.tstats{margin-left:auto;display:flex}
.tcell{display:flex;flex-direction:column;gap:4px;padding:2px 16px;text-align:right}
.tcell+.tcell{border-left:1px solid rgba(255,255,255,.05)}
.tcell label{font-size:8.5px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.42)}
.tcell b{font-size:13.5px;font-weight:600;color:#fff}
.tlab{font-size:9px;font-weight:600;letter-spacing:.14em;color:rgba(255,255,255,.45);line-height:1.3;flex:none}
.tlab b{display:block;font-size:11px;color:rgba(255,255,255,.75);letter-spacing:0}
.lbar{position:relative;flex:1;height:5px;border-radius:999px;background:linear-gradient(90deg,rgba(246,70,93,.45),rgba(255,255,255,.1) 50%,rgba(14,203,129,.45))}
.ldot{position:absolute;top:50%;left:50%;width:11px;height:11px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(0,0,0,.55),0 0 12px rgba(255,255,255,.65);transition:left .7s var(--ease)}
.lbear,.lbull{position:absolute;top:50%;transform:translateY(-50%);display:flex}
.lbear{left:-2px;color:var(--down)}
.lbull{right:-2px;color:var(--up)}
.lbear svg,.lbull svg{width:13px;height:13px}
/* result */
.view.res{gap:16px;padding:0 22px 0 14px}
.rcol{display:flex;flex-direction:column;gap:4px}
.rt{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.26em;color:rgba(255,255,255,.55)}
.rv{font-family:var(--fm);font-weight:700;font-size:28px;letter-spacing:-.02em;color:#fff}
.rbtn{font-family:var(--fm);font-size:12px;font-weight:600;color:rgba(255,255,255,.7);border-radius:999px;padding:6px 13px;background:rgba(0,0,0,.14);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.view.res.loss .rt,.view.res.loss .rv{color:var(--down)}
/* liquid + moods */
#isl.liquid .lv{color:var(--on)}
#isl.liquid .upt,#isl.liquid .psym,#isl.liquid .ppc,#isl.liquid .sdt,#isl.liquid .atx span,#isl.liquid .amsg,#isl.liquid .tsub,#isl.liquid .tlab,#isl.liquid .ttime,#isl.liquid .tcell label{color:rgba(10,10,10,.6)}
#isl.liquid .ppx,#isl.liquid .atx b,#isl.liquid .tmkt,#isl.liquid .tpnl,#isl.liquid .tcell b,#isl.liquid .tlab b,#isl.liquid .rv{color:var(--on)}
#isl.liquid .ihair{background:rgba(0,0,0,.2)}
#isl.liquid .aamt{color:var(--on);background:rgba(0,0,0,.14);box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
#isl.liquid .rbtn{color:var(--on);background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
#isl.liquid .tband+.tband{border-top-color:rgba(0,0,0,.12)}
#isl.liquid .smk .fc{fill:var(--on)}
#isl.liquid .smk .fe{fill:var(--acc)}
#isl.liquid .smk .fm{stroke:var(--acc)}
.smk .fc{fill:var(--acc)}
.smk .fe{fill:var(--on);transform-box:fill-box;transform-origin:center;transition:transform .16s ease}
.smk .fm{fill:none;stroke:var(--on);stroke-width:7.5;stroke-linecap:round}
.smk.blink .fe{transform:scaleY(.12)}
.smk.look-r .fe{transform:translateX(5px)}
.smk.celebrate{animation:mBounce .9s var(--spring)}
@keyframes mBounce{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-9%) scale(1.07)}60%{transform:translateY(2%) scale(.98)}100%{transform:none}}
.smk.shake{animation:mShake .55s ease}
@keyframes mShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}}
/* harness */
#deck{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:300;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:920px;padding:10px 12px;border-radius:18px;background:rgba(12,12,14,.9);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px)}
#deck .grp{display:flex;gap:5px;padding-right:10px;margin-right:4px;border-right:1px solid rgba(255,255,255,.08)}
#deck .grp:last-child{border-right:0;margin-right:0;padding-right:0}
#deck button{height:30px;padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
#deck button:hover{border-color:rgba(255,193,7,.55);color:var(--acc)}
#deck button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
#read{position:fixed;top:14px;right:16px;z-index:300;font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.45);text-transform:uppercase}
#labtag{position:fixed;top:14px;left:16px;z-index:300;font-family:var(--fm);font-size:10px;letter-spacing:.24em;color:rgba(255,255,255,.35);text-transform:uppercase}
body.bp .view,body.bp #punch{outline:1px dashed rgba(0,255,255,.3);outline-offset:-2px}
@media (prefers-reduced-motion:reduce){.bubs i,.lv i,.tdot{animation:none!important}}
</style>
</head>

/* springs — identical to live */
function Spr(v){this.v=v;this.t=v;this.vel=0;this.k=300;this.d=24}
Spr.prototype.to=function(t,k,d){if(k)this.k=k;if(d)this.d=d;if(!MOTION){this.v=t;this.t=t;this.vel=0;Isl.paint();return}
 if(Math.abs(t-this.t)<.01&&Math.abs(t-this.v)<.01&&Math.abs(this.vel)<.01){this.v=this.t;this.vel=0;Isl.paint();return}
 this.t=t;Eng.add(this)};
Spr.prototype.step=function(dt){var F=(this.t-this.v)*this.k-this.vel*this.d;this.vel+=F*dt;this.v+=this.vel*dt;
 if(Math.abs(this.t-this.v)<.08&&Math.abs(this.vel)<.15){this.v=this.t;this.vel=0;return false}return true};
var Eng={A:[],on:false,last:0,speed:1,
 add:function(s){if(Eng.A.indexOf(s)<0)Eng.A.push(s);Eng.wake()},
 wake:function(){if(Eng.on)return;Eng.on=true;Eng.last=performance.now();requestAnimationFrame(function(t){Eng.loop(t)})},
 loop:function(now){var dt=clamp((now-Eng.last)/1000,.001,.05)*Eng.speed;Eng.last=now;var any=false;
  for(var i=Eng.A.length-1;i>=0;i--){if(Eng.A[i].step(dt))any=true;else Eng.A.splice(i,1)}
  Isl.paint();
  if(Stage.cur){Stage.age+=dt*1000;if(Stage.age>=Stage.cur.dwell)Stage.end()}
  if(any||Stage.cur)Eng.wake();else Eng.on=false}};

var ALERTS={
 follow:{size:'s',dwell:3600,p:2,icon:'follow',verb:'followed the stream'},
 sub:{size:'s',dwell:4800,p:2,icon:'star',verb:'subscribed',coal:1},
 thanks:{size:'s',dwell:5200,p:2,icon:'heart',verb:'sent Super Thanks'},

function norm(e){if(!e||!ALERTS[e.type])return null;var d=ALERTS[e.type];
 var a={};for(var k in e)a[k]=e[k];
 a.size=e.size||d.size;a.dwell=e.dwell||d.dwell;a.p=e.p||d.p;a.icon=d.icon;a.count=e.count||1;
 if(a.type==='raid')a.amount=(a.count||120)+' RAIDERS';

 return a}
function subTxt(a){var s=a.sub||ALERTS[a.type].verb;if(a.count>1)s+=' \u00b7 +'+(a.count-1)+' more';return s}

var GEO={as:{w:560,h:56,r:999},al:{w:640,h:108,r:36},trade:{w:700,h:216,r:40},res:{w:520,h:100,r:36}};
var Isl={el:$('#isl'),stg:$('#stg'),idMark:null,
 iw:new Spr(0),ih:new Spr(46),ir:new Spr(999),view:null,refs:{},

 bump:function(){if(!MOTION)return;this.el.classList.remove('bump');void this.el.offsetWidth;this.el.classList.add('bump')},
 setView:function(kind,html,g){
  var old=this.stg.querySelector('.view.on');

  if(old){old.classList.remove('on','in');old.classList.add('out');setTimeout(function(){if(old.parentNode)old.parentNode.removeChild(old)},180)}
  var refs={};v.querySelectorAll('[data-r]').forEach(function(n){refs[n.dataset.r]=n});
  this.refs=refs;this.view=kind;
  var closing=g.h<this.ih.v;var w=Math.min(g.w,innerWidth-40);

/* stage queue — identical logic to live */
var Stage={q:[],cur:null,age:0,
 push:function(e){var a=norm(e);if(!a)return;
  if(this.cur&&this.cur.type===a.type&&ALERTS[this.cur.type].coal&&this.age<ALERTS[this.cur.type].dwell+4000){
   this.cur.count=(this.cur.count||1)+1;this.cur.dwell+=1200;
   if(Isl.refs.asub)Isl.refs.asub.textContent=subTxt(this.cur);Isl.bump();Eng.wake();return}
  if(!this.cur){this.play(a);return}
  if(a.p>=this.cur.p||this.age>this.cur.dwell*.62){this.play(a);return}
  this.q.push(a);if(this.q.length>5){this.q.sort(function(x,y){return y.p-x.p});this.q.length=5}Eng.wake()},
 play:function(a){this.cur=a;this.age=0;sync();Mood.look();Eng.wake()},
 end:function(){if(!this.cur)return;this.cur=null;

var Trade={cur:null,resT:0,
 open:function(d){d=d||{};var side=d.side==='short'?'short':'long',dir=side==='long'?1:-1;
  var entry=d.entry||Px.BTC.p;var dist=Math.max(entry*.004,Math.abs((d.sl||0)-entry)||entry*.012);
  this.cur={market:d.market||'BTC/USDT',side:side,entry:entry,
   tp:d.tp||+(entry+dir*dist*2.2).toFixed(1),sl:d.sl||+(entry-dir*dist).toFixed(1),
   opened:Date.now(),status:'run',pnl:0,r:0,pct:0,pos:50,risk:500};
  this.cur.per=this.cur.risk/dist;sync();Isl.bump();Mood.look();return this.cur},
 onPx:function(p){var t=this.cur;if(!t||t.status!=='run')return;
  var dir=t.side==='long'?1:-1;
  t.pnl=(p-t.entry)*dir*t.per;t.r=t.pnl/t.risk;t.pct=(p-t.entry)/t.entry*100*dir;
  t.pos=clamp(((p-t.sl)/((t.tp-t.sl)||1))*100,2,98);
  var g=Isl.refs||{};
  if(Isl.view==='trade'&&g.tpnl){g.tpnl.textContent=money(t.pnl);g.tpnl.className='tpnl mono '+(t.pnl>=0?'up':'down');
   if(g.trr)g.trr.textContent=(t.r>=0?'+':'')+t.r.toFixed(2)+'R';
   if(g.tpct)g.tpct.textContent=(t.pct>=0?'+':'')+t.pct.toFixed(2)+'%';
   if(g.tarr)g.tarr.innerHTML=icon(t.r>=0?'trend':'trendDown',11);
   if(g.ldot)g.ldot.style.left=t.pos.toFixed(1)+'%'}
  var win=dir>0?p>=t.tp:p<=t.tp,loss=dir>0?p<=t.sl:p>=t.sl;
  if(win)this.close('win');else if(loss)this.close('loss')},
 close:function(st){var t=this.cur;if(!t||t.status!=='run')return;
  var dir=t.side==='long'?1:-1;
  t.pnl=(st==='win'?(t.tp-t.entry):(st==='loss'?(t.sl-t.entry):0))*dir*t.per;
  t.r=t.pnl/t.risk;t.status=st;this.showRes()},

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SMILE LAB · CINEMA R4 — pure & bezel fullscreen · true smile.co.ke</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0C14; --line:rgba(255,255,255,.08);
  --fg:#F2F5FC; --muted:#9AA4BC; --faint:#5A6478;
  --gold:#FFCE00; --gold-ink:#1F1702; --up:#10B981; --dn:#F6465D;
  --expo:cubic-bezier(.16,1,.3,1);
  --sh:0 0 0 1.5px rgba(255,206,0,.4),0 0 0 1px rgba(0,0,0,.4),0 30px 80px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#05060B;overflow:hidden}
body{font-family:Inter,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace}
.num{font-variant-numeric:tabular-nums}
#fit{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center}
@keyframes enter{to{opacity:1;transform:none}}
.enter{opacity:0;transform:translateY(16px) scale(.985);animation:enter .85s var(--expo) forwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hide{display:none!important}

/* ---------- colossal content card ---------- */
#content{position:absolute;border-radius:22px;overflow:hidden;box-shadow:var(--sh);z-index:10;
  transition:left .7s var(--expo),top .7s var(--expo),width .7s var(--expo),height .7s var(--expo)}
#content .wm{position:absolute;left:16px;top:16px;z-index:6;display:flex;align-items:center;gap:10px;padding:9px 16px 9px 12px;
  border-radius:999px;background:rgba(8,10,16,.74);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
#content .wm img{height:22px}
#content .wm .lv{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:.18em;color:var(--gold)}
#content .wm .lv i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1.7s infinite}
#content .ghost{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:13px;
  background:radial-gradient(120% 120% at 50% 0%,#12151F,#0A0C13 72%)}
#content.showph .ghost{display:flex}
#content .ghost img{width:84px;height:84px;filter:drop-shadow(0 10px 24px rgba(255,206,0,.2))}
#content .ghost .t{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.22em;color:var(--faint)}
#content .meta{position:absolute;left:16px;bottom:14px;z-index:6;display:flex;gap:8px}
#content .meta span{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:.13em;color:var(--muted);
  padding:5px 11px;border-radius:999px;background:rgba(8,10,16,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
#content .meta span.gold{color:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,206,0,.35)}

/* ---------- cam layer (V cycles) ---------- */
#cam{position:absolute;width:300px;height:188px;border-radius:18px;overflow:hidden;z-index:35;display:none;
  box-shadow:0 0 0 1.5px rgba(255,206,0,.45),0 22px 54px rgba(0,0,0,.55);transition:left .7s var(--expo),right .7s var(--expo),top .7s var(--expo),bottom .7s var(--expo)}
#cam.on{display:block}
#cam .ph{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(115% 115% at 50% 0%,#12151F,#0A0C13 72%)}
#cam.off .ph{display:flex}
#cam .ph img{width:50px;height:50px;filter:drop-shadow(0 8px 18px rgba(255,206,0,.2))}
#cam .ph .t{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;letter-spacing:.18em;color:var(--faint)}
#cam .idc{position:absolute;left:10px;bottom:10px;z-index:6;padding:6px 12px;border-radius:11px;background:rgba(8,10,16,.85);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
#cam .idc .nm{font-weight:700;font-size:12px}
#cam .idc .rl{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:600;letter-spacing:.15em;color:var(--gold);margin-top:1px}

/* ---------- alerts (PURE: hidden until enabled) ---------- */
#alerts{position:absolute;left:24px;bottom:92px;z-index:38;--al-w:380px;transition:opacity .4s}
#alerts.pure-off{opacity:0;pointer-events:none}
#alerts .alzone{}
#alerts.pure-off .alzone{}

/* ---------- BEZEL device frame ---------- */
#bezel{position:absolute;inset:10px;border-radius:34px;pointer-events:none;z-index:60;display:none;
  box-shadow:inset 0 0 0 1.5px rgba(255,206,0,.26),inset 0 0 0 9px rgba(10,12,18,.9),inset 0 0 0 10.5px rgba(255,255,255,.05),
  inset 0 0 60px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.5)}
#bezel::after{content:"";position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:120px;height:7px;border-radius:99px;
  background:rgba(255,255,255,.07);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
body.bezel #bezel{display:block}

/* keybar (bezel only; never in pure) */
#helpWrap{position:absolute;left:0;right:0;bottom:92px;display:flex;justify-content:center;pointer-events:none;z-index:50}
#help{display:flex;align-items:center;gap:12px;padding:7px 20px;border-radius:999px;font-family:'IBM Plex Mono',monospace;
  font-size:9px;font-weight:600;letter-spacing:.07em;color:var(--muted);background:rgba(12,15,23,.85);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
#help b{color:var(--gold)} #help i{font-style:normal;color:rgba(255,255,255,.14)}
body.g #help,body.pure #helpWrap{display:none}
body.pure #content .meta{display:none}
body.pure #modeTag{display:none}
#modeTag{position:absolute;right:24px;bottom:86px;top:auto;z-index:70;font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;
  letter-spacing:.18em;color:var(--faint)}
body.g #modeTag{display:none}
body.calm .enter{animation:none!important;opacity:1!important;transform:none!important}
</style>
</head>
<body class="pure">
<div id="fit">
  <!-- COLOSSAL CONTENT CARD (capture goes under the overlay here) -->
  <div id="content" class="enter">
    <div class="ghost"><img src="assets/smile-face.svg" alt=""><div class="t">PLACE FULLSCREEN CAPTURE · ASPECT-LOCKED</div></div>
    <div class="wm"><img src="assets/smile-logo.svg" alt="smile.co.ke"><span class="lv"><i></i>LIVE</span></div>
    <div class="meta"><span class="gold" id="mAsp">16:9 · ASPECT LOCKED</span><span id="mSrc">DISPLAY CAPTURE SOURCE</span></div>
  </div>

  <!-- CAM LAYER -->
  <div id="cam" class="off">
    <div class="ph"><img src="assets/smile-face.svg" alt=""><div class="t">CAM OFF · SMILE AVATAR</div></div>
    <div class="idc"><div class="nm" id="camNm">WANJIKU M.</div><div class="rl" id="camRl">COMMENTARY · OVER CONTENT</div></div>
  </div>

  <div id="alerts"></div>

  <div id="bezel"></div>
  <div id="modeTag">PURE · WATERMARK ONLY</div>

  <div id="helpWrap"><div id="help">
    <span><b>F</b> pure ↔ bezel</span><i>·</i><span><b>V</b> cam layer</span><i>·</i><span><b>P</b> avatar</span><i>·</i>
    <span><b>A</b> alerts on/off</span><i>·</i><span><b>R</b> aspect</span><i>·</i><span><b>C</b> calibrate</span><i>·</i><span><b>H</b> hide</span>
  </div></div>

  <div id="cal"><div class="sheet" id="calSheet"></div></div>
</div>
<script src="assets/chrome.js"></script>
<script src="assets/alert-engine.js"></script>
<script>
var $=function(s){return document.querySelector(s)};
var G=new URLSearchParams(location.search);
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);$('#fit').style.transform='translate(-50%,-50%) scale('+s+')';fit.s=s}
addEventListener('resize',function(){fit();placeContent();if($('#cal').classList.contains('on'))calOn(true)});fit();

/* ---------- alerts ---------- */
var alerts=SmileAlerts.mount('#alerts');
var ZONES=['left','center','right'];
var zIx=ZONES.indexOf(G.get('apos'));if(zIx<0)zIx=0;
function applyZone(){alerts.setZone(ZONES[zIx]);
  $('#alerts').style.left=ZONES[zIx]==='left'?'24px':(ZONES[zIx]==='center'?'0':'auto');
  $('#alerts').style.right=ZONES[zIx]==='right'?'24px':(ZONES[zIx]==='center'?'0':'auto');
  $('#alerts').style.marginLeft=ZONES[zIx]==='center'?'auto':'0';
  $('#alerts').style.marginRight=ZONES[zIx]==='center'?'auto':'0';}
applyZone();
var alertsOn=G.get('alerts')==='1';
function applyAlerts(){$('#alerts').classList.toggle('pure-off',!alertsOn)}
applyAlerts();

/* ============================================================
   MODES — F cycles · body.pure = watermark + nothing else
   PURE : colossal card on FULL canvas, aspect-locked, watermark
          pill top-left, alerts opt-in (A), everything else OFF
   BEZEL: one rounded device frame; chrome pills + ticker live in
          the bezel; content aspect-locked inside the safe zone
   ============================================================ */
var pure=true;
function placeContent(){
  var a=AR[arIx],w,h,x,y;
  if(pure){var m=14,maxW=1920-m*2,maxH=1080-m*2;
    if(maxW/maxH>a[1]){h=maxH;w=Math.round(h*a[1])}else{w=maxW;h=Math.round(w/a[1])}
    x=Math.round((1920-w)/2);y=Math.round((1080-h)/2);
  }else{var y0=112,y1=986,mx=24,maxW=1920-mx*2,maxH=y1-y0;
    if(maxW/maxH>a[1]){h=maxH;w=Math.round(h*a[1])}else{w=maxW;h=Math.round(w/a[1])}
    x=Math.round((1920-w)/2);y=y0+Math.round((maxH-h)/2);
  }
  var c=$('#content');
  c.style.left=x+'px';c.style.top=y+'px';c.style.width=w+'px';c.style.height=h+'px';
  $('#mAsp').textContent=a[0]+' · ASPECT LOCKED · '+w+'×'+h;
}
var AR=[['16:9',16/9],['1.85:1',1.85],['2.39:1',2.39]],arIx=0;
function setMode(p){
  pure=p;document.body.classList.toggle('pure',p);
  $('#modeTag').textContent=p?'PURE · WATERMARK ONLY':'BEZEL · CHROME INSIDE THE FRAME';
  placeContent();
  if(!p){mountChrome()} /* chrome pills only exist in bezel mode */
}
function mountChrome(){
  if(window._chromeMounted)return;window._chromeMounted=true;
  SmileChrome.tickerCSS();
  SmileChrome.mount({});
  var tk=document.createElement('div');tk.className='tkWrap';
  tk.innerHTML='<div class="tkPill enter"><div class="cap"><i></i><span class="t">SMILE MARKETS</span></div>'+
    '<div class="clip"><div class="tk">'+SmileChrome.tickerItems('market')+SmileChrome.tickerItems('market')+'</div></div></div>';
  $('#fit').appendChild(tk);
}

/* ---------- cam layer positions (V cycles: off → BR → TR → off) ---------- */
var camPos=-1;
function camCycle(){
  camPos++;if(camPos>2)camPos=-1;
  var c=$('#cam');
  if(camPos<0){c.classList.remove('on');return}
  c.classList.add('on');
  if(camPos===0){c.style.right='24px';c.style.bottom='92px';c.style.left='auto';c.style.top='auto'}
  else{c.style.right='24px';c.style.top='100px';c.style.left='auto';c.style.bottom='auto'}
}

/* ---------- calibration ---------- */
function calOn(on){
  var cal=$('#cal');cal.classList.toggle('on',on);if(!on)return;
  cal.querySelectorAll('.sl').forEach(function(e){e.remove()});
  var s=fit.s||1,rows=[],defs=[['CONTENT HOLE','#content'],['CAM LAYER','#cam']];
  defs.forEach(function(d){var el=$(d[1]),r=el.getBoundingClientRect();
    if(d[1]==='#cam'&&!$('#cam').classList.contains('on'))return;
    var x=Math.round(r.left/s),y=Math.round((r.top-(innerHeight-1080*s)/2)/s),w=Math.round(r.width/s),h=Math.round(r.height/s);
    if(w<4)return;
    var sl=document.createElement('div');sl.className='sl';
    sl.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px';
    sl.innerHTML='<span class="tag">'+d[0]+' — '+w+'×'+h+' @ '+x+','+y+'</span>';cal.appendChild(sl);
    rows.push([d[0],w+'×'+h+' @ '+x+','+y])});
  rows.push(pure?['PURE RULE','watermark + optional alerts only']:
    ['BEZEL RULE','chrome lives inside the frame · content hole '+$('#mAsp').textContent]);
  $('#calSheet').innerHTML='<div class="t">OBS SLOT SHEET · BASE 1920×1080 · '+(pure?'PURE':'BEZEL')+'</div>'+
    rows.map(function(r){return '<div class="rw"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>'}).join('')+
    '<div class="note"><b>'+(pure?'Pure':'Bezel')+':</b> one display capture under the content hole · '+
    (pure?'nothing else on screen — enable alerts with <b>A</b> if the moment needs them.':
    'ticker + socials + clock live in the bezel · press <b>F</b> for the bare watermark look.')+' Full guide: <b>guide.html</b></div>';
}

/* ---------- keys ---------- */
addEventListener('keydown',function(e){var k=e.key.toLowerCase();
  if(k==='f'){setMode(!pure)}
  else if(k==='v'){camCycle()}
  else if(k==='p'){$('#cam').classList.toggle('off');
    $('#camRl').textContent=$('#cam').classList.contains('off')?'AVATAR ACTIVE · CAM HIDDEN':'COMMENTARY · OVER CONTENT'}
  else if(k==='a'){alertsOn=!alertsOn;applyAlerts();if(alertsOn&&!alerts.counts().live&&!alerts.counts().queued)alerts.push(alerts.fake())}
  else if(k==='z'){zIx=(zIx+1)%ZONES.length;applyZone()}
  else if(k==='r'){arIx=(arIx+1)%AR.length;placeContent();if($('#cal').classList.contains('on'))calOn(true)}
  else if(k==='c'){calOn(!$('#cal').classList.contains('on'))}
  else if(k==='x')alerts.clear();
  else if(k==='h')document.body.classList.toggle('g');
});
if(G.get('mode')==='bezel')setMode(false);else setMode(true);
if(G.get('cal')==='1'){document.body.classList.add('calm');calOn(true)}
if(G.get('ph')==='1'){$('#content').classList.add('showph');$('#cam').classList.add('off')}
if(G.get('ademo')==='1'||G.get('alerts')==='1')setTimeout(function(){alerts.push(alerts.fake())},3000);
</script>
</body>
</html>

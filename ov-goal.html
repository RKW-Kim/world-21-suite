<!doctype html>
<html><head>
<meta charset="utf-8"><title>SMILE · Follower Goal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile.css"><link rel="stylesheet" href="_shared.css">
<style>
/* DATA: state.json → goal.count / goal.target  ·  fallback ?count=&goal=
   VARS: --corner --mx --my --scale --w (card width) · --cap:none hides caption */
:root{--corner:tl;--mx:68;--my:146;--scale:1;--w:392;}
.widget{width:calc(var(--u)*var(--w,392));}
.goal-body{padding:calc(var(--u)*13) calc(var(--u)*14) calc(var(--u)*14);}
.goal-nums{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:calc(var(--u)*10);}
.goal-nums .gn{font-family:var(--font-display);font-weight:800;font-size:calc(var(--u)*21);color:var(--fg);}
.goal-nums .gt{font-family:var(--font-display);font-weight:600;font-size:calc(var(--u)*13);color:var(--faint);}
.goal-fill{height:100%;width:0%;border-radius:999px;position:relative;overflow:hidden;
  background:linear-gradient(90deg,var(--yellow),var(--yellow-hot));transition:width 1.1s cubic-bezier(.2,.9,.3,1);}
.goal-fill::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  animation:shimmer-slide 2.6s linear infinite;}
@keyframes shimmer-slide{to{transform:translateX(100%);}}
.idle .goal-fill{visibility:hidden;}
.idle .progress{border:1px dashed rgba(255,193,7,.35);background:transparent;}
.goal-cap{margin-top:calc(var(--u)*9);font-size:calc(var(--u)*10);letter-spacing:.08em;color:var(--faint);display:var(--cap,block);}
.goal-cap b{color:var(--yellow);font-weight:600;}
</style>
</head>
<body class="ov">
<div class="card fx" id="root">
  <div class="widget">
    <div class="w-head">
      <span class="w-idx">01</span>
      <svg class="w-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>
      <h3>FOLLOWER GOAL</h3>
    </div>
    <div class="goal-body">
      <div class="goal-nums"><span class="gn num" id="gn">0</span><span class="gt num">/ <span id="gt">0</span></span></div>
      <div class="progress"><div class="goal-fill" id="fill"></div></div>
      <p class="goal-cap">growing the squad on <b>smile.co.ke</b></p>
    </div>
  </div>
</div>
<script src="_shared.js"></script>
<script>
var root=document.getElementById('root'),gn=document.getElementById('gn'),
    gt=document.getElementById('gt'),fill=document.getElementById('fill');
SMILE.mount(root,{corner:'tl',mx:68,my:146,scale:1});
function anim(to){
  var from=parseInt((gn.textContent||'0').replace(/[^\d]/g,''),10)||0,t0=performance.now();
  (function step(t){var k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);
    gn.textContent=Math.round(from+(to-from)*e).toLocaleString('en-US');
    if(k<1)requestAnimationFrame(step);})(t0);
}
function render(count,target){
  gt.textContent=target.toLocaleString('en-US');
  root.classList.toggle('idle',target<=0);
  fill.style.width=(target>0?Math.min(100,count/target*100):0)+'%';
  anim(count);
}
var c0=parseInt(SMILE.param('count','0'),10), g0=parseInt(SMILE.param('goal','1000'),10);
render(c0,g0);
SMILE.watchState(function(s){ if(s.goal)render(s.goal.count|0,s.goal.target|0); },3000);
</script>
</body></html>

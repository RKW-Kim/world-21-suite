<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPECTACLE — 3D money stingers · smile.co.ke</title>
<link rel="stylesheet" href="assets/liquid-glass.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0A0C14;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif; }
  html.obs, body.obs { background:transparent !important; }

  #stage { position:absolute; inset:0; }
  #bgLayer { position:absolute; inset:0; display:none; }
  #bgLayer.bright { display:block; background:linear-gradient(135deg,#F7F3EA,#E8DFC9 45%,#D9CBA6); }
  #bgLayer.dark { display:block; background:linear-gradient(160deg,#0E1118,#131720 50%,#0B0D12); }
  #bgLayer.grad { display:block; background:
    radial-gradient(60% 90% at 20% 15%, rgba(255,206,0,.32), transparent 60%),
    radial-gradient(55% 80% at 82% 80%, rgba(64,120,255,.25), transparent 60%),
    linear-gradient(140deg,#151226,#1B1440 55%,#0D0B1A); }
  #chart { position:absolute; inset:0; }
  body.obs #chart, body.obs #bgLayer { display:none !important; }

  /* fire target: bottom-right — one shared anchor cell */
  #dock { position:absolute; right:36px; bottom:36px; display:grid; }

  /* ============ SPECTACLE CARD ============ */
  .stg { display:none; grid-area:1/1; justify-self:end; align-items:center; gap:16px;
    padding:14px 30px 14px 14px; border-radius:32px; cursor:pointer; opacity:0; }
  .stg.on { display:flex; }

  /* per-event accent hairline in the bottom rim */
  .stg .lg-rim::after { content:""; position:absolute; inset:0; border-radius:inherit;
    box-shadow: inset 0 -1.5px 0 var(--acc, transparent); opacity: var(--acc-o, 0); pointer-events:none; }
  .stg--super { --acc: rgba(255,206,0,.95); }
  .stg--tip   { --acc: rgba(67,176,42,.95); }
  .stg--cheer { --acc: rgba(145,70,255,.95); }
  .stg--sub   { --acc: rgba(255,206,0,.95); }
  .stg--obsidian { --acc-o:.5; }
  .stg--clear { --acc-o:.26; }

  /* text */
  .tx { display:flex; flex-direction:column; gap:4px; }
  .row1 { display:flex; align-items:center; gap:12px; }
  .ttl { font-size:20px; font-weight:800; letter-spacing:-.02em; line-height:1.1; white-space:nowrap; }
  .stg--clear .ttl { color:#1F1702; }
  .stg--obsidian .ttl { color:#fff; }
  .ttl--gold { background:linear-gradient(180deg,#FFDF3F,#FFCE00 46%,#C88F00);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:#FFCE00; }
  .sub { font-size:12.5px; font-weight:500; letter-spacing:-.008em; white-space:nowrap; }
  .stg--clear .sub { color:rgba(31,23,2,.62); }
  .stg--obsidian .sub { color:rgba(255,255,255,.66); }
  .mp { font-weight:800; letter-spacing:.04em; color:#2E801D; }
  .stg--obsidian .mp { color:#5BCB3F; }

  /* amount chip — tabular numerals, locked min-width (zero reflow during count-up) */
  .chip { font-size:15px; font-weight:800; letter-spacing:-.01em; font-variant-numeric:tabular-nums;
    color:#1F1702; background:linear-gradient(180deg,#FFE566,#FFCE00 52%,#E8B400);
    padding:5px 12px; border-radius:999px; text-align:center; white-space:nowrap;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(146,104,0,.32), 0 2px 8px rgba(120,84,0,.28); }
  .chip--usd  { min-width:72px; }
  .chip--kes  { min-width:96px; }
  .chip--bits { min-width:106px; }
  .amt { display:inline-block; }

  /* YouTube-red micro-accent (super thanks only) */
  .yt { display:inline-block; width:17px; height:12px; border-radius:3px; background:#FF0033;
    margin-right:7px; vertical-align:-1px; position:relative; }
  .yt::after { content:""; position:absolute; left:6.5px; top:3px;
    border-left:5px solid #fff; border-top:3px solid transparent; border-bottom:3px solid transparent; }

  /* ============ 3D HERO OBJECTS ============ */
  /* fixed stage — space reserved, animations are transform-only (no layout shift) */
  .obj-stage { position:relative; width:80px; height:80px; flex:none;
    display:grid; place-items:center; }
  .oshadow { position:absolute; left:50%; bottom:0; width:58px; height:11px;
    transform:translateX(-50%); border-radius:50%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(12,8,0,.35), transparent 70%); }

  .pop { transform-style:preserve-3d; animation: coinPop .85s var(--lg-spring) both; }
  @keyframes coinPop {
    0%   { transform: scale(.35); opacity: 0; }
    55%  { transform: scale(1.09); opacity: 1; }
    100% { transform: scale(1); }
  }
  .tok { position:relative; transform-style:preserve-3d; }
  .tok-edge { position:absolute; inset:0; }
  .tok-face { position:absolute; inset:0; backface-visibility:hidden; }
  .tok-face svg { width:100%; height:100%; display:block; }
  .tok-face .gemback { position:absolute; inset:0; }

  .coin { animation: lgCoinFlip .78s var(--lg-ease) both, lgFloat 3.4s ease-in-out 1s infinite; }
  .gem  { animation: lgCoinFlip .72s var(--lg-ease) both, lgFloat 3.1s ease-in-out 1.1s infinite; }

  /* M-PESA tip hero: brand-true squircle app tile (gem emoji killed) */
  .pop--tile { animation: tileIn .72s var(--lg-ease) both; }
  @keyframes tileIn {
    0%   { transform: rotateY(-28deg) scale(.6); opacity: 0; }
    60%  { transform: rotateY(7deg) scale(1.05); opacity: 1; }
    100% { transform: rotateY(0deg) scale(1); }
  }
  .tile { width:76px; height:76px; border-radius:24px; position:relative; display:grid; place-items:center;
    background:linear-gradient(160deg,#5BCB3F,#43B02A 55%,#2E801D);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.42), inset 0 -3px 8px rgba(10,40,5,.38),
      inset 0 0 0 1px rgba(255,255,255,.12), 0 6px 14px rgba(16,52,8,.38);
    animation: lgFloat 3.2s ease-in-out 1s infinite; }
  .tile svg { width:76px; height:76px; display:block; }

  /* the object IS its own entrance — never double-animate the stage */
  .lg.in .lg-content > .obj-stage { animation:none; opacity:1; }

  /* SUBSCRIBE bell: one spring swing + halo ring pulses */
  .bell { width:58px; height:58px; transform-origin:50% 9%;
    animation: bellSwing 1.5s cubic-bezier(.45,.05,.35,1.18) .32s both; }
  .bell svg { width:100%; height:100%; display:block; filter:drop-shadow(0 5px 8px rgba(120,84,0,.35)); }
  @keyframes bellSwing {
    0%   { transform: rotate(0deg); }
    18%  { transform: rotate(-13deg); }
    40%  { transform: rotate(10deg); }
    60%  { transform: rotate(-5deg); }
    78%  { transform: rotate(2deg); }
    100% { transform: rotate(0deg); }
  }
  .halo { position:absolute; left:50%; top:50%; width:66px; height:66px; margin:-33px 0 0 -33px;
    border-radius:50%; border:3px solid rgba(255,206,0,.92); opacity:0;
    box-shadow: 0 0 14px rgba(255,206,0,.5), inset 0 0 10px rgba(255,206,0,.35);
    animation: haloPulse 1.25s cubic-bezier(.22,.61,.36,1) both; }
  .halo.h2 { animation-delay:.9s; }
  .halo.h3 { animation-delay:1.55s; }
  @keyframes haloPulse {
    0%   { transform: scale(.5); opacity: 0; }
    22%  { opacity: .8; }
    100% { transform: scale(1.55); opacity: 0; }
  }

  /* ============ PAGE MATERIAL LIFT (core untouched) ============ */
  /* clear: white frost that reads WHITE over dark stages (lifted per D3-R2) */
  .lg--clear { background: rgba(255,255,255,.33);
    box-shadow: 0 18px 50px rgba(28,22,2,.36), 0 2px 8px rgba(28,22,2,.18), 0 0 0 1px rgba(31,23,2,.15); }
  .lg--clear .lg-tint { background:
    radial-gradient(120% 90% at 50% -20%, rgba(255,255,255,.52), transparent 55%), rgba(255,255,255,.13); }
  .lg--clear .lg-rim { box-shadow:
    inset 0 0 6px rgba(255,255,255,.65), inset 0 1.5px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.40); }
  /* obsidian: deep dark glass, bottom-loaded */
  .lg--obsidian { background: rgba(6,7,10,.62);
    box-shadow: 0 24px 64px rgba(0,0,0,.62), 0 3px 12px rgba(0,0,0,.45); }
  .lg--obsidian .lg-tint { background:
    radial-gradient(120% 90% at 50% -20%, rgba(255,255,255,.12), transparent 55%),
    linear-gradient(180deg, rgba(255,255,255,.02), rgba(2,3,5,.55)); }
  .lg--obsidian .lg-rim { box-shadow:
    inset 0 0 6px rgba(255,255,255,.20), inset 0 1px 0 rgba(255,255,255,.42),
    inset 0 -1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.14); }
  /* bright stage: hold the frost back so light glass never blows out */
  body.bg-bright .lg--clear { background: rgba(255,255,255,.20); }
  body.bg-bright .lg--clear .lg-tint { background:
    radial-gradient(120% 90% at 50% -20%, rgba(255,255,255,.30), transparent 55%), rgba(255,255,255,.04); }

  #help { position:absolute; left:20px; top:18px; font:600 12px "Inter",system-ui,sans-serif;
    color:rgba(255,255,255,.55); background:rgba(10,12,18,.5); padding:8px 12px; border-radius:10px;
    backdrop-filter:blur(8px); z-index:9; }
  body.obs #help, body.g #help { display:none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="chart" width="1920" height="1080"></canvas>
  <div id="bgLayer"></div>
  <div id="help">1 SUPER THANKS · 2 TIP · 3 CHEER · 4 SUBSCRIBE · B background · click card refires</div>
  <div id="dock"></div>
</div>

<script src="assets/liquid-glass.js"></script>
<script>
var Q = new URLSearchParams(location.search);
var THEME = Q.get('theme') === 'obsidian' ? 'obsidian' : 'clear';
if (Q.get('obs') === '1') {
  document.body.classList.add('obs');
  document.documentElement.classList.add('obs');
}
if (Q.get('g') === '1') document.body.classList.add('g');

/* ---- chart backdrop (reference pattern) ---- */
var C = document.getElementById('chart'), X = C.getContext('2d'), D = [];
(function () {
  var p = 600;
  for (var i = 0; i < 120; i++) { D.push(p); p += (Math.random() - .47) * 9; }
  var lo = Math.min.apply(null, D), hi = Math.max.apply(null, D);
  X.fillStyle = '#0A0C14'; X.fillRect(0, 0, 1920, 1080);
  X.strokeStyle = 'rgba(255,255,255,.045)';
  for (var gx = 0; gx < 1920; gx += 110) { X.beginPath(); X.moveTo(gx, 0); X.lineTo(gx, 1080); X.stroke(); }
  for (var gy = 0; gy < 1080; gy += 85) { X.beginPath(); X.moveTo(0, gy); X.lineTo(1920, gy); X.stroke(); }
  X.beginPath();
  D.forEach(function (v, i) { var px = i * 16, py = 950 - (v - lo) / (hi - lo) * 760; i ? X.lineTo(px, py) : X.moveTo(px, py); });
  X.strokeStyle = 'rgba(255,206,0,.85)'; X.lineWidth = 2.5; X.stroke();
  X.lineTo(120 * 16, 1080); X.lineTo(0, 1080); X.closePath();
  X.fillStyle = 'rgba(255,206,0,.05)'; X.fill();
})();

function bg(name) {
  var b = document.getElementById('bgLayer');
  b.className = ''; C.style.display = 'block';
  document.body.classList.remove('bg-bright');
  if (name === 'bright' || name === 'dark' || name === 'grad') {
    b.className = name; C.style.display = 'none';
    if (name === 'bright') document.body.classList.add('bg-bright');
  }
  rematerial();
}
var BGS = ['chart', 'bright', 'dark', 'grad'], curBg = 0;
if (BGS.indexOf(Q.get('bg')) > -1) { bg(Q.get('bg')); curBg = BGS.indexOf(Q.get('bg')); }

/* ---- expo-out cubic-bezier(.16,1,.3,1) solver + count-up ---- */
function bez(x1, y1, x2, y2) {
  var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  var cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  function sx(t) { return ((ax * t + bx) * t + cx) * t; }
  function sy(t) { return ((ay * t + by) * t + cy) * t; }
  function dx(t) { return (3 * ax * t + 2 * bx) * t + cx; }
  return function (x) {
    var t = x, e, i;
    for (i = 0; i < 6; i++) { e = sx(t) - x; if (Math.abs(e) < 1e-5) break; t -= e / dx(t); }
    t = Math.min(1, Math.max(0, t));
    return sy(t);
  };
}
var EASE = bez(.16, 1, .3, 1);
function countUp(el, target, fmt, dur) {
  if (!el) return;
  var t0 = performance.now();
  var fr = function (t) {
    var p = Math.min(1, (t - t0) / dur), v = EASE(p);
    el.textContent = fmt(target * v);
    if (p < 1) requestAnimationFrame(fr);
  };
  fr(t0);
  requestAnimationFrame(fr);
}

/* ---- spark fountain: round sparks, true up-then-fall arc ---- */
function fountain(host, o) {
  var n = o.count || 12;
  for (var i = 0; i < n; i++) {
    (function (i) {
      setTimeout(function () {
        var size = o.sMin + Math.random() * (o.sMax - o.sMin);
        var life = 700 + Math.random() * 400;                 /* 700-1100ms */
        var s = LG.spark(host,
          o.x + (Math.random() - .5) * o.spread,
          o.y + (Math.random() - .5) * 12,
          size, life, { color: o.colors[(Math.random() * o.colors.length) | 0], z: 7 });
        var old = s.getAnimations()[0]; if (old) old.cancel();
        var dx = (Math.random() - .5) * o.burst;
        var up = o.upMin + Math.random() * (o.upMax - o.upMin);
        var an = s.animate([
          { transform: 'translate(0,0) scale(.45)', opacity: 0 },
          { transform: 'translate(' + (dx * .38).toFixed(1) + 'px,' + (-up * .62).toFixed(1) + 'px) scale(1)', opacity: 1, offset: .34, easing: 'cubic-bezier(.17,.67,.35,1)' },
          { transform: 'translate(' + (dx * .72).toFixed(1) + 'px,' + (-up * .8).toFixed(1) + 'px) scale(.8)', opacity: .95, offset: .6, easing: 'cubic-bezier(.5,.05,.85,.4)' },
          { transform: 'translate(' + dx.toFixed(1) + 'px,' + (-up * .32 + 30).toFixed(1) + 'px) scale(.25)', opacity: 0 }
        ], { duration: life, fill: 'both' });
        an.onfinish = function () { s.remove(); };
      }, i * o.stagger + Math.random() * 110);
    })(i);
  }
}

/* ---- 3D token builder: N edge layers + front/back faces ---- */
function makeToken(stage, o) {
  var pop = document.createElement('div'); pop.className = 'pop';
  var tok = document.createElement('div'); tok.className = 'tok ' + (o.cls || '');
  tok.style.width = o.w + 'px'; tok.style.height = o.h + 'px';
  var n = o.layers || 9;
  for (var i = 0; i < n; i++) {
    var e = document.createElement('i'); e.className = 'tok-edge';
    e.style.transform = 'translateZ(' + (-o.thick / 2 + o.thick * i / (n - 1)).toFixed(2) + 'px)';
    e.style.background = i % 2 ? o.edgeB : o.edgeA;
    if (o.round) e.style.borderRadius = o.round;
    if (o.clip) e.style.clipPath = o.clip;
    tok.appendChild(e);
  }
  var f = document.createElement('div'); f.className = 'tok-face';
  f.style.transform = 'translateZ(' + (o.thick / 2 + .5) + 'px)'; f.innerHTML = o.front;
  var b = document.createElement('div'); b.className = 'tok-face';
  b.style.transform = 'rotateY(180deg) translateZ(' + (o.thick / 2 + .5) + 'px)'; b.innerHTML = o.back;
  tok.appendChild(f); tok.appendChild(b);
  pop.appendChild(tok); stage.appendChild(pop);
  return tok;
}

/* ---- object art (smile face paths verbatim from assets/smile-face.svg) ---- */
function feat(fill) {
  return '<path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="' + fill + '"/>' +
    '<path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="' + fill + '"/>' +
    '<path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="' + fill + '"/>';
}

    '<defs><radialGradient id="cgB" cx="36%" cy="30%" r="85%">' +
    '<stop offset="0" stop-color="#F5C93E"/><stop offset=".55" stop-color="#E8B400"/><stop offset="1" stop-color="#C89200"/>' +
    '</radialGradient></defs>' +
    '<circle cx="39" cy="39" r="38" fill="url(#cgB)"/>' +
    '<circle cx="39" cy="39" r="36.4" fill="none" stroke="rgba(255,240,170,.7)" stroke-width="1.1"/>' +
    '<circle cx="39" cy="39" r="33" fill="none" stroke="rgba(130,92,0,.55)" stroke-width="1.4"/>' +
    '<g transform="translate(39,37.5) scale(1.05) translate(-16.9,-22.6)">' + feat('rgba(122,86,0,.8)') + '</g>' +
    '<text x="39" y="57.5" text-anchor="middle" font-family="Inter,sans-serif" font-size="6.5" font-weight="700" letter-spacing="1.5" fill="rgba(122,86,0,.8)">SMILE.CO.KE</text>' +
    '</svg>';
}
function gemSVG(p) {
  /* recut: asymmetric facets + inner reflection planes + strong specular (D3-R2) */

    '<polygon points="21,3.5 59,3.5 76.5,26.5 39.5,73.5 2.5,26.5" fill="rgba(14,5,26,.35)"/>' +
    '<polygon points="19,1 57,1 75,24 38,71 1,24" fill="' + p.base + '"/>' +
    '<polygon points="19,1 1,24 15,25" fill="' + p.light + '"/>' +
    '<polygon points="19,1 15,25 27,9" fill="' + p.light2 + '"/>' +
    '<polygon points="19,1 27,9 45,7" fill="' + p.hi + '"/>' +
    '<polygon points="19,1 45,7 57,1" fill="' + p.light + '"/>' +
    '<polygon points="57,1 45,7 58,22" fill="' + p.base + '"/>' +
    '<polygon points="57,1 58,22 75,24" fill="' + p.deep + '"/>' +
    '<polygon points="27,9 45,7 58,22 20,24" fill="' + p.hi + '"/>' +
    '<polygon points="1,24 15,25 38,71" fill="' + p.light + '"/>' +
    '<polygon points="15,25 20,24 38,71" fill="' + p.base + '"/>' +
    '<polygon points="20,24 58,22 38,71" fill="' + p.deep + '"/>' +
    '<polygon points="58,22 75,24 38,71" fill="' + p.deep2 + '"/>' +
    '<polygon points="23,26 34,27 29,49 21,36" fill="rgba(255,255,255,.30)"/>' +
    '<polygon points="46,28 54,27 45,56 39,45" fill="rgba(255,255,255,.22)"/>' +
    '<path d="M15 25 L20 24" stroke="rgba(255,255,255,.55)" stroke-width="1"/>' +
    '<polygon points="28,10.5 38,11.5 33,20.5 25.5,18" fill="rgba(255,255,255,.92)"/>' +
    '<circle cx="31.5" cy="15" r="1.7" fill="#FFFFFF"/>' +
    '<path d="M48 11.5 h7 M51.5 8 v7" stroke="rgba(255,255,255,.8)" stroke-width="1.1" stroke-linecap="round"/>' +
    '<polygon points="20,24 58,22 44,26 30,27" fill="rgba(20,4,40,.28)"/>' +
    '<polygon points="19,1 57,1 75,24 38,71 1,24" fill="none" stroke="' + p.dark + '" stroke-width="1.6" stroke-linejoin="round"/>' +

}
function tileSVG() {
  return '<svg viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">' +
    '<g transform="translate(17,17) scale(1.75)">' +
    '<path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="#FFFFFF"/>' +
    '</g></svg>';
}
function gemBack(p) {
  return '<svg viewBox="0 0 76 72" xmlns="http://www.w3.org/2000/svg">' +
    '<polygon points="19,1 57,1 75,24 38,71 1,24" fill="' + p.deep + '"/>' +
    '<polygon points="27,24 49,24 38,56" fill="' + p.dark + '"/>' +
    '<path d="M16 24 L60 24" stroke="rgba(255,255,255,.18)" stroke-width="1"/>' +
    '<polygon points="19,1 57,1 75,24 38,71 1,24" fill="none" stroke="' + p.dark + '" stroke-width="1.6" stroke-linejoin="round"/>' +
    '</svg>';
}
var GEM_CLIP = 'polygon(25% 1.4%, 75% 1.4%, 98.7% 33.3%, 50% 98.6%, 1.3% 33.3%)';
function bellSVG() {
  return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><linearGradient id="bgld" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#FFE566"/><stop offset=".55" stop-color="#FFCE00"/><stop offset="1" stop-color="#DFA900"/>' +
    '</linearGradient></defs>' +
    '<path d="M32 5.5c1.6 0 2.9 1.3 2.9 2.9 0 1.1-.6 2-1.4 2.5v2.3h-3v-2.3c-.8-.5-1.4-1.4-1.4-2.5 0-1.6 1.3-2.9 2.9-2.9z" fill="url(#bgld)" stroke="#B8860B" stroke-width="1"/>' +
    '<path d="M32 13.5c-9.6 0-14.6 7-14.6 15.4 0 8.8-2.4 13.2-5.3 16.1-.9.9-.3 2.6 1.1 2.6h37.6c1.4 0 2-1.7 1.1-2.6-2.9-2.9-5.3-7.3-5.3-16.1 0-8.4-5-15.4-14.6-15.4z" fill="url(#bgld)" stroke="#8F6400" stroke-width="1.4" stroke-linejoin="round"/>' +
    '<path d="M24.5 18.5c-3.2 1.7-5.2 4.6-5.9 8.6" stroke="rgba(255,249,215,.95)" stroke-width="2" fill="none" stroke-linecap="round"/>' +
    '<path d="M22 44.5h20" stroke="rgba(143,100,0,.5)" stroke-width="1.4" stroke-linecap="round"/>' +
    '<circle cx="32" cy="51.5" r="4.2" fill="#C88F00" stroke="#8F6400" stroke-width="1"/>' +
    '</svg>';
}

/* ---- card factory ---- */
var dock = document.getElementById('dock');
var ORDER = ['super', 'tip', 'cheer', 'sub'];
var TUNE = {
  super: { s: 84, ca: 2.0, blur: 2.2 },
  tip:   { s: 88, ca: 2.1, blur: 2.3 },
  cheer: { s: 80, ca: 1.9, blur: 2.1 },
  sub:   { s: 82, ca: 2.0, blur: 2.2 }
};
var MAT = {
  clear:       { sat: 1.85, bri: 1.24 },   /* lifted: reads white glass over dark stages */
  clearBright: { sat: 1.70, bri: 1.08 },   /* held back on the ivory stage — no blowout */
  obsidian:    { sat: 1.42, bri: .99 }
};
function brightNow() { return document.body.classList.contains('bg-bright'); }
function glassOpts(id) {
  var t = TUNE[id];
  var m = THEME === 'clear' ? (brightNow() ? MAT.clearBright : MAT.clear) : MAT.obsidian;
  return { theme: THEME, depth: 14, strength: t.s, ca: t.ca, blur: t.blur, saturate: m.sat, brightness: m.bri };
}
function rematerial() {
  if (THEME !== 'clear' || !CARDS) return;
  ORDER.forEach(function (id) {
    var el = CARDS[id]; if (!el) return;
    ['lg-backdrop', 'lg-tint', 'lg-rim', 'lg-spec'].forEach(function (c) {
      Array.prototype.forEach.call(el.querySelectorAll(':scope > ' + c), function (n) { n.remove(); });
    });
    el._opts = glassOpts(id);
    el._ref = LG.glass(el, el._opts);
  });
}

var INNER = {
  super: '<div class="obj-stage lg-scene"><i class="oshadow"></i></div>' +
    '<div class="tx"><div class="row1"><b class="ttl">SUPER THANKS</b><span class="chip chip--usd"><span class="amt">$0.00</span></span></div>' +
    '<span class="sub"><i class="yt"></i>from @viewerriver · thank you</span></div>',
  tip: '<div class="obj-stage lg-scene"><i class="oshadow"></i></div>' +
    '<div class="tx"><div class="row1"><b class="ttl">TIP RECEIVED</b><span class="chip chip--kes"><span class="amt">KSh 0</span></span></div>' +
    '<span class="sub"><b class="mp">M-PESA</b> · asante sana</span></div>',
  cheer: '<div class="obj-stage lg-scene"><i class="oshadow"></i></div>' +
    '<div class="tx"><div class="row1"><b class="ttl">CHEER</b><span class="chip chip--bits"><span class="amt">0 BITS</span></span></div>' +
    '<span class="sub">twitch.tv/smilecoke</span></div>',
  sub: '<div class="obj-stage lg-scene"><i class="oshadow"></i></div>' +
    '<div class="tx"><div class="row1"><b class="ttl ttl--gold">SUBSCRIBE</b></div>' +
    '<span class="sub">welcome to the desk, @newviewerriver</span></div>'
};

var FX = {
  super: function (el) {
    fountain(el, { x: 54, y: 90, count: 13, colors: ['#FFCE00', '#FFDF3F', '#FFF3B0', '#FFB300'],
      burst: 130, upMin: 48, upMax: 108, spread: 58, sMin: 4, sMax: 12, stagger: 36 });
    countUp(el.querySelector('.amt'), 5, function (v) { return '$' + v.toFixed(2); }, 840);
  },
  tip: function (el) {
    fountain(el, { x: 54, y: 90, count: 11, colors: ['#43B02A', '#7ED957', '#C9F2A6', '#2E801D'],
      burst: 120, upMin: 44, upMax: 100, spread: 56, sMin: 4, sMax: 11, stagger: 40 });
    countUp(el.querySelector('.amt'), 250, function (v) { return 'KSh ' + Math.round(v); }, 820);
  },
  cheer: function (el) {
    fountain(el, { x: 54, y: 88, count: 11, colors: ['#9146FF', '#B98FFF', '#E2D0FF'],
      burst: 120, upMin: 44, upMax: 102, spread: 56, sMin: 4, sMax: 11, stagger: 40 });
    countUp(el.querySelector('.amt'), 100, function (v) { return Math.round(v) + ' BITS'; }, 820);
  },
  sub: function (el) {
    fountain(el, { x: 54, y: 70, count: 12, colors: ['#FFCE00', '#FFDF3F', '#FFF3B0'],
      burst: 150, upMin: 40, upMax: 96, spread: 60, sMin: 4, sMax: 11, stagger: 34 });
  }
};

function buildCard(id, setup) {
  var el = document.createElement('div');
  el.className = 'stg stg--' + THEME + ' stg--' + id;
  el.innerHTML = INNER[id];
  dock.appendChild(el);
  if (setup) setup(el);
  el._opts = glassOpts(id);
  el._ref = LG.glass(el, el._opts);
  el._id = id; el._fx = FX[id];
  el.addEventListener('click', function () { if (!TYPE) stopCycle(); fire(el); });
  return el;
}

function setupSuper(el) {
  makeToken(el.querySelector('.obj-stage'), { w: 78, h: 78, thick: 9, round: '50%',
    edgeA: '#D9A400', edgeB: '#B8860B', layers: 11, front: coinFront(), back: coinBack(), cls: 'coin' });
}
var PURPLE = { hi: '#F2E7FF', light: '#C9A4FF', light2: '#A878FF', base: '#9146FF',
  deep: '#5E2799', deep2: '#4A1878', dark: '#331263' };
function setupGem(pal) {
  return function (el) {
    makeToken(el.querySelector('.obj-stage'), { w: 76, h: 72, thick: 11, clip: GEM_CLIP,
      edgeA: pal.deep, edgeB: pal.dark, layers: 9, front: gemSVG(pal), back: gemBack(pal), cls: 'gem' });
  };
}
function setupTip(el) {
  var stage = el.querySelector('.obj-stage');
  var pop = document.createElement('div'); pop.className = 'pop pop--tile';
  var tile = document.createElement('div'); tile.className = 'tile';
  tile.innerHTML = tileSVG();
  pop.appendChild(tile); stage.appendChild(pop);
}
function setupSub(el) {
  el.querySelector('.obj-stage').insertAdjacentHTML('beforeend',
    '<i class="halo"></i><i class="halo h2"></i><i class="halo h3"></i><div class="bell">' + bellSVG() + '</div>');
}

var CARDS = {
  super: buildCard('super', setupSuper),
  tip: buildCard('tip', setupTip),
  cheer: buildCard('cheer', setupGem(PURPLE)),
  sub: buildCard('sub', setupSub)
};

/* ---- fire / kill / cycle ---- */
var active = null, cycling = true, cycleTimer = null, idx = 0;
function kill(el) {
  if (!el) return;
  clearTimeout(el._t1); clearTimeout(el._t2); clearTimeout(el._t3);
  el.classList.remove('in', 'out', 'sheen', 'on');
}
function fire(el) {
  kill(active); active = el;
  el.classList.add('on');                       /* opacity stays 0 until .in lands */
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    if (el._ref) el._ref.refresh();             /* displacement map at true size */
    el.classList.remove('in', 'out', 'sheen');
    void el.offsetWidth;                        /* restart animations */
    el.classList.add('in', 'sheen');
  }); });
  el._t1 = setTimeout(function () { el._fx(el); }, 300);
  el._t2 = setTimeout(function () { el.classList.remove('in'); el.classList.add('out'); }, 5200);
  el._t3 = setTimeout(function () { el.classList.remove('out'); el.classList.remove('on'); }, 5740);
}
function fireId(id) { if (CARDS[id]) fire(CARDS[id]); }
function next() { fireId(ORDER[idx++ % ORDER.length]); }
function schedule() {
  cycleTimer = setTimeout(function () { if (cycling) { next(); schedule(); } }, 7400);
}
function stopCycle() { cycling = false; clearTimeout(cycleTimer); }

var TYPE = Q.get('type');
if (TYPE && ORDER.indexOf(TYPE) > -1) {
  cycling = false;
  fireId(TYPE);
  setInterval(function () { fireId(TYPE); }, 8000);
} else {
  TYPE = null;
  setTimeout(function () { next(); schedule(); }, 500);
}

addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  var MAP = { '1': 'super', '2': 'tip', '3': 'cheer', '4': 'sub' };
  if (MAP[k]) { if (TYPE) return; stopCycle(); fireId(MAP[k]); }
  if (k === 'b') { curBg = (curBg + 1) % 4; bg(BGS[curBg]); }
});
</script>
</body>

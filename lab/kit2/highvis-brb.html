<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMILE · BRB · highvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --field:#15161A; --ink:#101114; --paper:#FFFFFF; --orange:#FF5A00; --hazard:#FFC400; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    overflow:hidden; background:var(--field); color:var(--ink);
    font-family:'IBM Plex Mono','Courier New',monospace;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  }
  /* hazard-tape bars crossing the top-left and bottom-right corners */
  .hz{position:fixed;height:24px;z-index:1;
    background:repeating-linear-gradient(45deg,var(--orange) 0 14px,var(--ink) 14px 28px);}
  .hz-tl{top:24vh;left:-18vw;width:56vw;transform:rotate(-45deg);}
  .hz-br{bottom:24vh;right:-18vw;width:56vw;transform:rotate(-45deg);}
  .stage{position:relative;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:clamp(26px,3.6vh,34px);z-index:2;}
  .kicker{color:#fff;font-weight:600;letter-spacing:.34em;
    font-size:clamp(13px,1vw,16px);}
  /* clipboard notice panel */
  .board{position:relative;width:min(520px,72vw);
    background:var(--paper);border:2px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,.45);
    padding:clamp(46px,7.5vh,66px) clamp(28px,4vw,44px) clamp(32px,5.2vh,48px);
    display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2vh,20px);text-align:center;}
  .clip{position:absolute;top:-24px;left:50%;transform:translateX(-50%);
    width:150px;height:48px;background:var(--ink);border-radius:9px;}
  .board h1{font-family:'Archivo Black','Arial Black',sans-serif;font-weight:400;
    color:var(--ink);text-transform:uppercase;letter-spacing:.02em;
    font-size:clamp(30px,3.4vw,50px);line-height:1.05;}
  .cd-line{font-weight:600;font-size:clamp(17px,1.6vw,24px);letter-spacing:.06em;
    transition:opacity .3s linear;}
  .cd-line [data-cd]{font-weight:700}
  .go{font-weight:700;color:var(--ink);font-size:clamp(13px,1.15vw,17px);
    letter-spacing:.12em;border:2px solid var(--ink);background:var(--paper);padding:8px 14px;}
  [data-cd-wrap][data-done="1"]{opacity:.35}
  /* sticky note pinned over the panel corner */
  .note{position:absolute;right:-46px;bottom:-42px;width:160px;min-height:140px;
    background:var(--hazard);color:var(--ink);border-radius:6px;transform:rotate(3deg);
    box-shadow:4px 4px 0 rgba(0,0,0,.4);padding:32px 14px 14px;
    font-weight:600;font-size:15px;letter-spacing:.04em;text-align:left;}
  .note::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:12px;height:12px;border-radius:50%;background:var(--ink);}
  .wm{position:fixed;left:clamp(18px,2.4vw,44px);bottom:clamp(16px,3vh,34px);
    width:72px;height:72px;z-index:9;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.45));}
  .wm img{display:block;width:72px;height:72px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;animation-delay:0s!important}
  }
</style>
</head>
<body>
  <span class="hz hz-tl" aria-hidden="true"></span>
  <span class="hz hz-br" aria-hidden="true"></span>
  <main class="stage">
    <p class="kicker">SMILE — SHIFT BREAK · EP-<span data-ep>128</span></p>
    <section class="board" aria-label="Break notice">
      <span class="clip" aria-hidden="true"></span>
      <h1>CREW ON BREAK</h1>
      <div class="cd-line" data-cd-wrap>BACK IN <span data-cd>05:00</span></div>
      <div class="go" data-when-live hidden>CREW BACK — RESUME THE SHOW</div>
      <aside class="note">brb — coffee</aside>
    </section>
  </main>
  <div class="wm"><img src="../assets/smile-mark.svg" alt="SMILE"></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+300000, tp=q.get('t');
  if(tp){ if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;} else {var d=new Date(tp); if(!isNaN(d.getTime())) target=d.getTime();} }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  var el0=q.get('elapsed')?parseInt(q.get('elapsed'),10):0, t0=Date.now();
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){ e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x); });
    var el=el0+Math.floor((Date.now()-t0)/1000);
    document.querySelectorAll('[data-elapsed]').forEach(function(e){ e.textContent=P(Math.floor(el/60))+':'+P(el%60); });
    if(s<=0){ document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');}); document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');}); }
  }
  tick(); setInterval(tick,250);
})();
</script>
</body>
</html>

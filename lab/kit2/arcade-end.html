<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · END · arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D14; --panel:rgba(15,20,32,.9); --line:#1E293B;
    --cy:#22D3EE; --mg:#F43F8E; --wht:#F8FAFC; --slt:#94A3B8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background-color:var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:64px 64px;
    font-family:'Chakra Petch','Segoe UI',sans-serif; color:var(--wht);
  }
  [hidden]{display:none!important}

  .vignette{position:fixed; inset:0; z-index:60; pointer-events:none;
    background:radial-gradient(120% 130% at 50% 50%, transparent 55%, rgba(0,0,0,.25) 100%)}
  .scan{position:fixed; inset:0; z-index:61; pointer-events:none; opacity:.35;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px)}

  .brand{position:fixed; top:42px; right:48px; z-index:10; text-align:right;
    font-weight:700; font-size:13px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--wht)}
  .brand span{color:var(--slt); font-weight:500}
  .wm{position:fixed; top:36px; left:48px; width:72px; height:72px; z-index:12;
    filter:drop-shadow(4px 4px 0 rgba(0,0,0,.5))}

  /* pixel confetti */
  .confetti{position:fixed; inset:0; z-index:4; pointer-events:none; overflow:hidden}
  .cf{position:absolute; top:-10vh; opacity:0;
    animation:fall var(--d) linear infinite; animation-delay:var(--dl)}
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg); opacity:0}
    5%{opacity:1}
    82%{opacity:1}
    100%{transform:translateY(120vh) rotate(var(--r)); opacity:0}
  }

  /* GG hero */
  .gg-wrap{position:fixed; inset:0; z-index:5; display:flex; align-items:center;
    justify-content:center; pointer-events:none; transform:translateY(-3vh)}
  .gg{margin:0; font-family:'Unbounded','Chakra Petch',sans-serif; font-weight:900;
    font-size:clamp(180px,26vw,340px); line-height:.9; letter-spacing:-.01em;
    color:var(--wht);
    text-shadow:5px 5px 0 rgba(34,211,238,.35), -5px -5px 0 rgba(244,63,142,.35)}

  /* match stats, bottom-right */
  .stats{position:fixed; right:64px; bottom:64px; z-index:10; width:372px;
    border:2px solid var(--line); border-radius:4px; background:var(--panel);
    box-shadow:8px 8px 0 rgba(244,63,142,.18); padding:22px 26px}
  .stats .micro{color:var(--mg); padding-bottom:14px; border-bottom:2px solid var(--line)}
  .row{display:flex; align-items:baseline; gap:10px; padding:11px 0 0}
  .row .k{font-weight:600; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--slt); flex:none}
  .row .lead{flex:1; border-bottom:2px dotted #334155; transform:translateY(-4px)}
  .row .v{font-weight:700; font-size:15px; color:var(--wht);
    font-variant-numeric:tabular-nums; flex:none}
  .row .v.mg{color:var(--mg); font-size:14px}

  /* follow CTA, bottom-center */
  .cta{position:fixed; bottom:64px; left:50%; transform:translateX(-50%); z-index:10;
    text-align:center}
  .chip{display:inline-block; border:2px solid var(--cy); border-radius:4px;
    padding:13px 24px; font-weight:700; font-size:14px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--cy); background:rgba(15,20,32,.6);
    animation:chipseq 2.8s steps(1,end) infinite}
  @keyframes chipseq{0%,64%{box-shadow:6px 6px 0 rgba(34,211,238,.18)}
    65%,100%{box-shadow:2px 2px 0 rgba(34,211,238,.18)}}
  .next{margin-top:13px; font-weight:500; font-size:13px; letter-spacing:.06em;
    color:var(--slt)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
    .cf{animation:none; top:9%; opacity:.3}
    .chip{animation:none; box-shadow:6px 6px 0 rgba(34,211,238,.18)}
  }
</style>
</head>
<body>
  <div class="vignette"></div>

  <img class="wm" src="../assets/smile-mark.svg" alt="SMILE">
  <header class="brand">SMILE <span>— live podcast + screen share</span></header>

  <div class="confetti">
    <span class="cf" style="left:2.1%;width:7px;height:7px;background:#22D3EE;--d:9.2s;--dl:-13.3s;--r:420deg"></span>
    <span class="cf" style="left:5.7%;width:10px;height:10px;background:#F43F8E;--d:6.5s;--dl:-6.9s;--r:180deg"></span>
    <span class="cf" style="left:10.0%;width:9px;height:9px;background:#F8FAFC;--d:6.6s;--dl:-12.7s;--r:340deg"></span>
    <span class="cf" style="left:14.2%;width:10px;height:10px;background:#22D3EE;--d:7.0s;--dl:-10.9s;--r:540deg"></span>
    <span class="cf" style="left:20.4%;width:6px;height:6px;background:#F43F8E;--d:10.6s;--dl:-8.4s;--r:240deg"></span>
    <span class="cf" style="left:22.9%;width:7px;height:7px;background:#F8FAFC;--d:8.3s;--dl:-12.0s;--r:180deg"></span>
    <span class="cf" style="left:29.0%;width:10px;height:10px;background:#22D3EE;--d:12.5s;--dl:-11.5s;--r:420deg"></span>
    <span class="cf" style="left:33.4%;width:7px;height:7px;background:#F43F8E;--d:9.0s;--dl:-6.3s;--r:180deg"></span>
    <span class="cf" style="left:37.7%;width:10px;height:10px;background:#F8FAFC;--d:7.6s;--dl:-4.5s;--r:340deg"></span>
    <span class="cf" style="left:42.8%;width:9px;height:9px;background:#22D3EE;--d:10.7s;--dl:-7.7s;--r:300deg"></span>
    <span class="cf" style="left:45.3%;width:7px;height:7px;background:#F43F8E;--d:11.6s;--dl:-10.6s;--r:420deg"></span>
    <span class="cf" style="left:49.8%;width:9px;height:9px;background:#F8FAFC;--d:13.0s;--dl:-3.8s;--r:300deg"></span>
    <span class="cf" style="left:55.2%;width:6px;height:6px;background:#22D3EE;--d:6.9s;--dl:-8.1s;--r:300deg"></span>
    <span class="cf" style="left:58.0%;width:9px;height:9px;background:#F43F8E;--d:9.4s;--dl:-0.5s;--r:180deg"></span>
    <span class="cf" style="left:64.4%;width:10px;height:10px;background:#F8FAFC;--d:12.3s;--dl:-2.5s;--r:300deg"></span>
    <span class="cf" style="left:68.5%;width:10px;height:10px;background:#22D3EE;--d:10.0s;--dl:-2.8s;--r:180deg"></span>
    <span class="cf" style="left:73.4%;width:8px;height:8px;background:#F43F8E;--d:9.8s;--dl:-4.7s;--r:180deg"></span>
    <span class="cf" style="left:77.3%;width:8px;height:8px;background:#F8FAFC;--d:11.2s;--dl:-0.1s;--r:340deg"></span>
    <span class="cf" style="left:80.1%;width:9px;height:9px;background:#22D3EE;--d:13.1s;--dl:-9.1s;--r:340deg"></span>
    <span class="cf" style="left:84.7%;width:10px;height:10px;background:#F43F8E;--d:6.9s;--dl:-13.2s;--r:300deg"></span>
    <span class="cf" style="left:88.3%;width:7px;height:7px;background:#F8FAFC;--d:9.2s;--dl:-1.2s;--r:340deg"></span>
    <span class="cf" style="left:92.4%;width:9px;height:9px;background:#22D3EE;--d:9.2s;--dl:-10.1s;--r:240deg"></span>
    <span class="cf" style="left:1.3%;width:10px;height:10px;background:#F43F8E;--d:8.2s;--dl:-8.2s;--r:300deg"></span>
    <span class="cf" style="left:5.2%;width:9px;height:9px;background:#F8FAFC;--d:13.7s;--dl:-11.9s;--r:240deg"></span>
  </div>

  <main class="gg-wrap">
    <h1 class="gg">GG</h1>
  </main>

  <aside class="stats">
    <div class="micro">MATCH STATS</div>
    <div class="row"><span class="k">EPISODE</span><span class="lead"></span><span class="v" data-ep>128</span></div>
    <div class="row"><span class="k">DURATION</span><span class="lead"></span><span class="v" data-elapsed>00:00</span></div>
    <div class="row"><span class="k">BEST MOMENT</span><span class="lead"></span><span class="v mg">clip it in chat</span></div>
  </aside>

  <div class="cta">
    <span class="chip">FOLLOW TO JOIN THE NEXT MATCH</span>
    <div class="next">next stream — next week</div>
  </div>

  <div class="scan"></div>

<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+600000, tp=q.get('t');
  if(tp){ if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;} else {var d=new Date(tp); if(!isNaN(d.getTime())) target=d.getTime();} }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  var el0=q.get('elapsed')?parseInt(q.get('elapsed'),10):0, t0=Date.now();
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){ e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x); });
    var el=el0+Math.floor((Date.now()-t0)/1000);
    document.querySelectorAll('[data-elapsed]').forEach(function(e){ e.textContent=P(Math.floor(el/60))+':'+P(el%60); });
    if(s<=0){
      document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');});
      document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');});
    }
  }
  tick(); setInterval(tick,250);
})();
</script>
</body>
</html>

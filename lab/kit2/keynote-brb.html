<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMILE · brb · keynote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:#000;color:#F5F5F7;
    font-family:-apple-system,'SF Pro Display','Inter','Helvetica Neue',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    display:grid;place-items:center;
  }
  /* the restraint scene: nothing on the stage but words, a dot, a countdown.
     deliberately no logo, no glow, no pill furniture until live. */
  .stage{display:flex;flex-direction:column;align-items:center;text-align:center}
  h1{
    font-size:clamp(80px,12vw,190px);
    font-weight:600;letter-spacing:-.025em;line-height:1.05;
  }
  .dot{
    display:block;
    width:6px;height:6px;border-radius:50%;
    background:#86868B;
    margin-top:38px;
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}
  .pill{
    display:inline-block;
    margin-top:26px;
    background:#1D1D1F;color:#F5F5F7;
    font-size:13px;font-weight:400;letter-spacing:.01em;
    padding:10px 20px;border-radius:999px;
    opacity:0;
  }
  [data-when-live]:not([hidden]){animation:rise .9s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .cdline{
    margin-top:24px;
    font-size:15px;font-weight:400;color:#86868B;
    transition:opacity .6s ease;
  }
  .cdline [data-cd]{font-variant-numeric:tabular-nums}
  [data-cd-wrap][data-done="1"]{opacity:.35}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
  <main class="stage">
    <h1>Be right back.</h1>
    <span class="dot" aria-hidden="true"></span>
    <span class="pill" data-when-live hidden>back now</span>
    <p class="cdline" data-cd-wrap>back in <span data-cd>05:00</span></p>
  </main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+300000,tp=q.get('t');
  if(tp){
    if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;}
    else{var d=new Date(tp);if(!isNaN(d.getTime()))target=d.getTime();}
  }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){
      e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x);
    });
    if(s<=0){
      document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');});
      document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');});
    }
  }
  tick();setInterval(tick,250);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMILE · INTER · highvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --field:#15161A; --ink:#101114; --paper:#FFFFFF; --orange:#FF5A00; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    overflow:hidden; background:var(--field); color:var(--ink);
    font-family:'IBM Plex Mono','Courier New',monospace;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;
  }
  /* orange header bar */
  .bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--orange);border-bottom:2px solid var(--ink);
    height:clamp(54px,9vh,84px);padding:0 clamp(20px,2.6vw,52px);}
  .bar h1{font-family:'Archivo Black','Arial Black',sans-serif;font-weight:400;
    color:#fff;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
    font-size:clamp(24px,1.9vw,32px);}
  .bar-meta{color:var(--ink);font-weight:700;letter-spacing:.18em;
    font-size:clamp(13px,1vw,16px);white-space:nowrap;}
  /* punch-list board */
  .board-wrap{flex:1;display:flex;align-items:center;justify-content:center;
    padding:clamp(20px,4vh,48px) clamp(16px,3vw,56px);}
  .panel{width:min(65vw,1240px);background:var(--paper);border:2px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;}
  .punch{list-style:none;padding:0 clamp(22px,2.4vw,46px);}
  .punch li{display:flex;align-items:center;gap:clamp(12px,1.2vw,20px);
    padding:clamp(13px,2.1vh,23px) 0;border-bottom:2px dotted #c9cad0;}
  .punch li:last-child{border-bottom:0}
  .cbx{width:18px;height:18px;border:2px solid var(--ink);background:#fff;
    flex:0 0 auto;position:relative;}
  .cbx.on{background:var(--orange)}
  .cbx.on::after{content:"";position:absolute;left:1px;top:3.5px;width:9px;height:4px;
    border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg);}
  .p-lbl{font-weight:600;font-size:clamp(15px,1.35vw,22px);letter-spacing:.03em;}
  /* now-playing readout */
  .np{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;
    padding:clamp(12px,1.9vh,18px) clamp(22px,2.4vw,46px);}
  .np-sq{width:12px;height:12px;background:var(--orange);flex:0 0 auto;
    animation:blink 1.2s infinite;}
  @keyframes blink{0%,54%{opacity:1}55%,100%{opacity:0}}
  .np-lbl{font-weight:700;letter-spacing:.24em;font-size:clamp(13px,1.05vw,16px);white-space:nowrap;}
  .np-val{margin-left:auto;font-weight:600;font-size:clamp(14px,1.2vw,19px);letter-spacing:.06em;white-space:nowrap;}
  /* resume footer */
  .foot{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    padding:clamp(16px,2.6vh,28px) clamp(22px,2.4vw,46px);}
  .resume{color:var(--orange);font-weight:700;letter-spacing:.04em;
    font-size:clamp(22px,2vw,32px);transition:opacity .3s linear;}
  .go{font-weight:700;color:var(--ink);font-size:clamp(14px,1.2vw,19px);
    letter-spacing:.1em;border:2px solid var(--ink);padding:8px 14px;}
  [data-cd-wrap][data-done="1"]{opacity:.35}
  /* panel footer with barcode */
  .p-foot{border-top:2px dashed var(--ink);display:flex;align-items:flex-end;
    justify-content:space-between;gap:20px;
    padding:clamp(14px,2vh,22px) clamp(22px,2.4vw,46px) clamp(16px,2.4vh,26px);}
  .b-wrap{display:flex;flex-direction:column;gap:8px}
  .barcode{height:34px;width:clamp(220px,20vw,360px);
    background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px);}
  .b-cap{font-weight:600;letter-spacing:.18em;font-size:clamp(13px,.95vw,15px)}
  .p-brand{color:var(--ink);font-weight:700;letter-spacing:.22em;font-size:clamp(13px,1vw,16px)}
  .wm{position:fixed;right:clamp(18px,2.4vw,44px);bottom:clamp(16px,3vh,34px);
    width:72px;height:72px;z-index:9;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.45));}
  .wm img{display:block;width:72px;height:72px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;animation-delay:0s!important}
  }
</style>
</head>
<body>
  <header class="bar">
    <h1>SHIFT BREAK — SCHEDULE</h1>
    <span class="bar-meta">SMILE · EP-<span data-ep>128</span></span>
  </header>
  <main class="board-wrap">
    <section class="panel" aria-label="Shift board">
      <ul class="punch">
        <li><span class="cbx on" aria-hidden="true"></span><span class="p-lbl">part one — done</span></li>
        <li><span class="cbx" aria-hidden="true"></span><span class="p-lbl">requests round — next</span></li>
        <li><span class="cbx" aria-hidden="true"></span><span class="p-lbl">mailbag</span></li>
        <li><span class="cbx" aria-hidden="true"></span><span class="p-lbl">part two</span></li>
      </ul>
      <div class="np">
        <span class="np-sq" aria-hidden="true"></span>
        <span class="np-lbl">NOW PLAYING</span>
        <span class="np-val">REQUESTS BLOCK</span>
      </div>
      <div class="foot">
        <div class="resume" data-cd-wrap>RESUME IN <span data-cd>10:00</span></div>
        <div class="go" data-when-live hidden>BACK ON AIR — WRAP THE BREAK</div>
      </div>
      <footer class="p-foot">
        <div class="b-wrap">
          <div class="barcode" aria-hidden="true"></div>
          <div class="b-cap">NO. SHIFT-<span data-ep>128</span></div>
        </div>
        <span class="p-brand">SMILE</span>
      </footer>
    </section>
  </main>
  <div class="wm"><img src="../assets/smile-mark.svg" alt="SMILE"></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+600000, tp=q.get('t');
  if(tp){ if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;} else {var d=new Date(tp); if(!isNaN(d.getTime())) target=d.getTime();} }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  var el0=q.get('elapsed')?parseInt(q.get('elapsed'),10):0, t0=Date.now();
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){ e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x); });
    var el=el0+Math.floor((Date.now()-t0)/1000);
    document.querySelectorAll('[data-elapsed]').forEach(function(e){ e.textContent=P(Math.floor(el/60))+':'+P(el%60); });
    if(s<=0){ document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');}); document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');}); }
  }
  tick(); setInterval(tick,250);
})();
</script>
</body>
</html>

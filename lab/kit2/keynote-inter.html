<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMILE · inter · keynote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:#000;color:#F5F5F7;
    font-family:-apple-system,'SF Pro Display','Inter','Helvetica Neue',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    display:grid;place-items:center;
  }
  .stage{width:100%;max-width:100vw;display:flex;flex-direction:column;align-items:center;text-align:center}
  h1{
    font-size:clamp(80px,12vw,190px);
    font-weight:600;letter-spacing:-.025em;line-height:1.05;
  }
  .cd{
    margin-top:20px;
    font-size:15px;font-weight:400;color:#86868B;
    transition:opacity .6s ease;
  }
  .cd [data-cd]{font-variant-numeric:tabular-nums}
  [data-cd-wrap][data-done="1"]{opacity:.35}
  /* one seamless marquee of small pills */
  .band{
    width:100%;overflow:hidden;
    margin-top:52px;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
  }
  .track{display:flex;width:max-content;animation:slide 30s linear infinite}
  @keyframes slide{to{transform:translateX(-50%)}}
  .set{display:flex;gap:14px;padding-right:14px}
  .chip{
    flex:0 0 auto;white-space:nowrap;
    background:#1D1D1F;color:#F5F5F7;
    font-size:13px;font-weight:400;letter-spacing:.01em;
    padding:8px 16px;border-radius:999px;
  }
  /* fixed beneath the marquee: now-playing pill with 4 tiny EQ bars */
  .np{
    margin-top:28px;
    display:inline-flex;align-items:center;gap:12px;
    background:#1D1D1F;color:#F5F5F7;
    padding:10px 20px;border-radius:999px;
  }
  .eq{display:flex;align-items:flex-end;gap:3px;height:12px}
  .eq i{
    display:block;
    width:2px;height:100%;border-radius:1px;
    background:#F5F5F7;
    transform-origin:bottom;
    animation:eq .9s ease-in-out infinite;
  }
  .eq i:nth-child(1){animation-delay:0s}
  .eq i:nth-child(2){animation-delay:.25s}
  .eq i:nth-child(3){animation-delay:.1s}
  .eq i:nth-child(4){animation-delay:.4s}
  @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  .np-t{font-size:13px;font-weight:400;letter-spacing:.01em}
  .mark{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:72px;height:72px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
  <main class="stage">
    <h1>Catch your breath.</h1>
    <p class="cd" data-cd-wrap>back in <span data-cd>10:00</span></p>
    <div class="band" role="marquee" aria-label="Intermission reminders">
      <div class="track">
        <div class="set">
          <span class="chip">stay hydrated</span>
          <span class="chip">stretch your shoulders</span>
          <span class="chip">follow the show</span>
          <span class="chip">grab a coffee</span>
          <span class="chip">back in five</span>
        </div>
        <div class="set" aria-hidden="true">
          <span class="chip">stay hydrated</span>
          <span class="chip">stretch your shoulders</span>
          <span class="chip">follow the show</span>
          <span class="chip">grab a coffee</span>
          <span class="chip">back in five</span>
        </div>
      </div>
    </div>
    <div class="np">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="np-t">now playing — lo-fi intermission mix</span>
    </div>
  </main>
  <img class="mark" src="../assets/smile-mark.svg" alt="SMILE" width="72" height="72">
<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+600000,tp=q.get('t');
  if(tp){
    if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;}
    else{var d=new Date(tp);if(!isNaN(d.getTime()))target=d.getTime();}
  }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){
      e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x);
    });
    if(s<=0){
      document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');});
      document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');});
    }
  }
  tick();setInterval(tick,250);
})();
</script>
</body>
</html>

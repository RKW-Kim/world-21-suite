<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMILE · END · highvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --field:#15161A; --ink:#101114; --paper:#FFFFFF; --orange:#FF5A00; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    overflow:hidden; background:var(--field); color:var(--ink);
    font-family:'IBM Plex Mono','Courier New',monospace;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  }
  .stage{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:clamp(22px,3.6vh,42px);
    padding:clamp(24px,4vh,48px) clamp(20px,3vw,64px);}
  /* the invoice */
  .invoice{position:relative;width:clamp(640px,60vw,1080px);
    background:var(--paper);border:2px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;}
  .i-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--orange);border-bottom:2px solid var(--ink);
    padding:clamp(12px,1.9vh,20px) clamp(22px,2.6vw,48px);}
  .i-head h1{font-family:'Archivo Black','Arial Black',sans-serif;font-weight:400;
    color:#fff;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
    font-size:clamp(24px,1.9vw,32px);}
  .i-brand{color:var(--ink);font-weight:700;letter-spacing:.22em;
    font-size:clamp(13px,1vw,16px);}
  .i-rows{display:flex;flex-direction:column;gap:clamp(12px,2vh,22px);
    padding:clamp(20px,3.2vh,38px) clamp(22px,2.6vw,48px) clamp(18px,3vh,34px);}
  .row{display:flex;align-items:baseline;gap:clamp(10px,1vw,16px);min-width:0}
  .lbl{font-weight:700;letter-spacing:.12em;font-size:clamp(14px,1.15vw,21px);white-space:nowrap}
  .lead{flex:1;min-width:20px;border-bottom:2px dotted var(--ink);transform:translateY(-4px)}
  .val{font-weight:600;font-size:clamp(14px,1.15vw,21px);letter-spacing:.04em;text-align:right}
  .i-total{border-top:3px solid var(--ink);margin:0 clamp(22px,2.6vw,48px);
    padding:clamp(16px,2.6vh,28px) 0 clamp(18px,3vh,34px);}
  .grand{font-family:'Archivo Black','Arial Black',sans-serif;font-weight:400;
    color:var(--ink);text-transform:uppercase;letter-spacing:.02em;text-align:right;
    font-size:clamp(20px,2.3vw,38px);}
  /* perforated barcode footer */
  .i-foot{position:relative;border-top:2px dashed var(--ink);
    padding:clamp(14px,2vh,22px) clamp(22px,2.6vw,48px) clamp(16px,2.4vh,26px);}
  .notch{position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--field)}
  .notch.l{left:-15px}.notch.r{right:-15px}
  .b-wrap{display:flex;flex-direction:column;gap:8px;width:fit-content}
  .barcode{height:34px;width:clamp(220px,20vw,360px);
    background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px);}
  .b-cap{font-weight:600;letter-spacing:.18em;font-size:clamp(13px,.95vw,15px)}
  /* the big stamp over the card */
  .stamp{position:absolute;top:40%;right:clamp(-38px,-2vw,-16px);z-index:3;
    font-family:'Archivo Black','Arial Black',sans-serif;font-weight:400;
    color:var(--orange);border:3px double var(--orange);text-transform:uppercase;
    letter-spacing:.06em;line-height:1;white-space:nowrap;background:transparent;
    padding:clamp(12px,1.8vh,18px) clamp(18px,1.8vw,30px);
    font-size:clamp(20px,1.9vw,34px);transform:rotate(-8deg);}
  .next{color:#fff;font-weight:600;letter-spacing:.14em;
    font-size:clamp(14px,1.35vw,22px);text-align:center;}
  .wm{position:fixed;left:clamp(18px,2.4vw,44px);bottom:clamp(16px,3vh,34px);
    width:72px;height:72px;z-index:9;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.45));}
  .wm img{display:block;width:72px;height:72px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;animation-delay:0s!important}
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="invoice" aria-label="Invoice">
      <header class="i-head">
        <h1>INVOICE — EP-<span data-ep>128</span></h1>
        <span class="i-brand">SMILE</span>
      </header>
      <div class="i-rows">
        <div class="row"><span class="lbl">ON AIR TIME</span><span class="lead" aria-hidden="true"></span><span class="val" data-elapsed>00:00</span></div>
        <div class="row"><span class="lbl">REQUESTS PLAYED</span><span class="lead" aria-hidden="true"></span><span class="val">14</span></div>
        <div class="row"><span class="lbl">CLIPS CUT</span><span class="lead" aria-hidden="true"></span><span class="val">3</span></div>
      </div>
      <div class="i-total">
        <div class="row"><span class="lbl">TOTAL</span><span class="lead" aria-hidden="true"></span><span class="grand">ONE GOOD STREAM</span></div>
      </div>
      <footer class="i-foot">
        <span class="notch l" aria-hidden="true"></span>
        <span class="notch r" aria-hidden="true"></span>
        <div class="b-wrap">
          <div class="barcode" aria-hidden="true"></div>
          <div class="b-cap">NO. INV-<span data-ep>128</span></div>
        </div>
      </footer>
      <div class="stamp">PAID IN FULL — THANKS</div>
    </section>
    <p class="next">NEXT JOB: NEXT WEEK — SAME TIME</p>
  </main>
  <div class="wm"><img src="../assets/smile-mark.svg" alt="SMILE"></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+600000, tp=q.get('t');
  if(tp){ if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;} else {var d=new Date(tp); if(!isNaN(d.getTime())) target=d.getTime();} }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  var el0=q.get('elapsed')?parseInt(q.get('elapsed'),10):0, t0=Date.now();
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){ e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x); });
    var el=el0+Math.floor((Date.now()-t0)/1000);
    document.querySelectorAll('[data-elapsed]').forEach(function(e){ e.textContent=P(Math.floor(el/60))+':'+P(el%60); });
    if(s<=0){ document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');}); document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');}); }
  }
  tick(); setInterval(tick,250);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMILE · Deck</title>
<style>
:root{
  --ink:#16131a; --shell:#1e1a22; --line:#2c2632; --line-2:#383040;
  --fg:#ede9f0; --dim:#a59fb0; --dim2:#7d7788;
  --one:#e5484d; --one-soft:#3a2226; --ok:#4cc38a; --warn:#f5a524;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;color:var(--fg);
  background:var(--line);padding:8px 13px;transition:.15s}
button:hover{background:var(--line-2)}
button.danger:hover{background:#4d2328}
button.primary{background:var(--one);font-weight:600}
button.primary:hover{background:#ef6065}
button.ghost{background:transparent;border:1px solid var(--line)}
input,select{font:inherit;color:var(--fg);background:#14111a;border:1px solid var(--line);
  border-radius:9px;padding:8px 12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--dim2)}
::placeholder{color:var(--dim2)}
/* ---------- shell ---------- */
header{display:flex;align-items:center;gap:14px;padding:14px 26px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink);z-index:5}
.mark{width:30px;height:30px;border-radius:9px;background:var(--one);display:grid;
  place-items:center;flex:none}
.mark i{width:14px;height:7px;border:2.5px solid #fff;border-top:0;border-left:0;
  border-radius:0 0 12px 12px}
.mast{font-weight:700;letter-spacing:.22em;font-size:13px}
.mast span{color:var(--dim);font-weight:400;letter-spacing:.35em;font-size:11px;margin-left:8px}
#err{position:fixed;left:26px;bottom:26px;background:#3b1d22;border:1px solid var(--one);
  color:#ffd9db;padding:10px 16px;border-radius:10px;font-size:13px;max-width:60ch;
  box-shadow:0 8px 30px #000a;opacity:0;transition:.25s;pointer-events:none}
#err.show{opacity:1}
main{max-width:880px;margin:0 auto;padding:28px 22px 90px}
h2{font-size:12px;letter-spacing:.18em;color:var(--dim);font-weight:600;text-transform:uppercase;
  margin:38px 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h2:first-of-type{margin-top:8px}
/* ---------- hero add ---------- */
.hero{background:linear-gradient(160deg,#241f2b,#1b1720);border:1px solid var(--line);
  border-radius:16px;padding:22px 22px 20px}
.hero p{color:var(--dim);font-size:13px;margin:6px 0 14px}
.hero .row{display:flex;gap:10px}
.hero .row input{flex:1}
details.adv{margin-top:14px}
details.adv summary{color:var(--dim2);font-size:13px;cursor:pointer;list-style:none}
details.adv summary:hover{color:var(--dim)}
details.adv .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
label.fl{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);margin-bottom:5px}
/* ---------- queue ---------- */
.qrow{display:flex;align-items:center;gap:14px;padding:11px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--shell);margin-bottom:8px}
.qrow.up{border-color:var(--one);background:#241c20}
.qrow.dorm{opacity:.45}
.qnum{color:var(--dim2);font:12px var(--mono);width:20px;flex:none;text-align:right}
.qtxt{flex:1;min-width:0}
.qtxt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtxt small{color:var(--dim2);font:11.5px var(--mono);display:block;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.qact{display:flex;gap:5px;opacity:0;transition:.15s;flex:none}
.qrow:hover .qact{opacity:1}
.qact button{padding:5px 9px;font-size:12px;border-radius:7px}
.qact button.on{color:var(--one)}
.pill{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;
  border-radius:99px;border:1px solid var(--line-2);color:var(--dim);flex:none}
.pill.stream{color:#f2a3c0;border-color:#52324a;background:#2b1e28}
.pill.next{color:#fff;background:var(--one);border-color:var(--one)}
.pill.pin{color:var(--warn);border-color:#544a1f}
.pill.miss{color:var(--warn);border-color:#54421f;background:#2a2113}
.empty{color:var(--dim2);font-size:13.5px;padding:10px 4px}
.meter{color:var(--dim2);font:11.5px var(--mono);display:block;margin-top:10px}
/* ---------- tables (music/history) ---------- */
.trow{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid var(--line);
  font-size:13.5px}
.trow:last-child{border-bottom:0}
.trow .mono{font:12px var(--mono);color:var(--dim)}
.trow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bed{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bed .mono{color:var(--dim);font-size:12.5px}
details.card{border:1px solid var(--line);border-radius:12px;background:var(--shell)}
details.card summary{padding:11px 14px;cursor:pointer;list-style:none;color:var(--dim);
  font-size:12px;letter-spacing:.18em;text-transform:uppercase}
details.card summary:hover{color:var(--fg)}
details.card .bd{padding:6px 14px 14px}
@media (max-width:640px){header{padding:12px 14px}.qact{opacity:1}}
</style></head><body>
<header>
  <div class="mark"><i></i></div>
  <div class="mast">SMILE<span>DECK</span></div>
  <span style="flex:1"></span>
  <span id="nowplay" style="font-size:13px;color:var(--dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:40ch"></span>
  <span id="diskline" class="mono" style="font:11.5px var(--mono);color:var(--dim2)"></span>
  <button class="ghost" id="refresh">↻</button>
</header>
<div id="err" aria-live="polite"></div>
<main>
<section class="hero">
  <input id="f_yt" placeholder="Paste a YouTube link — it airs. Nothing downloads." spellcheck="false">
  <div class="row" style="margin-top:10px">
    <input id="f_title" placeholder="Title (optional — defaults to the video's)" spellcheck="false">
    <button class="primary" id="add" style="flex:none">Put on air</button>
  </div>
  <p>Or files / intake links in advanced — same rotation either way.</p>
  <details class="adv"><summary>Advanced · intake link, file, show tag, status, slot</summary>
    <div class="grid">
      <div><label class="fl" for="f_dur">Stream slot (seconds — tests the rotation shorter)</label>
        <input id="f_dur" inputmode="numeric" placeholder="e.g. 45"></div>
      <div><label class="fl" for="f_show">Show tag</label><input id="f_show" placeholder="e.g. music"></div>
      <div><label class="fl" for="f_src">Fetch link instead (intake downloads it)</label>
        <input id="f_src" placeholder="https://…"></div>
      <div><label class="fl" for="f_file">…or file already in media/</label>
        <input id="f_file" placeholder="clip.mp4"></div>
      <div><label class="fl" for="f_status">Status</label>
        <select id="f_status"><option value="active">active — airs in rotation</option>
        <option value="dormant">parked — held out of rotation</option></select></div>
    </div>
  </details>
</section>

<h2>Rotation</h2>
<div id="rotation"></div>
<span class="meter" id="rotmeter"></span>

<details class="card" style="margin-top:26px"><summary>Waiting · registered, not fetched</summary>
  <div class="bd" id="pending"></div></details>
<details class="card" style="margin-top:10px"><summary>Parked · held out of rotation</summary>
  <div class="bd" id="archive"></div></details>

<h2>Music bed</h2>
<div class="qrow" style="margin-bottom:10px"><div class="qtxt">
  <b style="font-size:13.5px">Bed</b><small id="bedline">…</small></div>
  <div class="qact" style="opacity:1">
    <button id="m_play">Play</button><button id="m_stop">Stop</button></div></div>
<div id="musictracks"></div>
<div class="qrow" style="margin-top:12px">
  <div style="flex:1"><label class="fl" for="m_src">Fetch a bed track (intake, files into music/)</label>
  <input id="m_src" placeholder="https://…"></div>
  <div style="width:180px"><label class="fl" for="m_title">Title</label><input id="m_title"></div>
  <button id="m_add" style="margin-top:19px;flex:none">Fetch</button>
</div>

<details class="card" style="margin-top:30px"><summary>Fetched · the revert trail</summary>
  <div class="bd" id="history"></div></details>
</main>

<script>
(function(){
"use strict";
var errT = null;
function err(m){
  var e = document.getElementById('err');
  if (!m){ e.classList.remove('show'); clearInterval(errT); errT = null; return; }
  e.textContent = m; e.classList.add('show');
  if (errT) clearInterval(errT);
  errT = setInterval(function(){ e.classList.remove('show'); clearInterval(errT); errT = null; }, 6000);
}
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function MB(b){ return (b == null) ? '?' : (b / 1048576).toFixed(1) + ' MB'; }
function fmtDur(s){ s = Math.round(s); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60),
  ss = ('0' + (s % 60)).slice(-2);
  return h ? h + ':' + ('0' + m).slice(-2) + ':' + ss : m + ':' + ss; }
function op(b){ err('');
  fetch('library', {method: 'POST', body: JSON.stringify(b)})
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) err(j.error || 'update failed'); load(); })
    .catch(function(e){ err(String(e)); });
}
function btn(label, title, fn, cls){
  var b = document.createElement('button');
  b.textContent = label; if (title) b.title = title; if (cls) b.className = cls;
  b.onclick = fn; return b;
}
function qrow(t, i, kind){
  var d = document.createElement('div');
  d.className = 'qrow' + (t.up_next ? ' up' : '') + (t.status === 'dormant' && kind !== 'parked' ? ' dorm' : '');
  var n = document.createElement('div'); n.className = 'qnum'; n.textContent = i + 1;
  d.appendChild(n);
  var name = t.title || t.file || '(untitled)';
  var meta = t.mode === 'youtube' ? (t.youtube || '')
    : (t.file || t.source || '');
  var txt = document.createElement('div'); txt.className = 'qtxt';
  txt.innerHTML = '<b>' + esc(name) + '</b>' +
    '<small>' + esc(meta) + (t.duration != null && (t.mode === 'youtube' || t.size == null)
      ? ' · ' + fmtDur(t.duration) + ' slot' : '') + '</small>';
  d.appendChild(txt);
  if (t.mode === 'youtube') d.insertAdjacentHTML('beforeend', '<span class="pill stream">live</span>');
  if (t.mode === 'source') d.insertAdjacentHTML('beforeend', '<span class="pill">fetch</span>');
  if (t.pinned) d.insertAdjacentHTML('beforeend', '<span class="pill pin">pin</span>');
  if (kind === 'rotation' && !t.present && t.mode === 'file')
    d.insertAdjacentHTML('beforeend', '<span class="pill miss">missing</span>');
  if (t.up_next) d.insertAdjacentHTML('beforeend', '<span class="pill next">up next</span>');
  var acts = document.createElement('div'); acts.className = 'qact';
  var id = {index: i};
  acts.appendChild(btn('↑', 'Move up', function(){ op(Object.assign({op:'move', to:i-1}, id)); }));
  acts.appendChild(btn('↓', 'Move down', function(){ op(Object.assign({op:'move', to:i+1}, id)); }));
  acts.appendChild(btn(t.pinned ? 'unpin' : 'pin', null,
    function(){ op({op:'set', index:i, pinned: !t.pinned}); }, t.pinned ? 'on' : ''));
  acts.appendChild(btn(t.status === 'dormant' ? 'restore' : 'park', t.status === 'dormant'
    ? 'Back into rotation' : 'Hold out of rotation',
    function(){ op({op:'set', index:i, status: t.status === 'dormant' ? 'active' : 'dormant'}); }));
  acts.appendChild(btn('edit', 'Title + show tag', function(){
    var nt = prompt('Title', t.title || ''); if (nt === null) return;
    var ns = prompt('Show tag', t.show || ''); if (ns === null) return;
    op({op:'set', index:i, title: nt, show: ns});
  }));
  acts.appendChild(btn('✕', 'Remove from playlist', function(){
    if (confirm('Remove "' + name + '" from the playlist?')) op({op:'remove', index:i});
  }, 'danger'));
  d.appendChild(acts);
  return d;
}
function load(){
  fetch('library').then(function(r){ return r.json(); }).then(function(l){
    var items = l.items || [];
    document.getElementById('diskline').textContent =
      'media ' + MB(l.disk.media_bytes) + ' / cap ' + MB(l.disk.cap) +
      ' · free ' + MB(l.disk.free);
    var now = items[(l.state.index - 1 + items.length) % items.length];
    document.getElementById('nowplay').textContent =
      now ? 'ON AIR · ' + (now.title || now.file || '') : 'ON AIR';
    var rot = document.getElementById('rotation'); rot.innerHTML = '';
    var rt = [], pp = [], ar = [];
    items.forEach(function(t, i){
      if (!t.file && t.source && !t.youtube) pp.push(i);
      else if ((t.status || 'active') === 'dormant') ar.push(i);
      else rt.push(i);
    });
    var bytes = items.reduce(function(a, t){ return a + (t.size || 0); }, 0);
    document.getElementById('rotmeter').textContent =
      rt.length + ' in rotation · ' + pp.length + ' waiting · ' + ar.length +
      ' parked · ' + MB(bytes) + ' on disk';
    if (!rt.length) rot.innerHTML = '<p class="empty">Nothing in rotation — paste a link above.</p>';
    rt.forEach(function(i){ rot.appendChild(qrow(items[i], i, 'rotation')); });
    renderList('pending', 'No waiting items.', pp.map(function(i){ return qrow(items[i], i, 'pending'); }));
    renderList('archive', 'Empty — park a row to hold it here.', ar.map(function(i){ return qrow(items[i], i, 'parked'); }));
  }).catch(function(e){ err(String(e)); });
  loadMusic(); loadHistory();
}
function renderList(id, emptyMsg, rows){
  var box = document.getElementById(id); box.innerHTML = '';
  if (!rows.length){ box.innerHTML = '<p class="empty">' + emptyMsg + '</p>'; return; }
  rows.forEach(function(d){ box.appendChild(d); });
}
function loadHistory(){
  fetch('intake').then(function(r){ return r.json(); }).then(function(h){
    var box = document.getElementById('history'); box.innerHTML = '';
    var rows = h.history || [];
    if (!rows.length){ box.innerHTML = '<p class="empty">No fetches recorded yet.</p>'; return; }
    rows.forEach(function(r){
      var d = document.createElement('div'); d.className = 'trow';
      d.innerHTML = '<div class="grow"><b>' + esc(r.title || '(untitled)') + '</b><br>' +
        '<span class="mono">' + esc(r.source || '') + '</span></div>' +
        '<span class="mono">' + esc(r.file || '') + '</span>' +
        '<span class="mono">' + (r.duration != null ? Math.round(r.duration) + 's' : '?') + '</span>' +
        '<span class="mono">' + esc(r.date || '') + '</span>';
      var b = btn('queue', 'Re-register into the playlist', (function(rr){
        return function(){
          op({op:'add', title: rr.title || rr.file || 're-queue',
              source: rr.source || '', file: rr.source ? '' : (rr.file || '')});
        };
      })(r));
      d.appendChild(b); box.appendChild(d);
    });
  }).catch(function(e){ err('history: ' + String(e)); });
}
function loadMusic(){
  fetch('music').then(function(r){ return r.json(); }).then(function(m){
    var tracks = m.tracks || [];
    document.getElementById('bedline').textContent =
      'Playing: ' + (m.bed || '(none set — pick a track below)');
    var box = document.getElementById('musictracks'); box.innerHTML = '';
    if (!tracks.length){ box.innerHTML = '<p class="empty">No tracks yet — fetch one below.</p>'; return; }
    tracks.forEach(function(f){
      var d = document.createElement('div'); d.className = 'trow';
      d.innerHTML = '<span class="grow mono">' + esc(f) + '</span>';
      d.appendChild(btn('set as bed', null, function(){ mpost({op:'set', file:f}); }));
      box.appendChild(d);
    });
  }).catch(function(e){ err('bed: ' + String(e)); });
}
function mpost(body, failLabel){
  err('');
  fetch('music', {method:'POST', body: JSON.stringify(body)})
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) err((failLabel || 'music update failed') + ': ' + j.error); load(); })
    .catch(function(e){ err(String(e)); });
}
function obsMedia(act){
  err('');
  fetch('obs', {method:'POST', body: JSON.stringify({type:'TriggerMediaInputAction',
    data:{inputName:'Music Bed', mediaAction:'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_' + act}})})
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) err(j.error || 'transport failed'); })
    .catch(function(e){ err(String(e)); });
}
document.getElementById('m_add').onclick = function(){
  var b = this; b.textContent = 'fetching…'; b.disabled = true;
  fetch('music', {method:'POST', body: JSON.stringify({op:'add',
    source: document.getElementById('m_src').value,
    title: document.getElementById('m_title').value})})
    .then(function(r){ return r.json(); })
    .then(function(j){
      b.textContent = 'Fetch'; b.disabled = false;
      if (!j.ok) err('fetch failed: ' + j.error);
      else document.getElementById('m_src').value = '';
      load();
    })
    .catch(function(e){ b.textContent = 'Fetch'; b.disabled = false; err(String(e)); });
};
document.getElementById('m_play').onclick = function(){ obsMedia('PLAY'); };
document.getElementById('m_stop').onclick = function(){ obsMedia('STOP'); };
document.getElementById('refresh').onclick = function(){ err(''); load(); };
document.getElementById('add').onclick = function(){
  var b = {op:'add',
    title: document.getElementById('f_title').value,
    youtube: document.getElementById('f_yt').value,
    source: document.getElementById('f_src').value,
    file: document.getElementById('f_file').value,
    show: document.getElementById('f_show').value,
    status: document.getElementById('f_status').value};
  var d = parseInt(document.getElementById('f_dur').value, 10);
  if (d > 0) b.duration = d;
  op(b);
  ['f_title','f_yt','f_src','f_file','f_show','f_dur'].forEach(function(id){
    document.getElementById(id).value = ''; });
};
document.querySelector('.hero input').focus();
load();
})();
</script>
</body></html>

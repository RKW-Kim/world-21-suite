<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMILE · Library</title>
<style>
:root{
  --ink:#16131a; --shell:#1e1a22; --card:#221d29; --line:#2c2632; --line-2:#383040;
  --fg:#ede9f0; --dim:#a59fb0; --dim2:#7d7788;
  --one:#e5484d; --one-soft:#3a2226; --ok:#4cc38a; --warn:#f5a524; --info:#7aa2f7;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;color:var(--fg);
  background:var(--line);padding:8px 13px;transition:.15s}
button:hover{background:var(--line-2)}
button.danger:hover{background:#4d2328}
button.primary{background:var(--one);font-weight:600}
button.primary:hover{background:#ef6065}
button.ghost{background:transparent;border:1px solid var(--line)}
button.mini{padding:5px 9px;font-size:12px;border-radius:7px}
input,select{font:inherit;color:var(--fg);background:#14111a;border:1px solid var(--line);
  border-radius:9px;padding:8px 12px}
input:focus,select:focus{outline:none;border-color:var(--dim2)}
::placeholder{color:var(--dim2)}
/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;padding:12px 22px;
  border-bottom:1px solid var(--line);flex:none}
.mark{width:28px;height:28px;border-radius:9px;background:var(--one);display:grid;
  place-items:center;flex:none}
.mark i{width:13px;height:6px;border:2.5px solid #fff;border-top:0;border-left:0;
  border-radius:0 0 12px 12px}
.mast{font-weight:700;letter-spacing:.22em;font-size:12.5px}
.mast span{color:var(--dim);font-weight:400;letter-spacing:.35em;font-size:10.5px;margin-left:8px}
#livechip{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim);
  font:11.5px var(--mono)}
.dot{width:8px;height:8px;border-radius:99px;background:var(--dim2)}
.dot.on{background:var(--one);box-shadow:0 0 8px var(--one)}
/* ---------- frame: main + right rail ---------- */
.frame{flex:1;display:flex;min-height:0}
main{flex:1;overflow-y:auto;padding:22px 26px 46px;min-width:0}
nav.rail{width:236px;flex:none;border-left:1px solid var(--line);padding:16px 12px;
  display:flex;flex-direction:column;gap:4px;overflow-y:auto;background:#191521}
.railcap{font-size:10px;letter-spacing:.2em;color:var(--dim2);font-weight:600;
  text-transform:uppercase;padding:6px 10px 8px}
.rcat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
  cursor:pointer;border:1px solid transparent;color:var(--dim);transition:.15s;background:none}
.rcat:hover{background:var(--shell);color:var(--fg)}
.rcat.sel{background:var(--shell);border-color:var(--line-2);color:var(--fg);font-weight:600}
.rcat .ico{width:20px;height:20px;display:grid;place-items:center;flex:none;color:inherit}
.rcat .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.rcat .n{margin-left:auto;font:11px var(--mono);color:var(--dim2);
  background:#14111a;border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.rcat.sel .n{color:var(--fg)}
.rsep{height:1px;background:var(--line);margin:10px 6px}
.rfoot{margin-top:auto;font:10.5px/1.6 var(--mono);color:var(--dim2);padding:10px 12px}
.rfoot b{color:var(--dim)}
/* ---------- views ---------- */
.vhead{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.vhead h1{font-size:21px;font-weight:700}
.vhead .sub{color:var(--dim2);font-size:13px}
.addbar{display:flex;gap:10px;margin:0 0 20px;max-width:760px}
.addbar input{flex:1}
.addbar button{flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;transition:.15s}
.card:hover{border-color:var(--line-2);transform:translateY(-1px)}
.card.ghostcard{opacity:.5;border-style:dashed}
.thumb{aspect-ratio:16/9;background:#14111a;position:relative;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim2);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.thumb .scrim{position:absolute;inset:auto 0 0 0;height:52%;display:grid;place-items:center;
  background:linear-gradient(transparent,rgba(0,0,0,.78));opacity:0;transition:.15s}
.card:hover .scrim, .card:focus-within .scrim{opacity:1}
.badge{position:absolute;top:8px;left:8px;font:10px var(--mono);letter-spacing:.12em;
  background:#0009;border:1px solid #fff2;color:#fffd;padding:2px 7px;border-radius:99px}
.missb{position:absolute;top:8px;right:8px;color:var(--warn);background:#2a2113;
  border:1px solid #54421f;font:10px var(--mono);padding:2px 7px;border-radius:99px}
.cmeta{padding:10px 12px 12px;min-width:0}
.cmeta b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta small{display:block;color:var(--dim2);font:11px var(--mono);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta .tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;min-height:0}
.cmeta .racts{display:flex;gap:4px;margin-top:7px;opacity:0;transition:.15s}
.card:hover .racts,.card:focus-within .racts{opacity:1}
.pill{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;
  border-radius:99px;border:1px solid var(--line-2);color:var(--dim)}
.pill.up{color:#fff;background:var(--one);border-color:var(--one)}
.pill.pin{color:var(--warn);border-color:#544a1f}
.pill.avail{color:var(--info);border-color:#2c3a55}
.pill.miss{color:var(--warn);border-color:#54421f}
.rowlist{display:flex;flex-direction:column;gap:8px;max-width:860px}
.rowcard{display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px}
.rowcard:hover{border-color:var(--line-2)}
.rowcard .timg{width:104px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;
  background:#14111a;flex:none;display:grid;place-items:center;color:var(--dim2)}
.rowcard .timg img{width:100%;height:100%;object-fit:cover}
.rowcard .rmeta{flex:1;min-width:0}
.rowcard .rmeta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowcard .rmeta small{color:var(--dim2);font:11px var(--mono)}
.rowcard .racts,.card .racts{display:flex;gap:4px;opacity:0;transition:.15s}
.rowcard:hover .racts,.rowcard:focus-within .racts{opacity:1}
@media (hover:none){.racts,.scrim{opacity:1!important}}
.vtoggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vtoggle button{border-radius:0;padding:6px 12px;font-size:12px;background:none;color:var(--dim)}
.vtoggle button.on{background:var(--shell);color:var(--fg)}
.empty{color:var(--dim2);font-size:13.5px;padding:14px 4px}
.meter{color:var(--dim2);font:11.5px var(--mono);display:block;margin-top:14px}
h2.sec{font-size:11px;letter-spacing:.18em;color:var(--dim);font-weight:600;margin:26px 0 10px;
  display:flex;gap:10px;align-items:center;max-width:860px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
/* ---------- AUTOMATION ---------- */
.rule{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;max-width:820px;margin-bottom:12px}
.rule h3{font-size:13.5px;font-weight:600;display:flex;gap:9px;align-items:center}
.rule h3 .k{color:var(--one);font:10.5px var(--mono);letter-spacing:.12em;
  border:1px solid var(--one-soft);background:var(--one-soft);border-radius:6px;padding:2px 7px}
.rule p{color:var(--dim);font-size:12.5px;margin-top:5px}
.rule .knobs{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap;align-items:flex-end}
.knob label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);margin-bottom:5px}
.knob input{width:86px;text-align:center}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;
  overflow:hidden}
.step button{border-radius:0;padding:4px 10px;background:var(--shell)}
.step input{width:56px;text-align:center;border:0;background:none;padding:6px 8px;
  -moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
.timeline{max-width:820px}
.railrow{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:10px}
.railrow .t{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.railrow .t b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.railrow .t span{font:11px var(--mono);color:var(--dim2);flex:none}
.bar{position:relative;height:30px;border-radius:8px;background:#14111a;
  border:1px solid var(--line)}
.bar .mark{position:absolute;top:0;bottom:0;width:5px;background:var(--one);
  transform:translateX(-50%)}
.bar .mark::after{content:"AD";position:absolute;top:2px;bottom:2px;left:5px;
  font:9px/26px var(--mono);color:var(--one);letter-spacing:.08em}
.bar .half{position:absolute;top:0;bottom:0;width:1px;left:50%;background:var(--line-2)}
/* ---------- edit dialog ---------- */
dialog{background:var(--shell);color:var(--fg);border:1px solid var(--line-2);border-radius:16px;
  padding:20px 22px;width:min(430px,92vw)}
dialog::backdrop{background:#000a}
dialog h3{font-size:15px;margin-bottom:14px}
dialog .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
dialog label.fl{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);margin-bottom:5px}
dialog .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
/* ---------- toast ---------- */
#err{position:fixed;left:26px;bottom:26px;background:#3b1d22;border:1px solid var(--one);
  color:#ffd9db;padding:10px 16px;border-radius:10px;font-size:13px;max-width:60ch;
  box-shadow:0 8px 30px #000a;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#err.show{opacity:1}
@media (max-width:960px){
  body{overflow:auto;height:auto}
  .frame{flex-direction:column-reverse}
  nav.rail{width:auto;border-left:0;border-top:1px solid var(--line);
    flex-direction:row;flex-wrap:wrap}
  .railcap,.rfoot,.rsep{display:none}
  .rcat{padding:8px 10px}
  .rcat .n{display:none}
}
</style></head><body>
<header>
  <div class="mark"><i></i></div>
  <div class="mast">SMILE<span>· LIBRARY</span></div>
  <div id="livechip"><span class="dot" id="livedot"></span><span id="livetxt">—</span></div>
</header>
<div class="frame">
  <main id="main"></main>
  <nav class="rail" id="rail"></nav>
</div>
<div id="err"></div>

<dialog id="dlg">
  <h3 id="dtitle">Edit</h3>
  <div class="grid">
    <div style="grid-column:1/-1"><label class="fl">Title</label><input id="f_title"></div>
    <div><label class="fl">Show tag</label><input id="f_show"></div>
    <div><label class="fl">Status</label><select id="f_status">
      <option value="active">active — in rotation</option>
      <option value="dormant">cleared — available only</option></select></div>
    <div style="grid-column:1/-1"><label class="fl">
      <input type="checkbox" id="f_del" style="width:auto">
      also delete the cached file from disk</label></div>
  </div>
  <div class="foot">
    <button class="ghost" id="dcancel">Cancel</button>
    <button class="primary" id="dsave">Save</button>
  </div>
</dialog>

<script>
/* ============ SMILE Library: segmented media manager, no build ============ */

const $ = (s, el=document) => el.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = t => (t==null?"":String(t)).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmt(s){
  s = Math.round(s||0);
  const mm = String(Math.floor(s%3600/60)).padStart(2,"0"),
        hh = Math.floor(s/3600), ss = String(s%60).padStart(2,"0");
  return hh ? hh+":"+mm+":"+ss : mm+":"+ss;
}
let toastT;
function toast(msg){ const e=$("#err"); e.textContent=String(e.message||msg||e);
  e.classList.add("show"); clearTimeout(toastT);
  toastT=setTimeout(()=>e.classList.remove("show"), 4200); }
function sayit(msg){
  $("#err").textContent = msg; $("#err").classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>$("#err").classList.remove("show"), 4200);
}
async function api(url, body){
  const r = await fetch(url, body
    ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}
    : {});
  let j = {}; try{ j = await r.json(); }catch(_){}
  if(!r.ok || j.ok===false) throw new Error(j.error || ("HTTP "+r.status));
  return j;
}
const ytId = u => { const m = String(u||"").match(
  /(youtu\.be\/|\/shorts\/|[?&]v=|\/embed\/)([\w-]{11})/); return m ? m[2] : null; };
const ytThumb = u => { const id = ytId(u); return id
  ? "https://i.ytimg.com/vi/"+id+"/hqdefault.jpg" : null; };

/* ---------- shared data ---------- */
let LIB = {items:[]}, ADS = null, MUSIC = null, STATE = {index:0,deck:"A"};
let VIEW = "active", GRID = localStorage.vtoggle2 !== "rows";

async function refresh(){
  try{
    const results = await Promise.all([api("/library"), api("/ads"), api("/music")]);
    LIB = results[0]; ADS = results[1]; MUSIC = results[2];
    STATE = LIB.state || STATE;
    LIB.items.forEach((it,ix)=>it.__i = ix);
  }catch(e){ sayit(String(e && e.message || e)); }
  render();
}
function liveChip(){
  fetch("/state").then(r=>r.json()).then(s=>{
    const up = s && Object.keys(s).length > 0;
    $("#livedot").className = "dot" + (up ? " on" : "");
    let txt = "standby";
    if(up) txt = s.in_ad_break ? "AD BREAK" : "live · deck "+(s.deck||"?");
    $("#livetxt").textContent = txt;
  }).catch(()=>{});
}
setInterval(liveChip, 6000);

/* ---------- rail ---------- */
const CATS = [
  ["active",  "Rotation",  iconRot],
  ["available","Available",iconShelf],
  ["ads",     "Ads",       iconBolt],
  ["music",   "Music bed", iconNote],
  ["auto",    "Automations",iconFlow]];
function rail(){
  const onrot = LIB.items.filter(i=>i.status!=="dormant").length;
  const avail = LIB.items.filter(i=>i.status==="dormant").length;
  const counts = {active:onrot, available:avail,
                  ads:ADS ? ADS.pool.length : null,
                  music:MUSIC ? MUSIC.tracks.length : null, auto:null};
  $("#rail").innerHTML = '<div class="railcap">Segments</div>' + CATS.map(
    ([k, title, ic]) => '<button class="rcat'+(VIEW===k?" sel":"")+'" data-v="'+k+'">'+
      ic()+'<span>'+title+'</span><span class="n">'+
      (counts[k]==null?"·":counts[k])+'</span></button>').join("") +
    '<div class="rsep"></div>' +
    '<div class="rfoot"><b>'+diskLine()+'</b><br>cursor #'+(STATE.index||0)+
    ' · deck '+esc(STATE.deck||"—")+'<br>127.0.0.1:7070/media</div>';
  $$("#rail .rcat").forEach(b=>b.onclick = ()=>{VIEW = b.dataset.v; render();});
}
function diskLine(){
  const d = LIB.disk||{}; if(!d.free) return "disk —";
  return "free "+(d.free/1073741824).toFixed(0)+" GB / media "+
    (d.media_bytes ? (d.media_bytes/1073741824).toFixed(1) : "0")+" GB";
}
function iconRot(){return '<span class="ico"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5M18 3v4h-4M6 21v-4h4"/></svg></span>';}
function iconShelf(){return '<span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7"/><rect x="3" y="13" width="18" height="7"/></svg></span>';}
function iconBolt(){return '<span class="ico"><svg viewBox="0 0 24 24"><path d="M13 3 5 13h5l-1 8 9-11h-5l1-7z"/></svg></span>';}
function iconNote(){return '<span class="ico"><svg viewBox="0 0 24 24"><circle cx="8" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path d="M11 18V6l9-2v12"/></svg></span>';}
function iconFlow(){return '<span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="15" width="6" height="6"/><path d="M9 6h6a3 3 0 0 1 3 3v6"/></svg></span>';}

/* ---------- view render ---------- */
function render(){ rail(); $("#main").innerHTML = (
  VIEW==="active" ? viewRotation() :
  VIEW==="available" ? viewAvailable() :
  VIEW==="ads" ? viewAds() :
  VIEW==="music" ? viewMusic2() : viewAuto());
  feedIntake();
  wire();
}
function kindOf(i){
  if(i.mode==="youtube") return "stream";
  if(i.mode==="source") return i.present ? "file" : "fetch";
  if(!i.present) return "missing";
  return "file";
}
function thumbURL(i){
  if(i.youtube) return ytThumb(i.youtube);
  if(i.mode!=="youtube" && i.present && i.file) return "/thumbs/"+encodeURIComponent(i.file);
  return null;
}
function actions(i){
  const a = ['<button class="mini" data-act="promote" data-idx="'+i.__i+'">next</button>'];
  if(i.pinned) a.push('<button class="mini on" data-act="unpin" data-idx="'+i.__i+'">unpin</button>');
  else a.push('<button class="mini" data-act="pin" data-idx="'+i.__i+'">pin</button>');
  a.push(i.status==="dormant"
    ? '<button class="mini" data-act="set-active" data-idx="'+i.__i+'">to rotation</button>'
    : '<button class="mini" data-act="set-avail" data-idx="'+i.__i+'">clear</button>');
  a.push('<button class="mini" data-act="edit" data-idx="'+i.__i+'">edit</button>');
  a.push('<button class="mini danger" data-act="remove" data-idx="'+i.__i+'">✕</button>');
  return '<div class="racts">'+a.join("")+'</div>';
}
function cardHTML(i){
  const k = kindOf(i), t = thumbURL(i);
  const badge = k==="stream" ? ["LINK"] : k==="fetch" ? ["FETCH"] : k==="missing" ? ["MISSING"] : [];
  return '<div class="card'+(i.present?"":" ghostcard")+'">'+
    '<div class="thumb">'+
      (t ? '<img loading="lazy" src="'+esc(t)+'" onerror="this.style.display=\'none\'">' : "") +
      (t ? '' : '<div class="ph">'+(k==="fetch"?"FETCHING":k==="stream"?"NO PREVIEW":"NO THUMB")+'</div>') +
      (badge.length ? '<span class="badge'+(badge[0]==="MISSING"?" missb":"")+'">'+
        esc(badge[badge.length-1])+'</span>' : '') +
      (k==="missing" ? '' :
        '<div class="scrim"><button class="mini primary" data-act="promote" data-idx="'+
        i.__i+'">Next up</button></div>') +
    '</div>'+
    '<div class="cmeta"><b>'+esc(i.title)+'</b>' +
    '<small>'+(i.duration?fmt(i.duration):"—")+(i.up_next?" · up next":"")+'</small>'+
    '<div class="tags">'+
      (i.up_next ? '<span class="pill up">up next</span>' : '') +
      (i.pinned ? '<span class="pill pin">pinned</span>' : '') +
      (i.status==="dormant" ? '<span class="pill avail">available</span>' : '') +
    '</div>'+actions(i)+'</div></div>';
}
function rowHTML(i){
  const k = kindOf(i), t = thumbURL(i);
  return '<div class="rowcard">'+
    '<div class="timg" style="width:104px;height:60px">'+
      (t ? '<img loading="lazy" src="'+esc(t)+'" onerror="this.style.display=\'none\'">' :
         '<span style="font-size:9px;letter-spacing:.1em">'+
         (k==="fetch"?"FETCH":k==="stream"?"LINK":"—")+'</span>')+'</div>'+
    '<div class="rmeta"><b>'+esc(i.title)+'</b><small>'+(i.duration?fmt(i.duration):"—")+
      ' · '+k+(i.up_next?" · UP NEXT":"")+'</small></div>'+
    '<div style="display:flex;gap:5px">'+
      (i.up_next?'<span class="pill up">up next</span>':'')+
      (i.pinned?'<span class="pill pin">pin</span>':'')+
    '</div>'+actions(i)+'</div>';
}
function itemsHTML(list){
  if(!list.length) return '<div class="empty">Nothing here yet.</div>';
  return GRID ? '<div class="grid">'+list.map(cardHTML).join("")+'</div>'
              : '<div class="rowlist" style="max-width:none">'+list.map(rowHTML).join("")+'</div>';
}
function vhead(h, sub){
  return '<div class="vhead"><h1>'+h+'</h1><span class="sub">'+sub+'</span>'+
  '<div class="vtoggle" style="margin-left:auto">'+
  '<button data-vg="grid" class="'+(GRID?"on":"")+'">Grid</button>'+
  '<button data-vg="rows" class="'+(GRID?"":"on")+'">Rows</button></div></div>';
}
function addbar(ph, act){
  return '<div class="addbar"><input id="newsrc" placeholder="'+esc(ph)+'">'+
    '<button class="primary" data-act="'+(act||"add")+'">Add</button></div>';
}
function viewRotation(){
  const items = LIB.items.filter(i=>i.status!=="dormant");
  return vhead("Rotation", "the queue the daemon plays through") +
    addbar("Paste a YouTube link — streams live, zero disk…") +
    itemsHTML(items) +
    '<div class="meter">'+diskLine()+' · cache cap '+
    (LIB.disk && LIB.disk.cap ? (LIB.disk.cap/1073741824).toFixed(0) : "?")+' GB</div>';
}
function viewAvailable(){
  const avail = LIB.items.filter(i=>i.status==="dormant" && i.mode!=="source");
  const pend = LIB.items.filter(i=>i.mode==="source" && !i.present);
  const miss = LIB.items.filter(i=>!i.present && !i.youtube && i.mode!=="source" && i.has_source===false);
  return vhead("Available", "cleared shows, fetch queue, intake history") +
    '<h2 class="sec">Fetch queue</h2>' +
    (pend.length ? '<div class="rowlist">'+pend.map(rowHTML).join("")+'</div>'
      : '<div class="empty">No fetches waiting.</div>') +
    '<h2 class="sec">Cleared items</h2>' +
    (avail.length ? itemsHTML(avail) : '<div class="empty">Nothing parked. Cleared items keep position but never air.</div>') +
    '<div id="inthealth"></div>' +
    '<div class="meter">'+diskLine()+'</div>';
}
let INTAKE = [];
function feedIntake(){
  if(VIEW!=="available") return;
  api("/intake").then(j=>{
    INTAKE = (j&&j.history)||[];
    const host = $("#inthealth");
    if(!host) return;
    host.innerHTML = '<h2 class="sec">Recent intake</h2>' + (INTAKE.slice(0,8).map(h=>
      '<div class="rowlist">'+ '<div class="rowcard"><div class="rmeta"><b>'+
      esc((h.title||h.file||"").slice(0,60))+'</b><small>'+esc(h.date||"")+
      ' · '+(h.duration?fmt(h.duration):"—")+'</small></div>'+
      '<div class="racts"><button class="mini" data-act="intake-add" data-src="'+
      esc((h.file||""))+'" data-if="'+esc(h.file||"")+'">add to rotation</button></div>'+
      '</div></div>').join("") || '<div class="empty">No intake history yet.</div>');
    wire();
  }).catch(()=>{});
}
/* ADS */
function viewAds(){
  if(!ADS) return '<div class="empty">loading…</div>';
  const pool = ADS.pool.map(p=>{
    const link = p.kind==="link";
    const t = link ? ytThumb(p.name) : "/thumbs/"+encodeURIComponent(p.name);
    return '<div class="rowcard">'+
      '<div class="timg">'+(t?'<img loading="lazy" src="'+esc(t)+'" onerror="this.style.display=\'none\'">'
        :'<span style="font-size:9px">AD</span>')+'</div>'+
      '<div class="rmeta"><b>'+esc(p.name.length>56?"…"+p.name.slice(-55):p.name)+'</b>'+
      '<small>'+p.kind+'</small></div>'+
      '<div class="racts"><button class="mini danger" data-act="ad-del" data-kind="'+
      p.kind+'" data-name="'+esc(p.name)+'">✕</button></div></div>';
  }).join("");
  return vhead("Ads", "the pool the daemon rolls during breaks") +
    '<div class="rule"><h3><span class="k">CADENCE</span> One break every N played items</h3>'+
    '<p>Counted when new items start. 0 = ads fully off. Mid-rolls live under Automations.</p>'+
    '<div class="knobs"><div class="step"><button data-step="-1" data-k="ad_every">−</button>'+
    '<input id="k_every" type="number" min="0" value="'+(ADS.ad_every||0)+'" step="1">'+
    '<button data-step="1" data-k="ad_every">+</button></div>'+
    '<span class="pill" style="margin-left:auto">items since break: '+(ADS.since_ad||0)+'</span></div></div>'+
    '<div class="addbar"><input id="adlink" placeholder="https://youtube link — plays the spot directly, zero disk">'+
    '<button class="primary" data-act="ad-add">Add ad link</button></div>'+
    (pool?'<div class="rowlist" style="max-width:none">'+pool+'</div>'
      :'<div class="empty">Empty pool: breaks are declined and content keeps on playing. Add video files under media/ and register them, or add links above.</div>');
}
/* MUSIC */
function viewMusic2(){
  if(!MUSIC) return '<div class="empty">loading…</div>';
  const bed = ((MUSIC.bed||"").split("/").pop())||null;
  const rows = MUSIC.tracks.map(f=>
    '<div class="rowcard">'+
      '<div class="timg"><span>'+iconNote()+'</span></div>'+
      '<div class="rmeta"><b>'+esc(f)+'</b><small>'+
      (bed===f?'CURRENT BED':'music/')+'</small></div>'+
      '<div class="racts">'+
      (bed===f?'<span class="pill">current</span>'
        :'<button class="mini" data-mact="set" data-f="'+esc(f)+'">set as bed</button>')+
      '<button class="mini danger" data-mact="del" data-f="'+esc(f)+'">✕</button></div>'+
    '</div>').join("");
  return vhead("Music bed", "loops under Starting / Off Air / End Credits") +
    '<div class="addbar"><input id="muslink" placeholder="Paste a link to intake a track…">'+
    '<button class="primary" data-act="mus-add">Add track</button></div>'+
    (rows || '<div class="empty">No tracks yet: intake one above.</div>') +
    '<div class="meter">bed: '+esc(bed||"none")+(MUSIC.plane==="down"?" · PLANE DOWN (read-only)":"")+'</div>';
}
/* AUTOMATION */
function viewAuto(){
  if(!ADS) return '<div class="empty">loading…</div>';
  const p = ADS.ad_plan||{};
  const queue = (ADS.queue||[]).filter(q=>q.status!=="dormant");
  return vhead("Automations", "what the daemon does, visible") +
    rule1HTML(p) + rule2HTML(p) +
    '<h2 class="sec">Planned routes — next items</h2>' +
    '<div class="timeline">'+timelineHTML(queue)+'</div>';
}
function rule1HTML(){
  return '<div class="rule"><h3><span class="k">RULE 1</span> Cycle break every N items</h3>'+
    '<p>When N items have newly started, the next transition cuts to the ad scene instead of the next item — the index never moves, so the return resumes where the cycle left off.</p>'+
    '<div class="knobs"><div class="step"><button data-step="-1" data-k="ad_every">−</button>'+
    '<input id="k_every" type="number" min="0" value="'+(ADS.ad_every||0)+'" step="1">'+
    '<button data-step="1" data-k="ad_every">+</button></div>'+
    '<span class="pill" style="margin-left:auto">items since break: '+(ADS.since_ad||0)+'</span></div></div>';
}
function rule2HTML(p){
  const on = p.enabled!==false;
  return '<div class="rule"><h3><span class="k">RULE 2</span> Long-form: breaks inside the item</h3>'+
    '<p>Items under the threshold only ever see the cycle break, near their end. Longer items get up to N breaks past the min-gap — the program keeps rolling muted under cover, then the return picks up exactly where it cut away. Marks are seeded per item: the same run shows the same plan every time.</p>'+
    '<div class="knobs">'+
      knob("k_thr","Long-form threshold (min)","threshold_min",p.threshold_min,1)+
      knob("k_n","Breaks per long item","mid_rolls",p.mid_rolls,0)+
      knob("k_gap","Min gap between breaks (min)","min_gap_min",p.min_gap_min,1)+
      '<button class="primary" data-act="plan-save">Save plan</button>'+
      '<button class="ghost '+(on?"":"danger")+'" data-act="plan-toggle">'+(on?"ON":"OFF")+'</button>'+
      '</div></div>';
}
function knob(id,label,key,val,min){
  return '<div class="knob"><label>'+label+'</label>'+
    '<input id="'+id+'" type="number" min="'+min+'" value="'+(val==null?"":val)+'" data-k="'+key+'"></div>';
}
function timelineHTML(queue){
  const rows = queue.map((q,ix)=>{
    const dur = q.duration||0;
    const marks = (q.marks||[]).filter(m=>dur>0).map(m=>
      '<div class="mark" style="left:'+(m*100/dur).toFixed(2)+'%" title="'+fmt(m)+'"></div>').join("");
    return '<div class="railrow"><div class="t"><b>'+(ix===0?"▸ ":"")+esc(q.title)+
      '</b><span>'+(dur?fmt(dur):"duration unknown — breaks start once its clock reports a length")+
      ' · '+(q.marks&&q.marks.length ? q.marks.length+" mid-roll"+(q.marks.length>1?"s":"")
        : "cycle breaks only")+'</span></div>'+
      '<div class="bar"><div class="half"></div>'+marks+'</div></div>';
  }).join("");
  return rows || '<div class="empty">Playlist empty.</div>';
}

/* ---------- interactions ---------- */
async function act(a, el){
  const idx = parseInt(el.dataset.idx);
  const it = LIB.items[idx];
  try{
    if(a==="add"){
      const src = $("#newsrc").value.trim(); if(!src) return;
      if(ytId(src)) await api("/library",{op:"add", title:src.slice(0,60), youtube:src});
      else await api("/library",{op:"add", title:src.split("/").pop().slice(0,60)||src, source:src});
      sayit("added — resolves/prefetches in the background");
    }
    else if(!it) return;
    else if(a==="promote"){ await api("/library",{op:"move", ...keyFor(it), to:0});
      sayit('"'+it.title+'" is now next in rotation.'); }
    else if(a==="pin"){ await api("/library",{...keyFor(it), op:"set", pinned:true});
      sayit("pinned — never evicted from cache."); }
    else if(a==="unpin"){ await api("/library",{...keyFor(it), op:"set", pinned:false}); }
    else if(a==="set-active"){ await api("/library",{...keyFor(it), op:"set", status:"active"}); }
    else if(a==="set-avail"){ await api("/library",{...keyFor(it), op:"set", status:"dormant"}); }
    else if(a==="edit"){ openDlg(it); return; }
    else if(a==="remove"){
      if(!confirm("Remove '"+it.title+"' from the library?")) return;
      await api("/library",{...keyFor(it), op:"remove", delete_file:false});
      sayit("removed."); }
    else if(a==="intake-add"){
      await api("/library",{op:"add", title:(it?it.title:el.dataset.t||el.dataset.src||"intake"), file:el.dataset.src});
      sayit("queued: file added to rotation.");
    }
    else if(a==="ad-add"){ const u = $("#adlink").value.trim(); if(!u) return;
      const links = (ADS.ad_links||[]).slice();
      if(!links.includes(u)) links.push(u);
      await api("/ads",{ad_links:links}); $("#adlink").value=""; sayit("ad link added."); }
    else if(a==="ad-del"){
      const kind = el.dataset.kind, name = el.dataset.name;
      if(kind==="link") await api("/ads",{ad_links:(ADS.ad_links||[]).filter(x=>x!==name)});
      else await api("/ads",{ad_files:(ADS.ad_files||[]).filter(x=>x!==name)});
      sayit("removed from ad pool."); }
    else if(a==="mus-add"){ const u = $("#muslink").value.trim(); if(!u) return;
      await api("/music",{op:"add", source:u, title:u.split("/").pop().slice(0,40)||"music"});
      sayit("track intake started — lands in media/music/."); }
    else if(a==="plan-save"){
      const body = {};
      ["threshold_min","mid_rolls","min_gap_min"].forEach(k=>{
        const el2=$("#"+ ({threshold_min:"k_thr",mid_rolls:"k_n",min_gap_min:"k_gap"}[k]));
        if(el2 && el2.value!=="") body[k==null?k:k] = parseFloat(el2.value);
      });
      const cur = ADS.ad_plan || {};
      await api("/ads",{ad_plan:Object.assign({}, cur, body)});
      sayit("plan saved — applies at the next transition."); }
    else if(a==="plan-toggle"){
      await api("/ads",{ad_plan:Object.assign({}, ADS.ad_plan||{},
        {enabled: !(ADS.ad_plan && ADS.ad_plan.enabled===false)})});
      sayit("mid-rolls " + (!(ADS.ad_plan&&ADS.ad_plan.enabled===false)?"OFF":"ON") + "."); }
  }catch(e){ sayit(String(e && e.message || e)); }
  refresh();
}
function keyFor(it){
  return it.file ? {file:it.file} : {index: parseInt(it.__i)};
}
function wire(){
  $$("[data-act]").forEach(b=>b.onclick = ()=>act(b.dataset.act, b));
  $$("[data-mact]").forEach(b=>b.onclick = async ()=>{
    try{
      if(b.dataset.mact==="set") await api("/music",{op:"set", file:b.dataset.f});
      else { if(!confirm("Remove "+b.dataset.f+" from music/?")) return;
        const r = await fetch("/music",{method:"DELETE",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({file:b.dataset.f})});
        if(!r.ok){ let j={}; try{ j=await r.json(); }catch(_){}
          throw new Error(j.error || "HTTP "+r.status); } }
    }catch(e){ sayit(String(e && e.message || e)); }
    refresh();
  });
  $$("[data-vg]").forEach(b=>b.onclick = ()=>{
    GRID = b.dataset.vg==="grid"; localStorage.vtoggle2 = GRID?"grid":"rows"; render(); });
  $$(".step [data-step]").forEach(b=>b.onclick = ()=>{
    const inp = b.parentNode.querySelector("input");
    inp.value = Math.max(0, (+inp.value||0) + (+b.dataset.step));
    clearTimeout(inp.__t);
    inp.__t = setTimeout(async ()=>{ try{ await api("/ads",{ad_every:+inp.value}); }
      catch(e){ sayit(String(e.message||e)); } refresh(); }, 350);
  });
}

/* ---------- edit dialog ---------- */
let dlgIt;
function openDlg(it){
  dlgIt = it;
  $("#f_title").value = it.title||"";
  $("#f_show").value = it.show||"";
  $("#f_status").value = it.status==="dormant" ? "dormant" : "active";
  $("#f_del").checked = false;
  $("#dtitle").textContent = "Edit — "+(it.title||"?");
  $("#dlg").showModal();
}
$("#dcancel").onclick = ()=> $("#dlg").close();
$("#dsave").onclick = async ()=>{
  try{
    await api("/library", Object.assign(keyFor(dlgIt), {op:"set",
      title:$("#f_title").value.trim()||undefined,
      show:$("#f_show").value.trim(),
      status:$("#f_status").value}));
    if($("#f_del").checked && dlgIt.file)
      await api("/library", Object.assign(keyFor(dlgIt), {op:"remove", delete_file:true}));
    $("#dlg").close(); refresh();
  }catch(e){ sayit(String(e && e.message || e)); }
};

refresh(); liveChip();
</script>
</body></html>

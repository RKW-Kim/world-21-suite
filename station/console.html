<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMILE · station console</title>
<style>
/* STATION CONSOLE — remote control for the headless render plane.
   Open from the machine under test with the socket address + password:
     http://<ARCH-IP>:7070/console?obs=<ARCH-IP>&pass=<OBS_PASS>
   The page talks DIRECTLY to obs-websocket (ws://<obs>:4455) from the
   browser: no inbound holes beyond the OBS socket itself, no server side.
   LAB ONLY in this form: the password rides in the URL. On the VPS this
   page is served behind an SSH tunnel, never raw. Daemon intents (go-live
   with ident chaining, auto TECHDIFF) are NOT here — those live in the
   daemon CLI until the dashboard phase. This is raw switching + transport. */
:root{--bg:#0a0a0a;--panel:#141417;--line:#27272a;--fg:#fafafa;--mut:#a1a1aa;
  --yel:#ffc107;--ok:#0ecb81;--bad:#f6465d;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,sans-serif;padding:16px;max-width:720px}
h1{font-size:18px;margin:0 0 4px}.sub{color:var(--mut);font-size:12px;margin-bottom:14px;
  font-family:var(--mono)}
#status{font-family:var(--mono);font-size:12px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px}
#status b.on{color:var(--ok)}#status b.off{color:var(--bad)}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
  font-family:var(--mono);margin:16px 0 8px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
button{background:var(--panel);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer}
button.onair{border-color:var(--yel);color:var(--yel)}
button:active{transform:scale(.97)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
select{background:var(--panel);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:10px}
#err{color:var(--bad);font-family:var(--mono);font-size:12px;min-height:18px}
</style></head><body>
<h1>SMILE · station console</h1>
<div class="sub">raw switching + media transport · daemon intents live in the CLI</div>
<div id="status">connecting…</div>
<h2>Director intents</h2>
<div class="grid">
  <button data-intent="go-live">GO LIVE</button>
  <button data-intent="tech-diff">TECH DIFF</button>
  <button data-intent="resume">RESUME</button>
  <button data-intent="return">RETURN</button>
</div>
<div id="err"></div>
<h2>Scenes</h2><div class="grid" id="scenes"></div>
<h2>Media transport</h2>
<div class="row"><select id="src"></select></div>
<div class="grid">
  <button data-act="RESTART">Restart</button>
  <button data-act="PLAY">Play</button>
  <button data-act="PAUSE">Pause</button>
  <button data-act="STOP">Stop</button>
  <button id="mute">Mute/Unmute source</button>
</div>
<h2>Output</h2>
<div class="grid">
  <button id="rec">Start/Stop recording</button>
</div>
<script>
(function(){
"use strict";
var q = new URLSearchParams(location.search);
var host = q.get('obs') || location.hostname;
var pass = q.get('pass') || '';
var err = function(m){ document.getElementById('err').textContent = m || ''; };
var seq = 0, pending = {}, ws = null, statusTimer = null;

function b64(bytes){
  var s = '';
  bytes.forEach(function(b){ s += String.fromCharCode(b); });
  return btoa(s);
}
function sha256(str){
  return sha256ascii(str);
}
/* SHA-256 over bytes, dependency-free: crypto.subtle does not exist on plain
   http://LAN origins (non-secure contexts), which is exactly how this console
   is served. Verified against NIST vectors in node before shipping. */
function sha256ascii(s) {
  s = unescape(encodeURIComponent(s));
  var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var l = s.length, bl = l * 8, pad = (((l + 8) >> 6) + 1) * 16, M = new Array(pad).fill(0);
  for (var i = 0; i < l; i++) M[i >> 2] |= s.charCodeAt(i) << (24 - (i % 4) * 8);
  M[(l >> 2)] |= 0x80 << (24 - (l % 4) * 8);
  M[pad - 1] = bl;
  var R = function(x, n) { return (x >>> n) | (x << (32 - n)); };
  for (var j = 0; j < pad; j += 16) {
    var w = M.slice(j, j + 16);
    for (var t = 16; t < 64; t++) {
      var s0 = R(w[t-15],7) ^ R(w[t-15],18) ^ (w[t-15] >>> 3);
      var s1 = R(w[t-2],17) ^ R(w[t-2],19) ^ (w[t-2] >>> 10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (var k = 0; k < 64; k++) {
      var S1 = R(e,6) ^ R(e,11) ^ R(e,25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K[k] + w[k]) | 0;
      var S0 = R(a,2) ^ R(a,13) ^ R(a,22);
      var mj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + mj) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H = H.map(function(x, ix){ return (x + [a,b,c,d,e,f,g,h][ix]) | 0; });
  }
  var out = new Uint8Array(32);
  H.forEach(function(x, ix){ out[ix*4]=x>>>24; out[ix*4+1]=(x>>>16)&255; out[ix*4+2]=(x>>>8)&255; out[ix*4+3]=x&255; });
  return out;
}
function call(type, data){
  return new Promise(function(res, rej){
    var id = 'c' + (++seq);
    pending[id] = {res: res, rej: rej};
    ws.send(JSON.stringify({op: 6, d: {requestType: type, requestId: id, requestData: data || {}}}));
    setTimeout(function(){ if (pending[id]) { delete pending[id]; rej(new Error('timeout ' + type)); } }, 15000);
  });
}
function setStatus(){
  Promise.all([call('GetStreamStatus'), call('GetRecordStatus'), call('GetCurrentProgramScene')])
    .then(function(r){
      var s = r[0], rec = r[1], pgm = r[2].currentProgramSceneName;
      document.getElementById('status').innerHTML =
        'program <b class="on">' + pgm + '</b> · stream ' +
        (s.outputActive ? '<b class="on">LIVE</b>' : '<b class="off">off</b>') +
        ' · rec ' + (rec.outputActive ? '<b class="on">on</b>' : 'off');
      document.querySelectorAll('#scenes button').forEach(function(b){
        b.classList.toggle('onair', b.textContent === pgm);
      });
    }).catch(function(){});
}
function refresh(){
  call('GetSceneList').then(function(d){
    var box = document.getElementById('scenes'); box.innerHTML = '';
    d.scenes.forEach(function(s){
      var b = document.createElement('button');
      b.textContent = s.sceneName;
      b.onclick = function(){ err(''); call('SetCurrentProgramScene', {sceneName: s.sceneName}).then(setStatus).catch(function(e){ err(String(e)); }); };
      box.appendChild(b);
    });
    setStatus();
  }).catch(function(e){ err(String(e)); });
  call('GetInputList').then(function(d){
    var sel = document.getElementById('src'); sel.innerHTML = '';
    (d.inputs || []).forEach(function(i){
      if (String(i.inputKind) !== 'ffmpeg_source') return;  // transport = media only
      var o = document.createElement('option');
      o.value = i.inputName; o.textContent = i.inputName;
      sel.appendChild(o);
    });
    Array.prototype.forEach.call(sel.options, function(o, ix){
      if (/PLAYOUT|SRT|IDENT/.test(o.value)) sel.selectedIndex = ix;
    });
  }).catch(function(){});
}
function transport(act){
  var name = document.getElementById('src').value;
  if (!name) return;
  err('');
  call('TriggerMediaInputAction', {inputName: name, mediaAction: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_' + act})
    .catch(function(e){ err(String(e)); });
}
document.querySelectorAll('[data-intent]').forEach(function(b){
  // Same functions the CLI runs (server-side); phone and terminal agree.
  b.onclick = function(){
    err('');
    fetch('intent/' + b.getAttribute('data-intent'), {method: 'POST'})
      .then(function(r){ return r.json(); })
      .then(function(j){ if (!j.ok) err(j.error || 'intent failed'); else setStatus(); })
      .catch(function(e){ err(String(e)); });
  };
});
document.querySelectorAll('[data-act]').forEach(function(b){
  b.onclick = function(){ transport(b.getAttribute('data-act')); };
});
document.getElementById('mute').onclick = function(){
  var name = document.getElementById('src').value;
  if (name) call('ToggleInputMute', {inputName: name}).catch(function(e){ err(String(e)); });
};
document.getElementById('rec').onclick = function(){
  err('');
  call('GetRecordStatus').then(function(s){
    return call(s.outputActive ? 'StopRecord' : 'StartRecord');
  }).catch(function(e){ err(String(e)); });
};
function connect(){
  ws = new WebSocket('ws://' + host + ':4455');
  ws.onopen = function(){
    // v5 handshake: wait for Hello(op 0), answer Identify(op 1), wait Identified(op 2).
    var hello = function(ev){
      var m = JSON.parse(ev.data);
      if (m.op !== 0) return;
      ws.removeEventListener('message', hello);
      var d = {rpcVersion: 1, eventSubscriptions: 2047};
      var auth = m.d && m.d.authentication;
      var done = function(){
        ws.send(JSON.stringify({op: 1, d: d}));
        var identified = function(ev2){
          var m2 = JSON.parse(ev2.data);
          if (m2.op !== 2) return;
          ws.removeEventListener('message', identified);
          ws.addEventListener('message', route);
          err('');
          refresh();
          // One poller ever: reconnects reuse it (ws is global). A new
          // interval per connect would stack N pollers hammering the socket.
          if (!statusTimer) statusTimer = setInterval(setStatus, 5000);
        };
        ws.addEventListener('message', identified);
      };
      if (auth && pass) {
        var secret = b64(sha256(pass + auth.salt));
        d.authentication = b64(sha256(secret + auth.challenge));
        done();
      } else done();
    };
    ws.addEventListener('message', hello);
  };
  ws.onerror = function(){ err('socket error — is obs-websocket up at ' + host + ':4455?'); };
  ws.onclose = function(){ err('socket closed — reconnecting…'); setTimeout(connect, 3000); };
}
function route(ev){
  var m;
  try { m = JSON.parse(ev.data); } catch (e) { return; }
  if (m.op === 7 && m.d && pending[m.d.requestId]) {
    var p = pending[m.d.requestId]; delete pending[m.d.requestId];
    if (m.d.requestStatus && m.d.requestStatus.result) p.res(m.d.responseData || {});
    else p.rej(new Error((m.d.requestStatus || {}).comment || 'request failed'));
  } else if (m.op === 5 && m.d && m.d.eventType === 'CurrentProgramSceneChanged') {
    setStatus();
  }
}
connect();
})();
</script>
</body>
</html>

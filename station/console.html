<!doctype html>

<title>SMILE · station console</title>
<style>
/* STATION CONSOLE v2 — OBS arrangement, our code throughout.
   Menu bar carries ONLY working entries (View/Profile/Collection/Tools/Help).
   File/Edit are omitted on purpose: they administer the local desktop app
   (undo, clipboard, remux, updates), none of which is a show operation and
   none of which has a protocol surface. A menu of dead buttons is worse
   than no menu. What a TD does on air lives in docks + preview/program.
   Open with socket address + password:
     http://<ARCH-IP>:7070/console?obs=<ARCH-IP>&pass=<OBS_PASS>
   LAB ONLY in this form (password in URL; SSH tunnel on VPS). */
:root{--bg:#1d1f26;--panel:#272a33;--panel2:#2b2e38;--line:#3c404d;--fg:#dfdfdf;
  --mut:#888;--yel:#ffc107;--ok:#4caf50;--bad:#f44336;--acc:#4daafc;
  --mono:ui-monospace,monospace}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Segoe UI",Arial,sans-serif;padding:0;font-size:13px;height:100vh;
  display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border:3px solid var(--bg);border-radius:6px}
.menubar{display:flex;gap:2px;background:#1c1c1c;border-bottom:1px solid #111;
  padding:0 8px;font-size:13px;user-select:none;flex:none}
.mi{position:relative;padding:8px 10px;cursor:pointer}
.mi:hover,.mi.open{background:var(--panel2)}
.dd{display:none;position:absolute;top:100%;left:0;background:var(--panel2);
  border:1px solid var(--line);border-radius:0 0 6px 6px;min-width:220px;z-index:20;
  box-shadow:0 12px 28px rgba(0,0,0,.5)}
.mi.open .dd{display:block}
.dd button{display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--fg);padding:9px 12px;font-size:13px;border-radius:0;cursor:pointer}
.dd button:hover{background:#4a4a4a}
.dd button{display:flex;align-items:center;text-align:left}
.menubar .meta b{color:var(--yel);font-weight:600}
body.notoolbars .dtools{display:none}
#items.iconic button.eye{font-size:16px;padding:6px 10px}
.dd .sep{border-top:1px solid var(--line);margin:4px 0}
.topbar{display:flex;align-items:center;gap:10px;background:var(--panel);
  border-bottom:1px solid var(--line);padding:8px 14px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.topbar .title{font-weight:700}
.topbar .pgm{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mut)}
.topbar .pgm b{color:var(--yel);font-weight:600}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 0}
.stage.one{grid-template-columns:1fr}
.view{background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.view .cap{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--mut);
  padding:6px 10px;background:var(--panel)}
.view img{display:block;width:100%;aspect-ratio:16/9;background:#000;object-fit:contain}
.docks{display:flex;gap:5px;padding:5px;height:250px;overflow-x:auto;flex:none}
.dock{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:0;min-width:180px;flex:1;overflow:hidden}
.dock>h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--mut);font-family:var(--mono);margin:0 0 8px;font-weight:600}
.grid{display:flex;flex-wrap:wrap;gap:6px}
button{background:#3c404d;color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:7px 10px;font-size:13px;cursor:pointer}
button.onair{border-color:var(--yel);color:var(--yel)}
button.live{border-color:var(--bad);color:var(--bad)}
button:active{transform:scale(.97)}
/* source rows use .srow + .ibtn now */
.row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
select,input[type=number]{background:#1d1f26;color:var(--fg);border:1px solid var(--line);
  border-radius:3px;padding:6px 8px;max-width:100%}
input[type=text],input[type=password],textarea{background:#1d1f26;color:var(--fg);
  border:1px solid var(--line);border-radius:3px;padding:6px 8px;font-size:13px;
  font-family:var(--mono)}
textarea{width:100%;box-sizing:border-box}
.dlg label.fl{display:block;margin:6px 0;font-size:12px;color:var(--mut)}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mv figure{margin:0;cursor:pointer}
.mv img{display:block;width:100%;aspect-ratio:16/9;background:#000;object-fit:contain;
  border:2px solid var(--line);border-radius:4px}
.mv figure.onair img{border-color:var(--yel)}
.mv figcaption{font-family:var(--mono);font-size:11px;color:var(--mut);padding:3px 2px}
table.kv{border-collapse:collapse;font-size:12px;font-family:var(--mono)}
table.kv td{padding:3px 10px 3px 0;color:var(--mut)}
table.kv td:last-child{color:var(--fg)}
input[type=range]{flex:1;min-width:90px;accent-color:var(--yel)}
.mixrow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;margin-bottom:8px}
.mixrow .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixrow .meter{grid-column:1/-1;height:6px;background:#141414;border-radius:3px;overflow:hidden}
.mixrow .meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--ok),var(--yel))}
.statusbar{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;
  color:var(--mut);background:var(--panel);border-top:1px solid var(--line);
  padding:8px 14px;position:sticky;bottom:0}
.statusbar b{color:var(--fg);font-weight:600}.statusbar b.bad{color:var(--bad)}
#err{color:var(--bad);font-family:var(--mono);font-size:12px;min-height:18px;padding:4px 14px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50}
.dlg.open{display:grid}
.dlg .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:0;min-width:min(420px,92vw);font-size:13px;line-height:1.6;overflow:hidden}
.dlg .box h3{margin:0;background:#3c404d;padding:8px 12px;font-size:14px}
#dlgbody{padding:16px}
/* OBS-arrangement pass: one slim bar, capped stage, dock chrome, footer */
.menubar{position:sticky;top:0;z-index:30}
.menubar .spacer{flex:1}
.menubar .meta{display:flex;align-items:center;gap:10px;padding:0 10px;
  font-family:var(--mono);font-size:11px;color:var(--mut);white-space:nowrap}
.dd button.dis{opacity:.45;cursor:not-allowed}
.dd .sep{border-top:1px solid var(--line);margin:4px 2px}
.dd button .ck{color:var(--ok);margin-right:6px}
.dd button .key{margin-left:auto;color:var(--mut);font-size:11px;
  font-family:var(--mono);padding-left:18px}
.dd button .arr{margin-left:auto;color:var(--mut);padding-left:18px}
.dd .sub{position:absolute;left:100%;top:0;min-width:200px;background:var(--panel2);
  border:1px solid var(--line);border-radius:0 6px 6px 0;display:none;
  box-shadow:0 12px 28px rgba(0,0,0,.5)}
.dd button.hasub{position:relative}
.dd button.hasub:hover .sub{display:block}
.stage{flex:1;min-height:0}
.stage img{max-height:100%}
.dock{display:flex;flex-direction:column}
.dock .dhead{display:flex;align-items:center;background:#3c404d;padding:6px 10px;
  font-weight:600;font-size:13px;color:#e0e0e0;margin:0;flex:none}
.dock .dhead .undock{margin-left:auto;background:none;border:0;color:var(--mut);
  padding:2px 4px;font-size:12px;cursor:pointer;line-height:1}
.dock .dbody{flex:1;min-height:0;overflow:auto;padding:8px 10px}
.dock .dtools{display:flex;gap:4px;margin-top:0;padding:4px 6px;align-items:center;
  border-top:1px solid var(--line);flex-wrap:wrap;flex:none}
.ibtn{background:#2b2e38;border:1px solid var(--line);border-radius:4px;
  width:24px;height:24px;padding:4px;cursor:pointer;color:var(--fg);line-height:0;flex:none}
.ibtn:hover{background:#4a4a4a;border-color:var(--line)}
.ibtn svg{display:block;width:14px;height:14px}
.ibtn svg .s{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ibtn svg .f{fill:currentColor}
body.locked .ibtn,body.locked .undock{pointer-events:none;opacity:.4}
#scenes.compact button{padding:4px 8px;font-size:12px}
.statusbar{position:sticky;bottom:0;z-index:20}
.textbar{display:none;gap:8px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:8px 12px;
  margin:0 12px 10px;font-size:13px}
.textbar.on{display:flex}
.textbar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
/* density pass toward the reference arrangement */
.menubar .mi{padding:6px 10px}
#scenes,#items{display:flex;flex-direction:column;gap:2px}
#scenes button,#items .srow .nm{border-radius:4px;text-align:left;width:100%}
#items .srow{display:flex;gap:4px;margin-bottom:2px}
#items .srow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#items .srow.sel .nm{background:#1e50a0;border-color:#1e50a0;color:#fff}
#items.iconic .srow .nm{display:none}
#scenes button.onair{background:#1e50a0;border-color:#1e50a0;color:#fff}
.grid.col{flex-direction:column;align-items:stretch}
.grid.col button{width:100%}
.dock .dhead .undock svg{width:12px;height:12px}
.mixrow{gap:2px 8px;margin-bottom:6px}
.mixrow .nm{font-size:12px}
.stage{padding:5px 5px 0}

<script>
(function(){
"use strict";
var err = function(m){ document.getElementById('err').textContent = m || ''; };
var statusTimer = null, previewTimer = null, meterTimer = null;
var studioOn = false;

function call(type, data){
  // All OBS traffic goes through the overlay server's held connection:
  // no OBS port, no password, no handshake lottery on this side.
  return fetch('obs', {method: 'POST', body: JSON.stringify({type: type, data: data || {}})})
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j.ok) return j.response || {}; throw new Error(j.error || 'request failed'); });
}
function loadMeters(){
  fetch('obs/meters').then(function(r){ return r.json(); }).then(function(m){
    Object.keys(m).forEach(function(name){
      var el = document.getElementById('meter-' + name);
      if (el) el.style.width = Math.min(100, Math.round((m[name] || 0) * 100)) + '%';
    });
  }).catch(function(){});
}
/* ---- menus: the full OBS tree, real names. Rows with a protocol surface
   work; rows without one are present but disabled WITH the reason on hover.
   Nothing here is decorative. ---- */
var showIcons = false, lockDocks = false;
var MENUS = [
  {t: 'File', items: [
    ['Show recordings', function(){ call('GetRecordDirectory').then(function(d){ dlg('Recordings', 'Record directory on the render plane:\n' + d.recordDirectory + '\n\nFiles stay there; fetch them off-box, never through this page.'); }).catch(function(e){ err(String(e)); }); }],
    ['Remux recordings', null, {dis: 'No remote protocol: remux on the render plane.'}],
    '---',
    ['Settings', function(){ openSettings(); }],
    ['Show settings folder', null, {dis: 'Local path on the render plane.'}],
    ['Show profile folder', null, {dis: 'Local path on the render plane.'}],
    '---',
    ['Exit', null, {dis: 'Would kill the render plane for everyone.'}]]},
  {t: 'Edit', items: [
    ['Duplicate', function(){ dupSel(); }],
    ['Copy', null, {dis: 'No clipboard in the remote protocol.'}],
    ['Paste (reference)', null, {dis: 'No clipboard in the remote protocol.'}],
    '---',
    ['Transform', null, {sub: [
      ['Reset transform', function(){ resetTransform(); }],
      ['Flip horizontal', function(){ flipSel('x'); }],
      ['Flip vertical', function(){ flipSel('y'); }]]}],
    ['Order', null, {sub: [
      ['Move up', function(){ srcMove(-1); }],
      ['Move down', function(){ srcMove(1); }]]}],
    ['Copy filters', null, {dis: 'No clipboard in the remote protocol.'}],
    ['Paste filters', null, {dis: 'No clipboard in the remote protocol.'}],
    '---',

} catch (e) {}
document.getElementById('librefresh').onclick = function(){ err(''); loadLib(); };
})();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMILE · station console</title>
<style>
/* STATION CONSOLE v2 — OBS arrangement, our code throughout.
   Menu bar carries ONLY working entries (View/Profile/Collection/Tools/Help).
   File/Edit are omitted on purpose: they administer the local desktop app
   (undo, clipboard, remux, updates), none of which is a show operation and
   none of which has a protocol surface. A menu of dead buttons is worse
   than no menu. What a TD does on air lives in docks + preview/program.
   Open with socket address + password:
     http://<ARCH-IP>:7070/console?obs=<ARCH-IP>&pass=<OBS_PASS>
   LAB ONLY in this form (password in URL; SSH tunnel on VPS). */
:root{--bg:#1e1e1e;--panel:#2d2d2d;--panel2:#383838;--line:#3f3f3f;--fg:#fafafa;
  --mut:#a1a1aa;--yel:#ffc107;--ok:#0ecb81;--bad:#f6465d;--acc:#3fb6ff;
  --mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,sans-serif;padding:0;font-size:14px}
.menubar{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);
  padding:0 8px;font-size:13px;user-select:none}
.mi{position:relative;padding:8px 10px;cursor:pointer}
.mi:hover,.mi.open{background:var(--panel2)}
.dd{display:none;position:absolute;top:100%;left:0;background:var(--panel2);
  border:1px solid var(--line);border-radius:0 0 6px 6px;min-width:220px;z-index:20;
  box-shadow:0 12px 28px rgba(0,0,0,.5)}
.mi.open .dd{display:block}
.dd button{display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--fg);padding:9px 12px;font-size:13px;border-radius:0;cursor:pointer}
.dd button:hover{background:#4a4a4a}
.dd .sep{border-top:1px solid var(--line);margin:4px 0}
.topbar{display:flex;align-items:center;gap:10px;background:var(--panel);
  border-bottom:1px solid var(--line);padding:8px 14px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.topbar .title{font-weight:700}
.topbar .pgm{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mut)}
.topbar .pgm b{color:var(--yel);font-weight:600}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 0}
.stage.one{grid-template-columns:1fr}
.view{background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.view .cap{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--mut);
  padding:6px 10px;background:var(--panel)}
.view img{display:block;width:100%;aspect-ratio:16/9;background:#000;object-fit:contain}
.docks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;padding:12px}
.dock{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:10px 12px 12px;min-width:0}
.dock>h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--mut);font-family:var(--mono);margin:0 0 8px;font-weight:600}
.grid{display:flex;flex-wrap:wrap;gap:6px}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:5px;padding:9px 12px;font-size:13px;cursor:pointer}
button.onair{border-color:var(--yel);color:var(--yel)}
button.live{border-color:var(--bad);color:var(--bad)}
button:active{transform:scale(.97)}
button.eye{font-family:var(--mono);font-size:12px;padding:8px 10px}
button.eye.off{opacity:.45;text-decoration:line-through}
.row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
select,input[type=number]{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:5px;padding:9px;max-width:100%}
input[type=range]{flex:1;min-width:90px;accent-color:var(--yel)}
.mixrow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;margin-bottom:8px}
.mixrow .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixrow .meter{grid-column:1/-1;height:6px;background:#141414;border-radius:3px;overflow:hidden}
.mixrow .meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--ok),var(--yel))}
.statusbar{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;
  color:var(--mut);background:var(--panel);border-top:1px solid var(--line);
  padding:8px 14px;position:sticky;bottom:0}
.statusbar b{color:var(--fg);font-weight:600}.statusbar b.bad{color:var(--bad)}
#err{color:var(--bad);font-family:var(--mono);font-size:12px;min-height:18px;padding:4px 14px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50}
.dlg.open{display:grid}
.dlg .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:16px;min-width:min(420px,92vw);font-size:13px;line-height:1.6}
.dlg .box h3{margin:0 0 8px;font-size:14px}
</style></head><body>
<div class="menubar" id="menu"></div>
<div class="topbar"><span class="dot" id="conn"></span>
  <span class="title">SMILE &middot; station console</span>
  <span class="pgm">PGM <b id="pgm">&hellip;</b></span>
</div>
<div class="stage one" id="stage">
  <div class="view" id="programView"><div class="cap">PROGRAM</div><img id="programImg" alt=""></div>
  <div class="view" id="previewView" style="display:none"><div class="cap">PREVIEW</div><img id="previewImg" alt=""></div>
</div>
<div id="status" style="display:none"></div>
<div class="docks">
<div class="dock"><h2>Director intents</h2>
<div class="grid">
  <button data-intent="go-live">GO LIVE</button>
  <button data-intent="tech-diff">TECH DIFF</button>
  <button data-intent="resume">RESUME</button>
  <button data-intent="return">RETURN</button>
</div></div>
<div class="dock"><h2>Scenes</h2><div class="grid" id="scenes"></div></div>
<div class="dock"><h2>Sources &middot; <span id="srcscene"></span></h2><div class="grid" id="items"></div></div>
<div class="dock"><h2>Scene transitions</h2>
<div class="row"><select id="trans"></select>
<input type="number" id="transdur" min="50" max="5000" step="50" value="300" style="width:90px" title="ms"></div>
<div class="grid"><button id="dotrans">Transition</button><button id="studio">Studio Mode: off</button></div></div>
<div class="dock"><h2>Audio mixer</h2><div id="mixer"></div></div>
<div class="dock"><h2>Media transport</h2>
<div class="row"><select id="src"></select></div>
<div class="grid">
  <button data-act="RESTART">Restart</button>
  <button data-act="PLAY">Play</button>
  <button data-act="PAUSE">Pause</button>
  <button data-act="STOP">Stop</button>
  <button id="mute">Mute/Unmute source</button>
</div></div>
<div class="dock"><h2>Controls</h2>
<div class="grid">
  <button id="stream">Start Streaming</button>
  <button id="rec">Start Recording</button>
  <button id="vcam">Virtual Camera</button>
</div></div>
<div class="dock"><h2>Library</h2><div class="row"><button id="librefresh">↻ refresh</button><span id="libdisk" style="color:var(--mut);font-size:12px"></span></div><div id="lib"></div></div>
</div>
<div id="err"></div>
<div class="statusbar" id="stats"></div>
<div class="dlg" id="dlg"><div class="box"><h3 id="dlgtitle"></h3><div id="dlgbody"></div>
<div class="grid" style="margin-top:12px"><button onclick="document.getElementById('dlg').classList.remove('open')">Close</button></div></div></div>
<script>
(function(){
"use strict";
var q = new URLSearchParams(location.search);
var host = q.get('obs') || location.hostname;
var pass = q.get('pass') || '';
var err = function(m){ document.getElementById('err').textContent = m || ''; };
var seq = 0, pending = {}, ws = null, statusTimer = null, previewTimer = null;
var studioOn = false;

/* SHA-256 over bytes, dependency-free: crypto.subtle does not exist on plain
   http://LAN origins (non-secure contexts), which is exactly how this console
   is served. Verified against NIST vectors in node before shipping. */
function b64(bytes){
  var s = '';
  bytes.forEach(function(b){ s += String.fromCharCode(b); });
  return btoa(s);
}
function sha256ascii(s) {
  s = unescape(encodeURIComponent(s));
  var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var l = s.length, bl = l * 8, pad = (((l + 8) >> 6) + 1) * 16, M = new Array(pad).fill(0);
  for (var i = 0; i < l; i++) M[i >> 2] |= s.charCodeAt(i) << (24 - (i % 4) * 8);
  M[(l >> 2)] |= 0x80 << (24 - (l % 4) * 8);
  M[pad - 1] = bl;
  var R = function(x, n) { return (x >>> n) | (x << (32 - n)); };
  for (var j = 0; j < pad; j += 16) {
    var w = M.slice(j, j + 16);
    for (var t = 16; t < 64; t++) {
      var s0 = R(w[t-15],7) ^ R(w[t-15],18) ^ (w[t-15] >>> 3);
      var s1 = R(w[t-2],17) ^ R(w[t-2],19) ^ (w[t-2] >>> 10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (var k = 0; k < 64; k++) {
      var S1 = R(e,6) ^ R(e,11) ^ R(e,25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K[k] + w[k]) | 0;
      var S0 = R(a,2) ^ R(a,13) ^ R(a,22);
      var mj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + mj) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H = H.map(function(x, ix){ return (x + [a,b,c,d,e,f,g,h][ix]) | 0; });
  }
  var out = new Uint8Array(32);
  H.forEach(function(x, ix){ out[ix*4]=x>>>24; out[ix*4+1]=(x>>>16)&255; out[ix*4+2]=(x>>>8)&255; out[ix*4+3]=x&255; });
  return out;
}
function sha256(str){ return sha256ascii(str); }
function call(type, data){
  return new Promise(function(res, rej){
    var id = 'c' + (++seq);
    pending[id] = {res: res, rej: rej};
    ws.send(JSON.stringify({op: 6, d: {requestType: type, requestId: id, requestData: data || {}}}));
    setTimeout(function(){ if (pending[id]) { delete pending[id]; rej(new Error('timeout ' + type)); } }, 20000);
  });
}
/* ---- menus: only working entries. File/Edit administer the local desktop
   app and have no protocol surface, so they are absent, not disabled. ---- */
var MENUS = [
  {t: 'View', items: [
    ['Fullscreen interface', function(){ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }]]},
  {t: 'Profile', items: [], dyn: function(box, close){
    call('GetProfileList').then(function(d){
      (d.profiles || []).forEach(function(p){
        var b = document.createElement('button'); b.textContent = p + (p === d.currentProfileName ? ' ✓' : '');
        b.onclick = function(){ close(); err(''); call('SetCurrentProfile', {profileName: p}).catch(function(e){ err(String(e)); }); };
        box.appendChild(b);
      });
    }).catch(function(e){ err(String(e)); }); }},
  {t: 'Scene Collection', items: [], dyn: function(box, close){
    call('GetSceneCollectionList').then(function(d){
      (d.sceneCollections || []).forEach(function(c){
        var b = document.createElement('button'); b.textContent = c + (c === d.currentSceneCollectionName ? ' ✓' : '');
        b.onclick = function(){ close(); err(''); call('SetCurrentSceneCollection', {sceneCollectionName: c}).then(refresh).catch(function(e){ err(String(e)); }); };
        box.appendChild(b);
      });
    }).catch(function(e){ err(String(e)); }); }},
  {t: 'Tools', items: [
    ['Reconnect socket', function(){ try { ws.close(); } catch (e) {} }],
    ['Copy page URL', function(){ try { navigator.clipboard.writeText(location.href); } catch (e) { err(String(e)); } }]]},
  {t: 'Help', items: [
    ['About this console', function(){
      call('GetVersion').then(function(d){
        dlg('About', 'Station console (own code) talking to OBS ' + d.obsVersion + ' / websocket ' + d.obsWebSocketVersion + '. Password rides in the URL: tunnel on VPS, never raw.');
      }).catch(function(e){ err(String(e)); }); }]]}
];
function dlg(t, b){
  document.getElementById('dlgtitle').textContent = t;
  document.getElementById('dlgbody').textContent = b;
  document.getElementById('dlg').classList.add('open');
}
function buildMenu(){
  var bar = document.getElementById('menu');
  MENUS.forEach(function(m){
    var mi = document.createElement('div');
    mi.className = 'mi'; mi.textContent = m.t;
    var dd = document.createElement('div'); dd.className = 'dd';
    var close = function(){ mi.classList.remove('open'); };
    mi.onclick = function(e){
      e.stopPropagation();
      var was = mi.classList.contains('open');
      document.querySelectorAll('.mi.open').forEach(function(x){ x.classList.remove('open'); });
      if (!was) { mi.classList.add('open'); dd.innerHTML = '';
        m.items.forEach(function(it){
          var b = document.createElement('button'); b.textContent = it[0];
          b.onclick = function(){ close(); it[1](); }; dd.appendChild(b);
        });
        if (m.dyn) m.dyn(dd, close);
      }
    };
    mi.appendChild(dd); bar.appendChild(mi);
  });
  document.addEventListener('click', function(){
    document.querySelectorAll('.mi.open').forEach(function(x){ x.classList.remove('open'); });
  });
}
var lastItemsScene = null;
function setStatus(){
  Promise.all([call('GetStreamStatus'), call('GetRecordStatus'), call('GetCurrentProgramScene')])
    .then(function(r){
      var s = r[0], rec = r[1], pgm = r[2].currentProgramSceneName;
      document.getElementById('pgm').textContent = pgm;
      document.getElementById('conn').className = 'dot ok';
      call('GetStats').then(function(st){
        var el = document.getElementById('stats');
        el.innerHTML = 'CPU <b>' + st.cpuUsage.toFixed(1) + '%</b> · ' +
          st.activeFps.toFixed(0) + ' fps · dropped <b class="' +
          (st.outputSkippedFrames > 0 ? 'bad">' : '">') + st.outputSkippedFrames + '</b> · stream ' +
          (s.outputActive ? '<b class="on">LIVE</b>' : '<b class="off">off</b>') +
          ' · rec ' + (rec.outputActive ? '<b class="on">on</b>' : 'off') +
          ' · disk ' + (st.availableDiskSpace / 1024).toFixed(1) + ' GB';
      }).catch(function(){});
      document.querySelectorAll('#scenes button').forEach(function(b){
        b.classList.toggle('onair', b.textContent === pgm);
      });
      refreshStreamBtn(s.outputActive); refreshRecBtn(rec.outputActive);
      loadItems(pgm);
    }).catch(function(){});
}
function refreshStreamBtn(on){
  var b = document.getElementById('stream');
  b.textContent = on ? 'Stop Streaming' : 'Start Streaming';
  b.classList.toggle('live', !!on);
}
function refreshRecBtn(on){ document.getElementById('rec').textContent = on ? 'Stop Recording' : 'Start Recording'; }
function loadItems(pgm){
  if (pgm === lastItemsScene) return;
  lastItemsScene = pgm;
  document.getElementById('srcscene').textContent = pgm;
  call('GetSceneItemList', {sceneName: pgm}).then(function(d){
    var box = document.getElementById('items'); box.innerHTML = '';
    (d.sceneItems || []).forEach(function(it){
      var b = document.createElement('button');
      b.className = 'eye' + (it.sceneItemEnabled === false ? ' off' : '');
      b.textContent = (it.sceneItemEnabled === false ? 'show ' : 'hide ') + it.sourceName;
      b.onclick = (function(id){
        return function(){
          err('');
          call('GetSceneItemList', {sceneName: pgm}).then(function(dd){
            var cur = (dd.sceneItems || []).filter(function(x){ return x.sceneItemId === id; })[0];
            var want = !(cur && cur.sceneItemEnabled !== false);
            return call('SetSceneItemEnabled', {sceneName: pgm, sceneItemId: id, sceneItemEnabled: want});
          }).then(function(){ lastItemsScene = null; loadItems(pgm); }).catch(function(e){ err(String(e)); });
        };
      })(it.sceneItemId);
      box.appendChild(b);
    });
  }).catch(function(e){ err(String(e)); });
}
function refresh(){
  call('GetSceneList').then(function(d){
    var box = document.getElementById('scenes'); box.innerHTML = '';
    d.scenes.forEach(function(s){
      var b = document.createElement('button');
      b.textContent = s.sceneName;
      b.onclick = function(){
        err('');
        if (studioOn) call('SetCurrentPreviewScene', {sceneName: s.sceneName}).then(setStatus).catch(function(e){ err(String(e)); });
        else call('SetCurrentProgramScene', {sceneName: s.sceneName}).then(setStatus).catch(function(e){ err(String(e)); });
      };
      box.appendChild(b);
    });
    setStatus();
  }).catch(function(e){ err(String(e)); });
  call('GetSceneTransitionList').then(function(d){
    var sel = document.getElementById('trans'); sel.innerHTML = '';
    (d.transitions || []).forEach(function(t){
      var o = document.createElement('option');
      o.value = t.transitionName; o.textContent = t.transitionName;
      if (t.transitionName === d.currentSceneTransitionName) o.selected = true;
      sel.appendChild(o);
    });
  }).catch(function(){});
  call('GetInputList').then(function(d){
    var sel = document.getElementById('src'); sel.innerHTML = '';
    (d.inputs || []).forEach(function(i){
      if (String(i.inputKind) !== 'ffmpeg_source') return;
      var o = document.createElement('option');
      o.value = i.inputName; o.textContent = i.inputName;
      sel.appendChild(o);
    });
    Array.prototype.forEach.call(sel.options, function(o, ix){
      if (/PLAYOUT|SRT|IDENT/.test(o.value)) sel.selectedIndex = ix;
    });
  }).catch(function(){});
  loadMixer();
}
function loadMixer(){
  // Audio rows come from the special-inputs registry (desktop/mic slots),
  // not from guessing names. Meters arrive as InputVolumeMeters events.
  call('GetSpecialInputs').then(function(d){
    var box = document.getElementById('mixer'); box.innerHTML = '';
    ['desktop1', 'desktop2', 'mic1', 'mic2', 'mic3', 'mic4'].forEach(function(k){
      var name = d[k];
      if (!name) return;
      var row = document.createElement('div'); row.className = 'mixrow';
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = name;
      var mb = document.createElement('button'); mb.textContent = 'mute';
      mb.onclick = function(){ err(''); call('ToggleInputMute', {inputName: name}).then(loadMixer).catch(function(e){ err(String(e)); }); };
      var sl = document.createElement('input');
      sl.type = 'range'; sl.min = '0'; sl.max = '100'; sl.value = '75'; sl.title = name;
      sl.onchange = function(){
        var v = +sl.value;
        var db = v <= 0 ? -100 : +(20 * Math.log10(v / 100)).toFixed(1);
        err(''); call('SetInputVolume', {inputName: name, inputVolumeDb: db}).catch(function(e){ err(String(e)); });
      };
      var mt = document.createElement('div'); mt.className = 'meter';
      var fill = document.createElement('i'); fill.id = 'meter-' + name;
      mt.appendChild(fill);
      call('GetInputVolume', {inputName: name}).then(function(v){
        try { sl.value = Math.round(100 * Math.pow(10, (v.inputVolumeDb || -20) / 20)); } catch (e) {}
      }).catch(function(){});
      call('GetInputMute', {inputName: name}).then(function(v){
        mb.style.borderColor = v.inputMuted ? 'var(--bad)' : '';
      }).catch(function(){});
      row.appendChild(nm); row.appendChild(mb); row.appendChild(mt);
      box.appendChild(row);
    });
  }).catch(function(e){ err(String(e)); });
}
function grabShot(which, img){
  call('GetSourceScreenshot', {sourceName: which, imageFormat: 'jpg'})
    .then(function(d){
      img.src = 'data:image/jpeg;base64,' + d.imageData;
    }).catch(function(){});
}
function previews(){
  // 1fps program/preview stills. This is a slideshow by physics (full render
  // + encode + base64 per frame), not video — enough to confirm framing.
  call('GetStudioModeEnabled').then(function(d){
    studioOn = !!d.studioModeEnabled;
    document.getElementById('studio').textContent = 'Studio Mode: ' + (studioOn ? 'on' : 'off');
    document.getElementById('previewView').style.display = studioOn ? '' : 'none';
    document.getElementById('stage').className = 'stage' + (studioOn ? '' : ' one');
    if (!studioOn) { grabShot(pgmName(), document.getElementById('programImg')); return; }
    call('GetCurrentPreviewScene').then(function(p){
      grabShot(p.currentPreviewSceneName, document.getElementById('previewImg'));
      grabShot(pgmName(), document.getElementById('programImg'));
    }).catch(function(){});
  }).catch(function(){});
}
function pgmName(){ return document.getElementById('pgm').textContent || ''; }
function transport(act){
  var name = document.getElementById('src').value;
  if (!name) return;
  err('');
  call('TriggerMediaInputAction', {inputName: name, mediaAction: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_' + act})
    .catch(function(e){ err(String(e)); });
}
document.querySelectorAll('[data-intent]').forEach(function(b){
  // Same functions the CLI runs (server-side); phone and terminal agree.
  b.onclick = function(){
    err('');

      .then(function(r){ return r.json(); })
      .then(function(j){ if (!j.ok) err(j.error || 'intent failed'); else setStatus(); })
      .catch(function(e){ err(String(e)); });
  };
});

function connect(){
  ws = new WebSocket('ws://' + host + ':4455');
  ws.onopen = function(){
    // v5 handshake: wait for Hello(op 0), answer Identify(op 1), wait Identified(op 2).
    var hello = function(ev){
      var m = JSON.parse(ev.data);
      if (m.op !== 0) return;
      ws.removeEventListener('message', hello);
      // Meters are high-volume: the server only sends them on explicit
      // subscription (All alone does not include them).
      var d = {rpcVersion: 1, eventSubscriptions: 2047 | 65536};
      var auth = m.d && m.d.authentication;
      var done = function(){
        ws.send(JSON.stringify({op: 1, d: d}));
        var identified = function(ev2){
          var m2 = JSON.parse(ev2.data);
          if (m2.op !== 2) return;
          ws.removeEventListener('message', identified);
          ws.addEventListener('message', route);
          err('');
          refresh();
          // One poller ever: reconnects reuse it (ws is global). A new
          // interval per connect would stack N pollers hammering the socket.
          if (!statusTimer) statusTimer = setInterval(setStatus, 5000);
          if (!previewTimer) previewTimer = setInterval(previews, 5000);
        };
        ws.addEventListener('message', identified);
      };
      if (auth && pass) {
        var secret = b64(sha256(pass + auth.salt));
        d.authentication = b64(sha256(secret + auth.challenge));
        done();
      } else done();
    };
    ws.addEventListener('message', hello);
  };
  ws.onerror = function(){ document.getElementById('conn').className = 'dot bad'; err('socket error — is obs-websocket up at ' + host + ':4455?'); };
  ws.onclose = function(){ document.getElementById('conn').className = 'dot bad'; err('socket closed — reconnecting…'); setTimeout(connect, 3000); };
}
var previewTimer = null;
function route(ev){
  var m;
  try { m = JSON.parse(ev.data); } catch (e) { return; }
  if (m.op === 7 && m.d && pending[m.d.requestId]) {
    var p = pending[m.d.requestId]; delete pending[m.d.requestId];
    if (m.d.requestStatus && m.d.requestStatus.result) p.res(m.d.responseData || {});
    else p.rej(new Error((m.d.requestStatus || {}).comment || 'request failed'));
  } else if (m.op === 5 && m.d) {
    if (m.d.eventType === 'CurrentProgramSceneChanged') setStatus();
    else if (m.d.eventType === 'CurrentPreviewSceneChanged') previews();
    else if (m.d.eventType === 'StudioModeStateChanged') { previews(); refresh(); }
    else if (m.d.eventType === 'InputVolumeMeters' && m.d.eventData) {
      (m.d.eventData.inputs || []).forEach(function(i){
        var el = document.getElementById('meter-' + i.inputName);
        if (el && i.inputLevelsMul && i.inputLevelsMul[0]) {
          el.style.width = Math.min(100, Math.round((i.inputLevelsMul[0][1] || 0) * 100)) + '%';
        }
      });
    }
  }
}
var libCache = [];
function libMB(b){ return (b == null) ? '?' : (b / 1048576).toFixed(1) + ' MB'; }
function loadLib(){
  // Playlist + on-disk truth from the overlay server (same origin as the
  // intents). Pin and dormant toggles POST back; the daemon picks them up
  // at the next transition, never mid-air.
  fetch('library').then(function(r){ return r.json(); }).then(function(l){
    libCache = l.items || [];
    document.getElementById('libdisk').textContent =
      'media ' + libMB(l.disk.media_bytes) + ' / cap ' + libMB(l.disk.cap) +
      ' · disk free ' + libMB(l.disk.free);
    var box = document.getElementById('lib'); box.innerHTML = '';
    if (!libCache.length) { box.innerHTML = '<div class="row">empty</div>'; return; }
    libCache.forEach(function(t){
      var row = document.createElement('div'); row.className = 'mixrow';
      if (t.status === 'dormant') row.style.opacity = '.55';
      var nm = document.createElement('div'); nm.className = 'nm';
      nm.textContent = (t.present ? '● ' : '○ ') + (t.title || t.file) +
        ' · ' + (t.size != null ? libMB(t.size) : 'missing') +
        (t.show ? ' · ' + t.show : '') + (t.up_next ? '  ▸UP NEXT' : '');
      if (!t.present) nm.style.color = 'var(--bad)';
      var pb = document.createElement('button');
      pb.textContent = t.pinned ? '🧷 pinned' : '📎 pin';
      pb.onclick = (function(it){ return function(){ libSet(it, 'pinned', !it.pinned); }; })(t);
      var sb = document.createElement('button');
      sb.textContent = t.status === 'dormant' ? '💤 dormant' : '▶ active';
      sb.onclick = (function(it){ return function(){ libSet(it, 'status', it.status === 'dormant' ? 'active' : 'dormant'); }; })(t);
      row.appendChild(nm); row.appendChild(pb); row.appendChild(sb);
      box.appendChild(row);
    });
  }).catch(function(e){ err(String(e)); });
}
function libSet(t, key, val){
  err('');
  var b = {file: t.file}; b[key] = val;
  fetch('library', {method: 'POST', body: JSON.stringify(b)})
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) err(j.error || 'library update failed'); loadLib(); })
    .catch(function(e){ err(String(e)); });
}
buildMenu();
connect();
document.getElementById('librefresh').onclick = function(){ err(''); loadLib(); };
loadLib();
})();

# MediaMTX: the ingest bus in front of the render plane.
# Owns the volatile WAN socket (reconnects silently); OBS/ffmpeg pull LOCAL
# streams that either have frames or don't — a state the watchdog can act on.
# One SRT port; streamid selects the path. Control API on loopback only.
logLevel: debug
srtAddress: :9000
api: yes
apiAddress: 127.0.0.1:9997
paths:
  slot-cam:
  slot-screen:
  # Program return for the director panel: OBS (rtmp_custom service in the
  # lab profile) publishes here; /studio watches via WHEP (:8889). Paths
  # must be listed — this build rejects undefined paths (seen live).
  monitor:

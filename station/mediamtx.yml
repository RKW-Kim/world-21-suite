# MediaMTX: the ingest bus in front of the render plane.
# Owns the volatile WAN socket (reconnects silently); OBS/ffmpeg pull LOCAL
# streams that either have frames or don't — a state the watchdog can act on.
# One SRT port; streamid selects the path. Control API on loopback only.
#
# User-facing surfaces stay reachable beyond the box: SRT (:9000, seats) and
# WHIP/WHEP (:8889 + the WebRTC UDP listeners, contribution seats and the
# director monitor). Everything else binds LOOPBACK — with binds off, any
# LAN/WAN peer could RTMP/RTSP-publish straight onto a path OBS reads
# timestamped persistently (on-air injection; seen-audit fix 2026-10-17;
# revisit with auth when cutover adds publish roles).
logLevel: debug
srtAddress: :9000
api: yes
apiAddress: 127.0.0.1:9997
rtspAddress: 127.0.0.1:8554
rtmpAddress: 127.0.0.1:1935
hlsAddress: 127.0.0.1:8888
# WebRTC/WHIP/WHEP keeps mediamtx's default binds: v1.21 opens a second,
# hard-coded wildcard UDP listener on the mux port that cannot coexist with
# a specific-LAN-IP bind (bind: address already in use, seen 2026-10-18).
# Exposure is therefore pinned at the firewall instead: UFW allows only
# 22/tcp, and the TD desk adds 8889/tcp + 8892/udp from its own IP.

paths:
  slot-cam:
  slot-screen:
  # Audio-only microphone seat (browser WHIP publish, OBS Slot Audio reads).
  slot-audio:
  # Stream decks: yt-dlp -> ffmpeg publishes here (RTSP/TCP localhost);
  # OBS STREAM_A/B inputs read with restart_on_activate, so a deck only
  # connects once its pipeline is already publishing. Zero disk anywhere.
  slot-stream-a:
  slot-stream-b:
  # Ad-break streams: same pipeline as the decks, but landed in the ad
  # scene (STREAM AD input) so a break can roll a YouTube link too.
  slot-ad:
  # The lab-era "monitor"/"monitor-av" return paths are gone 2026-10-18:
  # on the real station OBS publishes straight to YouTube and the
  # monitor-av repackager sat restarting 11k+ times doing nothing.

# Deploy overlay/ to GitHub Pages on every push to main.
# One HTML file = one browser source = one URL.
# OBS points at https://rkw-kim.github.io/world-21-suite/<filename>.html
#
# Setup (one-time, manual):
#   1. Repo → Settings → Pages
#   2. "Build and deployment" → Source: GitHub Actions
#   3. (No further config needed — this workflow handles the deploy)
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage deploy folder
        run: |
          # We deploy ONLY overlay/ at the site root, plus an index.html
          # that lists the available overlays as clickable links.
          mkdir -p _site
          # Copy everything in overlay/ (incl. archive/ subfolder, shared assets, state.json)
          cp -r overlay/* _site/

          # Auto-generate a simple index.html listing the .html files at root of overlay/
          # (not archive/ — those are reference-only)
          python3 << 'PY'
          import os, html
          from pathlib import Path

          site = Path("_site")
          files = sorted(
              p.name for p in site.iterdir()
              if p.is_file() and p.suffix == ".html"
          )

          rows = "\n".join(
              f'<li><a href="{html.escape(f)}">{html.escape(f)}</a></li>'
              for f in files
          ) if files else "<li>(no HTML files found)</li>"

          index = f"""<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>world-21-suite — overlay index</title>
<style>
  body {{ font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0a0a0b; color: #fafafa; max-width: 720px; margin: 4rem auto; padding: 0 1rem; }}
  h1 {{ font-weight: 600; margin-bottom: 0.5rem; }}
  p.muted {{ color: #8a8a93; margin-bottom: 2rem; }}
  ul {{ list-style: none; padding: 0; }}
  li {{ padding: 0.5rem 0; border-bottom: 1px solid #1f1f23; }}
  a {{ color: #FFC107; text-decoration: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }}
  a:hover {{ text-decoration: underline; }}
  code {{ background: #141416; padding: 1px 6px; border-radius: 4px; font-size: 12px; }}
</style>
</head>
<body>
  <h1>world-21-suite — overlay index</h1>
  <p class="muted">Each file below is a self-contained OBS browser source. Copy the URL into OBS.</p>
  <ul>
{rows}
  </ul>
  <p class="muted" style="margin-top: 2rem;">
    URL pattern: <code>https://rkw-kim.github.io/world-21-suite/&lt;filename&gt;.html</code><br>
    Archive of earlier iterations: <a href="archive/">archive/</a>
  </p>
</body>
</html>
"""
          (site / "index.html").write_text(index)
          print("Generated _site/index.html with", len(files), "overlay links")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# Deploy overlay/ to GitHub Pages on every push to main.
# One HTML file = one browser source = one URL.
# OBS points at https://rkw-kim.github.io/world-21-suite/<filename>.html
#
# Setup (one-time, manual):
#   1. Repo -> Settings -> Pages
#   2. "Build and deployment" -> Source: GitHub Actions
#   3. (No further config needed — this workflow handles the deploy)
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage deploy folder
        run: |
          # We deploy ONLY overlay/ at the site root, plus an index.html
          # that lists the available overlays as clickable links.
          mkdir -p _site
          # Copy everything in overlay/ (incl. archive/ subfolder, shared assets, state.json)
          cp -r overlay/* _site/

      - name: Generate index.html
        run: python3 scripts/generate-index.py

      - name: Show staged site
        run: ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

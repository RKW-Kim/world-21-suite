# HTML validation CI — runs on PRs to prototype and main, and on pushes to prototype.
# Catches: unclosed tags, malformed attributes, wrong nesting of parents.
# Keeps the overlay HTML OBS-safe.
name: validate

on:
  push:
    branches: [prototype, main]
  pull_request:
    branches: [prototype, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-validate:
    name: Validate overlay HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g html-validate@8

      - name: List files to be validated
        run: |
          echo "=== Files in overlay/ (top-level .html only) ==="
          ls -1 overlay/*.html 2>/dev/null || true
          echo ""
          echo "=== Files in overlay/archive/ ==="
          ls -1 overlay/archive/*.html 2>/dev/null || true

      - name: Validate active overlay HTML (hard fail on error)
        run: |
          set -e
          shopt -s nullglob
          files=(overlay/*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No HTML files found in overlay/ — at least one (smile-v9.html) must exist."
            exit 1
          fi
          echo "=== Validating ${#files[@]} file(s) ==="
          for f in "${files[@]}"; do
            echo "--- $f ---"
            if ! html-validate --config .github/html-validate.json "$f"; then
              echo "::error file=$f::HTML validation failed. See log above."
              exit 1
            fi
          done
          echo "All active overlay HTML files passed validation."

      - name: Smoke-check archive HTML (warn only, never fail the build)
        run: |
          shopt -s nullglob
          files=(overlay/archive/*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No archive HTML files to smoke-check."
            exit 0
          fi
          echo "=== Smoke-checking ${#files[@]} archive file(s) (warnings allowed) ==="
          for f in "${files[@]}"; do
            echo "--- $f (warning-only) ---"
            html-validate --config .github/html-validate.json "$f" || echo "::warning file=$f::Archive HTML has issues (non-blocking)."
          done
          echo "Archive smoke-check complete."

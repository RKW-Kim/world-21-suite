<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Kit fonts, bundled locally. See fonts/fonts.css for why this is
     not a fonts.googleapis.com link: OBS loads these from file:// on machines
     with unreliable internet, and a stalled webfont request does not fail, it
     hangs, leaving the headline in a fallback face for ~20s. -->
<link rel="stylesheet" href="fonts/fonts.css">
<title>SMILE · Watermark</title>
<!-- DARK THEME, DELIBERATELY WITHOUT A color-scheme META TAG
     The whole kit is dark and stays dark — that is the brand, and every
     colour in this file is explicit. What this file must NOT do is ask the
     UA for a dark base canvas: color-scheme makes Chromium paint the root
     canvas OPAQUE (rgb 18,18,18), which turns the watermark MODULE, which must composite over any scene
     into a solid dark rectangle in OBS instead of a transparent layer.
     Theme lives in the CSS; transparency lives in the root background. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<style>
/* ── SMILE WATERMARK MODULE ─────────────────────────────────────────────
   The Round-5 verdict, standardized: V4 BARE — quiet identity furniture.
   Its only job is "whose stream is this?" — it never moves, never changes
   size mid-stream, and never animates by default (a watermark that
   animates too much stops being furniture and starts being a pop-up).

   Layer it as its own OBS browser source over ANY scene:
     1920×1080 · transparent · ?corner=tl|tr|bl|br (default tl)
     ?size=s|m|l|xl = 48/60/72/88px  (default l = 72px, the verdict)
     ?icon=1        = the face alone, no wordmark
     ?op=0..1       = opacity (default .95)
     ?scrim=1       = soft dark halo, for bright/busy backdrops
     ?anim=breathe  = the ONE allowed motion (3.6s gentle breathe)

   Zero timers, zero rAF, zero canvas — the only style mutation happens
   once at load. With no ?anim, literally nothing animates: a perfectly
   still compositor layer. ─────────────────────────────────────────── */
:root{--fd:'Space Grotesk',system-ui,sans-serif;--h:72px;--op:.95}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:var(--fd);-webkit-font-smoothing:antialiased}

.wm{position:absolute;z-index:40;display:flex;align-items:center;gap:calc(var(--h)*.22);
  opacity:var(--op);pointer-events:none;will-change:auto}
.wm.pos-tl{left:28px;top:28px}
.wm.pos-tr{right:28px;top:28px}
.wm.pos-bl{left:28px;bottom:28px}
.wm.pos-br{right:28px;bottom:28px}

/* verbatim logo lockup — paths copied exactly from overlay/Smile-Logo.svg */
.wm .lg{height:calc(var(--h)*.58);width:auto;display:block;
  filter:drop-shadow(0 1px 10px rgba(0,0,0,1))}
/* icon-only mode — same face paths, tight crop */
.wm .fc{height:calc(var(--h)*.8);width:auto;display:none;
  filter:drop-shadow(0 1px 10px rgba(0,0,0,1))}
.wm.icon .lg{display:none}
.wm.icon .fc{display:block}

::selection{background:#FFCE00;color:#1F1702}
</style>
</head>
<body>

    </svg>
    <!-- icon-only crop — same four face paths, tight viewBox -->
    <svg class="fc" viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>

  </div>
<script>
/* param parsing only — runs once, then the page is completely still. */
(function(){
  var q=location.search, wm=document.getElementById('wm');
  var c=(q.match(/[?&]corner=(tl|tr|bl|br)/)||[])[1];
  if(c){wm.className=wm.className.replace('pos-tl','pos-'+c);}
  if(/[?&]icon=1/.test(q))wm.classList.add('icon');
  var op=parseFloat((q.match(/[?&]op=(0?\.\d+|0|1)/)||[])[1]);
  if(!isNaN(op))document.documentElement.style.setProperty('--op',Math.min(1,Math.max(0,op)));
})();
</script>
</body>
</html>

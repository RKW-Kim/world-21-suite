<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE — off air</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23ffd100'/%3E%3Cpath d='M4.16 12.91a7.9 7.9 0 0015.68 0' fill='none' stroke='%230a0900' stroke-width='1.32' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='8' r='1.5' fill='%230a0900'/%3E%3Ccircle cx='17' cy='8' r='1.5' fill='%230a0900'/%3E%3C/svg%3E">
<style>
/* OFF AIR — the safety state.
   This is not for viewers. Nobody is watching when the stream is not running,
   so the scene has one job: make it impossible to broadcast the wrong thing.
   When the stream ends, whatever was last on Program stays there. If that was
   a captured window — a Meet room with a join code in it — and anyone hits
   start streaming, or OBS is left encoding, that room goes out. Switching to
   this is a two-second action that removes the whole class of accident.

   Same design language as starting.html, with the lights down: the dot field
   stays, the gradients stay, the type stays. What leaves is the GLOW. Yellow
   is the kit's live signal, so nothing here is yellow and nothing here glows —
   a viewer glancing at Program can tell in one frame whether anything is live.

   Contract: no canvas, no rAF, one gated interval (the clock). Bottom 76px is
   the ticker dock and is deliberately left empty — off air, there is no tape. */
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0A0A0A;
  --fg:#FAFAFA; --muted:#A1A1AA; --faint:#9B9BA4;
  --line:#2a2a2a; --up:#0ECB81;
  --fd:'Inter',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:76px;
  --eo:cubic-bezier(.32,.72,0,1);
  --eio:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--fg);
  font-family:var(--fd);-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--fg);color:var(--ink)}
.page{position:relative;width:100vw;height:100vh;overflow:hidden}

/* the dot field, exactly as starting.html carries it */
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.09) 1.1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 26%,transparent 100%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 26%,transparent 100%)}
/* the aura, cooled right down: starting.html runs this at .08 and glows yellow.
   here it is a grey lift so the centre reads without implying a live state */
.aura{position:absolute;left:50%;top:46%;width:900px;height:600px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,255,255,.035),transparent 66%)}

.stack{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:0 40px calc(var(--safe-b) / 2);z-index:2}

/* ---- THE MARK
   Awake, as it always is. A one-shot animation on load only speaks to whoever
   happens to be watching at that instant, and this scene sits for hours — so
   the meaning lives in the REST STATE, not in the entrance. The mark keeps only
   a slow breath, which is ambient rather than communicative: you notice it
   never, but the card is not dead.

   No halo at all. A lit face IS the live signal and this one is not lit. ---- */
.markwrap{position:relative;width:190px;height:190px;margin-bottom:40px;
  animation:breathe 14s var(--eio) infinite}
@keyframes breathe{0%,100%{opacity:.26}50%{opacity:.38}}
.mark{width:100%;height:100%}
.mark svg{width:100%;height:100%;overflow:visible}

/* ---- state label ---- */
.state{display:inline-flex;align-items:center;gap:14px;
  font-family:var(--fm);font-size:13px;font-weight:600;letter-spacing:.52em;
  color:var(--muted);padding-left:.52em;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.led{width:9px;height:9px;border-radius:50%;background:var(--faint);
  animation:blip 4.2s var(--eio) infinite}
@keyframes blip{0%,100%{opacity:.22}50%{opacity:.7}}

/* ---- the clock. The one thing this scene is genuinely for.
   Tracking here is POSITIVE on purpose. -0.05em is correct for a headline but
   wrong for numerals: Space Grotesk's 1 is a narrow glyph with wide side
   bearings, so at 168px a negative value pulls the pair together and "11"
   reads as one blob. Tabular figures plus a hair of positive space keeps every
   pair distinct. ---- */
.clock{margin-top:34px;font-family:var(--fd);font-weight:800;
  font-size:clamp(76px,10vw,168px);line-height:.94;letter-spacing:.012em;
  background:linear-gradient(180deg,#fafafa 22%,#7e7e86 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 3px 24px rgba(0,0,0,.6)}

/* ---- THE CENTREPIECE: a plug that keeps failing to seat.
   This is the off-air equivalent of the cable idea tech-diff uses. The whole
   loop is designed around one rule: at EVERY moment of the cycle the two halves
   are apart. They drift out, try to come back, and stop just short — an
   attempted reconnect that never lands. So someone arriving at second 1 or
   second 4000 reads the same thing: unplugged, and still trying.

   The spark is deliberately not yellow. Yellow is the kit's live signal and
   nothing on this scene is live, so the arc is a dim warm white. ---- */
.plugwrap{position:relative;width:300px;height:74px;margin:34px 0 26px;opacity:.5}
.plugwrap svg{width:100%;height:100%;overflow:visible}
.pl-line{fill:none;stroke:var(--faint);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* the socket's standby pip — the machine is on, the signal is not */
.pip{fill:var(--faint);animation:pip 6.4s var(--eio) infinite}
@keyframes pip{0%,42%{opacity:.12}50%{opacity:.75}58%,100%{opacity:.12}}
.socket{animation:driftL 6.4s var(--eio) infinite}
.plugbody{animation:driftR 6.4s var(--eio) infinite}
@keyframes driftL{0%,100%{transform:translateX(0)}34%{transform:translateX(-5px)}
  62%{transform:translateX(2px)}78%{transform:translateX(-3px)}}
@keyframes driftR{0%,100%{transform:translateX(0)}34%{transform:translateX(5px)}
  62%{transform:translateX(-2px)}78%{transform:translateX(3px)}}
/* an arc at the gap, only at the moment of the closest approach */
.arc{fill:var(--fg);opacity:0;animation:arc 6.4s linear infinite}
@keyframes arc{0%,44%{opacity:0;transform:scale(.5)}48%{opacity:.7;transform:scale(1)}
  52%{opacity:0;transform:scale(1.4)}100%{opacity:0;transform:scale(.5)}}
.spark{transform-box:fill-box;transform-origin:center}
.next{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.3em;
  color:var(--faint);text-transform:uppercase}
.back{margin-top:20px;font-family:var(--fd);font-weight:500;
  font-size:clamp(15px,1.2vw,20px);color:var(--muted);text-shadow:0 2px 10px rgba(0,0,0,.55)}
.back b{color:var(--fg);font-weight:600}
.back .over{color:var(--muted)}

/* ---- the instruction that makes this scene worth having ---- */
.note{margin-top:40px;display:inline-flex;align-items:center;gap:11px;
  padding:9px 17px;border:1px solid var(--line);border-radius:999px;
  background:rgba(255,255,255,.022);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 22px rgba(0,0,0,.4);
  font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.2em;
  color:rgba(250,250,250,.26)}


.rise{opacity:0;animation:rise 820ms var(--eo) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important}
  .rise{opacity:1}
  .markwrap{opacity:.34}
  .plugwrap .socket,.plugwrap .plugbody,.plugwrap .pip,.plugwrap .arc{animation:none}
  .plugwrap .pip{opacity:.3}
}
</style>
</head>
<body>
<div class="page">
  <div class="dots" aria-hidden="true"></div>
  <div class="aura" aria-hidden="true"></div>

  <main class="stack">
    <div class="markwrap rise" style="animation-delay:0ms" aria-hidden="true">
      <div class="mark">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="12" fill="#FAFAFA"/><path d="M4.16 12.91a7.9 7.9 0 0015.68 0" fill="none" stroke="#0a0900" stroke-width="1.32" stroke-linecap="round"/><circle cx="7" cy="8" r="1.5" fill="#0a0900"/><circle cx="17" cy="8" r="1.5" fill="#0a0900"/></svg>
      </div>
    </div>

    <div class="state rise" style="animation-delay:90ms"><i class="led"></i>OFF AIR</div>

    <div class="clock num" id="clock">--:--</div>

    <div class="plugwrap rise" style="animation-delay:220ms" aria-hidden="true">
      <svg viewBox="0 0 300 74" xmlns="http://www.w3.org/2000/svg">
        <!-- socket, facing right. the pin slots are notches IN the face, not
             marks floating past it, which is what the first pass drew -->
        <g class="socket">
          <path class="pl-line" d="M98 23H60a9 9 0 0 0-9 9v10a9 9 0 0 0 9 9h38"/>
          <path class="pl-line" d="M98 23v28"/>
          <path class="pl-line" d="M98 30h-7M98 39h-7"/>
          <circle class="pip" cx="74" cy="37" r="2.4"/>
        </g>
        <!-- plug, facing left. prongs run all the way back into the body so it
             reads as one object, and the tips never reach the socket -->
        <g class="plugbody">
          <path class="pl-line" d="M206 23h36a9 9 0 0 1 9 9v10a9 9 0 0 1-9 9h-36"/>
          <path class="pl-line" d="M206 23v28"/>
          <path class="pl-line" d="M206 30h-22M206 39h-22"/>
        </g>
        <!-- the gap, and the arc that jumps it -->
        <g class="spark">
          <path class="arc" d="M146 27l7 10-9 4 8 9"/>
        </g>
      </svg>
    </div>

    <div class="next rise" style="animation-delay:260ms">next session</div>
    <div class="back rise" id="back" style="animation-delay:320ms">on air most evenings &middot; smile<b>.co.ke</b></div>

    <div class="note rise" style="animation-delay:420ms">NOT TRANSMITTING &middot; SAFE TO LEAVE ON PROGRAM</div>

  </main>
</div>

<script>
/* ONE gated interval — the clock. No rAF, no canvas.
   ?next=21:00              just a time — resolved to the NEXT occurrence, local
   ?next=2026-10-06T21:00   a full local wall-clock stamp
   ?note=...                replace the safety line

   Both forms are read as LOCAL time on purpose. The desk runs on EAT and the
   stream is at 21:00 Nairobi; a UTC stamp here would silently show a countdown
   three hours wrong, which is the worst possible failure for the one scene you
   are supposed to be able to trust.

   Without ?next it just sits as a clock. That is the safe default: this scene
   must never be the thing that has to be updated to stay correct. */
(function(){
  function get(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';}
  function pad(n){return n<10?'0'+n:''+n}
  function dhm(ms){
    if(ms<=0) return null;
    var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s/60)%60;
    if(h>=24) return null;
    return (h? h+'h ':'') + pad(m)+'m';
  }

  var clockEl=document.getElementById('clock');
  var backEl=document.getElementById('back');

  var n=get('note');
  if(n) document.querySelector('.note').textContent=n;

  /* Bare HH:MM means "the next time that happens today" — a daily desk does not
     want a date typed into it every morning. */
  function resolveNext(v){
    var t=/^\s*(\d{1,2}):(\d{2})\s*$/.exec(v);
    if(t){
      var d=new Date(), h=+t[1], m=+t[2];
      if(h>23||m>59) return null;
      d.setHours(h,m,0,0);
      if(d<=new Date()) d.setDate(d.getDate()+1);   /* already past today */
      return d;
    }
    var d=new Date(v.replace(' ','T'));
    return isNaN(d)? null : d;
  }
  var next=get('next');
  var target=next? resolveNext(next) : null;

  function tick(){
    if(document.hidden) return;
    var d=new Date();
    clockEl.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());

    if(target){
      var left=dhm(target-d);
      backEl.innerHTML = left
        ? 'we are back in <b>'+left+'</b>'
        : '<span class="over">the session should be open &mdash; go live</span>';
      backEl.classList.add('counting');
    }
  }
  tick();
  setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0A">
<title>SMILE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23ffd100'/%3E%3Cpath d='M4.16 12.91a7.9 7.9 0 0015.68 0' fill='none' stroke='%230a0900' stroke-width='1.32' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='8' r='1.5' fill='%230a0900'/%3E%3Ccircle cx='17' cy='8' r='1.5' fill='%230a0900'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
/* OFF AIR — the safety state.
   Not for viewers. Nobody is watching when the stream is down, so the scene
   has one job: make it impossible to broadcast the wrong thing, and survive
   being looked at once, at 3am, through a glance at Program.

   Same design language as starting.html with the lights down: the dot field,
   the gradients, the type. What leaves is the GLOW. Yellow is the kit's live
   signal, so nothing here is yellow and nothing here glows — one frame of
   this scene on Program must read "nothing is happening".

   The scene says it with hardware now: a plug, mated and apart, on a loop.
   No headline does that work — the last one was two words telling what the
   mark already shows, so it is gone.

   Contract: no canvas, no rAF, one gated interval (the clock). The plug is
   declarative CSS keyframes on transform/opacity/fill only, scoped inside
   its own svg. Bottom 76px is the ticker dock and stays empty — off air,
   there is no tape. */
:root{
  /* --yellow exists as the contract, not a colour: nothing on this scene
     may use it. It is the kit's live signal and this scene is not live. */
  --ink:#0A0A0A;
  --fg:#FAFAFA; --muted:#A1A1AA; --faint:#9B9BA4;
  --line:#2a2a2a;
  --fd:'Inter',system-ui,sans-serif; /* the kit's committed face — kept by
    design even though it is common; the kit speaks with one voice */
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:76px;
  --eo:cubic-bezier(.32,.72,0,1);
  --eio:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--fg);
  font-family:var(--fd);-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--fg);color:var(--ink)}
.page{position:relative;width:100vw;height:100vh;overflow:hidden}

/* the dot field, exactly as starting.html carries it */
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.09) 1.1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 26%,transparent 100%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 26%,transparent 100%)}
/* the aura, cooled right down: a grey lift so the centre reads without
   implying a live state */
.aura{position:absolute;left:50%;top:46%;width:900px;height:600px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,255,255,.035),transparent 66%)}

.stack{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:0 40px calc(var(--safe-b) / 2);z-index:2}

/* ---- THE MARK
   Awake, as it always is — the meaning lives in the REST STATE, not in an
   entrance. It keeps only a slow breath: ambient, not communicative. No
   halo; a lit face IS the live signal and this one is not lit. ---- */
.markwrap{position:relative;width:116px;height:116px;margin-bottom:24px;
  animation:breathe 14s var(--eio) infinite}
@keyframes breathe{0%,100%{opacity:.26}50%{opacity:.38}}
.mark{width:100%;height:100%}
.mark svg{width:100%;height:100%;overflow:visible}

/* ---- THE PLUG
   The whole argument of the scene, drawn as hardware: two halves of a
   connection on an endless test cycle. Mated, the little monitor on the
   plug body lights and breathes — that is what "on" would look like.
   Then the signal dies, the screen blanks, the halves spring apart and
   sit there, open and dark, before clamping back. The loop is the point:
   the connected phase is the demo, the open phase is the truth, and the
   pill at the bottom is the verdict. Nothing here needs reading.

   Monochrome on purpose — the scene has no live colour to lend it.

   The static frame (reduced motion) is the OPEN pose with a blank screen:
   at every instant, including the ones without animation, this scene must
   read the same thing. ---- */
.plugband{width:min(620px,64vw);margin:6px 0 2px}
.plugband svg{width:100%;height:auto;overflow:visible}

/* ---- the clock. The one thing this scene is genuinely for, and now its
   only typographic anchor — so it carries the size the headline dropped.
   The silver gradient is the kit's system, kept deliberately: it is the
   "unlit metal" statement (yellow = live, silver = not). Tracking stays
   POSITIVE on purpose: negative values pull "11" into one blob at this
   scale. Tabular figures keep every pair distinct. ---- */
.clock{margin-top:20px;font-family:var(--fd);font-weight:800;
  font-size:clamp(64px,8.6vw,148px);line-height:.94;letter-spacing:.012em;
  background:linear-gradient(180deg,#fafafa 22%,#7e7e86 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 3px 24px rgba(0,0,0,.6)}

.next{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.3em;
  color:var(--faint);text-transform:uppercase}
.back{margin-top:18px;font-family:var(--fd);font-weight:500;
  font-size:clamp(15px,1.2vw,20px);color:var(--muted);text-shadow:0 2px 10px rgba(0,0,0,.55)}
.back b{color:var(--fg);font-weight:600}
.back .over{color:var(--muted)}
/* a known return time is real information: when the countdown is live the
   line earns a step of brightness the idle line does not have */
.back.counting{color:#C9C9D1}

/* ---- the instruction that makes this scene worth having.
   One edge, one inset light — no diffuse elevation: on ink it does nothing
   but halo. Text sits at .32 alpha: quiet, still readable at arm's length. ---- */
.note{margin-top:28px;display:inline-flex;align-items:center;gap:11px;
  padding:9px 17px;border:1px solid var(--line);border-radius:999px;
  background:rgba(255,255,255,.022);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.2em;
  color:rgba(250,250,250,.32)}

.rise{opacity:0;animation:rise 820ms var(--eo) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* the stack is authored for 1080p Program; smaller canvases get the same
   scene, not a cropped one — two tiers, whole-scale, nothing reflowed */
@media (max-height:840px){
  .markwrap{width:92px;height:92px;margin-bottom:18px}
  .plugband{width:min(520px,58vw)}
  .clock{font-size:clamp(52px,9.8vh,110px);margin-top:14px}
  .note{margin-top:20px}
  .back{margin-top:14px}
}
@media (max-height:660px){
  .markwrap{width:72px;height:72px;margin-bottom:12px}
  .plugband{width:min(420px,52vw)}
  .clock{font-size:clamp(44px,8.8vh,88px);margin-top:10px}
  .note{margin-top:16px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important}
  .rise{opacity:1}
  .markwrap{opacity:.32}
  /* the plug fragment carries its own static frame: open + blank screen */
}
</style>
</head>
<body>
<div class="page">
  <div class="dots" aria-hidden="true"></div>
  <div class="aura" aria-hidden="true"></div>

  <main class="stack">
    <div class="markwrap rise" style="animation-delay:0ms" aria-hidden="true">
      <div class="mark">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="12" fill="#FAFAFA"/><path d="M4.16 12.91a7.9 7.9 0 0015.68 0" fill="none" stroke="#0a0900" stroke-width="1.32" stroke-linecap="round"/><circle cx="7" cy="8" r="1.5" fill="#0a0900"/><circle cx="17" cy="8" r="1.5" fill="#0a0900"/></svg>
      </div>
    </div>

    <div class="plugband rise" style="animation-delay:120ms">

    </div>

    <div class="clock num" id="clock">--:--</div>

    <div class="next rise" style="animation-delay:340ms">Next session</div>
    <div class="back rise" id="back" style="animation-delay:400ms">On air most evenings &middot; smile<b>.co.ke</b></div>

    <div class="note rise" style="animation-delay:480ms">NOT TRANSMITTING &middot; SAFE TO LEAVE ON PROGRAM</div>

  </main>
</div>

<script>
/* ONE gated interval — the clock. No rAF, no canvas.
   ?next=21:00              just a time — resolved to the NEXT occurrence, local
   ?next=2026-10-06T21:00   a full local wall-clock stamp
   ?note=...                replace the safety line

   Both time forms are read as LOCAL time on purpose. The desk runs on EAT and
   the stream is at 21:00 Nairobi; a UTC stamp here would silently show a
   countdown three hours wrong, which is the worst possible failure for the
   one scene you are supposed to be able to trust.

   Without ?next it just sits as a clock. That is the safe default: this scene
   must never be the thing that has to be updated to stay correct. */
(function(){
  function get(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';}
  function pad(n){return n<10?'0'+n:''+n}
  function dhm(ms){
    if(ms<=0) return null;
    var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s/60)%60;
    if(h>=24) return null;
    return (h? h+'h ':'') + pad(m)+'m';
  }

  var clockEl=document.getElementById('clock');
  var backEl=document.getElementById('back');

  var n=get('note');
  if(n) document.querySelector('.note').textContent=n;

  /* Bare HH:MM means "the next time that happens today" — a daily desk does not
     want a date typed into it every morning. */
  function resolveNext(v){
    var t=/^\s*(\d{1,2}):(\d{2})\s*$/.exec(v);
    if(t){
      var d=new Date(), h=+t[1], m=+t[2];
      if(h>23||m>59) return null;
      d.setHours(h,m,0,0);
      if(d<=new Date()) d.setDate(d.getDate()+1);   /* already past today */
      return d;
    }
    var d=new Date(v.replace(' ','T'));
    return isNaN(d)? null : d;
  }
  var next=get('next');
  var target=next? resolveNext(next) : null;

  function tick(){
    if(document.hidden) return;
    var d=new Date();
    clockEl.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());

    if(target){
      var left=dhm(target-d);
      if(left){
        backEl.innerHTML='We are back in <b>'+left+'</b>';
        backEl.classList.add('counting');
      }else{
        backEl.innerHTML='<span class="over">The session should be open &mdash; go live</span>';
        backEl.classList.remove('counting');
      }
    }
  }
  tick();
  setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
})();
</script>
</body>
</html>

<!DOCTYPE html>

<head>

<title>SMILE · LIVE</title>
<!--
  SMILE · LIVE — clean-slate broadcast overlay. One file. Transparent by default.
  OBS: Browser Source 1920x1080 -> .../overlay/live.html?clean=1
       "Refresh when scene becomes active" OFF · "Shutdown when not visible" OFF
  Params: ?clean=1 OBS mode (no stage) · ?stage=1 dev backdrop · ?demo=1 stage + full show
          ?console=1 operator console (or key C) · ?debug=1 island clicks
          ?hide=header,footer,news,goal,next · ?next=TEXT · ?cur=$ · ?speed=52 · ?web=1|URL (site as backdrop)
  Drive it:
    SMILE.alert({type:'follow'|'sub'|'thanks'|'chat'|'raid'|'announce',name,amount,message,sub})
    SMILE.trade({market,side,entry,tp,sl}) · .close('win'|'loss') · .flatten()
    SMILE.news({text,level:'info'|'breaking'}) · .goal({label,cur,tgt})
    SMILE.chat({plat,name,handle,msg}) · .pin(text) · .dismiss()
    BroadcastChannel 'smile-live' -> {v:1,id,cmd,data} same commands
    state.json polled 2.5s: {goal:{label,cur,tgt}, news:{text,level}, pinned, chat:{plat,name,handle,msg},
      island:{lastEvent:{id,type,name,amount,message}}, signals:[{action:'open'|'close'|'flatten',market,side,status}]}
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){var d=document.createElement('div');d.id='smile-splash';
d.setAttribute('style','position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99999;display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:999px;background:#0a0a0c;border:1px solid rgba(255,193,7,.45);font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.22em;color:#FFC107');
d.textContent='⚡ SMILE BOOTING…';
document.documentElement.appendChild(d);
window.__smileFail=function(msg,line){d.setAttribute('style','position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:rgba(9,9,11,.97);padding:24px');
d.innerHTML='<div style="max-width:680px;border:2px solid #F6465D;border-radius:18px;padding:26px 30px;background:rgba(246,70,93,.07);font-family:ui-monospace,Menlo,monospace;text-align:center"><div style="font-size:40px">💥</div><div style="color:#fff;font-weight:700;font-size:15px;letter-spacing:.2em;margin:12px 0 10px">SMILE FAILED TO BOOT</div><div style="color:#FFD7DC;font-size:12.5px;line-height:1.65;word-break:break-word">'+String(msg).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})+'</div><div style="color:#a1a1aa;font-size:11px;margin-top:12px">'+(line?('line '+line+' · '):'')+'copy this red box and paste it back</div></div>'};
window.addEventListener('error',function(e){window.__smileFail((e&&e.message)||'unknown error',(e&&e.lineno)||0)});})();
</script>
<style>
:root{
--acc:#FFC107;--acc-rgb:255,193,7;--on:#0A0A0A;--bg:#09090B;--fg:#FAFAFA;--fg2:rgba(255,255,255,.64);--fg3:rgba(255,255,255,.42);
--mut:#A1A1AA;--fnt:#71717A;--hair:rgba(255,255,255,.10);--up:#0ECB81;--down:#F6465D;--live:#FF375F;
--glass:rgba(9,9,11,.72);--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.32,1.45,.45,1);
--fd:'Space Grotesk',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace;--fb:'Inter',system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:transparent}
body{font-family:var(--fb);-webkit-font-smoothing:antialiased;user-select:none;color:var(--fg)}
svg{display:block}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)}.down{color:var(--down)}
/* dev stage */
#stage{position:fixed;inset:0;z-index:0;display:none;background:radial-gradient(90% 70% at 50% 26%,#14161D,#07080B 74%)}
body.stage #stage{display:block}
#stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 16%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 40%,#000 16%,transparent 72%)}
#stage::after{content:"";position:absolute;left:8%;top:6%;width:44vw;height:36vh;background:radial-gradient(closest-side,rgba(255,193,7,.08),transparent);filter:blur(28px)}
/* header — pill system */
#scrim{position:absolute;left:0;right:0;top:0;height:150px;z-index:30;pointer-events:none;background:linear-gradient(180deg,rgba(5,5,7,.55),rgba(5,5,7,.16) 55%,transparent)}
#hdr{position:absolute;left:0;right:0;top:12px;z-index:40;display:flex;align-items:center;gap:10px;padding:0 14px;pointer-events:none;transition:opacity .4s ease,transform .5s var(--ease)}
body.hide-header #hdr{opacity:0;transform:translateY(-100%)}
.pill{display:flex;align-items:center;height:44px;padding:0 8px;flex:1 1 0;min-width:0;max-width:560px;border-radius:999px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.6);box-shadow:0 12px 32px rgba(0,0,0,.42),0 2px 8px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.09);white-space:nowrap}
.sgt{display:flex;align-items:center;gap:9px;height:100%;padding:0 11px}
.cdot{width:3px;height:3px;border-radius:50%;background:rgba(var(--acc-rgb),.45);flex:none}
#pillL{justify-content:flex-start}
#pillR{margin-left:auto;justify-content:flex-end}
#goalSeg .glabel{font-family:var(--fd);font-weight:700;font-size:9.5px;letter-spacing:.2em;color:var(--acc)}
.gbar{width:104px;height:9px;border-radius:999px;background:rgba(127,127,127,.24);overflow:hidden;position:relative;flex:none}
.gbar i{position:absolute;top:0;bottom:0;left:0;border-radius:999px;background:linear-gradient(90deg,rgba(var(--acc-rgb),.6),var(--acc));overflow:hidden;transition:width .9s var(--ease)}
.gbar i svg{position:absolute;top:0;left:0;height:100%;width:200%;animation:wave 2.8s linear infinite}
.gbar i svg path{fill:rgba(255,255,255,.32)}
@keyframes wave{to{transform:translateX(-50%)}}
#goalVal{font-family:var(--fm);font-size:12.5px;font-weight:600;color:var(--fg)}
#goalVal em{font-style:normal;color:var(--fnt);font-size:10px}
#goalChip.hit{animation:hit 2.4s var(--ease)}
@keyframes hit{0%,100%{filter:none}18%{filter:brightness(1.9)}}
#clkDate{font-family:var(--fm);font-size:11px;letter-spacing:.12em;color:var(--mut)}
.clktz{font-size:11.5px;letter-spacing:.1em;color:var(--mut)}
.clktz b{color:var(--fg);font-weight:600}
.nlab{font-family:var(--fm);font-size:10px;letter-spacing:.18em;color:var(--acc)}
#nextTxt{font-family:var(--fm);font-size:11px;letter-spacing:.06em;color:var(--fg);max-width:230px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1760px){#nextSeg{display:none}}
@media (max-width:1560px){#clkNyc{display:none}}
@media (max-width:1340px){#clkDate{display:none}}
@media (max-width:1240px){#goalSeg .gbar{display:none}}
@media (max-width:1080px){#goalSeg{display:none}}
@media (max-width:1080px){#pillL{display:none}}
@media (max-width:1500px){.pill{max-width:470px}}
/* island — fixed state geometry (states have designed sizes, never measured mid-morph) */
#islw{position:absolute;top:11px;left:50%;transform:translateX(-50%);z-index:60;pointer-events:none}
#isl{position:relative;display:flex;align-items:center;padding-left:9px;overflow:hidden;border-radius:999px;max-width:calc(100vw - 40px);min-width:0;opacity:0;transform:translateY(-8px);background:linear-gradient(165deg,#16161B 0%,#060608 55%,#000 100%);box-shadow:0 24px 50px -16px rgba(0,0,0,.75),0 4px 16px rgba(0,0,0,.35);transition:opacity .5s ease,transform .6s var(--spring)}
#isl.on{opacity:1;transform:none}
body.debug #isl{pointer-events:auto;cursor:pointer}
#isl::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:4;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.07) 30%,rgba(255,255,255,.015) 55%,rgba(255,255,255,.10));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
#isl::after{content:"";position:absolute;top:0;left:-70%;width:42%;height:100%;z-index:3;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(255,255,255,.055),transparent);transform:skewX(-18deg);animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-70%}85%,100%{left:135%}}
#isl.bump{animation:bump .34s var(--spring)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.02)}100%{transform:scale(1)}}
#isl.liquid{background:linear-gradient(168deg,#FFD84E 0%,#FFC107 48%,#EDA400 100%)}
#isl.liquid::before{background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.25) 30%,rgba(255,255,255,.08) 60%,rgba(255,255,255,.4))}
#isl.liquid::after{display:none}
.bubs{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;border-radius:inherit;opacity:0;transition:opacity .6s ease}
#isl.bub .bubs{opacity:1}
.bubs i{position:absolute;bottom:-12px;border-radius:50%;background:rgba(255,255,255,.10);animation:bub 4.8s ease-in infinite}
#isl.liquid .bubs i{background:rgba(255,255,255,.38)}
@keyframes bub{0%{transform:translateY(0) scale(.5);opacity:0}12%{opacity:.55}100%{transform:translateY(-150px) scale(1.15);opacity:0}}
#punch{flex:none;display:grid;place-items:center;position:relative;z-index:2}
#punch .smk{width:28px;height:28px}
.lv{display:flex;align-items:center;gap:7px;font-family:var(--fd);font-weight:700;font-size:10.5px;letter-spacing:.18em;color:var(--live)}
.lv i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:softpulse 1.6s infinite}
.lv.s{font-size:8.5px;gap:4px}
.lv.s i{width:5px;height:5px}
@keyframes softpulse{0%,100%{opacity:1}50%{opacity:.3}}
.upt{font-size:12px;color:rgba(255,255,255,.75)}
.ihair{width:1px;height:14px;background:rgba(255,255,255,.14);flex:none}
.pairwrap{display:flex;align-items:baseline;gap:8px}
.psym{font-size:10.5px;color:rgba(255,255,255,.4);letter-spacing:.12em}
.ppx{font-size:13px;font-weight:700;color:#fff}
.roll{animation:tickUp .7s ease-out}
.roll.dn{animation-name:tickDown}
@keyframes tickUp{0%{color:var(--up)}100%{color:var(--fg)}}
@keyframes tickDown{0%{color:var(--down)}100%{color:var(--fg)}}
.ppc{font-size:11px;font-weight:700}
.sess{display:flex;gap:8px;align-items:center}
.sdt{display:flex;gap:4px;align-items:center;font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;color:rgba(255,255,255,.4)}
.sdt i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18)}
.sdt.open{color:rgba(255,255,255,.9)}
.sdt.open i{background:var(--up);box-shadow:0 0 6px var(--up)}

#isl.liquid .lv{color:var(--on)}
#isl.liquid .upt,#isl.liquid .psym,#isl.liquid .ppc,#isl.liquid .sdt{color:rgba(10,10,10,.6)}
#isl.liquid .ppx{color:var(--on)}
#isl.liquid .ihair{background:rgba(0,0,0,.2)}
#isl.liquid .smk .fc{fill:var(--on)}#isl.liquid .smk .fe{fill:var(--acc)}#isl.liquid .smk .fm{stroke:var(--acc)}
#stg{position:relative;flex:1 1 auto;min-width:0;height:100%;z-index:2;margin-left:10px}
.view{position:absolute;left:0;top:0;bottom:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;pointer-events:none}
.view.on{opacity:1}
.view.in{animation:vIn .45s var(--ease) both}
.view.in>*{animation:chIn .5s var(--ease) both;animation-delay:.1s}
.view.in>*:nth-child(2){animation-delay:.15s}
.view.in>*:nth-child(3){animation-delay:.2s}
.view.in>*:nth-child(4){animation-delay:.25s}
.view.out{animation:vOut .14s ease forwards}
@keyframes vIn{0%{opacity:0;transform:scale(.94) translateY(5px);filter:blur(8px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes vOut{to{opacity:0;transform:scale(.965);filter:blur(6px)}}
@keyframes chIn{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:none}}
.view.as{gap:13px;padding:0 20px}
.view.idle{justify-content:space-between;padding:0 18px 0 2px}
.idleg{display:flex;align-items:center;gap:10px}
.aico{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;color:var(--acc);background:rgba(var(--acc-rgb),.13);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.35),inset 0 1px 0 rgba(255,255,255,.12);animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.atx{display:flex;flex-direction:column;gap:3px;min-width:0}
.atx b{font-family:var(--fd);font-weight:700;font-size:16px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.atx span{font-size:12.5px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aamt{flex:none;font-family:var(--fd);font-weight:700;font-size:14px;color:var(--acc);background:rgba(var(--acc-rgb),.12);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.38);border-radius:999px;padding:7px 14px}
#isl.liquid .aamt{color:var(--on);background:rgba(0,0,0,.14);box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.view.al{flex-direction:column;justify-content:center;gap:10px;padding:12px 22px}
.ahead{display:flex;align-items:center;gap:13px;min-width:0;width:100%}
.amsg{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.78);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%}
#isl.liquid .atx b{color:var(--on)}
#isl.liquid .atx span,#isl.liquid .amsg{color:rgba(10,10,10,.66)}
.view.trade{flex-direction:column;justify-content:center;gap:13px;padding:14px 24px}
.trow1{display:flex;align-items:center;gap:10px;width:100%}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px rgba(255,193,7,.7);animation:softpulse 1.8s infinite;flex:none}
.tmkt{font-family:var(--fd);font-weight:700;font-size:17px;color:#fff}
.tside{font-size:9px;font-weight:800;letter-spacing:.16em;padding:4px 10px;border-radius:999px;flex:none}
.tside.long{color:var(--up);background:rgba(14,203,129,.15);box-shadow:inset 0 0 0 1px rgba(14,203,129,.4)}
.tside.short{color:var(--down);background:rgba(246,70,93,.15);box-shadow:inset 0 0 0 1px rgba(246,70,93,.4)}
.ttime{margin-left:auto;font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.08em}
.trow2{display:flex;align-items:center;gap:22px;min-height:56px;width:100%}
.tpnl{font-family:var(--fm);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1}
.tsub{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.55);margin-top:7px}
.tsub b{color:rgba(255,255,255,.8);font-weight:600}
.tstats{margin-left:auto;display:flex}
.tcell{display:flex;flex-direction:column;gap:4px;padding:2px 16px;text-align:right}
.tcell + .tcell{border-left:1px solid rgba(255,255,255,.05)}
.tcell label{font-size:8.5px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.42)}
.tcell b{font-size:13.5px;font-weight:600;color:#fff}
.tlad{display:flex;align-items:center;gap:12px;width:100%}
.tlab{font-size:9px;font-weight:600;letter-spacing:.14em;color:rgba(255,255,255,.45);line-height:1.3}
.tlab b{display:block;font-size:11px;color:rgba(255,255,255,.75);letter-spacing:0}
.lbar{position:relative;flex:1;height:5px;border-radius:999px;background:linear-gradient(90deg,rgba(246,70,93,.45),rgba(255,255,255,.1) 50%,rgba(14,203,129,.45))}
.ldot{position:absolute;top:50%;left:50%;width:11px;height:11px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(0,0,0,.55),0 0 12px rgba(255,255,255,.65);transition:left .7s var(--ease)}
.lbear,.lbull{position:absolute;top:50%;transform:translateY(-50%);display:flex}
.lbear{left:-2px;color:var(--down)}
.lbull{right:-2px;color:var(--up)}
.lbear svg,.lbull svg{width:13px;height:13px}
#isl.liquid .tmkt,#isl.liquid .tpnl,#isl.liquid .tcell b,#isl.liquid .tlab b{color:var(--on)}
#isl.liquid .tsub,#isl.liquid .tlab,#isl.liquid .ttime,#isl.liquid .tcell label{color:rgba(10,10,10,.6)}
.view.res{gap:16px;padding:0 24px}
.rcol{display:flex;flex-direction:column;gap:4px}
.rt{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.26em;color:rgba(255,255,255,.55)}
.rv{font-family:var(--fm);font-weight:700;font-size:28px;letter-spacing:-.02em;color:#fff}
.rbtn{font-family:var(--fm);font-size:12px;font-weight:600;color:rgba(255,255,255,.7);border-radius:999px;padding:6px 13px;background:rgba(0,0,0,.14);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.view.res.loss .rt,.view.res.loss .rv{color:var(--down)}
#isl.liquid .rt,#isl.liquid .rv{color:var(--on)}
#isl.liquid .rbtn{color:var(--on);background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
@media (max-width:820px){#islw{transform:translateX(-50%) scale(.72);transform-origin:top center}}

.smk{flex:none}
.smk .fc{fill:var(--acc)}
.smk .fe{fill:var(--on);transform-box:fill-box;transform-origin:center;transition:transform .16s ease}
.smk .fm{fill:none;stroke:var(--on);stroke-width:7.5;stroke-linecap:round}
.smk.blink .fe{transform:scaleY(.12)}
.smk.look-r .fe{transform:translateX(5px)}
.smk.look-l .fe{transform:translateX(-5px)}
.smk.celebrate{animation:mBounce .9s var(--spring)}
@keyframes mBounce{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-9%) scale(1.07)}60%{transform:translateY(2%) scale(.98)}100%{transform:none}}
.smk.shake{animation:mShake .55s ease}
@keyframes mShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}}
/* news — floating banner (its own silhouette, never a stacked bar) */
#news{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px) scale(.96);max-width:min(880px,86vw);height:54px;z-index:41;display:flex;align-items:center;gap:14px;padding:0 15px 0 11px;border-radius:999px;background:rgba(9,9,11,.93);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 18px 44px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.09);opacity:0;transition:transform .55s var(--spring),opacity .3s ease;pointer-events:none;overflow:hidden}
#news.on{opacity:1;transform:translateX(-50%)}
#news.breaking{background:rgba(34,10,15,.94);box-shadow:0 18px 44px rgba(0,0,0,.55),0 0 46px rgba(246,70,93,.30),inset 0 1px 0 rgba(255,255,255,.09)}

#news.breaking #newsTxt{color:#FFD7DC}
#newsTime{margin-left:auto;flex:none;font-size:10px;letter-spacing:.16em;color:var(--fnt)}
body.hide-news #news{display:none}
body.hide-footer #news{bottom:16px}
/* footer — pill bar */
#ftr{position:absolute;left:12px;right:12px;bottom:10px;height:70px;z-index:40;display:flex;align-items:center;gap:14px;padding:0 14px 0 96px;border-radius:999px;background:rgba(8,8,10,.9);backdrop-filter:blur(16px) saturate(1.5);box-shadow:0 14px 36px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .55s var(--spring),opacity .35s ease}

  if(st.pinned){realIn();Drawer.pin(st.pinned)}
  if(st.chat){realIn();Drawer.show(st.chat)}
  if(st.island&&st.island.lastEvent&&st.island.lastEvent.id&&st.island.lastEvent.id!==StatePoll.lastEv){
   StatePoll.lastEv=st.island.lastEvent.id;realIn();Stage.push(st.island.lastEvent)}
  if(Array.isArray(st.signals)){realIn();st.signals.forEach(function(s){
   if(s.action==='open')Trade.open(s);
   else if(s.action==='close')Trade.close(s.status||'win');
   else if(s.action==='flatten')Trade.flatten()})}}};

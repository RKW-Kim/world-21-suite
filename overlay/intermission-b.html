<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · intermission — departures</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ── INTERMISSION, variant B — "departures" (take three) ────────────────
   A third structural answer, after the horizon and the house lights: the
   show has stepped out of the hall, and the SMILE CENTRAL departure board
   says when it's back. The smile hangs as the station roundel; the board
   carries a dot-matrix split-flap break clock (hero row), dotted-leader
   rows for what's next, and a shine that sweeps the tiles once in a while.
   Same hold contract as A: default 10:00, ?t= overrides, ?t=0 pre-stages
   the hold, at zero the flap row cross-fades into BACK ANY MOMENT and the
   STATUS row flips BOARDING → FINAL CALL. Modules live outside this page:
   bottom 76px + corners stay clear. ────────────────────────────────────── */
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0a0a0a;
  --bg:#09090b; --border:#27272a; --fg:#fafafa; --muted:#a1a1aa; --faint:#9b9ba4;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:76px; /* EXACTLY the ticker module dock height (1920×76) */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--yellow);color:var(--ink)}
.page{position:relative;display:flex;flex-direction:column;height:100%}

/* ── ambient ── */
.ambient{position:absolute;inset:0;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 30%,transparent 84%);
          mask-image:radial-gradient(ellipse at 50% 42%,#000 30%,transparent 84%)}
.spot{position:absolute;inset:0;background:radial-gradient(ellipse 60% 42% at 50% -8%,rgba(255,255,255,.07),transparent 70%)}
.glow{position:absolute;left:50%;top:56%;width:940px;height:600px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,193,7,.075),transparent 62%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 56%,rgba(0,0,0,.55) 100%)}

.topbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:flex-end;
  padding:22px clamp(18px,4vw,48px)}
.clockchip{border:1px solid var(--border);border-radius:999px;padding:8px 16px;
  font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:var(--muted)}
.clockchip b{color:var(--fg);font-weight:600}

/* ── hero ── */
.hero{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(9px,1.8vh,16px);padding:0 24px var(--safe-b);min-height:0}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:9px;border-radius:999px;
  border:1px solid rgba(255,193,7,.35);background:rgba(255,193,7,.06);color:var(--yellow);
  padding:7px 16px;font-family:var(--fm);font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .05s both}
.dot{position:relative;width:7px;height:7px;border-radius:50%;background:var(--yellow)}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;
  animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.6);opacity:0}}

/* the smile hangs as the station roundel — cables drop from a rail */
.hanger{position:relative;display:inline-flex;flex-direction:column;align-items:center;
  animation:rise .9s cubic-bezier(.2,.9,.3,1) .12s both}
.hanger .rail{width:min(560px,58vw);height:1px;margin-bottom:clamp(10px,2vh,18px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16) 16%,rgba(255,255,255,.16) 84%,transparent)}
/* the cables and the face bob as ONE assembly — bobbing only the face
   left the face sliding out from under its mount and the two cable
   stubs read as stray scratches floating above it. */
.hanger .lines{position:relative;width:clamp(120px,14vh,168px);height:clamp(52px,9vh,92px);
  margin-bottom:calc(-1 * clamp(52px,9vh,92px) + 16px);
  animation:bob 6.5s ease-in-out infinite}
.hanger .lines::before,.hanger .lines::after{content:"";position:absolute;top:0;height:100%;width:1.5px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.14))}
.hanger .lines::before{left:32%;transform:rotate(4deg);transform-origin:50% 0}
.hanger .lines::after{right:32%;transform:rotate(-4deg);transform-origin:50% 0}
.hanger .face{width:clamp(88px,13vh,126px);height:clamp(88px,13vh,126px);
  filter:drop-shadow(0 14px 34px rgba(0,0,0,.55));animation:bob 6.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hanger .face svg{width:100%;height:100%}

h1{font-family:var(--fd);font-weight:700;font-size:clamp(40px,7.6vh,74px);line-height:1;
  letter-spacing:-.03em;animation:rise .8s cubic-bezier(.2,.9,.3,1) .18s both}
h1 .g{background:linear-gradient(180deg,#fafafa 25%,#86868e 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
h1 .y{background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ── the departure board ── */
.board{width:min(880px,88vw);border:1px solid var(--border);border-radius:18px;
  background:linear-gradient(180deg,#101013,#0b0b0e);box-shadow:0 30px 80px rgba(0,0,0,.55);
  overflow:hidden;animation:rise .9s cubic-bezier(.2,.9,.3,1) .26s both}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 22px;border-bottom:1px solid var(--border);
  font-family:var(--fm);font-size:9.5px;letter-spacing:.34em;color:var(--faint);text-transform:uppercase}
.bhead .bl{display:inline-flex;align-items:center;gap:10px;overflow:hidden;position:relative}
.bhead .bdot{width:6px;height:6px;border-radius:50%;background:var(--yellow);flex:none;
  box-shadow:0 0 8px rgba(255,193,7,.8)}
.bhead .wave{position:absolute;top:0;bottom:0;left:-8%;width:8%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
  animation:wave 16s linear infinite}
@keyframes wave{0%{transform:translateX(0)}60%,100%{transform:translateX(1400%)}}

.bbody{padding:clamp(18px,3.2vh,30px) clamp(18px,3vw,34px);
  display:flex;flex-direction:column;gap:clamp(11px,2vh,17px)}

/* hero row — dot-matrix split-flap break clock */
.cdzone{display:grid;place-items:center;min-height:calc(clamp(64px,6.6vw,92px) + 8px);width:100%}
.cdzone>*{grid-area:1/1}
.flapwrap{display:flex;align-items:center;gap:clamp(14px,2vw,24px);
  transition:opacity .7s cubic-bezier(.2,.9,.3,1),transform .7s cubic-bezier(.2,.9,.3,1)}
.flapwrap .ba{font-family:var(--fm);font-size:10px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase}
.flap{position:relative;display:flex;align-items:center;gap:7px;overflow:hidden}
.flap .shine{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.07) 50%,transparent 68%);
  transform:translateX(-135%);animation:shineS 6.5s ease-in-out 2.4s infinite}
@keyframes shineS{0%{transform:translateX(-135%)}45%,100%{transform:translateX(135%)}}
.tile{position:relative;width:clamp(46px,4.8vw,66px);height:clamp(64px,6.6vw,92px);
  border-radius:10px;background:linear-gradient(180deg,#17171b,#0d0d10);
  border:1px solid #232329;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  display:grid;place-items:center;transform-origin:50% 50%}
.tile::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:rgba(0,0,0,.55);z-index:2}
.tile::after{content:"";position:absolute;inset:0;border-radius:10px;z-index:2;
  background-image:radial-gradient(circle,rgba(0,0,0,.42) 1px,transparent 1.4px);
  background-size:4px 4px;pointer-events:none}
.tile .d{font-family:var(--fm);font-weight:600;font-size:clamp(32px,4vw,54px);line-height:1;
  color:var(--yellow);text-shadow:0 0 18px rgba(255,193,7,.25);z-index:1}
.tile.tick{animation:flapTick .16s ease}
@keyframes flapTick{0%{transform:scaleY(1)}45%{transform:scaleY(.93)}100%{transform:scaleY(1)}}
.colon{font-family:var(--fm);font-weight:600;font-size:clamp(26px,3.2vw,42px);color:var(--yellow);
  animation:colonB 2s step-end infinite}
@keyframes colonB{0%,100%{opacity:.85}50%{opacity:.22}}
html[data-hold="1"] .flapwrap{opacity:0;transform:scale(.94);pointer-events:none}
.hold{display:inline-flex;align-items:center;gap:11px;border-radius:999px;
  border:1px solid rgba(255,193,7,.5);background:rgba(255,193,7,.1);
  padding:12px 26px;font-family:var(--fm);font-weight:600;font-size:clamp(11px,1.8vh,14px);
  letter-spacing:.3em;color:var(--yellow);text-transform:uppercase;
  opacity:0;transform:scale(.92);transition:opacity .7s cubic-bezier(.2,.9,.3,1) .25s,transform .7s cubic-bezier(.2,.9,.3,1) .25s}
.hold .dot{width:9px;height:9px}
html[data-hold="1"] .hold{opacity:1;transform:none}

/* dotted-leader rows — what's next while the desk is out */
.drow{display:flex;align-items:baseline;gap:14px;font-family:var(--fm)}
.drow .k{font-size:10px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase;flex:none}
.drow .lead{flex:1;border-bottom:1px dotted rgba(255,255,255,.14);transform:translateY(-4px)}
.drow .v{font-size:clamp(11px,1.7vh,14px);letter-spacing:.14em;color:var(--fg);text-transform:uppercase;text-align:right}
.drow .v b{color:var(--yellow);font-weight:600}
.stv{display:inline-grid;text-align:right}
.stv span{grid-area:1/1;transition:opacity .7s cubic-bezier(.2,.9,.3,1),transform .7s cubic-bezier(.2,.9,.3,1)}
.stv .stB{color:var(--yellow);font-weight:600}
html:not([data-hold]) .stv .stB{opacity:0}
html[data-hold="1"] .stv .stA{opacity:0;transform:translateY(-8px)}

/* plain-sight brand signature */
.sig{font-family:var(--fm);font-size:11px;letter-spacing:.46em;color:rgba(250,250,250,.38);
  text-align:center;animation:rise .8s cubic-bezier(.2,.9,.3,1) .5s both}
.sig b{font-weight:600;color:rgba(255,193,7,.62)}

@media (max-width:760px){.drow.opt{display:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  html[data-hold="1"] .flapwrap{display:none}
  html:not([data-hold]) .hold{opacity:0}
  html:not([data-hold]) .stv .stB{display:none}
  html[data-hold="1"] .stv .stA{display:none}
  .colon{opacity:.85}
  .flap .shine{display:none}
  .dot::after{display:none}
}
</style>
</head>
<body>
<div class="page">
  <div class="ambient" aria-hidden="true">
    <div class="dots"></div><div class="spot"></div><div class="glow"></div><div class="vig"></div>
  </div>

  <header class="topbar">
    <span class="clockchip"><b class="num" id="clock">--:--</b> · NAIROBI CENTRAL · EAT</span>
  </header>

  <main class="hero">
    <span class="eyebrow"><span class="dot"></span>Intermission · The Departures Hall</span>

    <div class="hanger">
      <span class="rail" aria-hidden="true"></span>
      <span class="lines" aria-hidden="true"></span>
      <span class="face" aria-hidden="true">
        <!-- smile face — verbatim crop of the real logo (same 4 paths, tight viewBox) -->
        <svg viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg">
          <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>
          <path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#0A0900"/>
          <path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#0A0900"/>
          <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0A0900"/>
        </svg>
      </span>
    </div>

    <h1><span class="g">back in a</span> <span class="y">moment.</span></h1>

    <div class="board">
      <div class="bhead">
        <span class="bl"><i class="bdot"></i>SMILE CENTRAL · DEPARTURES<span class="wave"></span></span>
        <span class="br">PLATFORM <span data-ep>128</span></span>
      </div>
      <div class="bbody">
        <div class="cdzone">
          <div class="flapwrap">
            <span class="ba">Back in</span>
            <div class="flap">
              <span class="shine"></span>
              <span class="tile num" id="dM1"><span class="d">1</span></span>
              <span class="tile num" id="dM2"><span class="d">0</span></span>
              <span class="colon num">:</span>
              <span class="tile num" id="dS1"><span class="d">0</span></span>
              <span class="tile num" id="dS2"><span class="d">0</span></span>
            </div>
          </div>
          <div class="hold" id="hold"><span class="dot"></span>BACK ANY MOMENT</div>
        </div>
        <div class="drow">
          <span class="k">Next session</span><span class="lead"></span>
          <span class="v">Episode <b data-ep>128</b><span id="nxTail"> · Markets Desk</span></span>
        </div>
        <div class="drow">
          <span class="k">Status</span><span class="lead"></span>
          <span class="v stv"><span class="stA">Boarding</span><span class="stB">Final call</span></span>
        </div>
        <div class="drow opt">
          <span class="k">Refreshments</span><span class="lead"></span>
          <span class="v">Served — help yourself</span>
        </div>
        <div class="drow opt">
          <span class="k">Chat</span><span class="lead"></span>
          <span class="v">Open — drop your <b>Qs</b></span>
        </div>
      </div>
    </div>

    <p class="sig">smile<b>.co.ke</b></p>
  </main>
</div>

<script>
/* one gated interval — clock + break countdown → hold, with a tiny tick
   dip on digits that change. no rAF, no canvas. Contract: default 10:00;
   ?t=90 | ?t=05:00 | ?t=1:05:00 overrides; ?t=0 holds immediately
   (pre-stage the hold in OBS); junk falls back to 600s. */
(function(){
  var EAT=3*3600*1000; /* UTC+3 */
  function two(n){return String(n).padStart(2,'0')}

  var eps=(location.search.match(/[?&]ep=([^&]+)/)||[])[1];
  if(eps)document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});

  /* schedule wire — ?next=Trivia Night & ?host=Alice retitle the NEXT SESSION row.
     one-shot, textContent only. */
  (function nx(){
    function g(k){return (location.search.match(new RegExp('[?&]'+k+'=([^&]+)'))||[])[1]}
    function d(v){try{return decodeURIComponent(String(v).replace(/\+/g,' '))}catch(e){return v}}
    var nxt=d(g('next')||'').trim(),hst=d(g('host')||'').trim();
    if(!nxt&&!hst)return;
    var tail=document.getElementById('nxTail');if(!tail)return;
    var t=' \u00b7 ';
    if(nxt)t+=nxt;
    if(hst)t+=(nxt?' \u2014 w/ ':'w/ ')+hst;
    tail.textContent=t;
  })();

  var ck=document.getElementById('clock'),lastMin=-1;
  function tickClock(){
    var m=Math.floor((Date.now()+EAT)/60000)%1440;
    if(m!==lastMin){lastMin=m;ck.textContent=two(Math.floor(m/60))+':'+two(m%60);}
  }

  var raw=(location.search.match(/[?&]t=([\d:]+)/)||[])[1],secs=600;
  if(raw){
    var p=raw.split(':').map(Number);
    secs=p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0];
    if(!(secs>=0))secs=600; /* junk -> default; 0 = hold immediately */
  }
  var END=Date.now()+secs*1000;

  var T=[document.getElementById('dM1'),document.getElementById('dM2'),
         document.getElementById('dS1'),document.getElementById('dS2')];
  function setTile(el,v){
    var d=el.firstChild;
    if(d.textContent!==v){
      d.textContent=v;
      el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick');
    }
  }
  function goHold(){
    if(document.documentElement.dataset.hold!=='1')document.documentElement.dataset.hold='1';
  }
  function tick(){
    if(document.hidden)return;
    tickClock();
    var left=Math.max(0,Math.round((END-Date.now())/1000));
    var str=two(Math.floor(left/60))+two(left%60);
    for(var i=0;i<4;i++)setTile(T[i],str[i]);
    if(left<=0)goHold();
  }
  tick();setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
})();
</script>
</body>
</html>

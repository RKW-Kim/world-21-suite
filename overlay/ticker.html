<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMILE · Ticker</title>
<!-- DARK THEME, DELIBERATELY WITHOUT A color-scheme META TAG
     The whole kit is dark and stays dark — that is the brand, and every
     colour in this file is explicit. What this file must NOT do is ask the
     UA for a dark base canvas: color-scheme makes Chromium paint the root
     canvas OPAQUE (rgb 18,18,18), which turns the ticker MODULE, which must composite over any scene
     into a solid dark rectangle in OBS instead of a transparent layer.
     Theme lives in the CSS; transparency lives in the root background. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<style>
/* ── THE TICKER — the pill, wearing Prism's coat ─────────────────────────
   THE MERGE. By request: the SHAPE stays the stingers-era merged pill
   (rounded 999px capsule, flat #FFCE00 smile cap, masked marquee, 1920×76
   dock) and the CRAFT comes from the Prism take:
     · the cap gets Prism's real gradient instead of flat fill
     · the cap label switches to Space Grotesk 700 / .2em tracking
     · Prism's diagonal sheen sweep rides the strip, compositor-only
     · sponsor cells get Prism's skew + tighter radius
     · Prism's denser cell type — labels go 10.5px mono, uppercase, .14em
   THE DIAGONAL SLASHES STAY. Prism put a skewed amber bar between every
   pair of cells, and that is the one piece of its craft that earns its
   place — it is what makes the strip read as a market feed instead of a
   word cloud. The merge was wrong to drop them. Kept at 16px so they read
   as hairline ticks rather than a fence, over a 26px gutter.
   Content is static HTML — zero intervals, zero rAF, zero canvas; the
   loop is one compositor transform. No backdrop blur: a transparent OBS
   dock has nothing behind it to sample, so it was pure GPU cost.
   Reduced motion: the strip freezes as a clean static row.

   THE TICKER MODULE — layer it as its own OBS browser source over ANY
   scene (scenes keep their bottom 76px module zone clear for it):
     1920×76 dock · transparent · ?mode=offair adds sponsors + socials
     ?scale=1.25    = pill size inside the dock (0.5–3, default 1)
   No other params, no timers — same contract as the watermark module. */
 :root{
  --yellow:#FFC107; --ink:#0a0a0a; --up:#0ECB81; --down:#F6465D;
  --fg:#FAFAFA; --meta:#9AA4BC;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --tks:1;
  --capw:200px;
  --fade:108px;        /* marquee edge fade; ?fade= overrides */
 }
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{width:1920px;height:76px;overflow:hidden;background:transparent}
 body{font-family:var(--fd);-webkit-font-smoothing:antialiased}
 ::selection{background:#FFCE00;color:#1F1702}

 .dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.2) 1.1px,transparent 1px);
   background-size:26px 26px;
   -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%);
           mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%)}

 .tkWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
   z-index:35;pointer-events:none;padding:0 var(--dockpad,12px)}
 /* width:100%, NOT fit-content. fit-content lets the pill resolve to the
    intrinsic width of its contents — and the marquee track inside .clip is
    ~4600px of nowrap text. It happened to settle at exactly the container
    width on a 1920 canvas, but at other source widths the pill grew past the
    frame and body{overflow:hidden} clipped the clock cap off the right edge
    with nothing in the DOM reporting an overflow. width:100% cannot exceed its
    container by construction, which is the only reliable fix. */
 .tkPill{width:100%;max-width:100%;height:54px;display:flex;align-items:stretch;overflow:hidden;border-radius:999px;
   transform:scale(var(--tks));transform-origin:50% 50%;
   background:rgba(0,0,0,.93);
   box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.45),0 0 0 1.5px rgba(255,206,0,.2)}
 /* Both caps are a hard, identical width. They used to be flex:none sized by
    their own content, so the left measured 187px and the right 140px — two
    different cap widths on one strip, which reads as an accident rather than
    a decision. The clock cap now has exactly as much room as the brand cap. */
 .tkPill .cap{flex:0 0 var(--capw);width:var(--capw);display:flex;align-items:center;
   justify-content:center;gap:9px;padding:0 22px;
   background:linear-gradient(0deg,#FFAE5A,#FFC107 100%,#F8A800);color:#1F1702;
   clip-path:polygon(0 0,100% 0,calc(100% - 20px) 100%,0 100%)}

 /* Right cap is the left cap mirrored: the slope leans right at the top on
    BOTH, so the two cuts run parallel and the strip reads as one channel.
    The outer edge is deliberately left square here — .tkPill's own 999px
    radius plus overflow:hidden rounds it. Clipping it with a polygon too
    would flatten the end and the caps would no longer close into a clean
    pill when the middle is removed. */
 .tkPill .cap.r{clip-path:polygon(20px 0,100% 0,100% 100%,0 100%)}

 .tkPill .cap svg{width:29px;height:29px;display:block;filter:drop-shadow(0 1px 5px rgba(0,0,0,0.65))}
 .tkPill .cap .t{font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.2em}

 /* The clock is meant to read as a bedside alarm clock, not a stopwatch, and
    the seconds field was the entire problem: a stopwatch is something you
    watch. Hours and minutes alone, digits large and alone in their own block,
    with EAT as a quiet caption underneath instead of competing beside it on a
    single line. */
 .tkPill .cap.r{flex-direction:column;gap:2px}
 .tkPill .cap.r .face-t{font-family:var(--fd);font-weight:700;font-size:26px;
   line-height:1;letter-spacing:.005em;font-variant-numeric:tabular-nums;color:#17140A}
 .tkPill .cap.r .zone{font-family:var(--fm);font-weight:600;font-size:8.5px;
   letter-spacing:.24em;color:rgba(23,20,10,.6)}
 /* The edge fade is the whole reason the marquee reads as a ticker instead of
    a list being chopped. At 30px it was barely two characters wide, so cells
    were sliced mid-value right beside each cap — "SOL 120.93 +0" then the gold
    — and over a bright video the hard cut against the dark pill looked like a
    rendering fault. 108px is about eight characters: enough that whatever is
    leaving is already unreadable before it reaches the cap. */
 /* min-width:0 stated rather than inherited. A flex item's automatic minimum
    size is its content's min-content width, and with a nowrap marquee inside
    that is enormous. overflow:hidden happens to zero it today; saying so
    means it stays zero if the overflow is ever changed. */
 .clip{flex:1 1 0%;min-width:0;display:flex;align-items:center;overflow:hidden;position:relative;
   -webkit-mask:linear-gradient(90deg,transparent,#000 var(--fade) calc(100% - var(--fade)),transparent);
   mask:linear-gradient(90deg,transparent,#000 var(--fade) calc(100% - var(--fade)),transparent)}
 .sheen{position:absolute;top:-20%;bottom:-20%;left:0;width:26%;z-index:3;pointer-events:none;
   background:linear-gradient(105deg,transparent,rgba(255,255,255,.09) 45%,transparent 70%);
   transform:translateX(-160%) skewX(-18deg);animation:sheen 7s cubic-bezier(.3,.6,.4,0.7) 1.5s infinite}
 @keyframes sheen{0%{transform:translateX(-160%) skewX(-18deg)}
   55%,100%{transform:translateX(520%) skewX(-18deg)}}
 .tk{display:flex;align-items:center;gap:26px;padding:0 14px;white-space:nowrap;will-change:transform;
   animation:sp-tk 25s linear infinite}
 .tk[hidden]{display:none}
 .slash{flex:none;width:2px;height:16px;align-self:center;
  transform:skewX(-24deg);border-radius:1px;
  background:rgba(255,206,0,.5);box-shadow:0 0 7px rgba(255,206,0,.3)}
.it{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:12.5px;font-weight:600;color:var(--fg)}
 .it .s{color:var(--meta);font-size:10.5px;text-transform:uppercase;letter-spacing:.14em}
 .it .num{font-variant-numeric:tabular-nums}
 .it .up{color:var(--up)} .it .dn{color:var(--down)}
 @keyframes sp-tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
 @media (prefers-reduced-motion:reduce){.tk,.sheen{animation:none !important}}
</style>
</head>

        <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0a0a0a"/>

<script>
/* Module params + LIVE MARKET DATA.
   ?scale=0.5  resize the pill        ?live=0  freeze it at the baked values
   ?every=2    crypto refresh seconds (min 1)
   ?fx=300     FX refresh seconds (min 60)

   TWO CADENCES, ON PURPOSE. These are different instruments and the sources
   do not behave alike, so they are not polled on one shared interval:

     crypto  Binance publishes a rolling 24h window, so a 2s poll returns
             genuinely new data and the strip is alive.
     FX      No free source carries intraday FX at all -- every one of them is
             a once-daily reference rate. Measured: 10 polls of fxratesapi
             /latest across 20 seconds returned ONE distinct value. Polling
             it every 2s would render +0.00% forever and burn the quota into
             a 429 with no Retry-After that had still not recovered 11 minutes
             later. So FX is percentage-accurate but slow, which is honest.

   Percentages are 24h for every cell that shows one. Where a source cannot
   supply a 24h figure the cell shows nothing rather than a derived one --
   see the gold note below.

   Endpoints — all free, no API key, verified by fetching from a real
   Chromium context (curl-based CORS checks lie; both a curl-pass/Chromium-fail
   and a curl-fail/Chromium-pass case turned up in testing):
     Binance      api.binance.com/api/v3/ticker/24hr      360ms  native 24h %
     fxratesapi   .../timeseries                          300ms  24h % derived
     gold-api     api.gold-api.com/price/XAU              300ms  price only

   What is deliberately NOT here: NSE 20, SCOM, EQTY, KCB, EABL, ABG, the
   global indices, DXY, VIX, WTI and Brent. Every one of those endpoints is
   CORS-blocked to a browser origin, and the free tiers that do answer
   (CoinGecko 429s past ~5 rapid polls; Twelve Data free is 8 calls/min) will
   not survive a 2s cadence. There is no free keyless way to show them in an
   OBS browser source. They are absent rather than frozen on screen, because
   a static number under a live-ticking strip is the same as lying.

   Every cell updates in ONE pass per cycle, so the row can never show a BTC
   price from one minute next to an FX rate from the next. A failed fetch keeps
   the last good values on screen: a stale price is recoverable, a blank one
   during a live show is not. */
(function(){
  var sc=parseFloat((location.search.match(/[?&]scale=([\d.]+)/)||[])[1]);
  if(!isNaN(sc)&&sc>0)document.documentElement.style.setProperty('--tks',Math.min(3,sc));

  var LIVE=(location.search.match(/[?&]live=([^&]*)/)||[])[1]!=='0';
  var fade=parseInt((location.search.match(/[?&]fade=(\d+)/)||[])[1],10);
  if(fade>=0&&fade<=400)document.documentElement.style.setProperty('--fade',fade+'px');
  /* ?pad= moves the dock inset. 0 makes the strip truly edge-to-edge, which is
     what you usually want with a full-frame video behind it.
     Named dockPad, NOT pad: there is already a function pad(n) in this scope
     for the clock, and a var of the same name hoists over it — which silently
     killed the clock while every other value looked perfectly fine. */
  var dockPad=parseInt((location.search.match(/[?&]pad=(\d+)/)||[])[1],10);
  if(!isNaN(dockPad)&&dockPad>=0&&dockPad<=120)
    document.documentElement.style.setProperty('--dockpad',dockPad+'px');
  function num(re,lo,dflt){
    var v=parseInt((location.search.match(re)||[])[1],10);
    return v>=lo?v:dflt;
  }
  var every=num(/[?&]every=(\d+)/,1,2);     /* crypto */
  var fxEvery=num(/[?&]fx=(\d+)/,60,300);   /* FX */

  function pad(n){return n<10?'0'+n:''+n}
  var clock=document.getElementById('tkclock');
  /* a DECLARATION, not a named function expression: the name of a named
     function expression is only bound inside its own body, so setInterval could
     not see it — and the throw aborted the rest of the IIFE, which is why every
     cell sat at -- */
  function tickClock(){
    if(document.hidden)return;
    var d=new Date();
    clock.textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  }
  tickClock();
  setInterval(tickClock,1000);

  if(!LIVE)return;

  /* one group per label, so the duplicated loop halves update together */
  function groups(kind){
    var m={},all=document.querySelectorAll('[data-live="'+kind+'"]');
    for(var i=0;i<all.length;i++){
      var s=all[i].querySelector('.s').textContent.trim();
      (m[s]=m[s]||[]).push(all[i]);
    }
    return m;
  }
  function paint(set,price,pct){
    var fmt=Math.abs(price)>=1000?function(v){return v.toLocaleString('en-US',{maximumFractionDigits:0})}:
            Math.abs(price)>=1?function(v){return v.toFixed(2)}:
            function(v){return v.toFixed(4)};
    set.forEach(function(el){
      var nums=el.querySelectorAll('.num');
      nums[0].textContent=fmt(price);
      var c=nums[1]; c.textContent=(pct>0?'+':'')+pct.toFixed(2)+'%';
      c.className='num '+(pct>=0?'up':'dn');
    });
  }

  function get(url,ms){
    var c=new AbortController();
    var t=setTimeout(function(){c.abort()},ms||6000);
    return fetch(url,{signal:c.signal,cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
      .finally(function(){clearTimeout(t)});
  }

  /* ── crypto: rolling 24h window, so a fast poll is genuinely new data ── */
  function refreshCrypto(){
    get('https://api.binance.com/api/v3/ticker/24hr?symbols='+
        encodeURIComponent(JSON.stringify(['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','AVAXUSDT'])))
      .then(function(rows){
        var cG=groups('c');
        rows.forEach(function(r){
          var set=cG[r.symbol.replace('USDT','')]; if(!set)return;
          paint(set,parseFloat(r.lastPrice),parseFloat(r.priceChangePercent));
        });
      })
      .catch(function(){});          /* keep last good */
  }

  /* ── FX: daily buckets, newest first, base currency omitted from rates ──
     fxratesapi /timeseries returns rates keyed by ISO timestamp DESCENDING:
       rates["2026-10-05T23:59:00.000Z"] = {EUR,GBP,JPY,KES}   <- current
       rates["2026-10-04T23:59:00.000Z"] = {EUR,GBP,JPY,KES}   <- baseline
     base=USD so there is no USD entry; a quote of X/KES is KES divided by X,
     with X==1 for USD. Percent is therefore against the previous DAILY fix,
     which is the honest reading of "24h" for a daily reference rate. */
  function isoBack(n){var d=new Date(Date.now()-n*864e5);return d.toISOString().slice(0,10)}
  function refreshFX(){
    var url='https://api.fxratesapi.com/timeseries?start_date='+isoBack(6)+
            '&end_date='+isoBack(0)+'&base=USD&currencies=KES,EUR,GBP,JPY';
    get(url)
      .then(function(j){
        if(!j||!j.success||!j.rates)return;
        var days=Object.keys(j.rates).sort().reverse();   /* newest first */
        if(days.length<2)return;
        var cur=j.rates[days[0]], base=j.rates[days[1]];
        var fG=groups('f');
        /* leg[0] is the numerator in KES, leg[1] the optional denominator */
        var legs={'USD/KES':['KES'],'EUR/KES':['KES','EUR'],
                  'GBP/KES':['KES','GBP'],'JPY/KES':['KES','JPY']};
        Object.keys(legs).forEach(function(pair){
          var L=legs[pair], set=fG[pair];
          if(!set||!cur[L[0]]||!base[L[0]])return;
          if(L[1]&&(!cur[L[1]]||!base[L[1]]))return;
          var spot=cur[L[0]]/(L[1]?cur[L[1]]:1);
          var prev=base[L[0]]/(L[1]?base[L[1]]:1);
          if(!prev)return;
          paint(set,spot,(spot/prev-1)*100);
        });
      })
      .catch(function(){});
  }

  refreshCrypto();
  refreshFX();
  setInterval(refreshCrypto, every*1000);
  setInterval(refreshFX, fxEvery*1000);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden)return;
    refreshCrypto();refreshFX();
  });
})();
</script>
</body>

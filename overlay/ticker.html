<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<title>SMILE · market ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ── THE ORIGINAL MARKET TICKER, in the lineup ─────────────────────────
   Ported from core/market-ticker.html (main) into the kit language:
   same anatomy (clock · seamless price marquee · status), kit tokens,
   verbatim smile face, and one upgrade the old one never had — a built-in
   demo feed, so it renders standalone (GitHub Pages, no local server).
   Real contract preserved: ws /api/market/ws · poll /api/market/ticker.
   Featherweight: one gated 1s interval total, zero rAF, zero canvas,
   compositor-only marquee, reduced-motion = static row. */
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0a0a0a;
  --bg:#09090b; --border:#27272a; --fg:#fafafa; --muted:#a1a1aa; --faint:#71717a;
  --up:#0ECB81; --down:#F6465D;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:76px;overflow:hidden;background:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.bar{position:absolute;inset:0;display:flex;align-items:stretch;
  background:linear-gradient(90deg,rgba(9,9,11,.97),rgba(9,9,11,.88));
  border-top:1px solid rgba(255,193,7,.4)}
.cap{display:flex;align-items:center;gap:10px;padding:0 24px;white-space:nowrap;
  font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.18em}
.cap.l{background:var(--yellow);color:var(--ink)}
.cap.l svg{height:24px;width:auto;display:block}
.clock{display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:0 22px;border-right:1px solid rgba(255,255,255,.08)}
.clock .time{font-family:var(--fd);font-weight:700;font-size:23px;line-height:1;
  color:var(--fg);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock .date{font-family:var(--fm);font-size:9.5px;letter-spacing:.22em;
  color:var(--faint);text-transform:uppercase}
.mask{flex:1;overflow:hidden;display:flex;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 42px,#000 calc(100% - 42px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 42px,#000 calc(100% - 42px),transparent)}
.track{display:flex;width:max-content;animation:tk 48s linear infinite;will-change:transform}
@keyframes tk{to{transform:translateX(-50%)}}
.item{display:inline-flex;align-items:baseline;gap:9px;padding:0 26px;white-space:nowrap}
.item .sym{font-family:var(--fd);font-weight:700;font-size:13.5px;letter-spacing:.06em;color:var(--fg)}
.item .px{font-family:var(--fm);font-size:13px;font-weight:600;color:var(--fg);
  font-variant-numeric:tabular-nums}
.item .chg{font-family:var(--fm);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.item.up .chg{color:var(--up)} .item.down .chg{color:var(--down)}
.item.up .px::after{content:" \25B2";color:var(--up);font-size:9px}
.item.down .px::after{content:" \25BC";color:var(--down);font-size:9px}
.sep{align-self:center;font-size:10px;color:var(--yellow);opacity:.6}
.cap.r{margin-left:auto;background:rgba(255,193,7,.05);border-left:1px solid rgba(255,193,7,.25);
  color:rgba(255,193,7,.8);font-family:var(--fm);font-weight:400;font-size:10px;letter-spacing:.2em}
.cap.r.live{color:var(--up)}
@media (prefers-reduced-motion:reduce){.track{animation:none !important}}
</style>
</head>
<body>
<div class="bar">
  <div class="cap l">
    <!-- verbatim face — same paths as Smile-Logo.svg face crop used across the kit -->
    <svg viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg" aria-label="smile">
      <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#0a0a0a"/>
      <path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#FFC107"/>
      <path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#FFC107"/>
      <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#FFC107"/>
    </svg>
    <span>SMILE · MARKETS</span>
  </div>
  <div class="clock">
    <div class="time" id="time">--:--:--</div>
    <div class="date" id="date">— · EAT</div>
  </div>
  <div class="mask"><div class="track" id="track"></div></div>
  <div class="cap r" id="feed">DEMO FEED</div>
</div>
<script>
(function(){
'use strict';
var pad=function(n){return String(n).padStart(2,'0')};
function tickClock(){
  var d=new Date();
  document.getElementById('time').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  document.getElementById('date').textContent=
    d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}).toUpperCase()+' · EAT';
}

var track=document.getElementById('track'), feedEl=document.getElementById('feed');
var rows={}, order=[], gotReal=false, wsOpen=false, n=0;

function fmtPx(v){return v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function setFeed(mode){feedEl.textContent=mode;feedEl.className='cap r'+(mode.indexOf('LIVE')===0?' live':'')}

function build(symbols){
  track.textContent=''; rows={}; order=symbols.slice();
  var mk=function(sym){
    var el=document.createElement('span'); el.className='item';
    el.innerHTML='<span class="sym">'+sym+'</span><span class="px">—</span><span class="chg"></span>';
    return el;
  };
  var frag=document.createDocumentFragment();
  symbols.forEach(function(s){
    frag.appendChild(mk(s));
    var sep=document.createElement('span'); sep.className='sep'; sep.textContent='✦';
    frag.appendChild(sep);
  });
  track.appendChild(frag);
  var half=track.childElementCount, clone=document.createDocumentFragment();
  for(var i=0;i<half;i++) clone.appendChild(track.children[i].cloneNode(true));
  track.appendChild(clone);
  var items=track.querySelectorAll('.item'), h=items.length/2; rows={};
  for(var j=0;j<h;j++){
    var it=items[j];
    rows[it.querySelector('.sym').textContent]={
      root:it,px:it.querySelector('.px'),chg:it.querySelector('.chg'),twin:items[j+h]};
  }
}
function render(data){
  if(!data||!data.length) return;
  var syms=data.map(function(t){return t.symbol});
  if(track.childElementCount===0||syms.join('|')!==order.join('|')) build(syms);
  data.forEach(function(t){
    var r=rows[t.symbol]; if(!r) return;
    var cls=t.direction==='up'?'up':'down';
    var px=fmtPx(t.price), chg=(t.change_pct>=0?'+':'')+t.change_pct.toFixed(2)+'%';
    if(r.px.textContent!==px) r.px.textContent=px;
    if(r.chg.textContent!==chg) r.chg.textContent=chg;
    var want='item '+cls;
    if(r.root.className!==want){r.root.className=want;r.twin.className=want}
  });
}

/* ── real feed (original contract, local server) ── */
var ws=null;
function connect(){
  try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/market/ws')}catch(e){return}
  ws.onopen=function(){wsOpen=true;gotReal=true;setFeed('LIVE · WS')};
  ws.onmessage=function(e){try{gotReal=true;setFeed('LIVE · WS');render(JSON.parse(e.data))}catch(_){}}
  ws.onclose=function(){wsOpen=false;setTimeout(connect,3000)};
  ws.onerror=function(){try{ws.close()}catch(_){}}
}
function poll(){
  if(wsOpen||gotReal) return;
  fetch('/api/market/ticker').then(function(r){return r.json()}).then(function(d){
    if(d&&d.length&&!d.error){gotReal=true;setFeed('LIVE · POLL');render(d)}
  }).catch(function(){});
}
connect();

/* ── demo feed: random walk, only while no server answers ── */
var DEMO=[
  {symbol:'BTC/USDT',price:97412.20,vol:0.0018,chg: 1.84},
  {symbol:'ETH/USDT',price: 3421.55,vol:0.0021,chg: 2.37},
  {symbol:'SOL/USDT',price:  214.87,vol:0.0026,chg:-0.92},
  {symbol:'XAU/USD', price: 2648.30,vol:0.0006,chg: 0.41},
  {symbol:'EUR/USD', price:    1.0842,vol:0.0003,chg:-0.12},
  {symbol:'NAS100',  price:21784.50,vol:0.0009,chg: 0.68},
  {symbol:'US500',   price: 6012.40,vol:0.0007,chg: 0.35},
  {symbol:'AAPL',    price:  241.36,vol:0.0014,chg: 0.87},
  {symbol:'NVDA',    price:  138.25,vol:0.0022,chg: 3.12},
  {symbol:'TSLA',    price:  426.50,vol:0.0024,chg:-1.46}
];
function demoTick(){
  render(DEMO.map(function(t){
    var d=t.price*t.vol*(Math.random()-.5);
    t.price=Math.max(0.0001,t.price+d);
    t.chg=Math.max(-9.9,Math.min(9.9,t.chg+(Math.random()-.5)*0.06));
    return {symbol:t.symbol,price:t.price,change_pct:t.chg,direction:d>=0?'up':'down'};
  }));
}
demoTick(); setFeed('DEMO FEED');

/* ── ONE gated master interval: clock every tick · demo 1-in-4 · poll 1-in-5 ── */
setInterval(function(){
  if(document.hidden) return;
  tickClock();
  n++;
  if(!gotReal){
    if(n%4===0) demoTick();
    if(n%5===0) poll();
  }
},1000);
tickClock();
document.addEventListener('visibilitychange',tickClock);
})();
</script>
</body>
</html>

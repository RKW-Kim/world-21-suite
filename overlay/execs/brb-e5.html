<!doctype html><html lang="en"><head><meta charset="utf-8"><title>SMILE · brb · AMBIENT CINEMA</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile-core.css">
<style>
  /* ================= E5 · AMBIENT CINEMA =================
     The scene is always alive, almost imperceptibly. Depth parallax (grid
     far / sparks near), one 40s light sweep crossing the stage, and an 8s
     master tide: face scale + glow breathe together while the arc spinner
     completes exactly 5 revolutions (1.6s) and the dashed ring exactly 2
     (16s) — every loop phase-locks on the tide. Entrances slower (1.5s
     expo) with long 500ms+ group staggers. Everything loops seamlessly.  */

  /* --- skeleton: identical geometry to the frozen design --- */
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding-bottom:60px}
  .buffer{position:relative;width:340px;height:340px;display:grid;place-items:center;margin-bottom:44px}
  h1{font-family:var(--font-display);font-weight:800;font-size:118px;letter-spacing:-.03em;line-height:1}
  h1 .y{color:var(--yellow)}
  .sub{margin-top:22px;font-size:26px;font-weight:500;color:#a8a8a8}
  .bnc{margin-top:34px;display:flex;gap:14px}
  .bnc span{width:14px;height:14px;border-radius:50%;background:var(--yellow)}
  .bnc span:nth-child(2){background:var(--up)}
  .bnc span:nth-child(3){background:var(--down)}

  /* --- far depth: the grid drifts almost imperceptibly (52s round trip) --- */
  .bg::after{animation:gridDrift 52s ease-in-out infinite alternate;will-change:transform}
  @keyframes gridDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-16px,-10px,0)}}

  /* --- near depth: sparks travel farther on a longer, loop-perfect wave --- */
  @keyframes floatSpark{
    0%,100%{transform:translate3d(0,0,0) scale(1);opacity:0}
    10%{opacity:.9}
    50%{transform:translate3d(26px,-48px,0) scale(1.5);opacity:.5}
    88%{opacity:.7}
  }
  .stage .spark{animation-duration:11s;will-change:transform}

  /* --- the 40s light sweep crossing the whole stage --- */
  .stage::after{content:"";position:absolute;inset:-12%;z-index:6;pointer-events:none;
    background:linear-gradient(112deg,
      transparent 41%, rgba(255,255,255,.035) 49%,
      rgba(255,193,7,.05) 52%, transparent 59%);
    transform:translate3d(-60%,0,0);
    animation:stageSweep 40s ease-in-out infinite;will-change:transform}
  @keyframes stageSweep{0%{transform:translate3d(-60%,0,0)}58%{transform:translate3d(60%,0,0)}100%{transform:translate3d(60%,0,0)}}

  /* --- 8s master tide: lens + glow rise and fall as one --- */
  .buffer{animation:bufIn 1.6s cubic-bezier(.19,1,.22,1) both}
  @keyframes bufIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
  .buffer::before{content:"";position:absolute;inset:0;border-radius:50%;
    border:7px solid rgba(255,255,255,.07);border-top-color:var(--yellow);
    animation:spin 1.6s cubic-bezier(.6,.15,.4,.85) infinite;will-change:transform}   /* 5 revs / tide */
  .buffer::after{content:"";position:absolute;inset:16px;border-radius:50%;
    border:2px dashed rgba(255,193,7,.22);
    animation:spinRev 16s linear infinite;will-change:transform}                 /* 2 revs / tide */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinRev{to{transform:rotate(-360deg)}}
  .buffer .tide{position:absolute;inset:-22%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(255,193,7,.20), rgba(255,193,7,.05) 45%, transparent 68%);
    animation:tideGlow 8s ease-in-out infinite}
  @keyframes tideGlow{0%,100%{opacity:.35}50%{opacity:1}}
  .buffer .face{width:216px;height:216px;animation:faceTide 8s ease-in-out infinite;will-change:transform}
  @keyframes faceTide{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

  /* --- entrances: 1.5s expo, long-staggered groups (500ms+) --- */
  .rise{animation-duration:1.5s;animation-timing-function:cubic-bezier(.19,1,.22,1)}
  h1.rise{animation-delay:.5s}
  .sub.rise{animation-delay:1.05s}
  .bnc.rise{animation-delay:1.6s}

  /* --- dots: the same wave, unhurried --- */
  .bnc span{animation:b 1.2s ease-in-out infinite;will-change:transform}
  .bnc span:nth-child(2){animation-delay:.15s}
  .bnc span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

  /* --- ticker: quiet depth --- */
  .tk span{text-shadow:0 2px 10px rgba(0,0,0,.55)}
  .ticker{background:linear-gradient(90deg, rgba(10,10,10,.8), rgba(10,10,10,.55))}
</style></head><body>
<div class="stage">
  <div class="bg"></div>
  <span class="spark" style="left:14%;top:20%;--d:0s"></span><span class="spark" style="left:84%;top:26%;--d:2.75s;background:var(--up)"></span><span class="spark" style="left:76%;top:78%;--d:5.5s"></span><span class="spark" style="left:24%;top:72%;--d:8.25s;background:var(--sky)"></span>
  <div class="wrap">
    <div class="buffer"><i class="tide"></i><div class="face"><span class="eye l"></span><span class="eye r"></span><svg class="mouth" viewBox="0 0 150 70"><path d="M12 12 C 45 62, 105 62, 138 12"/></svg></div></div>
    <h1 class="rise" style="--rd:.1s">positions <span class="y">paused</span>.</h1>
    <p class="sub rise" style="--rd:.2s">Trader stepped away — charts secured, smile intact.</p>
    <div class="bnc rise" style="--rd:.3s"><span></span><span></span><span></span></div>
  </div>
  <div class="ticker" style="--tk-speed:38s">
    <div class="tk"><span>✦ BE RIGHT BACK</span><span>positions secured</span><span>don't close the tab</span><span>@smileke</span><span>smile.co.ke</span><span>#SmileSquad</span></div>
    <div class="tk"><span>✦ BE RIGHT BACK</span><span>positions secured</span><span>don't close the tab</span><span>@smileke</span><span>smile.co.ke</span><span>#SmileSquad</span></div>
  </div>
</div>
<script src="smile-mark.js"></script>
</body></html>

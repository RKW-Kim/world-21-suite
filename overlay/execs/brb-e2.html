<!doctype html><html lang="en"><head><meta charset="utf-8"><title>SMILE · brb · MASS &amp; SPRING</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile-core.css">
<style>
  /* ================= E2 · MASS & SPRING =================
     Same design; every entrance and idle motion is re-driven by a tiny
     hand-rolled rAF spring engine (semi-implicit Euler, no libraries).
     Ring: underdamped settle (1-2 visible oscillations). Face: underdamped
     + a spring-chased breathe. Type: near-critically damped rise.
     Dots: continuously excited pendulum springs with phase offsets.
     Loop pauses on document.hidden; dt clamped. Ticker stays CSS linear. */

  /* --- skeleton: identical geometry to the frozen design --- */
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding-bottom:60px}
  .buffer{position:relative;width:340px;height:340px;display:grid;place-items:center;margin-bottom:44px}
  h1{font-family:var(--font-display);font-weight:800;font-size:118px;letter-spacing:-.03em;line-height:1}
  h1 .y{color:var(--yellow)}
  .sub{margin-top:22px;font-size:26px;font-weight:500;color:#a8a8a8}
  .bnc{margin-top:34px;display:flex;gap:14px}
  .bnc span{width:14px;height:14px;border-radius:50%;background:var(--yellow)}
  .bnc span:nth-child(2){background:var(--up)}
  .bnc span:nth-child(3){background:var(--down)}

  /* --- loops that stay CSS: the arc keeps its eased-dash signature --- */
  .buffer::before{content:"";position:absolute;inset:0;border-radius:50%;
    border:7px solid rgba(255,255,255,.07);border-top-color:var(--yellow);
    animation:spin 1.5s cubic-bezier(.6,.15,.4,.85) infinite;will-change:transform}
  .buffer::after{content:"";position:absolute;inset:16px;border-radius:50%;
    border:2px dashed rgba(255,193,7,.22);
    animation:spinRev 14s linear infinite;will-change:transform}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinRev{to{transform:rotate(-360deg)}}

  /* transforms/opacity come from the engine; dots are pendulums, no CSS bounce */
  .bnc span{will-change:transform}
</style></head><body>
<div class="stage">
  <div class="bg"></div>
  <span class="spark" style="left:14%;top:20%;--d:.4s"></span><span class="spark" style="left:84%;top:26%;--d:1.8s;background:var(--up)"></span><span class="spark" style="left:76%;top:78%;--d:3s"></span><span class="spark" style="left:24%;top:72%;--d:2.3s;background:var(--sky)"></span>
  <div class="wrap">
    <div class="buffer"><div class="face"><span class="eye l"></span><span class="eye r"></span><svg class="mouth" viewBox="0 0 150 70"><path d="M12 12 C 45 62, 105 62, 138 12"/></svg></div></div>
    <h1 class="rise" style="--rd:.1s">positions <span class="y">paused</span>.</h1>
    <p class="sub rise" style="--rd:.2s">Trader stepped away — charts secured, smile intact.</p>
    <div class="bnc rise" style="--rd:.3s"><span></span><span></span><span></span></div>
  </div>
  <div class="ticker" style="--tk-speed:38s">
    <div class="tk"><span>✦ BE RIGHT BACK</span><span>positions secured</span><span>don't close the tab</span><span>@smileke</span><span>smile.co.ke</span><span>#SmileSquad</span></div>
    <div class="tk"><span>✦ BE RIGHT BACK</span><span>positions secured</span><span>don't close the tab</span><span>@smileke</span><span>smile.co.ke</span><span>#SmileSquad</span></div>
  </div>
</div>
<script src="smile-mark.js"></script>
<script>
/* E2 · MASS & SPRING — ~40-line hand-rolled spring engine.
   x += v·dt ; v += (k·(target−x) − c·v)·dt   (semi-implicit Euler)
   Opacity rides a separate expo-out clock. Zero layout reads in rAF.  */
(function(){
  "use strict";
  var $=function(s){return document.querySelector(s)};
  function clamp(v,a,b){return v<a?a:(v>b?b:v)}
  function expo(p){return p<=0?0:(p>=1?1:1-Math.pow(2,-10*p))}
  function step(o,v,t,k,c,dt){var a=(t-o)*k-v*c;v+=a*dt;o+=v*dt;return[o,v]}

  /* el, y0(px), s0(scale), k(stiffness), c(damping), delay(s), fade(s)  */
  var jobs=[
    {el:$('.buffer'), y0:26, s0:.82, k:120, c:12.0, d:0.00, f:1.00},            /* ring: underdamped, overshoots once   */
    {el:$('.face'),   y0:0,  s0:.72, k:150, c:11.0, d:0.16, f:1.00, idle:1},    /* face: springy pop, then chased tide  */
    {el:$('h1'),      y0:30, s0:1,   k:170, c:20.5, d:0.34, f:0.85},            /* type: near-critical, tiny overshoot  */
    {el:$('.sub'),    y0:26, s0:1,   k:170, c:20.5, d:0.50, f:0.85},
    {el:$('.bnc'),    y0:26, s0:1,   k:170, c:20.5, d:0.66, f:0.85}
  ];
  jobs.forEach(function(j){
    j.py=j.y0; j.pv=0; j.ps=j.s0; j.pvs=0; j.done=false;
    j.el.style.animation='none';                       /* engine owns transform+opacity */
    j.el.style.opacity='0';
    j.el.style.transform='translate3d(0,'+j.y0+'px,0) scale('+j.s0+')';
  });
  var TAU=Math.PI*2, BNC_LANDS=jobs[4].d+jobs[4].f;
  var dots=[].map.call(document.querySelectorAll('.bnc span'),function(el,i){
    el.style.transform='translate3d(0,0,0)';
    return {el:el, ph:i*2.094+.6, y:0, v:0};           /* 120° phase offsets = traveling wave */
  });

  var simT=0, last=0, raf=0;
  function frame(ts){
    if(!last) last=ts;
    var dt=Math.min(.033,(ts-last)/1000); last=ts; simT+=dt;
    var live=false, i, j, t, o, ts_, r;
    for(i=0;i<jobs.length;i++){
      j=jobs[i];
      if(simT<j.d){live=true;continue;}          /* hold pose until its cue — springs must not settle unseen */
      t=clamp((simT-j.d)/j.f,0,1); o=expo(t);
      ts_=1;
      if(j.idle && simT>j.d+j.f) ts_=1+.02*Math.sin(TAU*simT/3.4);   /* breathe target, spring-chased */
      r=step(j.py,j.pv,0,j.k,j.c,dt); j.py=r[0]; j.pv=r[1];
      r=step(j.ps,j.pvs,ts_,j.k,j.c,dt); j.ps=r[0]; j.pvs=r[1];
      if(!j.done){
        j.el.style.opacity=o.toFixed(3);
        j.el.style.transform='translate3d(0,'+j.py.toFixed(2)+'px,0) scale('+j.ps.toFixed(4)+')';
        if(t>=1 && !j.idle && Math.abs(j.py)<.02 && Math.abs(j.pv)<.02 && Math.abs(j.ps-1)<.001){
          j.done=true; j.el.style.opacity='1'; j.el.style.transform='none';   /* settle, release */
        }
      }
      if(!j.done || j.idle) live=true;
    }
    /* dots: pendulum springs chasing a phase-offset sine — mass you can feel */
    var ramp=clamp((simT-BNC_LANDS-.2)/1.4,0,1);
    if(ramp>0){
      var amp=20*ramp;
      for(i=0;i<dots.length;i++){
        var D=dots[i], tgt=-amp*(.5+.5*Math.sin(TAU*simT/1.2+D.ph));
        r=step(D.y,D.v,tgt,110,5,dt); D.y=r[0]; D.v=r[1];
        D.el.style.transform='translate3d(0,'+D.y.toFixed(2)+'px,0)';
      }
      live=true;
    }
    return live;
  }
  function tick(ts){ raf=0; if(frame(ts)) raf=requestAnimationFrame(tick); }
  function wake(){ if(!raf && !document.hidden){ last=0; raf=requestAnimationFrame(tick); } }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ if(raf){cancelAnimationFrame(raf); raf=0;} }  /* OBS: no CPU burn while hidden */
    else wake();
  });
  wake();
})();
</script>
</body></html>

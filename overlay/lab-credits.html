<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE — end credits</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23ffd100'/%3E%3Cpath d='M4.16 12.91a7.9 7.9 0 0015.68 0' fill='none' stroke='%230a0900' stroke-width='1.32' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='8' r='1.5' fill='%230a0900'/%3E%3Ccircle cx='17' cy='8' r='1.5' fill='%230a0900'/%3E%3C/svg%3E">
<style>
/* Numbers that change in place must not jitter as digits swap, and the
   browser's own selection colour is the cheapest signal that a page was built
   rather than assembled — both come from the palette. */
::selection{background:var(--acm);color:#0A0A0A}
.num,.chead .ep,.cat .cn small{font-variant-numeric:tabular-nums}

/* END CREDITS — the card the channel rests on.

   Left: the mark, the sign-off, the call to action. Right: the roll, which is
   the part that has to earn its keep.

   The roll is a carousel, not a scroller. Each category takes the stage: its
   people arrive one at a time as large overlapping cards with the centre one
   dominant, then the whole set spreads into a grid so you can see everyone at
   once before the next category takes over. The single bar at the top is the
   time left on whatever is currently on stage. */
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0A0A0A;
  --fg:#FAFAFA; --muted:#A1A1AA; --faint:#9B9BA4;
  --line:rgba(255,255,255,.08);
  --fd:'Inter',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:76px;
  --eo:cubic-bezier(.32,.72,0,1);
  /* A damped spring, solved rather than eyeballed: zeta .62 so it overshoots
     8.4% and comes back. Embla, Reanimated and Motion all ship springs, and
     the overshoot is what reads as physical rather than as a tween. */
  --spring:linear(0,0.0417 4.17%,0.1453 8.33%,0.2829 12.5%,0.433 16.67%,0.5799 20.83%,0.713 25%,0.8264 29.17%,0.9173 33.33%,0.9858 37.5%,1.0337 41.67%,1.0637 45.83%,1.0792 50%,1.0835 54.17%,1.08 58.33%,1.0713 62.5%,1.0597 66.67%,1.0472 70.83%,1.0349 75%,1.0238 79.17%,1.0144 83.33%,1.0068 87.5%,1.0011 91.67%,0.9971 95.83%,1);
  --card-ms:3500;
  --grid-ms:3200;
  /* --ac is the accent of whatever category is on stage. It is registered so
     the browser can interpolate it, which is what lets the whole panel cross
     fade from one category's colour to the next instead of snapping. */
  --ac:#FFC107;
  --acs:rgba(255,193,7,.15);
  --acm:rgba(255,193,7,.30);
  --acf:rgba(255,193,7,.22);
  transition:--ac .7s var(--eo),--acs .7s var(--eo),--acm .7s var(--eo),--acf .7s var(--eo);
}
@property --ac {syntax:'<color>';inherits:true;initial-value:#FFC107}
@property --acs{syntax:'<color>';inherits:true;initial-value:rgba(255,193,7,.15)}
@property --acm{syntax:'<color>';inherits:true;initial-value:rgba(255,193,7,.30)}
@property --acf{syntax:'<color>';inherits:true;initial-value:rgba(255,193,7,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--fg);
  font-family:var(--fd);-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--fg);color:var(--ink)}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden}

/*** background DNA — identical to starting.html ***/
.bg{position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.09) 1.1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 100%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 100%)}
.aura{position:absolute;left:34%;top:42%;width:900px;height:580px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,193,7,.08),transparent 64%)}

.rise{opacity:0;animation:riseIn .9s var(--eo) forwards;animation-delay:var(--rd,0s)}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* ── left column: orbit + sign-off ── */
.bwrap{position:absolute;left:5.4%;top:0;bottom:var(--safe-b);display:flex;align-items:center;
  gap:clamp(30px,3.6vw,64px);z-index:3}
.orbitB{position:relative;width:clamp(250px,34vh,360px);aspect-ratio:1;flex:none;
  display:grid;place-items:center}
.orbitB::before{content:"";position:absolute;inset:0;border:2px dashed rgba(255,193,7,.45);
  border-radius:50%;animation:spinCW 24s linear infinite}
.orbitB::after{content:"";position:absolute;inset:26px;border:1.5px dashed rgba(255,193,7,.2);
  border-radius:50%;animation:spinCCW 16s linear infinite}
.orbitB .glow{position:absolute;inset:-56px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,193,7,.12),transparent 62%)}
.orbitB .face{width:62%;aspect-ratio:1;animation:faceBob 5.6s ease-in-out infinite;
  filter:drop-shadow(0 0 48px rgba(255,193,7,.62))}
.orbitB .face svg{width:100%;height:100%}

/* ---- headline: starting.html's treatment, exactly ----
   The previous pass carried a text-shadow on the h1 and a dark drop-shadow on
   .g. Both were wrong here and nowhere else in the kit: the glyphs are filled by
   a clipped gradient with color:transparent, so a text-shadow has nothing to
   paint, and the drop-shadow only muddied the silver into something greyer than
   every other headline in the kit. line-height was also 1 where the kit uses
   1.02, which on two stacked lines set them too tight to read as one phrase. */
h1{font-family:var(--fd);font-weight:800;font-size:clamp(56px,5.4vw,116px);
  line-height:1.02;letter-spacing:-.045em}
h1 .w{display:block;opacity:0;transform:translateY(40px);animation:wordup .85s var(--eo) both}
h1 .w1{animation-delay:.06s}
h1 .w2{animation-delay:.16s}
@keyframes wordup{to{opacity:1;transform:none}}
h1 .g{background:linear-gradient(180deg,#fafafa 25%,#86868e 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
h1 .y{background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,193,7,.25))}

.follow{margin-top:34px;position:relative;overflow:hidden;display:inline-block}
.follow::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 62%);
  transform:translateX(-130%);animation:sheenX 4.5s ease-in-out 2s infinite}
@keyframes sheenX{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}

.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:999px;
  font-family:var(--fd);font-weight:800;font-size:14px;letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap}
.chip.solid{background:linear-gradient(135deg,var(--yellow),var(--hot));color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 28px rgba(255,193,7,.28)}

.nextrow{display:none;margin-top:22px}
html[data-next="1"] .nextrow{display:block}
.nc{border-left:1px solid rgba(255,193,7,.55);padding:2px 0 2px 18px;
  display:flex;flex-direction:column;gap:6px;max-width:520px}
.nc .nk{font-family:var(--fm);font-weight:600;font-size:11px;letter-spacing:.26em;
  color:var(--yellow);text-transform:uppercase}
.nc .nw{font-family:var(--fd);font-weight:800;font-size:clamp(20px,2.1vw,32px);
  letter-spacing:-.02em;color:var(--fg);line-height:1.12}
.nc .nh{font-family:var(--fm);font-weight:600;font-size:11px;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase}
.nc .nh b{color:var(--faint);font-weight:600}
.nc .nh .sep{color:rgba(255,193,7,.55);margin:0 8px}

.bellrow{display:inline-flex;margin-top:22px;align-items:center;gap:10px}
html[data-next="1"] .bellrow{display:none}
.bellrow svg{width:13px;height:13px;stroke:var(--yellow);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:none;transform-origin:top center;
  animation:ring 5.2s ease-in-out 2.4s infinite}
.bellrow span{font-family:var(--fm);font-weight:600;font-size:11px;letter-spacing:.18em;
  color:var(--muted);text-transform:uppercase}
.bellrow b{color:var(--faint);font-weight:600}
@keyframes ring{0%,84%,100%{transform:rotate(0)}86%{transform:rotate(12deg)}88%{transform:rotate(-10deg)}
  90%{transform:rotate(7deg)}92%{transform:rotate(-5deg)}94%{transform:rotate(3deg)}96%{transform:rotate(0)}}

/* ══ the credits panel ══
   Centred in the space above the dock with margin-block:auto rather than a
   transform: the panel carries a rise animation that animates transform, so an
   inline centring transform gets overwritten by it part way through the
   entrance and the panel lands half off the frame. */
.credits{position:absolute;right:3.4%;top:clamp(80px,10vh,116px);
  bottom:calc(var(--safe-b) + 54px);width:min(812px,46vw);z-index:3;
  height:fit-content;max-height:100%;margin-block:auto;
  display:flex;flex-direction:column;padding:26px 30px 24px;border-radius:16px;
  border:1px solid var(--acf);
  background:
    linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.014) 42%,rgba(255,255,255,.03)),
    radial-gradient(130% 78% at 50% 0%,var(--acs),transparent 62%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.4),
    0 40px 110px rgba(0,0,0,.62)}
.chead{display:flex;align-items:center;gap:18px;font-family:var(--fd);font-weight:800;
  font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#E4E4EA}
.chead .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.22),transparent)}
.chead .ep{color:var(--muted);letter-spacing:.18em}
.chead .ep b{color:var(--yellow);font-weight:800}

/* ---- category indicator: icon over name, centred.
   Sized to be read from across a room — this is the one line that tells a
   viewer where they are in the roll. It takes the category's colour. ---- */
.cat{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.cat .ci{width:64px;height:64px;display:grid;place-items:center;border-radius:12px;
  border:1px solid var(--acm);background:var(--panel);
  box-shadow:0 0 26px var(--acs),inset 0 1px 0 rgba(255,255,255,.09)}
.cat .ci svg{width:33px;height:33px;fill:none;stroke:var(--ac);stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.cat .cn{font-family:var(--fd);font-weight:800;font-size:30px;letter-spacing:.18em;
  text-transform:uppercase;color:#EDEDF2;text-align:center}
.cat .cn small{display:block;font-family:var(--fm);font-weight:600;font-size:11px;
  letter-spacing:.24em;color:var(--ac);margin-top:6px}

/* ---- the single bar: how much of the current card is left.
   It FILLS. Empty means the card has just taken the stage, full means it is
   about to hand over — which is the direction that reads as progress rather
   than urgency on a credits roll, where the viewer is waiting, not waiting
   for you to hurry. */
.bar{margin-top:14px;height:7px;border-radius:999px;overflow:hidden;flex:none;
  background:rgba(255,255,255,.07);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;width:100%;border-radius:999px;
  transform:scaleX(0);transform-origin:left center;will-change:transform;
  background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 55%,#000),
    var(--ac) 66%,color-mix(in srgb,var(--ac) 40%,#fff));
  box-shadow:0 0 16px var(--acm)}

/* ---- the stage: carousel, then grid ---- */
/* ---- the roll ----
   One track per department, holding only the people in it. The carousel is
   rebuilt when the department changes, so a team of four shows four cards and a
   team of eight shows eight -- not twenty-four mixed together with the
   department name in a header pretending otherwise. */
/* ---- the roll ----
   One track per department, holding only the people in it.

   The items are duplicated, which is the whole trick: a set of n becomes a
   track of 2n, so the roll always has cards on both sides of the one on stage
   and never shows an end. When the cursor runs past the halfway mark it steps
   back by exactly n slots — which is invisible, because slot n is a picture of
   the same person as slot 0 and the landing is the correct next beat anyway. */
/* ---- the roll ----
   One track per department, holding only the people in it. The items are
   duplicated, so a set of n becomes a track of 2n and the run never shows an
   end: when the cursor passes halfway it steps back by exactly n slots, which
   is invisible because slot n is a picture of the same person as slot 0. */
.box{position:relative;margin-top:18px;flex:none;height:clamp(300px,38vh,430px);
  display:flex;align-items:center;gap:0;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  overscroll-behavior-x:contain;scrollbar-width:none;
  pointer-events:none}
.box::-webkit-scrollbar{display:none}
.box::before,.box::after{content:'';flex:0 0 var(--pad,0px)}

/* ---- the card ----
   An instrument readout, not a promo tile. The photograph or the initials disc
   is the signal, the name is the label attached to it, and the role is
   measurement. Nothing is decorated.

   Elevation is declared once: a hairline. The previous card carried a gradient
   border AND a wide soft shadow, which is the ghost card -- the border vanishes
   under the shadow and the panel stops reading as a surface at all. The card on
   stage is marked by the brand signal rather than by more elevation, because a
   zero-offset coloured halo is decoration and this system has one signal
   colour and spends it once. */
.card{flex:0 0 var(--cw,250px);scroll-snap-align:center;scroll-snap-stop:always;
  height:var(--ch,300px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:26px 22px 22px;text-align:center;
  background:var(--panel);
  border:1px solid var(--hairline);
  border-radius:var(--panel-r,16px);
  transform-origin:center center;z-index:1;
  transition:scale .62s var(--eo),border-color .5s ease,
             background-color .5s ease}
.card:not(.is-active){scale:.9;opacity:.62}
.card.is-active{scale:var(--scale,1.1);z-index:3;
  border-color:color-mix(in srgb,var(--ac) 46%,transparent);
  background:var(--panel-2,#1A1A1E);
  /* one offset, one blur. A shadow without them is a costume. */
  box-shadow:0 18px 38px -12px rgba(0,0,0,.7)}

/* The name is the loudest thing on the card and nothing competes with it.
   Tracking stops at -0.02em: tighter reads cramped at this weight on a
   compressed stream. */
.card .nm{font-family:var(--fd);font-weight:800;font-size:clamp(17px,1.4vw,22px);
  letter-spacing:-.02em;line-height:1.14;color:var(--fg);
  overflow-wrap:anywhere;hyphens:auto;max-width:100%;min-height:2.3em;
  transition:color .5s var(--eo)}
/* The role is measurement, so it is set as data and not as a caption. It wraps,
   with two lines reserved: at 11px the widest role in the roster,
   LIVESTREAM DEVELOPER, clipped to an ellipsis on air. */
.card .rl{font-family:var(--fm);font-weight:600;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);white-space:normal;
  overflow-wrap:break-word;line-height:1.5;min-height:3em;max-width:100%;
  transition:color .5s var(--eo)}
.card.is-active .nm{color:#fff}
/* Active and inactive are told apart by weight of the label, not by hue, so
   the one signal colour on this scene stays where it belongs. */
.card:not(.is-active) .nm{color:var(--fg-2,#C9C9D1)}

/* ---- the portrait slot ----
   The signal. Circular, because the mark is a circle and a portrait in a circle
   is a broadcast convention rather than a style choice. */
.av{position:relative;width:min(58%,150px);height:auto;aspect-ratio:1;border-radius:50%;
  container-type:inline-size;overflow:hidden;
  display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,var(--c1) 0%,var(--c2) 54%,var(--c3) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14),
    inset 0 -6px 14px rgba(0,0,0,.45)}
.av svg{width:58%;height:58%;filter:drop-shadow(0 3px 7px rgba(0,0,0,.6))}
.av img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
/* a wordmark is wider than a portrait, so it is contained rather than cropped */
.av img.fit{object-fit:contain;padding:10%}
.av .ini{font-family:var(--fd);font-weight:800;font-size:38cqw;line-height:1;
  letter-spacing:-.02em;color:rgba(250,250,250,.82);
  text-shadow:0 2px 10px rgba(0,0,0,.5)}

.sig{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 14px);z-index:5;text-align:center;
  font-family:var(--fm);font-weight:600;font-size:11px;letter-spacing:.46em;
  color:rgba(250,250,250,.62);animation:riseIn .9s var(--eo) .7s both}
.sig b{font-weight:600;color:rgba(255,193,7,.62)}

@keyframes spinCW{to{transform:rotate(360deg)}}
@keyframes spinCCW{to{transform:rotate(-360deg)}}
@keyframes faceBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

@media (max-width:1400px){
  /* Below this width the panel on the right and the sign-off on the left start
     fighting for the same pixels: side by side, the headline block ended at 729
     while the panel began at 635. Stacking the column hands the headline the
     full width instead of the leftover, and the collision goes away. */
  .bwrap{left:4.4%;flex-direction:column;align-items:flex-start;
    gap:26px;max-width:min(560px,44vw)}
  .orbitB{width:clamp(190px,25vh,250px)}
  .credits{width:min(660px,47vw);padding:20px 22px 20px}
  .cat .ci{width:54px;height:54px;border-radius:10px}
  .cat .ci svg{width:28px;height:28px}
  .cat .cn{font-size:24px}
  .box .card{padding:22px 26px 20px}
  h1{font-size:clamp(44px,4.6vw,84px)}
  .chip{font-size:12.5px;padding:8px 18px}
}
@media (max-width:980px){
  .credits{right:auto;left:5%;top:auto;bottom:calc(var(--safe-b) + 20px);
    margin-block:0;width:90vw;height:36vh}
  .bwrap{bottom:46vh}
  h1{font-size:clamp(40px,7vh,64px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition:none !important;animation-delay:0s !important}
  .orbitB::before,.orbitB::after,.orbitB .face,.follow::after,.bellrow svg{animation:none !important}
  h1 .w{opacity:1;transform:none}
  .rise{opacity:1;transform:none}
  .card{transition:none !important;opacity:1 !important}
}
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <div class="aura"></div>

  <div class="bwrap">
    <div class="orbitB rise" style="--rd:.3s">
      <span class="glow" aria-hidden="true"></span>
      <div class="face" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="12" fill="#ffd100"/><path d="M4.16 12.91a7.9 7.9 0 0015.68 0" fill="none" stroke="#0a0900" stroke-width="1.32" stroke-linecap="round"/><circle cx="7" cy="8" r="1.5" fill="#0a0900"/><circle cx="17" cy="8" r="1.5" fill="#0a0900"/></svg>
      </div>
    </div>

    <div class="btxt">
      <h1>
        <span class="w w1"><span class="g">That's all</span></span>
        <span class="w w2"><span class="y">folks.</span></span>
      </h1>

      <div class="rise" style="--rd:.55s">
        <span class="chip solid follow">follow so you don't miss the next one</span>
      </div>

      <div class="nextrow rise" style="--rd:.6s">
        <div class="nc">
          <span class="nk">next session</span>
          <span class="nw" id="nw">tba</span>
          <span class="nh" id="nh" hidden></span>
        </div>
      </div>

      <div class="bellrow rise" style="--rd:.62s">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg>
        <span><b>Notifications on</b>&nbsp;— never miss a session</span>
      </div>
    </div>
  </div>

  <div class="credits rise" style="--rd:.5s">
    <div class="chead"><span>Credits</span><i class="rule"></i><span class="ep">ep <b class="num" data-ep>128</b></span></div>

    <div class="cat" id="cat">
      <span class="ci" id="catIcon"></span>
      <span class="cn"><span id="catName">Host</span><small id="catCount"></small></span>
    </div>

    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

    <div class="box car" id="box"></div>
  </div>

  <p class="sig">smile<b>.co.ke</b></p>
</div>

<script>
/* ============================================================
   THE ROLL.

   Data is categories, not a flat list. Each category owns an icon and a list of
   people, and the machine walks: category -> each person's card -> the category
   as a grid -> next category. That is why the grid earns its place rather than
   decorating: it is the "and everyone else in this department" beat between
   two categories.

   Placeholder names are written the way real credits are written — the desk,
   the crew, the cameras — so the board is legible before anybody is replaced.
   ============================================================ */
(function(){
  function get(k){return (location.search.match(new RegExp('[?&]'+k+'=([^&]*)'))||[])[1]}
  function dec(v){try{return decodeURIComponent(String(v).replace(/\+/g,' '))}catch(e){return v}}
  function trim(v){return dec(v||'').trim()}

  var ICON={

  /* The avatar palette. Low-chroma, cool-to-earthy: no pinks, no pastels,
     nothing that reads a gender, with the mid-tones kept masculine without
     collapsing into monochrome. Each person gets a TRIPLE rather than a single
     colour, so the number of combinations is effectively unlimited — swap any
     triple for any other. The set is curated rather than truly random, because
     a board where two cards land on near-identical greys looks accidental and
     an end card is the one place that must not look accidental. */
  /* Per-person disc gradient.
     A disc used to be a hand-picked hex triple, which meant a lot of people
     shared almost the same dark blue-grey and nobody's was bright. These are
     hue-matched two-stop ramps in OKLCH instead -- the pairing a preset uses:
     one hue, carried through a ramp from light and chromatic to dark and
     quieter. Nothing here is a hue-to-hue gradient, which is what makes those
     read as cheap.

     The hue is derived from the name, so it is stable for a given person, and
     the yellow band is deliberately skipped: yellow is the one signal colour on
     this scene and an initials disc sitting in that band would read as live. */
  var HUE_RESERVED=34;          /* degrees either side of the brand yellow */
  function hueFor(name){
    var h=0,i; name=String(name||'');
    for(i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
    var deg=h%360;
    if(deg>92-HUE_RESERVED && deg<92+HUE_RESERVED)
      deg=92+HUE_RESERVED+(deg-(92-HUE_RESERVED))%(360-2*HUE_RESERVED);
    return deg;
  }
  function C(name){
    var h=hueFor(name);
    /* L drops and C falls across the ramp: the top of the disc catches the
       light, the bottom settles into the panel */
    return { c1:'oklch(78% .155 '+h+')',
             c2:'oklch(58% .175 '+h+')',
             c3:'oklch(38% .120 '+h+')' };
  }

   Only genuine uploaded photographs live here. Eight other people on the World21
   team page are illustrated with stock Unsplash faces — putting a stranger's
   photograph next to a colleague's name on air is not a thing to do quietly, so
   those get an initials disc instead. If a real photo is uploaded for them
   later it drops straight in here with no other change.

   Mutinda carries the Pristan Press mark rather than a portrait: that provider
   page has no photograph of him at all, only a logo. */

  var w=String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!w.length) return '?';
  return (w[0][0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase();
}

/* == THE ROSTER ===============================================================
   One line per person. This is the only block you need to edit.

     n     their name
     dept  the department they belong to. It sets their card's colour, the
           header above the roll, and where they sort. Type a new department
           name anywhere in this list and it becomes a real department.
     role  what they do on the show. Shown under the name.
     as    other departments to credit them in. Optional. Somebody who really
           fronts the show and also writes the script gets named in both.
     face  a key from AVATAR above. Leave it off and they get an initials disc.
     fit   1 for a wordmark or logo, which must be contained rather than
           cropped -- cover would slice the ends off the name.

   Order is the roll. Departments come out in the order they are first
   mentioned, so moving a line moves the show and nobody has to renumber. */

var ROSTER=[
  {n:'Ted Rosela',               dept:'On air',    role:'Host - Platform Q&A',   face:'tedrosela'},
  {n:'Richard Nzyoki Mutinda',   dept:'On air',    role:'Invigilator - Co-host', face:'mutinda', fit:1},
  {n:'Josephine Wanjina',        dept:'On air',    role:'Co-host'},
  {n:'Alicia Gitau',             dept:'On air',    role:'Co-host'},
  {n:'Alfred Wangai Mundia',     dept:'Production',role:'Founding producer',     face:'alfred'},
  {n:'Gideon Githae',            dept:'Production',role:'Executive producer'},
  {n:'Mildred Ichingwa',         dept:'Production',role:'Producer, content'},
  {n:'Sharon Paul',              dept:'Script',    role:'Script editor'},
  {n:'Collins Omoto',            dept:'Script',    role:'Copy'},
  {n:'Damaris Muchoki',          dept:'Standards', role:'Fact checker'},
  {n:'Ryan Kim',                 dept:'Standards', role:'Livestream developer'},
  {n:'Trizah Trisha',            dept:'Graphics',  role:'Graphics',              face:'trizah'},
  {n:'Edwin Muthui muriuki',     dept:'Graphics',  role:'Motion',                face:'edwin'},
  {n:'Caroline wangare karimi', dept:'Graphics',  role:'Brand',                 face:'caroline'},
  {n:'Catherine wambui maina',   dept:'On air',    role:'Presenter'},
  {n:'Lilian Gacheru',           dept:'On air',    role:'Reader'},
  {n:'Victor E. W. Njanjo',      dept:'On air',    role:'Correspondent'},
  {n:'Hotwire',                  dept:'On air',    role:'Desk'},
  {n:'James Njunju',             dept:'Field',     role:'Camera'},
  {n:'Dickson M Njunjuri',       dept:'Field',     role:'Sound'},
  {n:'Vincent',                  dept:'Field',     role:'Producer, field'},
  {n:'John Manyange',            dept:'Music',     role:'Music'},
  {n:'everyone',                 dept:'Closing',   role:'Everyone'},
  {n:'tba',                      dept:'Closing',   role:'Next session'}
];

/* Departments. Added or renamed a name above? Add it here too for an icon and
   a colour; anything missing still works and picks a stable colour derived from
   its own name, it just arrives without an icon. */
var DEPTS=[
  {n:'On air',     i:'mic',   c:'#FFC107'},
  {n:'Production', i:'clap',  c:'#2BB2F5'},
  {n:'Graphics',   i:'spark', c:'#A78BFA'},
  {n:'Script',     i:'pen',   c:'#F97362'},
  {n:'Standards',  i:'check', c:'#34D399'},
  {n:'Field',      i:'map',   c:'#FBBF24'},
  {n:'Music',      i:'wave',  c:'#22D3EE'},
  {n:'Partners',   i:'hand',  c:'#94A3B8'},
  {n:'Closing',    i:'star',  c:'#9CA3AF'}
];

/* Build the categories the rest of the scene already understands, from the two
   lists above. Departments come out in the order they are first mentioned in
   ROSTER, so a new department lands where you put it. */
var CATS=(function(){
  var order=[], byName={};
  DEPTS.forEach(function(d){ order.push(d.n); byName[d.n]={n:d.n,i:d.i,c:d.c,p:[]} });
  function fallback(n){
    var h=0,i; for(i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0;
    return 'hsl('+(h%360)+' 62% 58%)';
  }
  function seat(r){
    /* The ramp is keyed off the name, not a hand-picked triple: every person in
       the roll gets their own hue and keeps it across reloads. */
    var s={r:r.role,v:r.n,k:C(r.n)};
    if(r.face) s.face=r.face;
    if(r.fit)  s.fit=1;
    return s;
  }
  ROSTER.forEach(function(r){
    if(!byName[r.dept]){ order.push(r.dept); byName[r.dept]={n:r.dept,i:'dot',c:fallback(r.dept),p:[]}; }
    byName[r.dept].p.push(seat(r));
    if(r.as){
      r.as.forEach(function(a){
        if(!byName[a]){ order.push(a); byName[a]={n:a,i:'dot',c:fallback(a),p:[]}; }
        byName[a].p.push(seat(r));
      });
    }
  });
  var first=[];
  ROSTER.forEach(function(r){ if(first.indexOf(r.dept)<0) first.push(r.dept) });
  order=order.filter(function(n){ return byName[n].p.length });
  first.forEach(function(n){ if(order.indexOf(n)<0) order.push(n) });
  return order.map(function(n){ return byName[n] });
})();;

  /* ---- overrides ---- */
  var eps=trim(get('ep'));
  if(eps)document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps});

  var host=trim(get('host'));
  if(host){
    var hs=CATS[0].p[0];
    hs.v=host; hs.r='Host'; hs.k=C(host);   /* re-key the ramp to the new name */
  }

  var nx=trim(get('next'));
  if(nx){
    document.documentElement.dataset.next='1';
    document.getElementById('nw').textContent=nx;
    var lp=CATS[CATS.length-1].p[0];
    if(lp.v==='tba') lp.v=nx;
    var what=trim(get('what'));
    if(host||what){
      var nh=document.getElementById('nh');
      nh.hidden=false;nh.textContent='';
      if(host){nh.appendChild(document.createTextNode('Hosted by '));var b=document.createElement('b');b.textContent=host;nh.appendChild(b);}
      if(what){if(host){var sp=document.createElement('span');sp.className='sep';sp.textContent='·';nh.appendChild(sp);}var b2=document.createElement('b');b2.textContent=what;nh.appendChild(b2);}
    }
  }

  var box=document.getElementById('box');
  var barFill=document.getElementById('barFill');
  var catIcon=document.getElementById('catIcon');
  var catName=document.getElementById('catName');
  var catCount=document.getElementById('catCount');

  function fill(c,p){
    c.querySelector('.rl').textContent=p.r;
    c.querySelector('.nm').textContent=p.v;
    c.style.setProperty('--c1',p.k.c1);
    c.style.setProperty('--c2',p.k.c2);
    c.style.setProperty('--c3',p.k.c3);
    var av=c.querySelector('.av');
    av.innerHTML=(p.face&&AVATAR[p.face])
      ? '<img class="'+(p.fit?'fit':'')+'" src="'+AVATAR[p.face]+'" alt="">'
      : '<span class="ini">'+initials(p.v)+'</span>';
  }
  function makeCard(p){
    var d=document.createElement('div');
    d.className='card';
    d.innerHTML='<span class="av">'+MARK+'</span><span class="rl"></span><span class="nm"></span>';
    fill(d,p);
    return d;
  }

  var CARD=parseFloat(get('cardms'))||3500;
  var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  var ci=0, slot=0, lastCi=-1, stepStart=0, cards=[], lastKey='', booted=false;

  function hexa(h,a){
    /* A department nobody declared falls back to an hsl() string, and
       parseInt('sl(...',16) is NaN -- which silently returned rgba(0,0,0) and
       turned the border and the bar black instead of throwing anything. */
    if(h.charAt(0)!=='#')
      return 'color-mix(in srgb,'+h+' '+Math.round(a*100)+'%,transparent)';
    var n=parseInt(h.slice(1),16);
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }
  /* the panel takes the colour of whatever category is on stage */
  function setAccent(){
    /* One signal colour, spent once. The department used to tint the panel, the
       icon, the ring and every card with its own hue -- which is the seat
       palette used as decoration, and also the purple-to-blue accent this
       system's anti-reference names by name. The department is now identified by
       its name and its count, and yellow is left alone for the progress bar,
       which is the only genuinely live thing on this scene. */
    var r=document.documentElement.style;
    r.setProperty('--ac','#FFC107');
    r.setProperty('--acs','rgba(255,193,7,.15)');
    r.setProperty('--acm','rgba(255,193,7,.32)');
    r.setProperty('--acf','rgba(255,193,7,.22)');
  }

  /* Enough nodes for the biggest set, reused forever. Cards are never destroyed
     between categories, so there is nothing to flicker. */
  function pool(items){
    items.forEach(function(it,i){
      if(!cards[i]) cards[i]=makeCard(it.p);
      else fill(cards[i],it.p);
      /* Re-attach unconditionally. A one person category parks the spare nodes
         with .remove(), which detaches them but keeps the reference — so the
         next, larger category would fill those nodes and never put them back. */
      if(!cards[i].parentNode) box.appendChild(cards[i]);
    });
    for(var j=items.length;j<cards.length;j++){ if(cards[j].parentNode) cards[j].remove() }
  }

  /* Height leads and the width follows from it. --ch is divided by the scale
     because the card on stage is scaled up: a box that fits at rest still
     overflows once it grows, and overflow-y is hidden on a scroller, so the top
     and bottom of the one card that matters most were being cropped. */
  function size(){
    var bw=box.clientWidth, bh=box.clientHeight;
    if(!bw||!bh) return;
    var SC=1.10;
    var ch=Math.max(180,(bh-12)/SC);
    var w=Math.min(ch/1.62,250);
    box.style.setProperty('--scale',SC);
    box.style.setProperty('--cw',w.toFixed(1)+'px');
    box.style.setProperty('--ch',ch.toFixed(1)+'px');
    box.style.setProperty('--pad',((bw-w)/2+w*0.03).toFixed(1)+'px');
    box.style.setProperty('--ow',(w*0.03).toFixed(1)+'px');
  }

  /* One carousel per department, rebuilt when the department changes: a team of
     four gets four cards and a team of eight gets eight. Centring is computed
     rather than left to scrollIntoView, which would also try to scroll any
     scrollable ancestor including the document. */
  function setCar(behavior){
    var people=CATS[ci].p, n=people.length, i;
    /* the set, twice over -- seven portraits as fourteen in the original */
    var doubled=[];
    for(i=0;i<2;i++) for(var j=0;j<n;j++) doubled.push(people[j]);
    pool(doubled.map(function(p){return {p:p}}));
    cards.forEach(function(c,i){
      c.classList.toggle('is-active',i===slot);
      c.dataset.index=String(i);
    });
    var t=cards[slot];
    if(!t) return;
    box.scrollTo({left:t.offsetLeft-(box.clientWidth-t.offsetWidth)/2,
                  behavior:behavior||'smooth'});
  }

  function enter(jumped){
    var key=ci+':'+slot;
    if(key===lastKey&&!jumped) return;
    var changed=(lastCi!==ci);
    lastKey=key; lastCi=ci;
    var cat=CATS[ci];

    setAccent();
    catIcon.innerHTML='<svg viewBox="0 0 24 24">'+(ICON[cat.i]||ICON.dot)+'</svg>';
    catName.textContent=cat.n;
    catCount.textContent=cat.p.length>1?cat.p.length+' in '+cat.n.toLowerCase():'';

    size();
    box.dataset.category=cat.n;
    /* A new department arrives without travelling -- the track has just been
       rebuilt, so sliding into it would scroll across cards that are no longer
       there. Steps within a department travel. */
    setCar((changed||jumped)?'auto':(booted?'smooth':'auto'));
    booted=true;
    stepStart=performance.now();
  }

  /* Walk the department, then move to the next one. There is no board phase:
     the carousel is the department, and when it runs out the roll moves on. */
  function advance(){
    var cat=CATS[ci], n=cat.p.length;
    slot++;
    /* One pass over the doubled track is one full turn of this department: it
       reaches every person twice, which is what the duplication is for, and only
       then does the roll move to the next department. Advancing the department
       mid-pass is what used to leave the roll stuck showing one team forever --
       slot walks the track, ci walks the departments. */
    if(slot>=2*n){ ci=(ci+1)%CATS.length; slot=0; enter(true); return }
    enter(false);
  }
  if(reduced){
    /* A poster, not a stopped clock. Rolling to the last department left three
       cards visible and twenty-one people never credited at all. */
    ci=CATS.length-1; enter();
    barFill.style.transform='scaleX(1)';
    box.style.display='grid'; box.style.gridAutoFlow='row';
    box.style.gridTemplateColumns='repeat(auto-fit,minmax(0,1fr))';
    box.style.gridAutoRows='var(--ch)'; box.style.height='auto';
    box.style.overflow='visible'; box.style.scrollSnapType='none';
    box.style.setProperty('--pad','0px'); box.style.setProperty('--ow','0px');
    box.scrollLeft=0;
  }else{
    enter();
    addEventListener('resize',function(){ size(); setCar('auto') });
    setInterval(function(){
      if(document.hidden) return;
      var now=performance.now(), el=now-stepStart;
      if(el>=CARD){ advance(); el=0 }
            /* fills: empty means the card has just taken the stage, full means handover */
      barFill.style.transform='scaleX('+Math.min(1,el/CARD).toFixed(4)+')';
    },70);
  }
})();
</script>

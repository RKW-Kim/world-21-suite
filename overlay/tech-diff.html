<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Kit fonts, bundled locally. See fonts/fonts.css for why this is
     not a fonts.googleapis.com link: OBS loads these from file:// on machines
     with unreliable internet, and a stalled webfont request does not fail, it
     hangs, leaving the headline in a fallback face for ~20s. -->
<link rel="stylesheet" href="fonts/fonts.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · technical difficulties</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<style>
/* ── TECHNICAL DIFFICULTIES — restored: the radar take (lab R3, 63197D0) ──
   "diagnostic orbit": the smile hub holds center while a radar sweep loops
   around it looking for the fault; MIC / CAM / SIGNAL satellites ride the
   dashed ring and check off "— OK" one by one, then the cycle resets. A
   typewriter status line mutters under the orbit. The spine (bg, sparks,
   dot field) ships inline; watermark + ticker stay outside the page
   as their own OBS modules (bottom 96px + corners stay clear). ────────── */
:root{
  --yellow:#FFC107; --yellow-hot:#F5A623; --ink:#0a0a0a;
  --line:#2a2a2a; --muted:#8c8c8c; --paper:#ffffff;
  --up:#0ECB81; --down:#F6465D; --sky:#3FB6FF;
  --font-display:'Manrope',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--font-body);
  overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
svg{display:block}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden}
.bg{position:absolute;inset:0;z-index:-2;background:
  radial-gradient(1100px 640px at 74% 18%,rgba(255,193,7,.05),transparent 62%),
  radial-gradient(900px 560px at 12% 88%,rgba(14,203,129,.04),transparent 60%),
  radial-gradient(circle at 50% 38%,#171717 0%,var(--ink) 78%)}
.bg::after{content:"";position:absolute;inset:0;background-image:
  radial-gradient(circle,rgba(255,255,255,.09) 1.1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 100%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 100%)}
  -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 78%);
          mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 78%)}

.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:999px;
  font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap}
.chip.dark{background:rgba(20,20,20,.86);border:1px solid var(--line);color:var(--paper);
  box-shadow:0 6px 24px rgba(0,0,0,.35)}
.chip.ghost{background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.55);color:var(--yellow)}
.chip.solid{background:linear-gradient(135deg,var(--yellow),var(--yellow-hot));color:var(--ink);
  box-shadow:0 8px 28px rgba(255,193,7,.28)}

.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 14px rgba(255,193,7,.9),0 0 4px rgba(255,193,7,1);opacity:0;
  animation:floatSpark 6s infinite ease-in-out var(--d,0s)}
@keyframes floatSpark{0%,100%{transform:translate(0,0) scale(1);opacity:0}
  12%{opacity:.85}50%{transform:translate(18px,-36px) scale(1.45);opacity:.55}88%{opacity:.7}}

to{opacity:.62;transform:scaleY(1)}}
50%{transform:scaleY(1.045)}}

.rise{opacity:0;animation:riseIn .9s var(--ease-out) forwards;animation-delay:var(--rd,0s)}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}

.scn{position:absolute;inset:0;z-index:2;overflow:hidden}
[hidden]{display:none!important}
.y{color:var(--yellow)}
@keyframes ringSpin{to{transform:rotate(360deg)}}

.topbar{position:absolute;top:56px;left:120px;right:120px;display:flex;
  justify-content:flex-end;align-items:center;z-index:6} /* top-left stays clear: watermark module docks here */
.evt{font-variant-numeric:tabular-nums;color:var(--yellow)}

.lcol{position:absolute;left:120px;top:168px;z-index:5;max-width:620px}
.lcol h1{font-family:var(--font-display);font-weight:700;font-size:64px;line-height:1.04;
  letter-spacing:-.03em;margin-top:22px}
.lcol .chips{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}

.orbitWrap{position:absolute;left:calc(55% - 280px);top:calc(48% - 280px);width:560px;height:560px;z-index:4}
.orbitStage{position:absolute;inset:0}
.ring{position:absolute;inset:70px;border:2px dashed rgba(255,193,7,.42);border-radius:50%;
  animation:ringSpin 30s linear infinite}
.ring2{position:absolute;inset:112px;border:1px solid rgba(255,193,7,.14);border-radius:50%}
/* the radar sweep — loops around the smile looking for the fault */
.sweep{position:absolute;inset:71px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,193,7,.15),transparent 85deg);
  animation:ringSpin 7s linear infinite;z-index:1;will-change:transform}
.fA{position:absolute;left:50%;top:50%;width:280px;height:280px;z-index:2;
  transform:translate(-50%,-50%);animation:facePulse 4.6s ease-in-out infinite;
  filter:drop-shadow(0 18px 60px rgba(255,193,7,.22))}
@keyframes facePulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.035)}}
.fA svg{width:100%;height:100%}
.spinner{position:absolute;inset:0;z-index:3;animation:ringSpin 18s linear infinite;will-change:transform}
.satPos{position:absolute;left:50%;top:50%;transform:rotate(var(--a)) translateX(210px)}
.satSpin{position:absolute;left:0;top:0;width:0;height:0;animation:satBack 18s linear infinite}
@keyframes satBack{to{transform:rotate(-360deg)}}
.satFix{position:absolute;left:0;top:0;transform:translate(-50%,-50%) rotate(calc(var(--a) * -1))}
.dchip{display:inline-flex;align-items:center;gap:10px;padding:11px 22px;border-radius:999px;
  background:rgba(18,18,18,.92);border:1.5px solid var(--line);font-family:var(--font-display);
  font-weight:700;font-size:15px;letter-spacing:.12em;color:#e3e3e3;white-space:nowrap;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  transition:border-color .35s,color .35s,box-shadow .35s}
.dchip em{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:.18em;transition:color .35s}
.dchip .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);background:transparent;
  transition:background .35s,border-color .35s,box-shadow .35s}
.dchip.ok{border-color:var(--yellow);color:var(--yellow);
  box-shadow:0 0 0 1px rgba(255,193,7,.28),0 8px 30px rgba(255,193,7,.18)}
.dchip.ok em{color:rgba(255,193,7,.75)}
.dchip.ok .dot{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 12px rgba(255,193,7,.95)}

.status{position:absolute;left:calc(55% - 230px);top:calc(48% + 298px);width:460px;text-align:center;
  z-index:5;font-size:19px;font-weight:500;color:#c9c9c9;min-height:26px}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--yellow);margin-left:4px;
  vertical-align:-2px;animation:caretB 1s steps(1) infinite}
@keyframes caretB{50%{opacity:0}}


</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>

  <section class="scn">
    <span class="spark" style="left:38%;top:15%;--d:0s"></span>
    <span class="spark" style="left:73%;top:12%;--d:1.3s;background:var(--up)"></span>
    <span class="spark" style="left:91%;top:36%;--d:.7s;background:var(--down)"></span>
    <span class="spark" style="left:87%;top:72%;--d:2.1s"></span>
    <span class="spark" style="left:31%;top:79%;--d:2.9s;background:var(--sky)"></span>

    <header class="topbar">
      <span class="chip dark rise" style="--rd:.55s">DOWN FOR&nbsp;<span class="evt" data-elapsed>00:00</span></span>
    </header>

    <div class="lcol">
      <span class="chip solid rise" style="--rd:.1s">● SIGNAL TROUBLE</span>
      <h1 class="rise" style="--rd:.2s">minor technical<br><span class="y">difficulties.</span></h1>
      <div class="chips rise" style="--rd:.34s">
        <span class="chip ghost">EPISODE <span data-ep>128</span> CONTINUES</span>
      </div>
      <div class="chips rise" style="--rd:.46s">
        <span class="chip ghost">@smileke</span><span class="chip ghost">smile.co.ke</span><span class="chip ghost">#SmileSquad</span>
      </div>
      <div class="chips rise" style="--rd:.56s" data-when-live hidden><span class="chip solid">● WE'RE BACK — ROLLING</span></div>
    </div>

    <div class="orbitWrap rise" style="--rd:.28s">
      <div class="orbitStage">
        <div class="ring"></div>
        <div class="ring2"></div>
        <div class="sweep"></div>
        <div class="fA" aria-hidden="true">
          <!-- smile face — verbatim crop of the real logo (same 4 paths, tight viewBox) -->
          <svg viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg">
            <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>
            <path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#0A0900"/>
            <path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#0A0900"/>
            <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0A0900"/>
          </svg>
        </div>
        <div class="spinner">
          <div class="satPos" style="--a:0deg"><div class="satSpin"><div class="satFix"><div class="dchip" data-base="MIC"><i class="dot"></i><em>01</em><span class="dlab">MIC</span></div></div></div></div>
          <div class="satPos" style="--a:120deg"><div class="satSpin"><div class="satFix"><div class="dchip" data-base="CAM"><i class="dot"></i><em>02</em><span class="dlab">CAM</span></div></div></div></div>
          <div class="satPos" style="--a:240deg"><div class="satSpin"><div class="satFix"><div class="dchip" data-base="SIGNAL"><i class="dot"></i><em>03</em><span class="dlab">SIGNAL</span></div></div></div></div>
        </div>
      </div>
    </div>

    <div class="status rise" style="--rd:.6s"><span id="typeTxt"></span><span class="caret"></span></div>
  </section>
</div>

<script>
/* two tiny loops, both document.hidden-gated — that's the whole script.
   radar + satellites are pure CSS on the compositor. */
(function(){
  function P2(n){return String(n).padStart(2,'0')}


  /* elapsed up-counter (mm:ss) — starts at 0 or ?elapsed= seconds */
  var qs=new URLSearchParams(location.search);
  var eps=qs.get('ep');if(eps){document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});}
  var e0=parseInt(qs.get('elapsed')||'0',10)||0;
  var t0=Date.now()-e0*1000;
  var els=document.querySelectorAll('[data-elapsed]');
  setInterval(function(){
    if(document.hidden||!els.length)return;
    var s=Math.max(0,Math.floor((Date.now()-t0)/1000));
    var txt=P2(Math.floor(s/60))+':'+P2(s%60);
    els.forEach(function(e){e.textContent=txt;});
  },1000);

  /* ?t= — flip to WE'RE BACK when the countdown expires */
  var tp=qs.get('t');
  if(tp){
    var target=/^\d+$/.test(tp)?Date.now()+parseInt(tp,10)*1000:new Date(tp).getTime();
    if(!isNaN(target)){
      setInterval(function(){
        if(document.hidden)return;
        if(Date.now()>=target){
          document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');});
        }
      },1000);
    }
  }

  /* diagnostic check loop: MIC → CAM → SIGNAL, hold, reset, loop */
  var chips=document.querySelectorAll('.dchip');
  var idx=0;
  function resetAll(){
    chips.forEach(function(ch){ch.classList.remove('ok');ch.querySelector('.dlab').textContent=ch.getAttribute('data-base');});
    idx=0;
    setTimeout(checkNext,700);
  }
  function checkNext(){
    if(document.hidden){setTimeout(checkNext,1200);return;} /* paused while hidden */
    if(idx>=chips.length){setTimeout(resetAll,3000);return;}
    var ch=chips[idx];
    ch.classList.add('ok');
    ch.querySelector('.dlab').textContent=ch.getAttribute('data-base')+' — OK';
    idx++;
    if(idx>=chips.length){setTimeout(resetAll,3000);}else{setTimeout(checkNext,2200);}
  }
  if(chips.length){setTimeout(checkNext,1800);}

  /* typewriter status line */
  var lines=['everything is fine — hold on…','fixing a wire…','still here — smile intact.'];
  var tt=document.getElementById('typeTxt');
  if(tt){
    (function type(li,ci,del){
      if(document.hidden){setTimeout(function(){type(li,ci,del)},1200);return;} /* paused while hidden */
      var L=lines[li];
      tt.textContent=L.slice(0,ci);
      if(!del){
        var nx=ci+1;
        if(nx>L.length){setTimeout(function(){type(li,L.length,true)},1500);return;}
        setTimeout(function(){type(li,nx,false)},36);
      }else{
        var dx=ci-1;
        if(dx<0){setTimeout(function(){type((li+1)%lines.length,0,false)},420);return;}
        setTimeout(function(){type(li,dx,true)},16);
      }
    })(0,0,false);
  }
})();
</script>
</body>
</html>

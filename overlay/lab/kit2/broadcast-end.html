<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMILE · end · broadcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;border-radius:0;margin:0;padding:0}
:root{--bg:#0A0E1A;--panel:#10182B;--line:#1E2A45;--red:#E4002B;--sky:#4DA3FF;--white:#FFFFFF;--grey:#454F63}
html,body{height:100%}
body{background:var(--bg);color:var(--white);font-family:'Archivo',system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
img{display:block}

/* ---------------- center-left WRAP block ---------------- */
.wrap-block{position:absolute;left:6vw;top:50%;transform:translateY(-52%);z-index:10}
.kick{display:flex;align-items:center;gap:14px;font-weight:800;font-size:clamp(20px,1.8vw,30px);letter-spacing:.14em;text-transform:uppercase;transform:skewX(-6deg)}
.kick .sq{width:14px;height:14px;background:var(--red);transform:skewX(-12deg);flex:none}
.big{font-family:'Archivo Black','Archivo',sans-serif;font-weight:400;font-size:clamp(140px,20vw,280px);line-height:.86;letter-spacing:-.02em;text-transform:uppercase;transform:skewX(-6deg);margin-top:clamp(12px,2.4vh,24px);white-space:nowrap}
.underbar{display:block;height:clamp(16px,2.2vh,24px);background:var(--red);transform:skewX(-12deg);margin-top:clamp(10px,2vh,18px)}

/* ---------------- right: rolling credits ---------------- */
.credits{position:absolute;right:7vw;top:50%;transform:translateY(-50%);width:clamp(250px,22vw,380px);height:min(54vh,500px);overflow:hidden;z-index:10;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 15%,#000 85%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 15%,#000 85%,transparent 100%)}
.cr-move{display:flex;flex-direction:column;width:100%;animation:roll 18s linear infinite}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.cr-set{display:flex;flex-direction:column;gap:38px;padding-bottom:38px}
.cr{display:flex;align-items:baseline;gap:12px}
.cr .role{font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.62);flex:none}
.cr .dash{font-weight:800;font-size:14px;color:rgba(255,255,255,.62)}
.cr .who{font-weight:800;font-size:clamp(20px,1.8vw,28px);line-height:1.15}

/* ---------------- FOLLOW bug (flashing) ---------------- */
.followbug{position:fixed;right:44px;bottom:calc(48px + 30px);z-index:55;background:var(--red);transform:skewX(-12deg);padding:12px 24px;pointer-events:none;animation:blink 1s steps(1,end) infinite}
.followbug .up{display:block;transform:skewX(12deg);font-weight:800;font-size:14px;letter-spacing:.12em}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}

/* ---------------- score bug (OFF AIR variant) ---------------- */
.bug{position:fixed;left:0;bottom:0;width:100%;height:48px;z-index:60;pointer-events:none}
.bug-skew{width:calc(100% + 120px);margin-left:-60px;height:100%;background:var(--panel);transform:skewX(-12deg);display:flex;align-items:stretch}
.bug-tab{width:10px;background:var(--grey);flex:none}
.seg{display:flex;align-items:center;padding:0 30px;border-right:1px solid var(--line)}
.seg .up{transform:skewX(12deg);display:flex;align-items:center;gap:10px;font-weight:700;font-size:12.5px;letter-spacing:.08em}
.seg-off{background:var(--grey)}
.seg-off .up{font-weight:800;letter-spacing:.14em}
.seg-num{font-weight:800;font-size:20px;color:var(--sky);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.seg-mark{margin-left:auto;border-right:0;border-left:1px solid var(--line);padding-right:44px}
.seg-mark img{width:28px;height:28px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>

<main>
  <section class="wrap-block">
    <p class="kick"><i class="sq" aria-hidden="true"></i><span>THAT'S A</span></p>
    <h1 class="big">WRAP</h1>
    <i class="underbar" aria-hidden="true"></i>
  </section>

  <aside class="credits" aria-label="credits">
    <div class="cr-move">
      <div class="cr-set">
        <div class="cr"><span class="role">host</span><span class="dash" aria-hidden="true">&mdash;</span><span class="who">smile</span></div>
        <div class="cr"><span class="role">production</span><span class="dash" aria-hidden="true">&mdash;</span><span class="who">smile crew</span></div>
        <div class="cr"><span class="role">music</span><span class="dash" aria-hidden="true">&mdash;</span><span class="who">licensed</span></div>
        <div class="cr"><span class="role">thanks</span><span class="dash" aria-hidden="true">&mdash;</span><span class="who">you</span></div>
      </div>
      <div class="cr-set" aria-hidden="true">
        <div class="cr"><span class="role">host</span><span class="dash">&mdash;</span><span class="who">smile</span></div>
        <div class="cr"><span class="role">production</span><span class="dash">&mdash;</span><span class="who">smile crew</span></div>
        <div class="cr"><span class="role">music</span><span class="dash">&mdash;</span><span class="who">licensed</span></div>
        <div class="cr"><span class="role">thanks</span><span class="dash">&mdash;</span><span class="who">you</span></div>
      </div>
    </div>
  </aside>
</main>

<p class="followbug"><span class="up">FOLLOW @SMILE</span></p>

<footer class="bug">
  <div class="bug-skew">
    <i class="bug-tab" aria-hidden="true"></i>
    <div class="seg seg-off"><span class="up"><span>OFF AIR</span></span></div>
    <div class="seg seg-ep"><span class="up"><span>EP</span><b class="seg-num" data-ep>128</b></span></div>
    <div class="seg seg-show"><span class="up"><span>PODCAST + SCREEN SHARE</span></span></div>
    <div class="seg seg-mark"><span class="up"><img src="../assets/smile-mark.svg" alt="SMILE mark" width="28" height="28"></span></div>
  </div>
</footer>

<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+600000, tp=q.get('t');
  if(tp){ if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;} else {var d=new Date(tp); if(!isNaN(d.getTime())) target=d.getTime();} }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  var el0=q.get('elapsed')?parseInt(q.get('elapsed'),10):0, t0=Date.now();
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){ e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x); });
    var el=el0+Math.floor((Date.now()-t0)/1000);
    document.querySelectorAll('[data-elapsed]').forEach(function(e){ e.textContent=P(Math.floor(el/60))+':'+P(el%60); });
    if(s<=0){
      document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');});
      document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');});
    }
  }
  tick(); setInterval(tick,250);
})();
</script>
</body>
</html>

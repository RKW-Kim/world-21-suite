<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMILE · brb · broadcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;border-radius:0;margin:0;padding:0}
:root{--bg:#0A0E1A;--panel:#10182B;--line:#1E2A45;--red:#E4002B;--sky:#4DA3FF;--white:#FFFFFF}
html,body{height:100%}
body{background:var(--bg);color:var(--white);font-family:'Archivo',system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
img{display:block}

/* ---------------- offset lower-third strap stack ---------------- */
.straps{position:absolute;top:13vh;left:0;width:100%;overflow:hidden;z-index:10}
.band-red{width:calc(100% + 80px);margin-left:-40px;height:clamp(84px,10.2vh,110px);background:var(--red);transform:skewX(-12deg);display:flex;align-items:center;padding:0 8vw}
.band-red h1{transform:skewX(6deg);font-family:'Archivo Black','Archivo',sans-serif;font-weight:400;font-size:clamp(46px,4.6vw,88px);line-height:1;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap}
.band-white{width:calc(100% + 80px);margin-left:-40px;height:clamp(66px,8.4vh,90px);background:var(--white);transform:translateX(60px) skewX(-12deg);display:flex;align-items:center;padding:0 8vw;margin-top:10px}
.band-white p{transform:skewX(6deg);font-weight:800;font-size:clamp(34px,3.4vw,64px);line-height:1;letter-spacing:.01em;color:var(--panel);text-transform:uppercase;white-space:nowrap}

/* ---------------- BACK IN scorebug-style box ---------------- */
.cd-zone{position:absolute;right:8vw;top:55%;z-index:10}
.cd-tag{display:inline-block;background:var(--red);transform:skewX(-12deg);padding:11px 22px}
.cd-tag .up{display:block;transform:skewX(12deg);font-weight:800;font-size:13px;letter-spacing:.12em}
.cd-body{display:inline-block;background:var(--panel);border-left:4px solid var(--red);transform:skewX(-12deg);margin-top:8px;padding:20px 36px}
.cd-digits{display:block;transform:skewX(12deg);font-family:'Archivo Black','Archivo',sans-serif;font-weight:400;font-size:clamp(56px,5.6vw,104px);line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
[data-cd-wrap][data-done="1"]{opacity:.35}
.live-strap{display:inline-block;background:var(--red);transform:skewX(-12deg);padding:12px 26px;margin-top:18px}
.live-strap .up{display:block;transform:skewX(12deg);font-weight:800;font-size:14px;letter-spacing:.12em}

/* ---------------- ON AIR elapsed chip (top-right) ---------------- */
.onair{position:fixed;top:28px;right:40px;z-index:60;background:var(--panel);border-right:3px solid var(--red);transform:skewX(-12deg);padding:11px 22px;pointer-events:none}
.onair .up{display:flex;align-items:center;gap:10px;transform:skewX(12deg);font-weight:700;font-size:12.5px;letter-spacing:.1em}
.onair b{font-weight:800;font-size:17px;color:var(--white);font-variant-numeric:tabular-nums}
.onair .dot{width:8px;height:8px;background:var(--red);animation:blink 1s steps(1,end) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}

/* ---------------- LIVE bug ---------------- */
.livebug{position:fixed;top:28px;left:28px;z-index:60;background:var(--red);transform:skewX(-12deg);padding:11px 20px;pointer-events:none}
.livebug .up{display:flex;align-items:center;gap:9px;transform:skewX(12deg);font-weight:800;font-size:14px;letter-spacing:.16em}
.livebug .dot{width:8px;height:8px;background:var(--white);animation:blink 1s steps(1,end) infinite}

/* ---------------- score bug ---------------- */
.bug{position:fixed;left:0;bottom:0;width:100%;height:48px;z-index:60;pointer-events:none}
.bug-skew{width:calc(100% + 120px);margin-left:-60px;height:100%;background:var(--panel);transform:skewX(-12deg);display:flex;align-items:stretch}
.bug-tab{width:10px;background:var(--red);flex:none}
.seg{display:flex;align-items:center;padding:0 30px;border-right:1px solid var(--line)}
.seg .up{transform:skewX(12deg);display:flex;align-items:center;gap:10px;font-weight:700;font-size:12.5px;letter-spacing:.08em}
.seg-num{font-weight:800;font-size:20px;color:var(--sky);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.seg-mark{margin-left:auto;border-right:0;border-left:1px solid var(--line);padding-right:44px}
.seg-mark img{width:28px;height:28px}

@media (max-width:1500px){
  .cd-zone{top:58%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>

<main>
  <section class="straps">
    <div class="band-red"><h1>TECHNICAL TIMEOUT</h1></div>
    <div class="band-white"><p>BE RIGHT BACK</p></div>
  </section>

  <aside class="cd-zone">
    <div data-cd-wrap>
      <div class="cd-tag"><span class="up">BACK IN</span></div>
      <div class="cd-body"><span class="up"><b class="cd-digits" data-cd>05:00</b></span></div>
    </div>
    <p class="live-strap" data-when-live hidden><span class="up">WE'RE LIVE</span></p>
  </aside>
</main>

<div class="livebug"><span class="up"><i class="dot" aria-hidden="true"></i>LIVE</span></div>

<div class="onair"><span class="up"><i class="dot" aria-hidden="true"></i><span>ON AIR</span><b data-elapsed>00:00</b></span></div>

<footer class="bug">
  <div class="bug-skew">
    <i class="bug-tab" aria-hidden="true"></i>
    <div class="seg seg-ep"><span class="up"><span>EP</span><b class="seg-num" data-ep>128</b></span></div>
    <div class="seg seg-show"><span class="up"><span>PODCAST + SCREEN SHARE</span></span></div>
    <div class="seg seg-mark"><span class="up"><img src="../assets/smile-mark.svg" alt="SMILE mark" width="28" height="28"></span></div>
  </div>
</footer>

<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+300000, tp=q.get('t');
  if(tp){ if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;} else {var d=new Date(tp); if(!isNaN(d.getTime())) target=d.getTime();} }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  var el0=q.get('elapsed')?parseInt(q.get('elapsed'),10):0, t0=Date.now();
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){ e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x); });
    var el=el0+Math.floor((Date.now()-t0)/1000);
    document.querySelectorAll('[data-elapsed]').forEach(function(e){ e.textContent=P(Math.floor(el/60))+':'+P(el%60); });
    if(s<=0){
      document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');});
      document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');});
    }
  }
  tick(); setInterval(tick,250);
})();
</script>
</body>
</html>

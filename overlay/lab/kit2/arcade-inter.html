<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · INTER · arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D14; --panel:rgba(15,20,32,.88); --line:#1E293B;
    --cy:#22D3EE; --mg:#F43F8E; --wht:#F8FAFC; --slt:#94A3B8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background-color:var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:64px 64px;
    font-family:'Chakra Petch','Segoe UI',sans-serif; color:var(--wht);
  }
  [hidden]{display:none!important}
  [data-cd-wrap][data-done="1"]{opacity:.35}

  .vignette{position:fixed; inset:0; z-index:60; pointer-events:none;
    background:radial-gradient(120% 130% at 50% 50%, transparent 55%, rgba(0,0,0,.25) 100%)}
  .scan{position:fixed; inset:0; z-index:61; pointer-events:none; opacity:.35;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px)}

  .wm{position:fixed; top:36px; right:48px; width:72px; height:72px; z-index:12;
    filter:drop-shadow(4px 4px 0 rgba(0,0,0,.5))}

  .wrap{position:fixed; inset:0; z-index:5; display:grid;
    grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);
    gap:clamp(32px,4vw,72px); align-content:center;
    padding:104px 64px 128px}
  .micro{font-weight:700; font-size:12px; letter-spacing:.18em; text-transform:uppercase}
  .brandline{color:var(--wht)}
  .brandline span{color:var(--slt); font-weight:500}

  /* left: lobby id + player slots */
  .lobby-row{display:flex; align-items:center; gap:30px; margin:18px 0 14px}
  .dpad-wrap{width:72px; height:40px; flex:none; position:relative}
  .dpad{position:absolute; top:0; left:0; width:8px; height:8px; background:transparent; flex:none;
    box-shadow:
    16px 0px 0 0 #22D3EE,
    16px 8px 0 0 #22D3EE,
    48px 8px 0 0 #F43F8E,
    0px 16px 0 0 #22D3EE,
    8px 16px 0 0 #22D3EE,
    16px 16px 0 0 #22D3EE,
    24px 16px 0 0 #22D3EE,
    32px 16px 0 0 #22D3EE,
    56px 16px 0 0 #F8FAFC,
    16px 24px 0 0 #22D3EE,
    16px 32px 0 0 #22D3EE;
  }
  h1{margin:0; font-family:'Unbounded','Chakra Petch',sans-serif; font-weight:900;
    font-size:clamp(44px,4.6vw,64px); line-height:1; color:var(--wht);
    text-shadow:4px 4px 0 rgba(34,211,238,.35), -4px -4px 0 rgba(244,63,142,.35)}
  .queue{display:inline-block; border:2px solid var(--mg); border-radius:4px;
    padding:9px 16px; color:var(--mg); box-shadow:6px 6px 0 rgba(244,63,142,.18);
    margin:0 0 30px}
  .slots{display:flex; flex-direction:column; gap:16px; width:min(460px,100%)}
  .slot{height:64px; display:flex; align-items:center; gap:16px; padding:0 20px;
    border:2px solid var(--line); border-radius:4px; background:var(--panel)}
  .slot .pdot{width:12px; height:12px; flex:none; border-radius:2px}
  .slot .nm{font-weight:700; font-size:15px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--wht)}
  .slot .st{margin-left:auto; font-weight:500; font-size:14px; letter-spacing:.06em;
    color:var(--slt)}
  .s1{box-shadow:inset 4px 0 0 var(--cy), 8px 8px 0 rgba(34,211,238,.16)}
  .s1 .pdot{background:var(--cy)} .s1 .st{color:var(--cy); font-weight:600}
  .s2 .pdot{background:#475569}
  .s3{box-shadow:8px 8px 0 rgba(244,63,142,.16)}
  .s3 .pdot{background:var(--mg)} .s3 .st{color:var(--mg); font-weight:600}
  .s2 .st i{font-style:normal; animation:dotin 1.2s steps(1,end) infinite}
  .s2 .st i:nth-child(2){animation-delay:.25s}
  .s2 .st i:nth-child(3){animation-delay:.5s}
  @keyframes dotin{0%,39%{opacity:0}40%,100%{opacity:1}}

  /* right: countdown + XP bar */
  .rcol{display:flex; flex-direction:column; justify-content:center; gap:26px}
  .panel{border:2px solid var(--line); border-radius:4px; background:var(--panel);
    padding:24px 30px}
  .backin{box-shadow:8px 8px 0 rgba(34,211,238,.16); transition:opacity .5s}
  .backin .lbl{color:var(--cy)}
  .backin .lbl .live{color:var(--mg)}
  .cd{margin-top:10px; font-weight:700; font-size:clamp(44px,6.6vw,72px); line-height:1;
    letter-spacing:.02em; color:var(--cy); font-variant-numeric:tabular-nums}
  .xp .row{display:flex; justify-content:space-between; align-items:baseline; gap:20px}
  .xp .lbl{color:var(--slt)}
  .xp .meta{font-weight:600; font-size:14px; letter-spacing:.1em; color:var(--slt);
    font-variant-numeric:tabular-nums}
  .xp .meta b{color:var(--wht); font-weight:700}
  .track{position:relative; margin-top:14px; height:10px; border-radius:2px;
    background:var(--line)}
  .xfill{position:absolute; inset:0 32% 0 0; background:var(--cy)}
  .tick{position:absolute; top:0; bottom:0; width:2px; background:var(--bg)}

  /* bottom HUD bar */
  .bar{position:fixed; left:0; right:0; bottom:0; height:64px; z-index:10;
    display:flex; align-items:center; gap:20px; padding:0 64px;
    border-top:2px solid var(--line); background:rgba(11,13,20,.84)}
  .bar .lbl{color:var(--cy)}
  .bar .np{font-weight:700; font-size:14px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--wht)}
  .eq{display:flex; align-items:flex-end; gap:4px; height:22px}
  .eq i{width:5px; height:100%; background:var(--cy); transform-origin:bottom;
    animation:eqb var(--d) ease-in-out infinite; animation-delay:var(--dl)}
  @keyframes eqb{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  .bar .up{margin-left:auto; font-weight:600; font-size:13px; letter-spacing:.1em;
    color:var(--slt); font-variant-numeric:tabular-nums}
  .bar .up b{color:var(--wht); font-weight:700}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
    .s2 .st i{animation:none;opacity:1}
    .eq i{animation:none;transform:none}
  }
</style>
</head>
<body>
  <div class="vignette"></div>
  <img class="wm" src="../assets/smile-mark.svg" alt="SMILE">

  <main class="wrap">
    <section class="lcol">
      <div class="micro brandline">SMILE <span>— live podcast + screen share</span></div>
      <div class="lobby-row">
        <div class="dpad-wrap"><div class="dpad"></div></div>
        <h1>LOBBY</h1>
      </div>
      <div><span class="queue micro">QUEUE: INTERMISSION</span></div>
      <div class="slots">
        <div class="slot s1"><i class="pdot"></i><span class="nm">Host</span><span class="st">ready</span></div>
        <div class="slot s2"><i class="pdot"></i><span class="nm">Guest</span><span class="st">joining<i>.</i><i>.</i><i>.</i></span></div>
        <div class="slot s3"><i class="pdot"></i><span class="nm">You</span><span class="st">in chat</span></div>
      </div>
    </section>

    <section class="rcol">
      <div class="panel backin" data-cd-wrap>
        <div class="micro lbl">
          <span data-hide-when-live>BACK IN</span>
          <span class="live" data-when-live hidden>BACK LIVE</span>
        </div>
        <div class="cd" data-cd>10:00</div>
      </div>
      <div class="panel xp">
        <div class="row">
          <span class="micro lbl">STREAM PROGRESS</span>
          <span class="meta">EP <b data-ep>128</b> — 68%</span>
        </div>
        <div class="track">
          <div class="xfill"></div>
          <i class="tick" style="left:10%"></i><i class="tick" style="left:20%"></i>
          <i class="tick" style="left:30%"></i><i class="tick" style="left:40%"></i>
          <i class="tick" style="left:50%"></i><i class="tick" style="left:60%"></i>
          <i class="tick" style="left:70%"></i><i class="tick" style="left:80%"></i>
          <i class="tick" style="left:90%"></i>
        </div>
      </div>
    </section>
  </main>

  <footer class="bar">
    <span class="micro lbl">NOW PLAYING</span>
    <span class="np">LO-FI OST</span>
    <span class="eq">
      <i style="--d:.7s;--dl:-.2s"></i><i style="--d:.95s;--dl:-.5s"></i>
      <i style="--d:.6s;--dl:-.1s"></i><i style="--d:1.05s;--dl:-.7s"></i>
      <i style="--d:.8s;--dl:-.35s"></i>
    </span>
    <span class="up">T+<b data-elapsed>00:00</b></span>
  </footer>

  <div class="scan"></div>

<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+600000, tp=q.get('t');
  if(tp){ if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;} else {var d=new Date(tp); if(!isNaN(d.getTime())) target=d.getTime();} }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  var el0=q.get('elapsed')?parseInt(q.get('elapsed'),10):0, t0=Date.now();
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){ e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x); });
    var el=el0+Math.floor((Date.now()-t0)/1000);
    document.querySelectorAll('[data-elapsed]').forEach(function(e){ e.textContent=P(Math.floor(el/60))+':'+P(el%60); });
    if(s<=0){
      document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');});
      document.querySelectorAll('[data-hide-when-live]').forEach(function(e){e.setAttribute('hidden','');});
      document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');});
    }
  }
  tick(); setInterval(tick,250);
})();
</script>
</body>
</html>

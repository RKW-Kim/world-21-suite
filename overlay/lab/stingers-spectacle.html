<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPECTACLE — 3D money stingers · smile.co.ke</title>
<link rel="stylesheet" href="assets/liquid-glass.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0A0C14;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif; }
  html.obs, body.obs { background:transparent !important; }

  #stage { position:absolute; inset:0; }
  #bgLayer { position:absolute; inset:0; display:none; }
  #bgLayer.bright { display:block; background:linear-gradient(135deg,#F7F3EA,#E8DFC9 45%,#D9CBA6); }
  #bgLayer.dark { display:block; background:linear-gradient(160deg,#0E1118,#131720 50%,#0B0D12); }
  #bgLayer.grad { display:block; background:
    radial-gradient(60% 90% at 20% 15%, rgba(255,206,0,.32), transparent 60%),
    radial-gradient(55% 80% at 82% 80%, rgba(64,120,255,.25), transparent 60%),
    linear-gradient(140deg,#151226,#1B1440 55%,#0D0B1A); }
  #chart { position:absolute; inset:0; }
  body.obs #chart, body.obs #bgLayer { display:none !important; }

  /* fire target: bottom-right — one shared anchor cell */
  #dock { position:absolute; right:36px; bottom:48px; display:grid; }

  /* ============ SPECTACLE CARD — matte family, core speaks ============ */
  .stg { display:none; grid-area:1/1; justify-self:end; align-items:center;
    padding:13px 26px 13px 13px; border-radius:30px; cursor:pointer; opacity:0; }
  .stg.on { display:flex; }
  .stg .lg-content { display:flex; align-items:center; gap:17px; }

  /* one accent per card — muted platform color, bottom rim only (core rule) */
  .stg--super, .stg--sub { --acc: rgba(217,172,43,.9); }
  .stg--tip              { --acc: rgba(76,168,58,.9); }
  .stg--cheer            { --acc: rgba(126,79,209,.9); }
  .stg--obsidian  { --acc-o:.55; }
  .stg--frost     { --acc-o:.34; }
  .stg--chameleon { --acc-o:.48; }

  /* text — quiet: verb, hairline, then amount + context */
  /* text block: optically centered against the hero's mass */
  .tx { display:flex; flex-direction:column; min-width:0; margin-top:-2px; }
  .ttl { font-size:18px; font-weight:700; letter-spacing:-.02em; line-height:1.12; white-space:nowrap; }
  .stg--frost .ttl { color:#26200F; }
  .stg--obsidian .ttl, .stg--chameleon .ttl { color:#fff; }
  .ttl--gold { background-image:linear-gradient(180deg,#F6CF3A,#E9B400 46%,#B8860B 82%,#9A6E08);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:#E9B400; }
  /* frost carries a deeper pour + ink hairline — pale gold dies on matte white */
  .stg--frost .ttl--gold { background-image:linear-gradient(180deg,#E4AF00,#C79100 48%,#8F640A 86%);
    filter:drop-shadow(0 1px 0 rgba(31,23,2,.14)); }
  .subrow { display:flex; align-items:baseline; gap:10px; margin-top:8px; padding-top:7px;
    border-top:1px solid rgba(255,255,255,.11); }
  .stg--frost .subrow { border-top-color:rgba(31,23,2,.20); }
  .sub { font-size:12px; font-weight:500; letter-spacing:-.006em; white-space:nowrap; }
  .stg--frost .sub { color:rgba(38,33,18,.66); }
  .stg--obsidian .sub, .stg--chameleon .sub { color:rgba(255,255,255,.62); }
  .mp { font-weight:800; letter-spacing:.04em; color:#2E801D; }
  .stg--obsidian .mp, .stg--chameleon .mp { color:#55BE3A; }

  /* amount — no chip box: the money is the loudest figure in the room */
  .amt { display:inline-block; font-size:17px; font-weight:700; letter-spacing:-.026em;
    font-variant-numeric:tabular-nums; white-space:nowrap; text-align:left; color:#26200F; }
  .stg--obsidian .amt, .stg--chameleon .amt { color:#fff; }
  .amt--usd  { min-width:56px; }
  .amt--kes  { min-width:72px; }
  .amt--bits { min-width:82px; }

  /* YouTube-red micro-accent (super thanks only) */
  .yt { display:inline-block; width:17px; height:12px; border-radius:3px; background:#FF0033;
    margin-right:7px; vertical-align:-1px; position:relative;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 2px rgba(122,0,12,.45); }
  .yt::after { content:""; position:absolute; left:6.5px; top:3px;
    border-left:5px solid #fff; border-top:3px solid transparent; border-bottom:3px solid transparent; }

  /* contact shadow lift (page-scoped): the card must TOUCH its ground,
     not float on one soft gaussian — core remains untouched */
  .stg.lg--obsidian, .stg.lg--chameleon {
    box-shadow: 0 24px 64px rgba(0,0,0,.58), 0 3px 12px rgba(0,0,0,.42), 0 1px 2px rgba(0,0,0,.5); }
  .stg.lg--frost {
    box-shadow: 0 18px 50px rgba(0,0,0,.34), 0 2px 8px rgba(0,0,0,.22), 0 1px 2px rgba(0,0,0,.32); }

  /* ============ 3D HERO OBJECTS — physical truth ============ */
  /* fixed stage — space reserved, animations are transform-only (no layout shift) */
  .obj-stage { position:relative; width:78px; height:78px; flex:none;
    display:grid; place-items:center; }
  .oshadow { position:absolute; left:50%; bottom:0; width:54px; height:10px;
    transform:translateX(-50%); border-radius:50%; opacity:.42;
    background:radial-gradient(50% 50% at 50% 50%, rgba(10,7,0,.45), transparent 68%); }

  .pop { transform-style:preserve-3d; }
  .tok { position:relative; transform-style:preserve-3d; }
  .tok-edge { position:absolute; inset:0; }
  .tok-face { position:absolute; inset:0; backface-visibility:hidden; }
  .tok-face svg { width:100%; height:100%; display:block; }

  /* COIN: enters with flip + rise, LANDS (squash + 2px drop), then rests
     on a barely-there idle float. One animation each on pop (weight) and tok (spin).
     Per-segment timing functions ARE the physics: decel up, gravity down, impulse squash. */
  .pop--coin { animation: coinLand 1.05s both; }
  @keyframes coinLand {
    0%   { transform: translateY(14px) scale(.72); opacity: 0;
           animation-timing-function: cubic-bezier(.30,.66,.38,1); }  /* rise, decelerating */
    30%  { transform: translateY(-8px) scale(1.012); opacity: 1;
           animation-timing-function: cubic-bezier(.50,0,.74,.42); }  /* apex — gravity owns it now */
    55%  { transform: translateY(1.6px) scale(1.008,.990);
           animation-timing-function: cubic-bezier(.32,.5,.40,1); }   /* first contact */
    63%  { transform: translateY(2px) scale(1.015,.981); }             /* max squash ≈1.9% */
    78%  { transform: translateY(-.6px) scale(.995,1.004);
           animation-timing-function: ease-out; }                     /* weight rebounds */
    100% { transform: translateY(0) scale(1); }
  }
  .coin { animation: lgCoinFlip .58s cubic-bezier(.3,.62,.3,1) both,
    idleFloat 4.6s ease-in-out 1.35s infinite; }
  @keyframes idleFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  /* shadow follows the weight: widens/lightens at apex, tightens + darkens at contact */
  .oshadow--coin { animation: shadowLand 1.05s linear both, shadowIdle 4.6s ease-in-out 1.35s infinite; }
  @keyframes shadowLand {
    0%   { transform: translateX(-50%) scale(.55); opacity: 0; }
    30%  { transform: translateX(-50%) scale(.92); opacity: .30; }
    55%  { transform: translateX(-50%) scale(.80); opacity: .40; }
    63%  { transform: translateX(-50%) scale(.70); opacity: .55; }
    78%  { transform: translateX(-50%) scale(.80); opacity: .44; }
    100% { transform: translateX(-50%) scale(.78); opacity: .48; }
  }
  @keyframes shadowIdle {
    0%,100% { transform: translateX(-50%) scale(.78); opacity: .48; }
    50%     { transform: translateX(-50%) scale(.71); opacity: .38; }
  }

  /* GEM: one refractive tick + settle (never perpetual), single glint sweep */
  .pop--gem { animation: gemTick .95s both; }
  @keyframes gemTick {
    0%   { transform: rotateY(30deg) scale(.72); opacity: 0;
           animation-timing-function: cubic-bezier(.25,.8,.3,1); }
    42%  { transform: rotateY(-9deg) scale(1.03); opacity: 1; }
    64%  { transform: rotateY(4deg) scale(.99); }
    84%  { transform: rotateY(-1.5deg) scale(1.003); }
    100% { transform: rotateY(0deg) scale(1); }
  }
  .gem { animation: idleFloat 4.6s ease-in-out 1.4s infinite; }
  .glint { position:absolute; inset:0; pointer-events:none;
    clip-path:polygon(25% 1.4%, 75% 1.4%, 98.7% 33.3%, 50% 98.6%, 1.3% 33.3%);
    background:linear-gradient(115deg, transparent 44%, rgba(255,255,255,.5) 50%, transparent 56%) no-repeat;
    background-size:38% 100%; background-position:-45% 0;
    animation: glintSweep 1.1s cubic-bezier(.32,.72,0,1) .24s 1 both; }
  @keyframes glintSweep { from { background-position:-45% 0; } to { background-position:145% 0; } }

  /* M-PESA tip hero: matte ceramic squircle app tile */
  .pop--tile { animation: tileIn .95s both; }
  @keyframes tileIn {
    0%   { transform: rotateY(-22deg) scale(.72); opacity: 0;
           animation-timing-function: cubic-bezier(.25,.8,.3,1); }
    46%  { transform: rotateY(5deg) scale(1.035); opacity: 1; }
    68%  { transform: rotateY(-2deg) scale(.996); }
    100% { transform: rotateY(0deg) scale(1); }
  }
  /* matte ceramic M-PESA tile: convex volume, micro-bevel, coin-weight shadow */
  .tile { width:76px; height:76px; border-radius:24px; position:relative; display:grid; place-items:center;
    background:linear-gradient(165deg,#4EB23C,#41A32C 58%,#2E7F1F);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -3px 8px rgba(10,40,5,.32),
      inset 0 0 0 1px rgba(255,255,255,.09), inset 0 -1px 0 rgba(255,255,255,.07),
      0 0 0 1px rgba(18,54,8,.32), 0 8px 18px rgba(16,52,8,.30);
    animation: idleFloat 4.4s ease-in-out 1.3s infinite; }
  .tile::before { content:""; position:absolute; inset:0; border-radius:inherit;
    background:radial-gradient(125% 125% at 32% 20%,
      rgba(255,255,255,.16), rgba(255,255,255,0) 48%, rgba(8,40,4,.20) 100%); }
  .tile svg { width:76px; height:76px; display:block; position:relative; }

  /* the object IS its own entrance — never double-animate the stage */
  .lg.in .lg-content > .obj-stage { animation:none; opacity:1; }

  /* SUBSCRIBE bell: one decisive ring, decay to stillness, ONE halo ring */
  .bell { width:60px; height:60px; transform-origin:50% 9%;
    animation: bellRing 1.7s cubic-bezier(.45,.05,.35,1) .3s both; }
  .bell svg { width:100%; height:100%; display:block; filter:drop-shadow(0 4px 7px rgba(120,84,0,.22)); }
  @keyframes bellRing {
    0%   { transform: rotate(0deg); }
    14%  { transform: rotate(-12deg); }
    36%  { transform: rotate(9deg); }
    56%  { transform: rotate(-4deg); }
    74%  { transform: rotate(1.6deg); }
    88%  { transform: rotate(-.5deg); }
    100% { transform: rotate(0deg); }
  }
  .halo { position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px;
    border-radius:50%; border:2px solid rgba(217,172,43,.62); opacity:0;
    box-shadow: 0 0 12px rgba(217,172,43,.28), inset 0 0 9px rgba(217,172,43,.18);
    animation: haloPulse 1.15s cubic-bezier(.22,.61,.36,1) .42s both; }
  @keyframes haloPulse {
    0%   { transform: scale(.55); opacity: 0; }
    25%  { opacity: .62; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  #help { position:absolute; left:20px; top:18px; font:600 12px "Inter",system-ui,sans-serif;
    color:rgba(255,255,255,.55); background:rgba(10,12,18,.5); padding:8px 12px; border-radius:10px;
    backdrop-filter:blur(8px); z-index:9; }
  body.obs #help, body.g #help { display:none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="chart" width="1920" height="1080"></canvas>
  <div id="bgLayer"></div>
  <div id="help">1 SUPER · 2 TIP · 3 CHEER · 4 SUBSCRIBE · B background (chart · bright · dark · grad · wash) · click refires · ?theme=obsidian (default) | frost | chameleon | clear=frost</div>
  <div id="dock"></div>
</div>

<script src="assets/liquid-glass.js"></script>
<script>
var Q = new URLSearchParams(location.search);
/* matte migration: clear is accepted but mapped to frost (matte white) */
var qt = Q.get('theme');
var THEME = qt === 'frost' ? 'frost' : qt === 'chameleon' ? 'chameleon' :
  (qt === 'clear' ? 'frost' : 'obsidian');
if (Q.get('obs') === '1') {
  document.body.classList.add('obs');
  document.documentElement.classList.add('obs');
}
if (Q.get('g') === '1') document.body.classList.add('g');

/* ---- chart backdrop (static) + wash mode (animated hue tour, feeds chameleon) ---- */
var C = document.getElementById('chart'), X = C.getContext('2d'), D = [];
(function () {
  var p = 600;
  for (var i = 0; i < 120; i++) { D.push(p); p += (Math.random() - .47) * 9; }
  var lo = Math.min.apply(null, D), hi = Math.max.apply(null, D);
  X.fillStyle = '#0A0C14'; X.fillRect(0, 0, 1920, 1080);
  X.strokeStyle = 'rgba(255,255,255,.045)';
  for (var gx = 0; gx < 1920; gx += 110) { X.beginPath(); X.moveTo(gx, 0); X.lineTo(gx, 1080); X.stroke(); }
  for (var gy = 0; gy < 1080; gy += 85) { X.beginPath(); X.moveTo(0, gy); X.lineTo(1920, gy); X.stroke(); }
  X.beginPath();
  D.forEach(function (v, i) { var px = i * 16, py = 950 - (v - lo) / (hi - lo) * 760; i ? X.lineTo(px, py) : X.moveTo(px, py); });
  X.strokeStyle = 'rgba(255,206,0,.85)'; X.lineWidth = 2.5; X.stroke();
  X.lineTo(120 * 16, 1080); X.lineTo(0, 1080); X.closePath();
  X.fillStyle = 'rgba(255,206,0,.05)'; X.fill();
})();
function drawWash(t) {
  var hue = (t * 9) % 360;
  var g2 = X.createLinearGradient(0, 0, 1920, 1080);
  g2.addColorStop(0, 'hsl(' + hue + ' 42% 12%)');
  g2.addColorStop(.5, 'hsl(' + ((hue + 40) % 360) + ' 34% 17%)');
  g2.addColorStop(1, 'hsl(' + ((hue + 90) % 360) + ' 40% 10%)');
  X.fillStyle = g2; X.fillRect(0, 0, 1920, 1080);
  var w1 = X.createRadialGradient(480 + Math.sin(t * .5) * 220, 380, 60, 480 + Math.sin(t * .5) * 220, 380, 620);
  w1.addColorStop(0, 'hsl(' + ((hue + 180) % 360) + ' 60% 52% / .30)'); w1.addColorStop(1, 'transparent');
  X.fillStyle = w1; X.fillRect(0, 0, 1920, 1080);
  var w2 = X.createRadialGradient(1450 + Math.cos(t * .38) * 200, 760, 60, 1450 + Math.cos(t * .38) * 200, 760, 560);
  w2.addColorStop(0, 'hsl(' + ((hue + 60) % 360) + ' 55% 55% / .26)'); w2.addColorStop(1, 'transparent');
  X.fillStyle = w2; X.fillRect(0, 0, 1920, 1080);
}
(function washLoop(ts) { if (bgMode === 'wash') drawWash((ts || 0) / 1000); requestAnimationFrame(washLoop); })();

var BGS = ['chart', 'bright', 'dark', 'grad', 'wash'], curBg = 0, bgMode = 'chart';
function bg(name) {
  var b = document.getElementById('bgLayer');
  b.className = ''; C.style.display = 'block';
  document.body.classList.remove('bg-bright');
  bgMode = 'chart';
  if (name === 'bright' || name === 'dark' || name === 'grad') {
    b.className = name; C.style.display = 'none';
    if (name === 'bright') document.body.classList.add('bg-bright');
  } else if (name === 'wash') { bgMode = 'wash'; }
  rematerial();
  chamSync();
}
if (BGS.indexOf(Q.get('bg')) > -1) { bg(Q.get('bg')); curBg = BGS.indexOf(Q.get('bg')); }

/* ---- expo-out cubic-bezier(.16,1,.3,1) solver + count-up ---- */
function bez(x1, y1, x2, y2) {
  var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  var cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  function sx(t) { return ((ax * t + bx) * t + cx) * t; }
  function sy(t) { return ((ay * t + by) * t + cy) * t; }
  function dx(t) { return (3 * ax * t + 2 * bx) * t + cx; }
  return function (x) {
    var t = x, e, i;
    for (i = 0; i < 6; i++) { e = sx(t) - x; if (Math.abs(e) < 1e-5) break; t -= e / dx(t); }
    t = Math.min(1, Math.max(0, t));
    return sy(t);
  };
}
var EASE = bez(.16, 1, .3, 1);
function countUp(el, target, fmt, dur) {
  if (!el) return;
  if (el._craf) cancelAnimationFrame(el._craf);   /* refire: one solver, never two */
  el.textContent = fmt(target);                   /* lock width to the FINAL figure —
                                                     zero layout shift while counting */
  el.style.minWidth = Math.ceil(el.getBoundingClientRect().width + 1) + 'px';
  var t0 = performance.now();
  var fr = function (t) {
    var p = Math.min(1, (t - t0) / dur), v = EASE(p);
    el.textContent = fmt(target * v);
    if (p < 1) el._craf = requestAnimationFrame(fr);
  };
  el._craf = requestAnimationFrame(fr);
}

/* ---- spark burst: few, muted, one decisive wave, slow decay ---- */
function fountain(host, o) {
  for (var i = 0; i < o.count; i++) {
    (function (i) {
      setTimeout(function () {
        /* bokeh-soft particle: soft edge, varied peak opacity + depth-of-field
           blur on the big ones — round sparks (core contract), but never flat dots */
        var size = o.sMin + Math.random() * (o.sMax - o.sMin);
        var life = o.lifeMin + Math.random() * (o.lifeMax - o.lifeMin);
        var c = o.colors[(Math.random() * o.colors.length) | 0];
        var pk = .58 + Math.random() * .34;
        var s = LG.spark(host,
          o.x + (Math.random() - .5) * o.spread,
          o.y + (Math.random() - .5) * 26,
          size, life, { z: 7 });
        if (size > (o.sMin + o.sMax) / 2 + 1.5) s.style.filter = 'blur(.6px)';
        s.style.background = 'radial-gradient(circle at 42% 36%, rgba(255,252,244,.92), ' +
          c + ' 48%, ' + c + '00 82%)';
        s.style.boxShadow = '0 0 ' + (4 + size) + 'px ' + c + '3d';
        var old = s.getAnimations()[0]; if (old) old.cancel();
        var dx = (Math.random() - .5) * o.burst;
        var up = o.upMin + Math.random() * (o.upMax - o.upMin);
        var an = s.animate([
          { transform: 'translate(0,0) scale(.4)', opacity: 0, easing: 'cubic-bezier(.2,.7,.3,1)' },
          { transform: 'translate(' + (dx * .45).toFixed(1) + 'px,' + (-up * .66).toFixed(1) + 'px) scale(1)', opacity: pk, offset: .32, easing: 'cubic-bezier(.33,0,.67,1)' },
          { transform: 'translate(' + (dx * .8).toFixed(1) + 'px,' + (-up).toFixed(1) + 'px) scale(.85)', opacity: pk * .72, offset: .58, easing: 'cubic-bezier(.45,.05,.7,.5)' },
          { transform: 'translate(' + dx.toFixed(1) + 'px,' + (-up * .45 + 14).toFixed(1) + 'px) scale(.4)', opacity: 0 }
        ], { duration: life, fill: 'both' });
        an.onfinish = function () { s.remove(); };
      }, i * o.stagger + Math.random() * o.jitter);
    })(i);
  }
}

/* ---- 3D token builder: N edge layers + front/back faces ---- */
function makeToken(stage, o) {
  var pop = document.createElement('div'); pop.className = 'pop' + (o.popCls ? ' ' + o.popCls : '');
  var tok = document.createElement('div'); tok.className = 'tok ' + (o.cls || '');
  tok.style.width = o.w + 'px'; tok.style.height = o.h + 'px';
  var n = o.layers || 9;
  for (var i = 0; i < n; i++) {
    var e = document.createElement('i'); e.className = 'tok-edge';
    e.style.transform = 'translateZ(' + (-o.thick / 2 + o.thick * i / (n - 1)).toFixed(2) + 'px)';
    e.style.background = i % 2 ? o.edgeB : o.edgeA;
    if (o.round) e.style.borderRadius = o.round;
    if (o.clip) e.style.clipPath = o.clip;
    tok.appendChild(e);
  }
  var f = document.createElement('div'); f.className = 'tok-face tok-face--front';
  f.style.transform = 'translateZ(' + (o.thick / 2 + .5) + 'px)'; f.innerHTML = o.front;
  var b = document.createElement('div'); b.className = 'tok-face';
  b.style.transform = 'rotateY(180deg) translateZ(' + (o.thick / 2 + .5) + 'px)'; b.innerHTML = o.back;
  tok.appendChild(f); tok.appendChild(b);
  pop.appendChild(tok); stage.appendChild(pop);
  return tok;
}

/* ---- object art (smile face paths verbatim from assets/smile-face.svg) ---- */
function feat(fill) {
  return '<path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="' + fill + '"/>' +
    '<path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="' + fill + '"/>' +
    '<path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="' + fill + '"/>';
}
/* brushed gold — real-gold tones, anisotropic brushing, true engraving:
   dark cut above the glyphs, light catch below, low-contrast radial body.
   MATTE metal: broad diffuse light, machined edge ring, visible grain. */
function coinFront() {
  return '<svg viewBox="0 0 78 78" xmlns="http://www.w3.org/2000/svg">' +

}

    '<path d="M22 44.5h20" stroke="rgba(143,100,0,.5)" stroke-width="1.4" stroke-linecap="round"/>' +

/* ---- card factory ---- */
var dock = document.getElementById('dock');
var ORDER = ['super', 'tip', 'cheer', 'sub'];
/* matte tuning: lower CA, calmer refraction, saturation boosts well under the
   old glossy values, brightness held near 1 — the material must sit, not shout */
var TUNE = {
  super: { s: 78, ca: 1.5, blur: 2.4 },
  tip:   { s: 82, ca: 1.6, blur: 2.5 },
  cheer: { s: 76, ca: 1.4, blur: 2.3 },
  sub:   { s: 78, ca: 1.5, blur: 2.4 }
};
var MAT = {
  obsidian:   { sat: 1.38, bri: .99 },
  chameleon:  { sat: 1.30, bri: 1.00 },
  frost:      { sat: 1.22, bri: 1.05 },
  frostBright:{ sat: 1.10, bri: .98 }
};
function brightNow() { return document.body.classList.contains('bg-bright'); }
function glassOpts(id) {
  var t = TUNE[id], m;
  if (THEME === 'obsidian') m = MAT.obsidian;
  else if (THEME === 'chameleon') m = MAT.chameleon;
  else m = brightNow() ? MAT.frostBright : MAT.frost;
  return { theme: THEME, depth: 14, strength: t.s, ca: t.ca, blur: t.blur, saturate: m.sat, brightness: m.bri };
}
function rematerial() {
  if (THEME !== 'frost' || !CARDS) return;
  ORDER.forEach(function (id) {
    var el = CARDS[id]; if (!el) return;
    ['lg-backdrop', 'lg-tint', 'lg-rim', 'lg-spec', 'lg-grain'].forEach(function (c) {
      Array.prototype.forEach.call(el.querySelectorAll(':scope > ' + c), function (n) { n.remove(); });
    });
    el._opts = glassOpts(id);
    el._ref = LG.glass(el, el._opts);
  });
}

var INNER = {
  super: '<div class="obj-stage lg-scene"><i class="oshadow oshadow--coin"></i></div>' +
    '<div class="tx"><b class="ttl">SUPER THANKS</b>' +
    '<span class="subrow"><b class="amt amt--usd">$0.00</b>' +
    '<span class="sub"><i class="yt"></i>from @viewerriver · thank you</span></span></div>',
  tip: '<div class="obj-stage lg-scene"><i class="oshadow"></i></div>' +
    '<div class="tx"><b class="ttl">TIP RECEIVED</b>' +
    '<span class="subrow"><b class="amt amt--kes">KSh 0</b>' +
    '<span class="sub"><b class="mp">M-PESA</b> · asante sana</span></span></div>',
  cheer: '<div class="obj-stage lg-scene"><i class="oshadow"></i></div>' +
    '<div class="tx"><b class="ttl">CHEER</b>' +
    '<span class="subrow"><b class="amt amt--bits">0 BITS</b>' +
    '<span class="sub">twitch.tv/smilecoke</span></span></div>',
  sub: '<div class="obj-stage lg-scene"><i class="oshadow"></i></div>' +
    '<div class="tx"><b class="ttl ttl--gold">SUBSCRIBE</b>' +
    '<span class="subrow"><span class="sub">welcome to the desk, @newviewerriver</span></span></div>'
};

/* fx fire at the physical moment: coin contact / tile settle / gem tick / bell strike */
var GOLD_M = ['#D9AC2B', '#C79A1F', '#EFD98A'];
var GREEN_M = ['#4CA83A', '#63B84F', '#8CCB79'];
var PURPLE_M = ['#7E4FD1', '#9268DE', '#B79AEB'];
var FX = {
  super: function (el) {
    fountain(el, { x: 54, y: 82, count: 7, colors: GOLD_M, burst: 96, upMin: 42, upMax: 76,
      spread: 38, sMin: 2.5, sMax: 9.5, stagger: 12, jitter: 70, lifeMin: 1050, lifeMax: 1400 });
    countUp(el.querySelector('.amt'), 5, function (v) { return '$' + v.toFixed(2); }, 860);
  },
  tip: function (el) {
    fountain(el, { x: 52, y: 82, count: 6, colors: GREEN_M, burst: 88, upMin: 36, upMax: 66,
      spread: 34, sMin: 2.5, sMax: 8.5, stagger: 15, jitter: 80, lifeMin: 1000, lifeMax: 1350 });
    countUp(el.querySelector('.amt'), 250, function (v) { return 'KSh ' + Math.round(v); }, 840);
  },
  cheer: function (el) {
    fountain(el, { x: 52, y: 80, count: 6, colors: PURPLE_M, burst: 88, upMin: 36, upMax: 68,
      spread: 34, sMin: 2.5, sMax: 8.5, stagger: 15, jitter: 80, lifeMin: 1000, lifeMax: 1350 });
    countUp(el.querySelector('.amt'), 100, function (v) { return Math.round(v) + ' BITS'; }, 840);
  },
  sub: function (el) {
    fountain(el, { x: 52, y: 66, count: 5, colors: GOLD_M, burst: 92, upMin: 34, upMax: 62,
      spread: 36, sMin: 2.5, sMax: 8.5, stagger: 18, jitter: 90, lifeMin: 950, lifeMax: 1300 });
  }
};
var FXD = { super: 660, tip: 640, cheer: 560, sub: 560 };

function buildCard(id, setup) {
  var el = document.createElement('div');
  el.className = 'stg stg--' + THEME + ' stg--' + id;
  el.innerHTML = INNER[id];
  dock.appendChild(el);
  if (setup) setup(el);
  el._opts = glassOpts(id);
  el._ref = LG.glass(el, el._opts);
  el._id = id; el._fx = FX[id]; el._fxd = FXD[id];
  el.addEventListener('click', function () { if (!TYPE) stopCycle(); fire(el); });
  return el;
}

function setupSuper(el) {
  makeToken(el.querySelector('.obj-stage'), { w: 78, h: 78, thick: 9, round: '50%',
    edgeA: '#CE9E20', edgeB: '#A87E15', layers: 11, front: coinFront(), back: coinBack(),
    cls: 'coin', popCls: 'pop--coin' });
}
var PURPLE = { hi: '#F2E7FF', light: '#C9A4FF', light2: '#A878FF', base: '#9146FF',
  deep: '#5E2799', deep2: '#4A1878', dark: '#331263' };
function setupGem(pal) {
  return function (el) {
    var tok = makeToken(el.querySelector('.obj-stage'), { w: 76, h: 72, thick: 11, clip: GEM_CLIP,
      edgeA: pal.deep, edgeB: pal.dark, layers: 9, front: gemSVG(pal), back: gemBack(pal),
      cls: 'gem', popCls: 'pop--gem' });
    var g = document.createElement('i'); g.className = 'glint';
    tok.querySelector('.tok-face--front').appendChild(g);
  };
}
function setupTip(el) {
  var stage = el.querySelector('.obj-stage');
  var pop = document.createElement('div'); pop.className = 'pop pop--tile';
  var tile = document.createElement('div'); tile.className = 'tile';
  tile.innerHTML = tileSVG();
  pop.appendChild(tile); stage.appendChild(pop);
}
function setupSub(el) {
  el.querySelector('.obj-stage').insertAdjacentHTML('beforeend',
    '<i class="halo"></i><div class="bell">' + bellSVG() + '</div>');
}

var CARDS = {
  super: buildCard('super', setupSuper),
  tip: buildCard('tip', setupTip),
  cheer: buildCard('cheer', setupGem(PURPLE)),
  sub: buildCard('sub', setupSub)
};

/* ---- chameleon wiring: cards sample the bg canvas (chart / wash) ---- */
var CHAM = null;
function chamStart() {
  if (THEME !== 'chameleon' || CHAM || !CARDS) return;
  var stageEl = document.getElementById('stage');
  CHAM = ORDER.map(function (id) {
    return LG.chameleon(CARDS[id], { source: C, stage: stageEl, interval: 420, hue: 224, sat: 22 });
  });
}
function chamStop() { if (CHAM) { CHAM.forEach(function (c) { c.stop(); }); CHAM = null; } }
var CHAM_PRESET = { bright: { h: 46, s: 34, e: .05 }, dark: { h: 222, s: 12, e: 0 }, grad: { h: 258, s: 36, e: .04 } };
function chamSync() {
  if (THEME !== 'chameleon' || !CARDS) return;
  if (bgMode === 'chart' || bgMode === 'wash') { chamStop(); chamStart(); }
  else {
    chamStop();
    var p = CHAM_PRESET[bgMode];
    ORDER.forEach(function (id) {
      var el = CARDS[id]; if (!el || !p) return;
      el.style.setProperty('--ch-h', p.h);
      el.style.setProperty('--ch-s', p.s);
      el.style.setProperty('--ch-e', p.e);
    });
  }
}
rematerial();
chamSync();

/* ---- fire / kill / cycle ---- */
var active = null, cycling = true, cycleTimer = null, idx = 0;
function kill(el) {
  if (!el) return;
  clearTimeout(el._t1); clearTimeout(el._t2); clearTimeout(el._t3);
  el.classList.remove('in', 'out', 'sheen', 'on');
}
function fire(el) {
  var wasOn = active === el;
  kill(active); active = el;
  el.classList.remove('on');
  if (wasOn) void el.offsetWidth;   /* true unrender: cancels running hero animations */
  el.classList.add('on');
  if (wasOn) void el.offsetWidth;   /* re-render: coin/tile/gem/bell restart from zero */
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    if (el._ref) el._ref.refresh();             /* displacement map at true size */
    el.classList.remove('in', 'out', 'sheen');
    void el.offsetWidth;                        /* restart animations */
    el.classList.add('in', 'sheen');
  }); });
  el._t1 = setTimeout(function () { el._fx(el); }, el._fxd || 300);
  el._t2 = setTimeout(function () { el.classList.remove('in'); el.classList.add('out'); }, 5200);
  el._t3 = setTimeout(function () { el.classList.remove('out'); el.classList.remove('on'); }, 5740);
}
function fireId(id) { if (CARDS[id]) fire(CARDS[id]); }
function next() { fireId(ORDER[idx++ % ORDER.length]); }
function schedule() {
  cycleTimer = setTimeout(function () { if (cycling) { next(); schedule(); } }, 7400);
}
function stopCycle() { cycling = false; clearTimeout(cycleTimer); }

var TYPE = Q.get('type');
if (TYPE && ORDER.indexOf(TYPE) > -1) {
  cycling = false;
  fireId(TYPE);
  setInterval(function () { fireId(TYPE); }, 8000);
} else {
  TYPE = null;
  setTimeout(function () { next(); schedule(); }, 500);
}

addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  var MAP = { '1': 'super', '2': 'tip', '3': 'cheer', '4': 'sub' };
  if (MAP[k]) { if (TYPE) return; stopCycle(); fireId(MAP[k]); }
  if (k === 'b') { curBg = (curBg + 1) % BGS.length; bg(BGS[curBg]); }
});
</script>

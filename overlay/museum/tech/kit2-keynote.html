<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMILE · tech · keynote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:#000;color:#F5F5F7;
    font-family:-apple-system,'SF Pro Display','Inter','Helvetica Neue',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    display:grid;place-items:center;
  }
  .stage{width:min(560px,80vw)}
  .micro{
    font-size:13px;font-weight:400;color:#86868B;
    margin-bottom:14px;
  }
  /* the one panel: iOS-settings style, floating on pure black, no shadow */
  .panel{
    background:#1D1D1F;
    border-radius:28px;
    overflow:hidden;
  }
  .prog{height:3px;width:100%;background:#2C2C2E}
  .prog-bar{display:block;height:100%;width:0;background:#30D158;animation:fill 3.6s linear both}
  @keyframes fill{from{width:0}to{width:100%}}
  .panel h1{
    font-size:24px;font-weight:600;letter-spacing:-.015em;line-height:1.1;
    padding:30px 28px 22px;
  }
  .rows{list-style:none}
  .row{
    display:flex;align-items:center;justify-content:space-between;
    height:56px;padding:0 28px;
  }
  /* the only hairlines in the whole world: panel row separators */
  .row + .row{border-top:1px solid #2C2C2E}
  .row .lbl{font-size:17px;font-weight:400;color:#F5F5F7}
  .chk{
    position:relative;flex:0 0 auto;
    width:28px;height:28px;border-radius:50%;
    background:#2C2C2E;
    opacity:0;transform:translateY(8px);
    animation:go .55s cubic-bezier(.3,1.2,.4,1) both;
  }
  @keyframes go{to{opacity:1;transform:none;background:#30D158}}
  .row:nth-child(1) .chk{animation-delay:0s}
  .row:nth-child(2) .chk{animation-delay:1.2s}
  .row:nth-child(3) .chk{animation-delay:2.4s}
  /* CSS-drawn checkmark: rotated L-shaped border */
  .chk i{
    position:absolute;left:50%;top:50%;
    width:12px;height:7px;
    border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;
    transform:translate(-50%,-60%) rotate(-45deg);
    opacity:0;
  }
  .row:nth-child(1) .chk i{animation:tick .35s ease .3s both}
  .row:nth-child(2) .chk i{animation:tick .35s ease 1.5s both}
  .row:nth-child(3) .chk i{animation:tick .35s ease 2.7s both}
  @keyframes tick{from{opacity:0}to{opacity:1}}
  .mark{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:72px;height:72px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
  <main class="stage">
    <p class="micro">one moment</p>
    <section class="panel" aria-label="Quick check">
      <div class="prog" aria-hidden="true"><span class="prog-bar"></span></div>
      <h1>Quick check</h1>
      <ul class="rows">
        <li class="row"><span class="lbl">Microphone</span><span class="chk"><i></i></span></li>
        <li class="row"><span class="lbl">Camera</span><span class="chk"><i></i></span></li>
        <li class="row"><span class="lbl">Screen share</span><span class="chk"><i></i></span></li>
      </ul>
    </section>
  </main>
  <img class="mark" src="../assets/smile-mark.svg" alt="SMILE" width="72" height="72">
<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+600000,tp=q.get('t');
  if(tp){
    if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;}
    else{var d=new Date(tp);if(!isNaN(d.getTime()))target=d.getTime();}
  }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){
      e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x);
    });
    if(s<=0){
      document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');});
      document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');});
    }
  }
  tick();setInterval(tick,250);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMILE · tech · broadcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;border-radius:0;margin:0;padding:0}
:root{--bg:#0A0E1A;--panel:#10182B;--line:#1E2A45;--red:#E4002B;--sky:#4DA3FF;--white:#FFFFFF}
html,body{height:100%}
body{background:var(--bg);color:var(--white);font-family:'Archivo',system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
img{display:block}

/* ---------------- stage: hero / band / standby ---------------- */
.stage{position:fixed;inset:0 0 48px 0;display:flex;flex-direction:column}
.zone-a{flex:1.12;display:flex;align-items:flex-end;padding:0 5vw 5.5vh}
.zone-a h1{font-family:'Archivo Black','Archivo',sans-serif;font-weight:400;font-size:clamp(64px,7.5vw,140px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase;transform:skewX(-6deg);white-space:nowrap}

.band{height:140px;display:flex;flex:none}
.band i{flex:1 1 0}
.c1{background:#bfbfbf}.c2{background:#bfbf00}.c3{background:#00bfbf}.c4{background:#00bf00}
.c5{background:#bf00bf}.c6{background:#bf0000}.c7{background:#0000bf}

.zone-b{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(20px,3.4vh,34px);padding:0 5vw}
.standby{font-family:'Archivo Black','Archivo',sans-serif;font-weight:400;font-size:clamp(30px,3.4vw,60px);line-height:1;color:var(--red);text-transform:uppercase;transform:skewX(-6deg);animation:blink 1s steps(1,end) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}

/* ---------------- meters ---------------- */
.meters{display:flex;flex-direction:column;gap:16px;max-width:840px}
.mrow{display:flex;align-items:center;gap:20px}
.mrow .lab{width:54px;flex:none;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.track{flex:1;height:10px;background:var(--panel);border:1px solid var(--line);position:relative;transform:skewX(-12deg)}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--white);width:58%}
.fill::after{content:"";position:absolute;top:0;right:0;bottom:0;width:8%;background:var(--red)}
.f1{animation:m1 2.3s steps(1,end) infinite}
.f2{animation:m2 1.8s steps(1,end) infinite}
.f3{animation:m3 2.9s steps(1,end) infinite}
@keyframes m1{0%{width:58%}14%{width:74%}29%{width:41%}43%{width:83%}57%{width:36%}71%{width:66%}86%{width:49%}100%{width:58%}}
@keyframes m2{0%{width:34%}18%{width:62%}31%{width:78%}47%{width:28%}63%{width:71%}79%{width:44%}100%{width:34%}}
@keyframes m3{0%{width:76%}16%{width:52%}33%{width:88%}50%{width:31%}66%{width:57%}83%{width:69%}100%{width:76%}}

/* ---------------- LIVE bug ---------------- */
.livebug{position:fixed;top:28px;left:28px;z-index:60;background:var(--red);transform:skewX(-12deg);padding:11px 20px;pointer-events:none}
.livebug .up{display:flex;align-items:center;gap:9px;transform:skewX(12deg);font-weight:800;font-size:14px;letter-spacing:.16em}
.dot{width:8px;height:8px;background:var(--white);animation:blink 1s steps(1,end) infinite}

/* ---------------- score bug ---------------- */
.bug{position:fixed;left:0;bottom:0;width:100%;height:48px;z-index:60;pointer-events:none}
.bug-skew{width:calc(100% + 120px);margin-left:-60px;height:100%;background:var(--panel);transform:skewX(-12deg);display:flex;align-items:stretch}
.bug-tab{width:10px;background:var(--red);flex:none}
.seg{display:flex;align-items:center;padding:0 30px;border-right:1px solid var(--line)}
.seg .up{transform:skewX(12deg);display:flex;align-items:center;gap:10px;font-weight:700;font-size:12.5px;letter-spacing:.08em}
.seg-num{font-weight:800;font-size:20px;color:var(--sky);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.seg-mark{margin-left:auto;border-right:0;border-left:1px solid var(--line);padding-right:44px}
.seg-mark img{width:28px;height:28px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>

<main class="stage">
  <header class="zone-a">
    <h1>SIGNAL CHECK</h1>
  </header>

  <div class="band" aria-hidden="true">
    <i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><i class="c5"></i><i class="c6"></i><i class="c7"></i>
  </div>

  <section class="zone-b">
    <p class="standby">STAND BY</p>
    <div class="meters">
      <div class="mrow"><span class="lab">MIC</span><span class="track"><i class="fill f1"></i></span></div>
      <div class="mrow"><span class="lab">CAM</span><span class="track"><i class="fill f2"></i></span></div>
      <div class="mrow"><span class="lab">SYNC</span><span class="track"><i class="fill f3"></i></span></div>
    </div>
  </section>
</main>

<div class="livebug"><span class="up"><i class="dot" aria-hidden="true"></i>LIVE</span></div>

<footer class="bug">
  <div class="bug-skew">
    <i class="bug-tab" aria-hidden="true"></i>
    <div class="seg seg-ep"><span class="up"><span>EP</span><b class="seg-num" data-ep>128</b></span></div>
    <div class="seg seg-show"><span class="up"><span>PODCAST + SCREEN SHARE</span></span></div>
    <div class="seg seg-mark"><span class="up"><img src="../assets/smile-mark.svg" alt="SMILE mark" width="28" height="28"></span></div>
  </div>
</footer>

<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+600000, tp=q.get('t');
  if(tp){ if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;} else {var d=new Date(tp); if(!isNaN(d.getTime())) target=d.getTime();} }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  var el0=q.get('elapsed')?parseInt(q.get('elapsed'),10):0, t0=Date.now();
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){ e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x); });
    var el=el0+Math.floor((Date.now()-t0)/1000);
    document.querySelectorAll('[data-elapsed]').forEach(function(e){ e.textContent=P(Math.floor(el/60))+':'+P(el%60); });
    if(s<=0){
      document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');});
      document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');});
    }
  }
  tick(); setInterval(tick,250);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMILE · TECH · highvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --field:#15161A; --ink:#101114; --paper:#FFFFFF; --orange:#FF5A00; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    overflow:hidden; background:var(--field); color:var(--ink);
    font-family:'IBM Plex Mono','Courier New',monospace;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  }
  .stage{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:clamp(28px,5.5vh,64px);
    padding:clamp(24px,4vh,48px) clamp(16px,3vw,56px);}
  /* full-width equipment checklist */
  .panel{width:min(92vw,1600px);background:var(--paper);border:2px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;}
  .p-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--orange);border-bottom:2px solid var(--ink);
    padding:clamp(12px,1.9vh,20px) clamp(22px,2.6vw,52px);}
  .p-head h1{font-family:'Archivo Black','Arial Black',sans-serif;font-weight:400;
    color:#fff;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
    font-size:clamp(24px,1.9vw,32px);}
  .p-brand{color:var(--ink);font-weight:700;letter-spacing:.18em;white-space:nowrap;
    font-size:clamp(13px,1vw,16px);}
  .eq{display:flex;align-items:center;justify-content:space-between;gap:24px;
    padding:clamp(20px,3.2vh,34px) clamp(22px,2.6vw,52px);}
  .eq + .eq{border-top:2px solid var(--ink)}
  .eq h2{font-family:'Archivo Black','Arial Black',sans-serif;font-weight:400;
    color:var(--ink);text-transform:uppercase;letter-spacing:.03em;
    font-size:clamp(26px,2.4vw,42px);}
  .st{display:flex;align-items:center;gap:clamp(12px,1.2vw,20px);flex:0 0 auto}
  .sttxt{position:relative;display:inline-block;min-width:clamp(92px,8.5vw,150px);
    height:1.5em;text-align:right;}
  .st-testing{position:absolute;right:0;top:0;color:#5A5D63;font-weight:600;
    font-size:clamp(15px,1.3vw,22px);letter-spacing:.06em;animation:fadeout .35s both var(--d);}
  .st-ok{position:absolute;right:0;top:0;color:var(--ink);font-weight:700;
    font-size:clamp(15px,1.3vw,22px);letter-spacing:.08em;opacity:0;animation:fadein .35s both var(--d);}
  .chk{width:clamp(30px,2.4vw,40px);aspect-ratio:1;background:var(--orange);
    border:2px solid var(--ink);position:relative;flex:0 0 auto;opacity:0;
    animation:stamp .5s cubic-bezier(.2,.9,.25,1.15) both var(--d);}
  .chk::after{content:"";position:absolute;left:50%;top:50%;width:38%;height:20%;
    border-left:3px solid #fff;border-bottom:3px solid #fff;
    transform:translate(-58%,-62%) rotate(-45deg);}
  @keyframes stamp{
    0%{opacity:0;transform:scale(1.6) rotate(-6deg)}
    60%{opacity:1;transform:scale(.94) rotate(-2deg)}
    100%{opacity:1;transform:scale(1) rotate(-2deg)}
  }
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes fadeout{from{opacity:1}to{opacity:0}}
  /* the big slam-in stamp */
  .bigstamp{font-family:'Archivo Black','Arial Black',sans-serif;font-weight:400;
    color:var(--orange);border:3px double var(--orange);text-transform:uppercase;
    letter-spacing:.06em;line-height:1;white-space:nowrap;
    padding:clamp(14px,2.2vh,26px) clamp(26px,2.8vw,52px);
    font-size:clamp(34px,4.2vw,80px);transform:rotate(-8deg);opacity:0;
    animation:slam .55s cubic-bezier(.2,1.5,.35,1) 3.6s both;}
  @keyframes slam{
    from{opacity:0;transform:scale(2) rotate(-8deg)}
    to{opacity:1;transform:scale(1) rotate(-8deg)}
  }
  .wm{position:fixed;right:clamp(18px,2.4vw,44px);top:clamp(16px,3vh,34px);
    width:72px;height:72px;z-index:9;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.45));}
  .wm img{display:block;width:72px;height:72px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;animation-delay:0s!important}
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="panel" aria-label="Equipment check">
      <header class="p-head">
        <h1>EQUIPMENT CHECK — PRE-SHOW</h1>
        <span class="p-brand">SMILE · EP-<span data-ep>128</span></span>
      </header>
      <div class="eq" style="--d:0s">
        <h2>MIC</h2>
        <div class="st">
          <span class="sttxt"><span class="st-testing">TESTING…</span><span class="st-ok">OK</span></span>
          <span class="chk" aria-hidden="true"></span>
        </div>
      </div>
      <div class="eq" style="--d:1.2s">
        <h2>CAMERA</h2>
        <div class="st">
          <span class="sttxt"><span class="st-testing">TESTING…</span><span class="st-ok">OK</span></span>
          <span class="chk" aria-hidden="true"></span>
        </div>
      </div>
      <div class="eq" style="--d:2.4s">
        <h2>SCREEN SHARE</h2>
        <div class="st">
          <span class="sttxt"><span class="st-testing">TESTING…</span><span class="st-ok">OK</span></span>
          <span class="chk" aria-hidden="true"></span>
        </div>
      </div>
    </section>
    <div class="bigstamp">ALL SYSTEMS GO</div>
  </main>
  <div class="wm"><img src="../assets/smile-mark.svg" alt="SMILE"></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+600000, tp=q.get('t');
  if(tp){ if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;} else {var d=new Date(tp); if(!isNaN(d.getTime())) target=d.getTime();} }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  var el0=q.get('elapsed')?parseInt(q.get('elapsed'),10):0, t0=Date.now();
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){ e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x); });
    var el=el0+Math.floor((Date.now()-t0)/1000);
    document.querySelectorAll('[data-elapsed]').forEach(function(e){ e.textContent=P(Math.floor(el/60))+':'+P(el%60); });
    if(s<=0){ document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');}); document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');}); }
  }
  tick(); setInterval(tick,250);
})();
</script>
</body>
</html>

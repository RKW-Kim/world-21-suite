<title>SMILE · be right back</title>

<style>
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0a0a0a;
  --bg:#09090b; --border:#27272a; --fg:#fafafa; --muted:#a1a1aa; --faint:#82828b;
  --up:#0ECB81; --down:#F6465D;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:96px; /* bottom module zone — the ticker module docks here */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--yellow);color:var(--ink)}
.page{position:relative;display:flex;flex-direction:column;height:100%}

.ambient{position:absolute;inset:0;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%)}
.spot{position:absolute;inset:0;background:radial-gradient(ellipse 64% 44% at 50% -10%,rgba(255,255,255,.09),transparent 70%)}
.aura{position:absolute;left:50%;top:42%;width:680px;height:460px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,193,7,.07),transparent 64%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 56%,rgba(0,0,0,.5) 100%)}

.topbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:22px clamp(18px,4vw,48px)}
.brand{display:inline-flex;align-items:center}
.brand svg{height:clamp(20px,2.6vh,28px);width:auto}
.awaychip{border:1px solid var(--border);border-radius:999px;padding:8px 16px;
  font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:var(--muted)}
.awaychip b{color:var(--yellow);font-weight:600}

.wrap{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(14px,2.6vh,26px);text-align:center;padding:0 24px var(--safe-b)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* buffer spinner — face parked inside two calm rings */
.buffer{position:relative;width:clamp(180px,30vh,260px);height:clamp(180px,30vh,260px);
  display:grid;place-items:center;animation:rise .9s cubic-bezier(.2,.9,.3,1) .05s both}
.buffer::before{content:"";position:absolute;inset:0;border-radius:50%;
  border:6px solid rgba(255,255,255,.07);border-top-color:var(--yellow);
  animation:spin 1.6s cubic-bezier(.6,.15,.4,.85) infinite}
.buffer::after{content:"";position:absolute;inset:14px;border-radius:50%;
  border:2px dashed rgba(255,193,7,.22);animation:spinRev 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
.buffer .face{width:clamp(104px,17vh,142px);height:clamp(104px,17vh,142px);
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.5));animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.buffer svg{width:100%;height:100%}

.eyebrow{display:inline-flex;align-items:center;gap:9px;border-radius:999px;
  border:1px solid rgba(255,193,7,.35);background:rgba(255,193,7,.06);color:var(--yellow);
  padding:7px 16px;font-family:var(--fm);font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .15s both}
h1{font-family:var(--fd);font-weight:700;font-size:clamp(42px,9.5vh,92px);line-height:1.02;
  letter-spacing:-.035em;animation:rise .9s cubic-bezier(.2,.9,.3,1) .25s both}
h1 .y{background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent}
h1 .g{background:linear-gradient(180deg,#fafafa 25%,#86868e 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:560px;font-size:clamp(14px,2.4vh,20px);font-weight:500;color:var(--muted);
  line-height:1.5;animation:rise .8s cubic-bezier(.2,.9,.3,1) .35s both}

/* away timer + bounce dots */
.meta{display:flex;align-items:center;gap:18px;animation:rise .8s cubic-bezier(.2,.9,.3,1) .45s both}
.timer{font-family:var(--fm);font-weight:600;font-size:clamp(15px,2.6vh,20px);
  letter-spacing:.14em;color:var(--fg);border:1px solid var(--border);border-radius:12px;
  background:rgba(14,14,17,.7);padding:10px 18px}
.timer span{color:var(--faint);font-size:10px;letter-spacing:.26em;margin-right:10px}
.bnc{display:flex;gap:9px}
.bnc i{width:9px;height:9px;border-radius:50%;background:var(--yellow);animation:bnc 1.2s ease-in-out infinite}
.bnc i:nth-child(2){animation-delay:.15s;background:var(--up)}
.bnc i:nth-child(3){animation-delay:.3s;background:var(--down)}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.usin{font-family:var(--fm);font-size:9.5px;letter-spacing:.22em;color:var(--muted);
  border:1px solid var(--border);border-radius:999px;padding:7px 13px;background:rgba(14,14,17,.55)}


@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="page">
  <div class="ambient" aria-hidden="true">
    <div class="dots"></div><div class="spot"></div><div class="aura"></div><div class="vig"></div>
  </div>

  <header class="topbar">

        <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>

    </span>
    <span class="awaychip">DESK SECURED · <b class="num" id="clock">--:--</b> EAT</span>
  </header>

  <main class="wrap">
    <div class="buffer">
      <span class="face" aria-hidden="true">
        <svg viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg">
          <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>

        </svg>
      </span>
    </div>

    <span class="eyebrow">Be Right Back</span>
    <h1><span class="g">positions</span> <span class="y">paused.</span></h1>
    <p class="sub">Stepped away for a moment — charts are watching themselves, and the smile is intact.</p>

    <div class="meta">
      <span class="timer num"><span>AWAY FOR</span><span id="away">00:00</span></span>
      <span class="bnc" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="usin">USUALLY BACK IN ~5 MIN</span>
    </div>
  </main>

</div>

<script>
/* one gated interval — away timer + clock. that's all. */
(function(){
  var awayEl=document.getElementById('away'),ck=document.getElementById('clock'),lastMin=-1;
  function two(n){return String(n).padStart(2,'0')}
  function tick(){
    if(document.hidden)return;
    var s=Math.floor(Date.now()/1000);
    var el=s-START;
    awayEl.textContent=two(Math.floor(el/60))+':'+two(el%60);
    var m=Math.floor((s+10800)%86400/60); /* EAT = UTC+3 */
    if(m!==lastMin){lastMin=m;ck.textContent=two(Math.floor(m/60))+':'+two(m%60);}
  }
  var START=Math.floor(Date.now()/1000);
  tick();setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
})();
</script>
</body>

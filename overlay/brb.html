<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · be right back</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<style>
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0a0a0a;
  --bg:#09090b; --border:#27272a; --fg:#fafafa; --muted:#a1a1aa; --faint:#9b9ba4;
  --up:#0ECB81; --down:#F6465D;
  --fd:'Inter',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:76px; /* EXACTLY the ticker module dock height (1920×76) */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fd);
  overflow:hidden;-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--yellow);color:var(--ink)}
.page{position:relative;display:flex;flex-direction:column;height:100%}

.ambient{position:absolute;inset:0;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.09) 1.1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%)}
.spot{position:absolute;inset:0;background:radial-gradient(ellipse 64% 44% at 50% -10%,rgba(255,255,255,.09),transparent 70%)}
.aura{position:absolute;left:50%;top:42%;width:680px;height:460px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,193,7,.07),transparent 64%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 56%,rgba(0,0,0,.5) 100%)}

.topbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:flex-end;
  padding:22px clamp(18px,4vw,48px)}
.awaychip{border:1px solid var(--border);border-radius:999px;padding:8px 16px;
  background:rgba(10,10,12,.82);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 24px rgba(0,0,0,.35);
  font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:var(--muted)}
.awaychip b{color:var(--yellow);font-weight:600}

.wrap{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(14px,2.6vh,26px);text-align:center;padding:0 24px var(--safe-b)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* buffer — the face floats inside two ultra-calm rings (no busy spinner) */
.buffer{position:relative;width:clamp(180px,30vh,260px);height:clamp(180px,30vh,260px);
  display:grid;place-items:center;animation:rise .9s cubic-bezier(.2,.9,.3,1) .05s both}
.buffer::before{content:"";position:absolute;inset:0;border-radius:50%;
  border:2px dashed rgba(255,255,255,.14);animation:spin 42s linear infinite}
.buffer::after{content:"";position:absolute;inset:16px;border-radius:50%;
  border:2px dashed rgba(255,193,7,.22);animation:spinRev 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
.buffer .face{width:clamp(104px,17vh,142px);height:clamp(104px,17vh,142px);
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.5));animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.buffer svg{width:100%;height:100%}

/* drifting mini faces — slow, faint, far background: something to graze at,
   nothing to watch hard. compositor transform only. */

.eyebrow{display:inline-flex;align-items:center;gap:9px;border-radius:999px;
  border:1px solid rgba(255,193,7,.35);background:rgba(255,193,7,.06);color:var(--yellow);
  padding:7px 16px;font-family:var(--fm);font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .15s both}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(42px,9.5vh,92px);line-height:1.02;
  letter-spacing:-.035em;animation:rise .9s cubic-bezier(.2,.9,.3,1) .25s both;
  text-shadow:0 2px 18px rgba(0,0,0,.55)}
h1 .y{background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,193,7,.28))}
h1 .g{background:linear-gradient(180deg,#fafafa 25%,#86868e 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 12px rgba(0,0,0,.6))}
.sub{max-width:560px;font-size:clamp(14px,2.4vh,20px);font-weight:500;color:var(--muted);
  line-height:1.5;animation:rise .8s cubic-bezier(.2,.9,.3,1) .35s both;
  text-shadow:0 2px 10px rgba(0,0,0,.5)}

/* quiet companions — no away clock, just a soft pulse + the usual promise */
.meta{display:flex;align-items:center;gap:18px;animation:rise .8s cubic-bezier(.2,.9,.3,1) .45s both}
.bnc{display:flex;gap:9px}
.bnc i{width:8px;height:8px;border-radius:50%;background:var(--yellow);animation:bnc 2.8s ease-in-out infinite}
.bnc i:nth-child(2){animation-delay:.4s;background:var(--up)}
.bnc i:nth-child(3){animation-delay:.8s;background:var(--down)}
@keyframes bnc{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-7px);opacity:1}}
.usin{font-family:var(--fm);font-size:9.5px;letter-spacing:.22em;color:var(--muted);
  border:1px solid var(--border);border-radius:999px;padding:7px 13px;background:rgba(14,14,17,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.35)}



/* ── plain-sight brand signature ────────────────────────────────────────
   The fallback mark: when the watermark module is not layered over this
   scene, the brand still leads to smile.co.ke — centered in the
   composition, in plain sight, quiet enough to never distract. ───────── */
.sig{font-family:var(--fm);font-size:11px;letter-spacing:.46em;color:rgba(250,250,250,.38);
  text-align:center;animation:rise .8s cubic-bezier(.2,.9,.3,1) .5s both}
.sig b{font-weight:600;color:rgba(255,193,7,.62)}
.sig .d{display:inline-block;width:4px;height:4px;border-radius:50%;background:rgba(255,193,7,.5);
  vertical-align:middle;margin:0 10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="page">
  <div class="ambient" aria-hidden="true">
    <div class="dots"></div><div class="spot"></div><div class="aura"></div><div class="vig"></div>
  </div>

  <header class="topbar">
    <span class="awaychip">DESK SECURED · <b class="num" id="clock">--:--</b> EAT</span>
  </header>

  <main class="wrap">
    <div class="buffer">
      <span class="face" aria-hidden="true">
        <svg viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg">
          <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>
          <path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#0A0900"/>
          <path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#0A0900"/>
          <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0A0900"/>
        </svg>
      </span>
    </div>

    <span class="eyebrow">Be Right Back</span>
    <h1><span class="g">positions</span> <span class="y">paused.</span></h1>
    <p class="sub">Stepped away for a moment — breathe, stretch, sip something. The desk comes back before you know it.</p>

    <div class="meta">
      <span class="bnc" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="usin">USUALLY BACK IN ~5 MIN</span>
    </div>
    <p class="sig">smile<b>.co.ke</b></p>
  </main>

</div>

<script>
/* one gated interval — the EAT clock. that's all. nothing here counts your absence. */
(function(){
  var ck=document.getElementById('clock'),lastMin=-1;
  function two(n){return String(n).padStart(2,'0')}
  function tick(){
    if(document.hidden)return;
    var m=Math.floor((Date.now()/60000+180)%1440); /* EAT = UTC+3 */
    if(m!==lastMin){lastMin=m;ck.textContent=two(Math.floor(m/60))+':'+two(m%60);}
  }
  tick();setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
})();
</script>
</body>
</html>

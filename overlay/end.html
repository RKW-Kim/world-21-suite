<style>
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0a0a0a;
  --bg:#09090b; --border:#27272a; --fg:#fafafa; --muted:#a1a1aa; --faint:#82828b;
  --up:#0ECB81; --down:#F6465D; --sky:#3FB6FF;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:96px; /* bottom module zone — the ticker module docks here */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--yellow);color:var(--ink)}
.page{position:relative;display:flex;flex-direction:column;height:100%}

.ambient{position:absolute;inset:0;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%)}
.spot{position:absolute;inset:0;background:radial-gradient(ellipse 64% 44% at 50% -10%,rgba(255,255,255,.09),transparent 70%)}
.aura{position:absolute;left:50%;top:42%;width:760px;height:500px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,193,7,.08),transparent 64%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 56%,rgba(0,0,0,.5) 100%)}

/* confetti — 18 pieces, transform/opacity only */
.cf{position:absolute;top:-4%;border-radius:3px;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{opacity:0;transform:translate3d(0,-4vh,0) rotate(0)}8%{opacity:.9}
  92%{opacity:.7}100%{opacity:0;transform:translate3d(var(--sx,0px),108vh,0) rotate(var(--rz,540deg))}}

.topbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:22px clamp(18px,4vw,48px)}
.brand{display:inline-flex;align-items:center}
.brand svg{height:clamp(20px,2.6vh,28px);width:auto}
.clockchip{border:1px solid var(--border);border-radius:999px;padding:8px 16px;
  font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:var(--muted)}
.clockchip b{color:var(--fg);font-weight:600}

.wrap{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(12px,2.2vh,20px);text-align:center;padding:0 24px var(--safe-b);min-height:0}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;
  border:1px solid rgba(14,203,129,.4);background:rgba(14,203,129,.07);color:var(--up);
  padding:7px 16px;font-family:var(--fm);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .05s both}
.chip .ck{width:9px;height:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(-45deg) translateY(-1px)}
.face{width:clamp(84px,13vh,122px);height:clamp(84px,13vh,122px);
  filter:drop-shadow(0 14px 30px rgba(255,193,7,.18)) drop-shadow(0 10px 24px rgba(0,0,0,.5));
  animation:rise .9s cubic-bezier(.2,.9,.3,1) .12s both}
.face svg{width:100%;height:100%;animation:breathe 4s ease-in-out 1s infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
h1{font-family:var(--fd);font-weight:700;font-size:clamp(44px,10vh,96px);line-height:1.0;
  letter-spacing:-.035em;animation:rise .9s cubic-bezier(.2,.9,.3,1) .2s both}
h1 .g{background:linear-gradient(180deg,#fafafa 25%,#86868e 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
h1 .y{background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:620px;font-size:clamp(14px,2.3vh,19px);font-weight:500;color:var(--muted);
  line-height:1.5;animation:rise .8s cubic-bezier(.2,.9,.3,1) .3s both}
.sub b{color:var(--fg);font-weight:600}

.socials{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .4s both}
.soc{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:999px;
  background:rgba(14,14,17,.72);padding:9px 16px;font-family:var(--fm);font-size:10px;
  letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.soc svg{width:13px;height:13px;color:var(--muted);fill:currentColor;stroke:none;flex:none}
.soc b{color:var(--fg);font-weight:600}
.next{display:inline-flex;align-items:center;gap:9px;border-radius:999px;
  background:linear-gradient(135deg,var(--yellow),var(--hot));color:var(--ink);
  padding:10px 20px;font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;animation:rise .8s cubic-bezier(.2,.9,.3,1) .5s both}


@media (max-width:720px){.soc span{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}
  .cf{display:none}}
</style>
</head>

        <path class="cls-2" d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z"/>
        <path class="cls-2" d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z"/>

<script>
/* confetti: 18 pre-built pieces, pure CSS animation. one gated interval for the clock. */
(function(){
  var box=document.getElementById('cfs'),cols=['#FFC107','#0ECB81','#F6465D','#ffffff','#3FB6FF'];
  for(var i=0;i<18;i++){
    var s=document.createElement('span');s.className='cf';
    s.style.left=(3+Math.random()*94)+'%';
    s.style.background=cols[i%cols.length];
    s.style.width=(7+Math.random()*7)+'px';
    s.style.height=(14+Math.random()*10)+'px';
    s.style.animationDuration=(6+Math.random()*5)+'s';
    s.style.animationDelay=(Math.random()*6)+'s';
    s.style.setProperty('--sx',(Math.random()*140-70)+'px');
    s.style.setProperty('--rz',(360+Math.random()*480)+'deg');
    box.appendChild(s);
  }
  var ck=document.getElementById('clock'),lastMin=-1;
  function two(n){return String(n).padStart(2,'0')}
  function tick(){
    if(document.hidden)return;
    var m=Math.floor((Date.now()/60000+180)%1440); /* EAT = UTC+3 */
    if(m!==lastMin){lastMin=m;ck.textContent=two(Math.floor(m/60))+':'+two(m%60);}
  }
  tick();setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
})();
</script>

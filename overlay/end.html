<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · session closed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0a0a0a;
  --bg:#09090b; --border:#27272a; --fg:#fafafa; --muted:#a1a1aa; --faint:#82828b;
  --up:#0ECB81; --down:#F6465D; --sky:#3FB6FF;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:96px; /* bottom module zone — the ticker module docks here */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--yellow);color:var(--ink)}
.page{position:relative;display:flex;flex-direction:column;height:100%}

.ambient{position:absolute;inset:0;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%)}
.spot{position:absolute;inset:0;background:radial-gradient(ellipse 64% 44% at 50% -10%,rgba(255,255,255,.09),transparent 70%)}
.aura{position:absolute;left:50%;top:42%;width:760px;height:500px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,193,7,.08),transparent 64%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 56%,rgba(0,0,0,.5) 100%)}

/* confetti — 18 pieces, transform/opacity only */
.cf{position:absolute;top:-4%;border-radius:3px;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{opacity:0;transform:translate3d(0,-4vh,0) rotate(0)}8%{opacity:.9}
  92%{opacity:.7}100%{opacity:0;transform:translate3d(var(--sx,0px),108vh,0) rotate(var(--rz,540deg))}}

.topbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:flex-end;
  padding:22px clamp(18px,4vw,48px)}
.clockchip{border:1px solid var(--border);border-radius:999px;padding:8px 16px;
  font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:var(--muted)}
.clockchip b{color:var(--fg);font-weight:600}

/* rising cheers — tiny brand-colored dots float up through the confetti */
.cheer{position:absolute;bottom:-3vh;border-radius:50%;opacity:0;pointer-events:none;
  animation:cheerUp var(--d,9s) ease-in-out infinite;animation-delay:var(--dl,0s);will-change:transform}
@keyframes cheerUp{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.85}85%{opacity:.6}
  100%{transform:translate3d(var(--sw,24px),-106vh,0);opacity:0}}

.wrap{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(12px,2.2vh,20px);text-align:center;padding:0 24px var(--safe-b);min-height:0}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;
  border:1px solid rgba(14,203,129,.4);background:rgba(14,203,129,.07);color:var(--up);
  padding:7px 16px;font-family:var(--fm);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .05s both}
.chip .ck{width:9px;height:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(-45deg) translateY(-1px)}
.face-wrap{position:relative;display:inline-flex;animation:rise .9s cubic-bezier(.2,.9,.3,1) .12s both}
.face-wrap .halo{position:absolute;inset:-20px;border-radius:50%;
  border:2px dashed rgba(255,193,7,.32);animation:spin 36s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.face{width:clamp(84px,13vh,122px);height:clamp(84px,13vh,122px);
  filter:drop-shadow(0 14px 30px rgba(255,193,7,.18)) drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.face svg{width:100%;height:100%;animation:breathe 4s ease-in-out 1s infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
h1{font-family:var(--fd);font-weight:700;font-size:clamp(44px,10vh,96px);line-height:1.0;
  letter-spacing:-.035em;animation:rise .9s cubic-bezier(.2,.9,.3,1) .2s both}
h1 .g{background:linear-gradient(180deg,#fafafa 25%,#86868e 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
h1 .y{background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:620px;font-size:clamp(14px,2.3vh,19px);font-weight:500;color:var(--muted);
  line-height:1.5;animation:rise .8s cubic-bezier(.2,.9,.3,1) .3s both}
.sub b{color:var(--fg);font-weight:600}

.socials{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .4s both}
.soc{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:999px;
  background:rgba(14,14,17,.72);padding:9px 16px;font-family:var(--fm);font-size:10px;
  letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.soc svg{width:13px;height:13px;color:var(--muted);fill:currentColor;stroke:none;flex:none}
.soc b{color:var(--fg);font-weight:600}
.next{display:inline-flex;align-items:center;gap:9px;border-radius:999px;
  background:linear-gradient(135deg,var(--yellow),var(--hot));color:var(--ink);
  padding:10px 20px;font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;animation:rise .8s cubic-bezier(.2,.9,.3,1) .5s both,pulse 3.4s ease-in-out 1.8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}


@media (max-width:720px){.soc span{display:none}}

/* ── plain-sight brand signature ────────────────────────────────────────
   The fallback mark: when the watermark module is not layered over this
   scene, the brand still leads to smile.co.ke — centered in the
   composition, in plain sight, quiet enough to never distract. ───────── */
.sig{font-family:var(--fm);font-size:11px;letter-spacing:.46em;color:rgba(250,250,250,.38);
  text-align:center;animation:rise .8s cubic-bezier(.2,.9,.3,1) .5s both}
.sig b{font-weight:600;color:rgba(255,193,7,.62)}
.sig .d{display:inline-block;width:4px;height:4px;border-radius:50%;background:rgba(255,193,7,.5);
  vertical-align:middle;margin:0 10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}
  .cf,.cheer{display:none}}
</style>
</head>
<body>
<div class="page">
  <div class="ambient" aria-hidden="true">
    <div class="dots"></div><div class="spot"></div><div class="aura"></div><div class="vig"></div>
    <div id="cfs"></div>
    <i class="cheer" style="left:18%;width:7px;height:7px;background:#FFC107;--d:8s;--dl:-2s;--sw:26px"></i>
    <i class="cheer" style="left:38%;width:9px;height:9px;background:#0ECB81;--d:10.5s;--dl:-6s;--sw:-30px"></i>
    <i class="cheer" style="left:60%;width:6px;height:6px;background:#F6465D;--d:9s;--dl:-4s;--sw:18px"></i>
    <i class="cheer" style="left:82%;width:8px;height:8px;background:#ffffff;--d:11s;--dl:-8.5s;--sw:-22px"></i>
    <i class="cheer" style="left:48%;width:5px;height:5px;background:#3FB6FF;--d:7.5s;--dl:-1s;--sw:34px"></i>
  </div>

  <header class="topbar">
    <span class="clockchip"><b class="num" id="clock">--:--</b> · SEE YOU NEXT SESSION · EAT</span>
  </header>

  <main class="wrap">
    <span class="chip"><i class="ck" aria-hidden="true"></i>Market Closed</span>
    <span class="face-wrap">
      <i class="halo" aria-hidden="true"></i>
      <span class="face" aria-hidden="true">
        <svg viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg">
          <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>
          <path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#0A0900"/>
          <path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#0A0900"/>
          <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0A0900"/>
        </svg>
      </span>
    </span>

    <h1><span class="g">session</span> <span class="y">closed.</span></h1>
    <p class="sub"><b>Asante</b> for trading with us today — books balanced, smile intact. Same desk, same energy, next time.</p>

    <div class="socials">
      <span class="soc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 12s0-3.85-.49-5.7a3 3 0 0 0-2.1-2.1C18.56 3.7 12 3.7 12 3.7s-6.56 0-8.4.5a3 3 0 0 0-2.11 2.1C1 8.15 1 12 1 12s0 3.85.49 5.7a3 3 0 0 0 2.1 2.1c1.85.5 8.41.5 8.41.5s6.56 0 8.4-.5a3 3 0 0 0 2.11-2.1C23 15.85 23 12 23 12zM9.75 15.02V8.98L15.5 12z"/></svg><b>YouTube</b><span>/smileke</span></span>
      <span class="soc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 2 1.714 6.286v15.428h5.143V26l4.286-4.286h3.428L22.286 14V2zm14.571 11.143-3.428 3.428h-3.429l-3 3v-3H6.857V3.714h13.714z"/></svg><b>Twitch</b><span>/smileke</span></span>
      <span class="soc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg><b>TikTok</b><span>@smileke</span></span>
    </div>

    <span class="next">Until next time</span>
    <p class="sig">smile<b>.co.ke</b></p>
  </main>

</div>

<script>
/* confetti: 18 pre-built pieces, pure CSS animation. one gated interval for the clock. */
(function(){
  var box=document.getElementById('cfs'),cols=['#FFC107','#0ECB81','#F6465D','#ffffff','#3FB6FF'];
  for(var i=0;i<18;i++){
    var s=document.createElement('span');s.className='cf';
    s.style.left=(3+Math.random()*94)+'%';
    s.style.background=cols[i%cols.length];
    s.style.width=(7+Math.random()*7)+'px';
    s.style.height=(14+Math.random()*10)+'px';
    s.style.animationDuration=(6+Math.random()*5)+'s';
    s.style.animationDelay=(Math.random()*6)+'s';
    s.style.setProperty('--sx',(Math.random()*140-70)+'px');
    s.style.setProperty('--rz',(360+Math.random()*480)+'deg');
    box.appendChild(s);
  }
  var ck=document.getElementById('clock'),lastMin=-1;
  function two(n){return String(n).padStart(2,'0')}
  function tick(){
    if(document.hidden)return;
    var m=Math.floor((Date.now()/60000+180)%1440); /* EAT = UTC+3 */
    if(m!==lastMin){lastMin=m;ck.textContent=two(Math.floor(m/60))+':'+two(m%60);}
  }
  tick();setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
})();
</script>
</body>
</html>

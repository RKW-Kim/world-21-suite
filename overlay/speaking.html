<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · now speaking</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0a0a0a;
  --bg:#09090b; --border:#27272a; --fg:#fafafa; --muted:#a1a1aa; --faint:#82828b;
  --up:#0ECB81; --down:#F6465D;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:96px; /* bottom module zone — the ticker module docks here */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--yellow);color:var(--ink)}
.page{position:relative;display:flex;flex-direction:column;height:100%}

/* ── ambient (static paint, zero filters) ── */
.ambient{position:absolute;inset:0;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%)}
.spot{position:absolute;inset:0;background:radial-gradient(ellipse 64% 44% at 50% -10%,rgba(255,255,255,.09),transparent 70%)}
.aura{position:absolute;left:50%;top:40%;width:820px;height:560px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,193,7,.08),transparent 64%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 56%,rgba(0,0,0,.5) 100%)}

/* ── topbar ── */
.topbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:flex-end;
  padding:22px clamp(18px,4vw,48px)}
.clockchip{border:1px solid var(--border);border-radius:999px;padding:8px 16px;
  font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:var(--muted)}
.clockchip b{color:var(--fg);font-weight:600}

/* ── hero ── */
.hero{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(10px,1.9vh,20px);text-align:center;
  padding:0 24px calc(8px + var(--safe-b));min-height:0}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* ON AIR lamp — red, the studio-sign exception to the yellow rule */
.onair{display:inline-flex;align-items:center;gap:9px;border-radius:999px;
  border:1px solid rgba(246,70,93,.45);background:rgba(246,70,93,.07);color:var(--down);
  padding:7px 16px;font-family:var(--fm);font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .05s both}
.onair .lamp{position:relative;width:8px;height:8px;border-radius:50%;background:var(--down)}
.onair .lamp::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;
  animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.7);opacity:0}}

/* ── the mic: verbatim face in a studio frame, sound rippling out ── */
.mic{position:relative;width:clamp(104px,18vh,164px);aspect-ratio:1;
  display:grid;place-items:center;animation:rise .9s cubic-bezier(.2,.9,.3,1) .12s both}
.mic .ring{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.mic .ring.dash{border:2px dashed rgba(255,193,7,.3);animation:spin 42s linear infinite}
.mic .rip{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,193,7,.4);
  opacity:0;animation:rip 3.6s cubic-bezier(.2,.6,.3,1) infinite;will-change:transform,opacity}
.mic .rip.r2{animation-delay:1.8s}
@keyframes rip{0%{transform:scale(.8);opacity:0}12%{opacity:.5}100%{transform:scale(1.8);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.mic .face{position:relative;width:74%;height:74%;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5));
  animation:bob 4.5s ease-in-out 1s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.mic svg{width:100%;height:100%}

h1{font-family:var(--fd);font-weight:700;font-size:clamp(34px,7.6vh,72px);
  line-height:1.02;letter-spacing:-.035em;animation:rise .9s cubic-bezier(.2,.9,.3,1) .22s both}
h1 .g{background:linear-gradient(180deg,#fafafa 25%,#86868e 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
h1 .y{background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* tagline — the lineup's cycling signature, three stacked lines */
.tag{position:relative;height:1.5em;width:min(88vw,720px);overflow:hidden;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .3s both}
.tag span{position:absolute;inset:0;display:block;line-height:1.5em;text-align:center;
  font-family:var(--fd);font-weight:500;font-size:clamp(13px,2.2vh,18px);
  background:linear-gradient(180deg,#e8e8ec 20%,#9a9aa2 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:translateY(12px);animation:tagCycle 12s infinite}
.tag span b{-webkit-text-fill-color:var(--ink);color:var(--ink);
  background:var(--yellow);border-radius:5px;padding:0 7px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.tag span:nth-child(2){animation-delay:4s}
.tag span:nth-child(3){animation-delay:8s}
@keyframes tagCycle{0%{opacity:0;transform:translateY(12px)}3%,27%{opacity:1;transform:none}
  33%,100%{opacity:0;transform:translateY(-12px)}}

/* ── the equaliser — stylised feed: transform-only bars, no canvas, no rAF ──
   every bar is baked once at load with its own base --b, peak --t, duration --d
   and a NEGATIVE delay so the wave is already mid-flight at frame one. */
.eqwrap{display:flex;flex-direction:column;align-items:center;gap:7px;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .42s both}
.eqzone{position:relative;width:min(86vw,700px)}
.eq{display:flex;align-items:flex-end;gap:clamp(3px,.45vw,6px);
  height:clamp(44px,10.5vh,104px);overflow:hidden}
.bar{flex:1;min-width:3px;height:100%;border-radius:4px 4px 2px 2px;
  background:linear-gradient(180deg,#FFE08A,#FFC107 55%,#93720a);
  transform-origin:bottom;transform:scaleY(var(--b,.5));
  animation:eqB var(--d,1s) ease-in-out var(--dl,0s) infinite alternate;will-change:transform}
@keyframes eqB{from{transform:scaleY(var(--b,.5))}to{transform:scaleY(var(--t,1))}}
.baseline{height:1px;background:linear-gradient(90deg,transparent,rgba(255,193,7,.5) 18%,rgba(255,193,7,.5) 82%,transparent)}
.eqmirror{display:flex;align-items:flex-start;gap:clamp(3px,.45vw,6px);
  height:clamp(18px,4vh,40px);transform:scaleY(-1);opacity:.14;overflow:hidden;
  -webkit-mask-image:linear-gradient(0deg,#000,transparent 78%);
          mask-image:linear-gradient(0deg,#000,transparent 78%)}
.eqmirror .bar{animation-duration:calc(var(--d,1s) + .15s)}
.eqlab{display:flex;justify-content:space-between;width:min(86vw,700px);
  font-family:var(--fm);font-weight:600;font-size:8.5px;letter-spacing:.3em;
  color:var(--faint);text-transform:uppercase}
.eqlab i{font-style:normal;color:rgba(255,193,7,.55)}

/* ── crew chips — one per voice; the lit chip is who the room hears ── */
.crew{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:860px;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .5s both}
.spk{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:999px;
  background:rgba(14,14,17,.66);padding:7px 15px 7px 8px;
  transition:border-color .45s cubic-bezier(.2,.9,.3,1)}
.spk .av{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,193,7,.4);
  display:grid;place-items:center;font-family:var(--fm);font-weight:600;font-size:11px;
  color:var(--yellow);background:rgba(255,193,7,.07);flex:none;
  transition:background .45s,color .45s,border-color .45s}
.spk .nm{font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.02em;color:var(--muted);
  transition:color .45s}
.spk .meq{display:flex;align-items:flex-end;gap:2px;height:13px;flex:none}
.spk .meq i{width:3px;height:100%;border-radius:2px;background:var(--yellow);opacity:.5;
  transform-origin:bottom;transform:scaleY(var(--b,.4));
  animation:eqB var(--d,.7s) ease-in-out var(--dl,0s) infinite alternate}
.spk.on{border-color:rgba(255,193,7,.6)}
.spk.on .nm{color:var(--fg)}
.spk.on .av{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.spk.on .meq i{opacity:.95}

/* ── plain-sight brand signature ────────────────────────────────────────
   The fallback mark: when the watermark module is not layered over this
   scene, the brand still leads to smile.co.ke — centered in the
   composition, in plain sight, quiet enough to never distract. ───────── */
.sig{font-family:var(--fm);font-size:11px;letter-spacing:.46em;color:rgba(250,250,250,.38);
  text-align:center;animation:rise .8s cubic-bezier(.2,.9,.3,1) .56s both}
.sig b{font-weight:600;color:rgba(255,193,7,.62)}
.sig .d{display:inline-block;width:4px;height:4px;border-radius:50%;background:rgba(255,193,7,.5);
  vertical-align:middle;margin:0 10px}

@media (max-height:640px){
  .mic{width:clamp(88px,14vh,120px)}
  .crew{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .tag span:first-child{opacity:1;transform:none}
  .bar{transform:scaleY(var(--b,.5))}
  .mic .rip{opacity:0}
}
</style>
</head>
<body>
<div class="page">
  <div class="ambient" aria-hidden="true">
    <div class="dots"></div><div class="spot"></div><div class="aura"></div><div class="vig"></div>
  </div>

  <header class="topbar">
    <span class="clockchip"><b class="num" id="clock">--:--</b> · NAIROBI DESK · EAT</span>
  </header>

  <main class="hero">
    <span class="onair"><span class="lamp" aria-hidden="true"></span>On Air · Voice Room</span>

    <div class="mic" aria-hidden="true">
      <i class="rip"></i><i class="rip r2"></i>
      <i class="ring dash"></i>
      <span class="face">
        <!-- smile face — verbatim crop of the real logo (same 4 paths, tight viewBox) -->
        <svg viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg">
          <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>
          <path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#0A0900"/>
          <path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#0A0900"/>
          <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0A0900"/>
        </svg>
      </span>
    </div>

    <h1 id="bigLine"><span class="g">the mic</span> <span class="y">is live.</span></h1>

    <p class="tag" aria-hidden="true">
      <span>Cameras off. <b>Voices on.</b> That's the whole dress code.</span>
      <span>Shy is welcome — the <b>smile</b> does the talking.</span>
      <span>One voice or five, the room <b>always</b> makes space.</span>
    </p>

    <div class="eqwrap">
      <div class="eqzone">
        <div class="eq" id="eq" aria-hidden="true"></div>
        <div class="baseline" aria-hidden="true"></div>
        <div class="eqmirror" id="eqm" aria-hidden="true"></div>
      </div>
      <div class="eqlab" aria-hidden="true"><span>LIVE INPUT</span><i>STYLISED FEED</i></div>
    </div>

    <div class="crew" id="crew" hidden></div>

    <p class="sig">smile<b>.co.ke</b></p>
  </main>
</div>

<script>
/* one gated interval — clock + (optional) spotlight rotation. no rAF, no canvas.
   Contract:
     (no params)            → solo board: "the mic is live." + full equaliser
     ?names=Alice,Bob,Cyro  → crew chips (initial avatars, mini eqs), big line "{name} on mic."
     ?rotate=6              → the lit chip + big name rotate every 6s (2–60s clamp)
     ?active=2              → light the 2nd chip first (1-based)                     */
(function(){
  var EAT=3*3600*1000; /* UTC+3 */
  function two(n){return String(n).padStart(2,'0')}
  function get(k){return (location.search.match(new RegExp('[?&]'+k+'=([^&]+)'))||[])[1]}
  function dec(v){try{return decodeURIComponent(String(v).replace(/\+/g,' '))}catch(e){return v}}

  /* clock — minute-grained, gated */
  var ck=document.getElementById('clock'),lastMin=-1;
  function tickClock(){
    var m=Math.floor((Date.now()+EAT)/60000)%1440;
    if(m!==lastMin){lastMin=m;ck.textContent=two(Math.floor(m/60))+':'+two(m%60);}
  }

  /* ── equaliser bake: one-shot, deterministic wave + a whisper of jitter ── */
  var N=window.innerWidth<640?18:30,eq=document.getElementById('eq'),eqm=document.getElementById('eqm');
  function bars(target){
    var f=document.createDocumentFragment();
    for(var i=0;i<N;i++){
      var b=document.createElement('i');b.className='bar';
      var base=.22+.62*Math.abs(Math.sin(i*1.31))+Math.random()*.14;
      if(base>.96)base=.96;
      var peak=Math.min(1,base+.28+Math.random()*.3);
      b.style.setProperty('--b',base.toFixed(2));
      b.style.setProperty('--t',peak.toFixed(2));
      b.style.setProperty('--d',(0.62+Math.random()*0.72).toFixed(2)+'s');
      b.style.setProperty('--dl',(-Math.random()*1.4).toFixed(2)+'s');
      f.appendChild(b);
    }
    target.appendChild(f);
  }
  bars(eq);bars(eqm);

  /* ── crew: names → chips. textContent everywhere, never innerHTML ── */
  var rawNames=dec(get('names')||get('n')||'').trim();
  var names=rawNames?rawNames.split(',').map(function(s){return s.trim()})
    .filter(function(s){return s.length>0}).slice(0,8):[];
  var big=document.getElementById('bigLine'),crew=document.getElementById('crew');
  var chips=[],cur=0,rotate=0;

  function bigName(n){
    big.textContent='';
    var g=document.createElement('span');g.className='g';g.textContent=n;
    var y=document.createElement('span');y.className='y';y.textContent=' on mic.';
    big.appendChild(g);big.appendChild(y);
  }

  if(names.length){
    var active=Math.max(1,parseInt(get('active')||'1',10)||1);
    cur=Math.min(names.length,active)-1;
    names.forEach(function(nm,i){
      var s=document.createElement('span');s.className='spk';
      var av=document.createElement('span');av.className='av';av.textContent=nm.charAt(0).toUpperCase();
      var nEl=document.createElement('span');nEl.className='nm';nEl.textContent=nm;
      var mq=document.createElement('span');mq.className='meq';
      [.4,.85,.55].forEach(function(bse,j){
        var bi=document.createElement('i');
        bi.style.setProperty('--b',(bse+Math.random()*.2).toFixed(2));
        bi.style.setProperty('--d',(0.5+Math.random()*0.35).toFixed(2)+'s');
        bi.style.setProperty('--dl',(-j*0.21-Math.random()*.3).toFixed(2)+'s');
        mq.appendChild(bi);
      });
      s.appendChild(av);s.appendChild(nEl);s.appendChild(mq);
      crew.appendChild(s);chips.push(s);
    });
    crew.hidden=false;
    bigName(names[cur]);
    var rq=parseInt(get('rotate')||'0',10);
    if(rq>=2&&rq<=60&&names.length>1)rotate=rq;
    function light(i){
      chips.forEach(function(c,j){c.classList.toggle('on',j===i)});
      bigName(names[i]);
    }
    light(cur);
    window.__light=light;
  }

  /* ── the single gated interval: clock + optional rotation ── */
  var secs=0;
  function tick(){
    if(document.hidden)return;
    tickClock();
    if(rotate){
      secs++;
      if(secs%rotate===0){cur=(cur+1)%names.length;window.__light(cur);}
    }
  }
  tick();setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
})();
</script>
</body>
</html>

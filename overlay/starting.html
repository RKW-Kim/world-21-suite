<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Kit fonts, bundled locally. See fonts/fonts.css for why this is
     not a fonts.googleapis.com link: OBS loads these from file:// on machines
     with unreliable internet, and a stalled webfont request does not fail, it
     hangs, leaving the headline in a fallback face for ~20s. -->
<link rel="stylesheet" href="fonts/fonts.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE — starting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<style>
/* STARTING — the long hold.
   Cut to countdown.html for the last sixty seconds. This one has to sit on
   screen for as long as it takes the crew to actually get ready, so it does the
   opposite job: it states the plan, shows the run of show is on track, and puts
   every place the stream lives in front of the viewer.

   Composition rebuilt to the reference frame: mark over a single stacked
   column, one focal point, everything on one vertical axis.

   Contract: no canvas, no rAF. Bottom 76px is the ticker dock; the watermark
   pill sits top-right. */
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0A0A0A;
  --fg:#FAFAFA; --muted:#A1A1AA; --faint:#9B9BA4;
  --line:#2a2a2a; --up:#0ECB81; --down:#F6465D;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:76px;
  --eo:cubic-bezier(.32,.72,0,1);
  --eio:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--fg);
  font-family:var(--fd);-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--yellow);color:var(--ink)}
.page{position:relative;width:100vw;height:100vh;overflow:hidden}

/* a faint dot field so the black is not dead flat on a big screen */
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.09) 1.1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 100%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 100%)}
.aura{position:absolute;left:50%;top:42%;width:760px;height:500px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,193,7,.08),transparent 64%)}

/* ---- watermark corner, right ---- */
.clockchip{position:absolute;top:34px;right:44px;z-index:30;display:inline-flex;align-items:center;gap:10px;
  padding:9px 18px;border-radius:999px;background:rgba(10,10,12,.82);border:1px solid var(--line);
  font-family:var(--fm);font-size:12px;font-weight:600;letter-spacing:.22em;color:var(--muted)}
.clockchip b{color:var(--fg);font-weight:600}
.stack{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:0 40px calc(var(--safe-b) / 2);z-index:2}

/* ---- Pill ---- */
.pill{margin-top:18px;display:inline-flex;align-items:center;gap:11px;padding:9px 20px;border-radius:999px;
  border:1px solid rgba(255,193,7,.38);background:rgba(255,193,7,.06);
  font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.26em;color:var(--yellow)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 12px rgba(255,193,7,.85);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}

/* ---- the mark ---- */
.mark{margin-bottom:54px;position:relative;width:300px;height:300px;border-radius:50%;padding:10px;
  filter:drop-shadow(0 0 48px rgba(255,193,7,.62))}
.mark svg{width:100%;height:100%;overflow:visible}

/* ---- headline ---- */
/* 96px, which is what the original reference frame resolved to. Fixing this at
   124 made the acrostics run the full width and left no air for anything else. */
/* Two lines of short words. The SMILE acrostic is five words; set as one
   line it is either ~1900px of type or a wall, so it breaks after the third
   word instead. Size and weight are the user's own choice and untouched. */
h1{font-family:var(--fd);font-weight:800;font-size:126px;
  line-height:1.04;letter-spacing:-.045em;margin-top:18px;
  max-width:100%}
h1 .ln{display:block;white-space:nowrap;opacity:0;transform:translateY(40px);
  animation:wordup .85s var(--eo) both}
h1 .l1{animation-delay:.05s}
h1 .l2{animation-delay:.15s}
/* the easter egg: the five letters that spell SMILE, in the gold ramp.
   Sized to read as punctuation first and a hidden word second. */
h1 .ac{font-style:normal;
  background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes wordup{to{opacity:1;transform:none}}
h1 .g{background:linear-gradient(180deg,#fafafa 25%,#86868e 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .y{background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,193,7,.25))}
/* was declared twice; the second won, so the intended 25px never applied */
.sub{margin-top:24px;max-width:560px;font-family:var(--fd);font-weight:500;
  font-size:clamp(16px,1.7vw,23px);line-height:1.5;color:var(--muted);
  animation:rise .8s var(--eo) .35s both}
.sub b{display:inline-block;padding:1px 9px;border-radius:5px;
  background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));color:#17140A;font-weight:700}


/* ---- run of show ---- */
.checks{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:40px}
.chk{display:inline-flex;align-items:center;gap:11px;padding:12px 20px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.chk .ic{width:28px;height:28px;flex:0 0 auto;color:var(--faint)}
.chk .ic svg{width:100%;height:100%}
.chk .nm{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--fg)}
.chk .st{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--up)}
.chk .st::before{content:"✓ ";color:var(--up)}

/* ---- where to watch ---- */
.watch{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:30px}
.watch .lbl{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.24em;
  color:rgba(250,250,250,.30)}
.chip{display:inline-flex;align-items:center;gap:9px;padding:9px 17px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.035);
  font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.18em;color:var(--muted)}
.chip .mk{width:16px;height:16px;flex:0 0 auto}
.chip .mk svg{width:100%;height:100%}
.handles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.handles .chip{color:rgba(250,250,250,.5)}

.onemore{margin-top:34px;font-family:var(--fd);font-weight:500;
  font-size:clamp(15px,1.15vw,19px);color:var(--muted)}
.onemore b{color:var(--yellow);font-weight:700}
.sig{margin-top:36px;font-family:var(--fm);font-size:13px;font-weight:600;
  letter-spacing:.34em;color:rgba(250,250,250,.34)}
.sig b{color:var(--yellow);font-weight:600}

/* restrained entrance so the scene assembles rather than appearing */
.rise{opacity:0;animation:rise 760ms var(--eo) both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important}
  .rise{opacity:1}
}

/* ==== Ring ==== */
.bell-frame{margin-bottom:50px;position:relative;width:340px;height:340px;border-radius:50%;padding:11px;filter:drop-shadow(0 0 34px rgba(255,193,7,0.5));
  background:conic-gradient(from 215deg,#FFaa00,#FFaa00 12%,#FFaa00 22%,#FFaa00 38%,#ffaa00 52%,#FFaa00 66%,#FFaa00 80%,#FFaa00);
  box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 60px rgba(255,193,7,.14),
             inset 0 10px 7px rgba(255,255,255,.5),inset 0 -3px 8px rgba(0,0,0,.55)}
.bell-frame svg.disc{width:100%;height:100%;border-radius:100%}
.bell-frame .engrave{position:absolute;inset:13px;border-radius:100%;pointer-events:none;
  box-shadow:inset 0 12px 26px rgba(0,0,0,.30),inset 0 8px 20px rgba(255,255,255,.16),inset 0 0 0 2px rgba(122,90,20,.35)}

/* quiet companions — no away clock, just a soft pulse + the usual promise */
.meta{display:flex;align-items:center;gap:1px;animation:rise .8s cubic-bezier(.2,.9,.3,1) .45s both}
/* PLATFORM INDICATOR. These three dots used to bounce for no reason, which is
   worse than nothing — motion with no meaning reads as a loading state. They
   now say what they always should have: one dot per platform, filled when the
   stream is live there, a hairline ring when it is not. Toggle .off per dot. */
/* was three bouncing dots. Motion with no meaning reads as a loading state,
   so this is now just the separator it was standing in for, in the same gold
   ramp the headline uses. */
@keyframes bnc{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-14px);opacity:1}}

/* ambient: slow light sweep every ~21s */
.sweep{position:absolute;top:-10%;bottom:-10%;left:0;width:46%;z-index:8;pointer-events:none;
  background:linear-gradient(100deg,transparent 20%,rgba(255,240,200,.05) 46%,rgba(255,244,214,.08) 50%,rgba(255,240,200,.05) 54%,transparent 80%);
  transform:translateX(-700px) skewX(-12deg);
  animation:sweepk 15s ease-in-out infinite}
@keyframes sweepk{
  0%{transform:translateX(-700px) skewX(-12deg);opacity:0}
  6%{opacity:1}
  24%{opacity:1}
  30%{transform:translateX(2600px) skewX(-12deg);opacity:0}
  100%{transform:translateX(2600px) skewX(-12deg);opacity:0}}

</style>
</head>
<body>
<div class="page">
  <div class="dots" aria-hidden="false"></div>
    <div class="sweep"></div>
  <span class="clockchip"><b class="num" id="clock">--:--</b> &middot; NAIROBI DESK &middot; EAT</span>

  <main class="stack">

    <div class="">
      <svg class="mark" viewBox="5.38 10.7 23.8 23.8" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Smile">
        <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#FFC107"/>
        <path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#0A0900"/>
        <path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#0A0900"/>
        <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0A0900"/>
      </svg>
      <span class=""></span>
    </div>

    <h1 class="rise" id="headline" style="animation-delay:220ms"></h1>

    <p class="sub rise" style="animation-delay:320ms">Fresh candles. Brewed coffee. <b>Zero</b> rush. </p>

    <div class="checks rise" style="animation-delay:560ms">
      <span class="chk"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><rect x="1.2" y="4.9" width="21.6" height="14.2" rx="4.1" fill="#FF0033"/><path d="M10.1 8.75v6.5L15.8 12z" fill="#fff"/></svg></span><span class="nm">YOUTUBE</span><span class="st">LIVE</span></span>
      <span class="chk"><span class="ic"><svg viewBox="0 0 24 24" fill="#1877F2"><path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/></svg></span><span class="nm">FACEBOOK</span><span class="st">LIVE</span></span>
      <span class="chk"><span class="ic"><svg viewBox="0 0 24 24" fill="#E7E9EA"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></span><span class="nm">TWITTER/X</span><span class="st">LIVE</span></span>

<path fill="#FE2C55" transform="translate(.62 .62)" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>

</g></svg></span><span class="nm">TIKTOK</span><span class="st">LIVE</span></span>
    </div>

    <div class="handles rise" style="animation-delay:740ms">
      <span class="chip">@SMILEKE</span>
      <span class="chip">@WORLD·21</span>
      <span class="chip">@HOTWIRE</span>
    </div>

    <p class="sig rise" style="animation-delay:900ms">smile<b>.co.ke</b></p>
  </main>
</div>

<script>
/* One gated interval — the clock. No rAF, no canvas.
   The headline IS the SMILE acrostic. Five short words, broken across two
   lines, with the five initials in the gold ramp so the word is there for
   anyone who looks and invisible to anyone who doesn't.

   It used to be a full sentence per line, which at 126px is either 1400px of
   type or a wall — neither of which is a headline. Five words is the shortest
   thing that can still spell a five-letter word. */
(function(){
  function pad(n){return n<10?'0'+n:''+n}
  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
  var clock=document.getElementById('clock');
  var h1=document.getElementById('headline');

  /* Five words each, initials spelling S-M-I-L-E. Authored, not generated.
     Line 1 carries S M I, line 2 carries L E. */
  var HL=[
    ['Sharp Markets Invite',   'Live Entries'],
    ['Smart Money, Insight',   'Lasting Equity'],
    ['Smile Markets Illuminate','Live Energy'],
    ['Signal Mastery, Insight','Leads Execution'],
    ['Signals Matter, Insight','Live Endeavour'],
    ['Smiles Matter Insight',  'Leads Execute']
  ];
  /* Asserted, not trusted: three of the first draft were authored as
     S-I-M and quietly spelled SIMLE. Cheap to check, invisible if wrong. */
  HL.forEach(function(l,i){
    var ac=(l[0]+' '+l[1]).split(' ').map(function(w){return w[0]}).join('');
    if(ac!=='SMILE') console.error('starting.html: headline '+(i+1)+' spells '+ac+', not SMILE');
  });
  var q=(location.search.match(/[?&]hl=([^&]*)/)||[])[1];
  var idx=0;
  if(q==='random'){
    var seed=sessionStorage.getItem('smile-hl');
    if(seed===null){seed=String(Math.floor(Math.random()*HL.length));sessionStorage.setItem('smile-hl',seed);}
    idx=parseInt(seed,10)||0;
  } else if(q){idx=Math.max(0,Math.min(HL.length-1,(parseInt(q,10)||1)-1));}

  /* Gold the initial of every word, then split the five words across two
     lines: three on top, two beneath. */
  function render(line){
    return line.split(' ').map(function(w,i){
      return (i?' ':'')+'<i class="ac">'+esc(w[0])+'</i>'+esc(w.slice(1));
    }).join('');
  }
  h1.innerHTML='<span class="ln l1">'+render(HL[idx][0])+'</span>'+
               '<span class="ln l2">'+render(HL[idx][1])+'</span>';

  /* Fit the LONGER of the two lines, then apply one size to both so the pair
     stays optically matched — fitting each line independently is what makes
     two-line headlines look accidental. */
  function fit(){
    var max=parseFloat(getComputedStyle(h1).fontSize);
    var l1=h1.querySelector('.l1'), l2=h1.querySelector('.l2');
    var box=h1.clientWidth, size=max;
    h1.style.fontSize=size+'px';
    function over(){return Math.max(l1.scrollWidth,l2.scrollWidth)>box+1}
    while(size>100&&over()){size-=2;h1.style.fontSize=size+'px';}
  }
  fit();
  window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);

  function tick(){
    if(document.hidden) return;
    var d=new Date();
    clock.textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  }
  tick();
  setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
})();
</script>
</body>
</html>

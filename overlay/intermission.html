<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · intermission</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<style>
/* ── INTERMISSION, redone ───────────────────────────────────────────────
   One idea: the face alone holds the room. The smile icon is the hero —
   huge, centered, breathing — with quiet machinery around it: two slow
   orbit rings, three satellite dots, a pulsing glow, and a ghost word
   stamped behind everything. A break clock counts down and then holds at
   BACK ANY MOMENT (same hold contract as starting-soon). Modules live
   outside this page: the bottom 76px and corners stay clear. ────────── */
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0a0a0a;
  --bg:#09090b; --border:#27272a; --fg:#fafafa; --muted:#a1a1aa; --faint:#9b9ba4;
  --up:#0ECB81; --down:#F6465D;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:76px; /* EXACTLY the ticker module dock height (1920×76) */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fd);
  overflow:hidden;-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--yellow);color:var(--ink)}
.page{position:relative;display:flex;flex-direction:column;height:100%}

.ambient{position:absolute;inset:0;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%)}
.spot{position:absolute;inset:0;background:radial-gradient(ellipse 64% 44% at 50% -10%,rgba(255,255,255,.09),transparent 70%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 56%,rgba(0,0,0,.5) 100%)}

.topbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:flex-end;
  padding:22px clamp(18px,4vw,48px)}
.clockchip{border:1px solid var(--border);border-radius:999px;padding:8px 16px;
  font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:var(--muted)}
.clockchip b{color:var(--fg);font-weight:600}

/* ── the stage: face + orbit machinery ── */
.hero{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(14px,2.6vh,26px);padding:0 24px var(--safe-b);min-height:0}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:9px;border-radius:999px;
  border:1px solid rgba(255,193,7,.35);background:rgba(255,193,7,.06);color:var(--yellow);
  padding:7px 16px;font-family:var(--fm);font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .05s both}
.dot{position:relative;width:7px;height:7px;border-radius:50%;background:var(--yellow)}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;
  animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.6);opacity:0}}

.stage{position:relative;display:grid;place-items:center;animation:rise .9s cubic-bezier(.2,.9,.3,1) .12s both}
.ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:0;
  /* 12vw, not 16vw: this word is nowrap and measures ~7.5x its font-size, so
     16vw needs the viewport to be at least ~1570px before it fits and it
     overflowed by 64px at 1440. 13.4vw is break-even; 12vw fits at every
     width and is unchanged at 1920, where the 210px cap applies either way. */
  font-family:var(--fd);font-weight:700;font-size:clamp(56px,12vw,210px);letter-spacing:.02em;
  color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.07);white-space:nowrap;user-select:none}

.orb{position:relative;z-index:2;width:clamp(240px,38vh,380px);height:clamp(240px,38vh,380px);
  display:grid;place-items:center}
.orb .glow{position:absolute;inset:-12%;border-radius:50%;z-index:0;
  background:radial-gradient(circle,rgba(255,193,7,.14),transparent 62%);
  animation:glow 4.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.orb .ring{position:absolute;border-radius:50%;border:2px dashed rgba(255,255,255,.13)}
.orb .ring.r1{inset:0;animation:spin 46s linear infinite}
.orb .ring.r2{inset:20px;border-color:rgba(255,193,7,.24);animation:spinRev 32s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
.orb .sats{position:absolute;inset:0;animation:spin 46s linear infinite}
.orb .sat{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 12px rgba(255,193,7,.5)}
.orb .sat.s1{left:50%;top:-5px;transform:translateX(-50%)}
.orb .sat.s2{right:-2px;top:62%;background:var(--up);box-shadow:0 0 10px rgba(14,203,129,.45)}
.orb .sat.s3{left:6%;bottom:8%;background:var(--down);box-shadow:0 0 10px rgba(246,70,93,.4)}
.orb .face{position:relative;z-index:2;width:clamp(128px,20vh,196px);height:clamp(128px,20vh,196px);
  filter:drop-shadow(0 16px 36px rgba(0,0,0,.55));animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.orb .face svg{width:100%;height:100%}
/* the icon only — no wordmark on this stage; the face IS the message */

/* ── break clock: counts down once, then holds at BACK ANY MOMENT ──
   ?t=90 | ?t=MM:SS | ?t=H:MM:SS overrides the default 10:00 break. */
.cdzone{display:grid;place-items:center;min-height:64px;width:100%}
.cdzone>*{grid-area:1/1}
.cdcol{display:flex;align-items:baseline;gap:14px;justify-content:center;
  transition:opacity .7s cubic-bezier(.2,.9,.3,1),transform .7s cubic-bezier(.2,.9,.3,1)}
.cdcol .ba{font-family:var(--fm);font-size:10px;letter-spacing:.3em;color:var(--faint)}
.cdcol .cv{font-family:var(--fm);font-weight:600;font-size:clamp(26px,4.6vh,40px);
  font-variant-numeric:tabular-nums;color:var(--fg)}
html[data-hold="1"] .cdcol{opacity:0;transform:scale(.92);pointer-events:none}
.hold{display:inline-flex;align-items:center;gap:11px;border-radius:999px;
  border:1px solid rgba(255,193,7,.5);background:rgba(255,193,7,.1);
  padding:11px 24px;font-family:var(--fm);font-weight:600;font-size:clamp(11px,1.8vh,14px);
  letter-spacing:.3em;color:var(--yellow);text-transform:uppercase;
  opacity:0;transform:scale(.92);transition:opacity .7s cubic-bezier(.2,.9,.3,1) .25s,transform .7s cubic-bezier(.2,.9,.3,1) .25s}
.hold .dot{width:9px;height:9px}
html[data-hold="1"] .hold{opacity:1;transform:none}

.ag{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:rise .8s cubic-bezier(.2,.9,.3,1) .4s both}
.agi{border:1px solid var(--border);border-radius:999px;background:rgba(14,14,17,.62);
  padding:8px 15px;font-family:var(--fm);font-size:9.5px;letter-spacing:.24em;color:var(--muted);
  text-transform:uppercase}
.agi b{color:var(--yellow);font-weight:600}

@media (max-width:720px){.agi:nth-child(3){display:none}}

/* ── plain-sight brand signature ────────────────────────────────────────
   The fallback mark: when the watermark module is not layered over this
   scene, the brand still leads to smile.co.ke — centered in the
   composition, in plain sight, quiet enough to never distract. ───────── */
.sig{font-family:var(--fm);font-size:11px;letter-spacing:.46em;color:rgba(250,250,250,.38);
  text-align:center;animation:rise .8s cubic-bezier(.2,.9,.3,1) .5s both}
.sig b{font-weight:600;color:rgba(255,193,7,.62)}
.sig .d{display:inline-block;width:4px;height:4px;border-radius:50%;background:rgba(255,193,7,.5);
  vertical-align:middle;margin:0 10px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  html[data-hold="1"] .cdcol{display:none}
  html:not([data-hold]) .hold{opacity:0}
}
</style>
</head>
<body>
<div class="page">
  <div class="ambient" aria-hidden="true">
    <div class="dots"></div><div class="spot"></div><div class="vig"></div>
  </div>

  <header class="topbar">
    <span class="clockchip"><b class="num" id="clock">--:--</b> · NAIROBI DESK · EAT</span>
  </header>

  <main class="hero">
    <span class="eyebrow"><span class="dot"></span>Intermission · The Desk Takes Five</span>

    <div class="stage">
      <span class="ghost" aria-hidden="true">INTERMISSION</span>
      <div class="orb">
        <span class="glow" aria-hidden="true"></span>
        <i class="ring r1" aria-hidden="true"></i>
        <i class="ring r2" aria-hidden="true"></i>
        <span class="sats" aria-hidden="true"><i class="sat s1"></i><i class="sat s2"></i><i class="sat s3"></i></span>
        <span class="face" aria-hidden="true">
          <!-- smile face — verbatim crop of the real logo (same 4 paths, tight viewBox) -->
          <svg viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg">
            <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>
            <path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#0A0900"/>
            <path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#0A0900"/>
            <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0A0900"/>
          </svg>
        </span>
      </div>
    </div>

    <div class="cdzone">
      <div class="cdcol" id="cdWrap">
        <span class="ba">BACK IN</span>
        <span class="cv num" id="cd">10:00</span>
      </div>
      <div class="hold" id="hold"><span class="dot"></span>BACK ANY MOMENT</div>
    </div>

    <div class="ag">
      <span class="agi"><b>01</b> HYDRATE</span>
      <span class="agi"><b>02</b> STRETCH</span>
      <span class="agi"><b>03</b> DROP Qs FOR Q&amp;A</span>
    </div>
    <p class="sig">smile<b>.co.ke</b></p>
  </main>
</div>

<script>
/* one gated interval — clock + break countdown → hold. no rAF, nothing else.
   Contract: default break 10:00; ?t=90 | ?t=05:00 | ?t=1:05:00 overrides;
   ?t=0 holds immediately (pre-stage the hold in OBS); at zero the clock
   cross-fades into BACK ANY MOMENT and stays. */
(function(){
  var EAT=3*3600*1000; /* UTC+3 */
  function two(n){return String(n).padStart(2,'0')}

  var ck=document.getElementById('clock'),lastMin=-1;
  function tickClock(){
    var m=Math.floor((Date.now()+EAT)/60000)%1440;
    if(m!==lastMin){lastMin=m;ck.textContent=two(Math.floor(m/60))+':'+two(m%60);}
  }

  var raw=(location.search.match(/[?&]t=([\d:]+)/)||[])[1],secs=600;
  if(raw){
    var p=raw.split(':').map(Number);
    secs=p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0];
    if(!(secs>=0))secs=600; /* junk -> default; 0 = hold immediately */
  }
  var END=Date.now()+secs*1000;
  var cd=document.getElementById('cd');

  function goHold(){
    if(document.documentElement.dataset.hold!=='1')document.documentElement.dataset.hold='1';
  }

  function tick(){
    if(document.hidden)return;
    tickClock();
    var left=Math.max(0,Math.round((END-Date.now())/1000));
    cd.textContent=two(Math.floor(left/60))+':'+two(left%60);
    if(left<=0)goHold();
  }
  tick();setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
})();
</script>
</body>
</html>

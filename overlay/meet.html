<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMILE · meet</title>
<!-- DARK THEME, DELIBERATELY WITHOUT A color-scheme META TAG
     This page composites OVER whatever you put beneath it, so the root canvas
     must stay transparent. color-scheme makes Chromium paint the root canvas
     opaque, which would turn the overlay into a black rectangle instead of a
     layer. Theme lives in the CSS; transparency lives in the root background. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3C/svg%3E">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   THE MEET SCENE — a full-frame video with the SmileTV chrome floating on it.

   WHAT IT IS FOR. You window-capture the Google Meet call as one OBS source
   and lay this above it, transparent. For the stretches where you are talking,
   this shows the call with the watermark and the ticker framing it. When you
   want to put a video up, this scene IS the video, full frame, and the same
   watermark and ticker sit on top of it. One source covers both, so nothing
   has to be swapped or re-timed mid-call.

   THE CHROME IS EMBEDDED, NOT COPIED. watermark.html and ticker.html already
   exist as standalone OBS modules and being identical everywhere is the entire
   point of a module. Pasting their markup and CSS here would create a second
   copy that starts drifting within a week. Both are iframed at their real
   URLs, so this scene inherits any change to either and has nothing to sync.

   TWO LAYOUTS FROM ONE SET OF PARAMS.
     default   — the player fills 1920x1080. Watermark top-left, ticker in the
                 dock, label chip top-right. Nothing framed, because a border
                 around the whole canvas is a border around the screen.
     ?ywx= ?ywy= ?yww= ?ywh=  — shrink it and it becomes a floating panel: it
                 grows a hairline, a radius, a drop shadow and its own header
                 bar, because at that size a bare rectangle reads as a pasted
                 screenshot rather than something designed.

   The header bar exists only in panel mode. In full frame there is no room
   above the video, so the label becomes a chip in the top-right corner instead
   — the same corner and the same inset the rest of the kit puts its clock in.

   THE PLAYER. ?yt= takes a bare id, a watch URL, an /embed/ URL or a /shorts/
   URL and reduces all four to the same embed. It autoplays, and is MUTED BY
   DEFAULT — not a styling choice: unmuted autoplay is blocked by the browser
   until there is a user gesture, and there is nobody to click in an OBS
   browser source. ?ctl=1 restores YouTube's controls.

   THE SETS. ?pl= plays a named list through in order:
     ?pl=hdf      hdf presidential, hdf wash, hdf collins
     ?pl=menta    menta · motivation
     ?pl=almond   almond
     ?pl=all      all five in the order above
   They live in this file as SETS rather than as a YouTube playlist id so the
   order and the names are editable next to the rest. One caveat worth knowing
   before you rely on it: YouTube's comma-list form takes a single start
   offset for the whole list, not one per item, so Collins' 14s is ignored
   inside a set. Play it alone to keep it: ?yt=PHb3YR8kgps&start=14

   ?start=<sec> offsets a single video. ?list=<id> still takes a real YouTube
   playlist id if you ever make one there.

   A note on aspect. YouTube letterboxes inside the iframe itself, so a 4:3
   upload in a 1920x1080 frame arrives with soft bars either side. The embed
   player cannot crop; if you need true full-bleed, transcode to 16:9 first.

   Contract: no canvas, no rAF, no timers. One pass at load.
   ───────────────────────────────────────────────────────────────────────────── */
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0A0A0A;
  --fg:#FAFAFA; --muted:#A1A1AA; --faint:#8A8A94;
  --line:#2a2a2a; --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --dock:76px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:var(--fd);color:var(--fg);-webkit-font-smoothing:antialiased}
svg{display:block}
::selection{background:var(--yellow);color:var(--ink)}
.stage{position:absolute;inset:0;overflow:hidden}

/* ── the player ── */
.vp{position:absolute;z-index:1;overflow:hidden;background:#000}
.vp .screen{position:absolute;left:0;right:0;top:0;bottom:0}
.vp iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0;display:block}

/* panel mode only: the frame that makes a shrunken player look deliberate */
.vp[data-frame="1"]{border-radius:16px;border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(180deg,rgba(12,12,15,.94),rgba(8,8,10,.96));
  box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.5)}
.vp[data-frame="1"] .screen{top:38px}
.vp .tex{display:none;position:absolute;inset:38px 0 0 0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.06) 1.1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 26%,#000 74%,transparent);
          mask-image:linear-gradient(180deg,transparent,#000 26%,#000 74%,transparent)}
.vp[data-frame="1"] .tex{display:block}

/* ── the label ──
   Two shapes from one element: a header bar in panel mode, a corner chip in
   full frame. Both carry a scrim, because in full frame the text sits on
   whatever the video happens to be showing. */
.vp .tag{position:absolute;z-index:2;display:flex;align-items:center;gap:10px;
  pointer-events:none;font-family:var(--fm);font-weight:600}
.vp .tag[hidden],.vp .empty[hidden]{display:none !important}

.vp[data-frame="1"] .tag{left:0;right:0;top:0;height:38px;padding:0 13px;
  border-bottom:1px solid rgba(255,255,255,.08);background:transparent}

.vp[data-frame="0"] .tag{right:44px;top:34px;padding:9px 16px;border-radius:999px;
  background:rgba(10,10,12,.78);border:1px solid var(--line);
  box-shadow:0 8px 26px rgba(0,0,0,.45)}
.vp .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);flex:none;
  box-shadow:0 0 10px rgba(255,193,7,.85)}
.vp .lab{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--fg);
  white-space:nowrap}
.vp .sub{font-size:10px;letter-spacing:.14em;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.vp[data-frame="1"] .sub{margin-left:auto;max-width:62%}
/* a hairline between label and caption, panel mode only */
.vp[data-frame="1"] .sub{padding-left:10px;border-left:1px solid rgba(255,255,255,.14)}

/* ── empty state ── */
.vp .empty{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;
  text-align:center;padding:34px;
  background:radial-gradient(ellipse at 50% 45%,#131316,#0A0A0A 72%)}
.vp .empty .big{font-family:var(--fm);font-weight:600;font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted)}
.vp .empty .hint{font-family:var(--fm);font-weight:400;font-size:12px;line-height:1.8;
  letter-spacing:.04em;color:var(--faint)}
.vp .empty .hint b{color:var(--yellow);font-weight:600}
.vp .empty .play{width:52px;height:36px;opacity:.45}

/* ── chrome: full-frame iframes stacked ABOVE the player ──
   pointer-events:none so this layer never swallows a click meant for OBS. */
iframe.chrome{position:absolute;border:0;background:transparent;pointer-events:none}
#wmFrame{left:0;top:0;width:1920px;height:1080px;z-index:5}
#tkFrame{left:0;bottom:0;width:1920px;height:var(--dock);z-index:6}

/* ── setup guide ── */
.guide{position:absolute;inset:0;z-index:9;pointer-events:none;display:none}
html[data-guide="1"] .guide{display:block}
.guide i{position:absolute;border:1px dashed rgba(255,193,7,.55);border-radius:10px}
.guide i::after{content:attr(data-l);position:absolute;left:8px;bottom:5px;
  font-family:var(--fm);font-weight:600;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--yellow)}
</style>
</head>
<body>
<div class="stage">

  <div class="vp" id="vp">
    <div class="tex" aria-hidden="true"></div>
    <div class="screen"></div>
    <div class="tag" id="tag" hidden>
      <span class="dot" aria-hidden="true"></span>
      <span class="lab" id="tagLab">now playing</span>
      <span class="sub" id="tagSub"></span>
    </div>
    <div class="empty" id="empty">
      <svg class="play" viewBox="0 0 46 32" aria-hidden="true">
        <rect x=".8" y=".8" width="44.4" height="30.4" rx="5" fill="none" stroke="#FFC107" stroke-width="1.4"/>
        <path d="M19 10.4v11.2L29.4 16z" fill="#FFC107"/>
      </svg>
      <span class="big">video goes full frame</span>
      <span class="hint"><b>?pl=hdf</b> · <b>?pl=menta</b> · <b>?pl=almond</b> · <b>?pl=all</b><br>
        or <b>?yt=</b> with any YouTube URL &nbsp;·&nbsp; plays automatically, muted<br>
        <b>?ywx=&amp;ywy=&amp;yww=&amp;ywh=</b> shrink it to a panel</span>
    </div>
  </div>

  <!-- the real modules, embedded — not copied -->
  <iframe class="chrome" id="wmFrame" title="watermark" scrolling="no"></iframe>
  <iframe class="chrome" id="tkFrame" title="ticker" scrolling="no"></iframe>

  <div class="guide" aria-hidden="true">
    <i data-l="player · 1920×1080" id="gVp" style=""></i>
    <i data-l="watermark · tl" style="left:20px;top:20px;width:340px;height:104px"></i>
    <i data-l="ticker dock · 76px" style="left:20px;bottom:16px;right:20px;height:56px"></i>
  </div>

</div>

<script>
/* One pass at load. */
(function(){
  function q(k,d){var v=(location.search.match(new RegExp('[?&]'+k+'=([^&]*)'))||[])[1];return v===undefined?d:v}
  function num(k,d,lo,hi){
    var v=parseFloat(q(k,''));if(isNaN(v))return d;
    return Math.max(lo,Math.min(hi,v));
  }
  function dec(v){try{return decodeURIComponent(String(v).replace(/\+/g,' '))}catch(e){return v}}

  if(q('guide')==='1')document.documentElement.dataset.guide='1';

  /* ── the player ──
     Geometry defaults to the whole canvas. Anything smaller is panel mode and
     gets the framed treatment automatically, so there is one decision to make
     (how big) rather than two (how big, and does it have a border). */
  var vp=document.getElementById('vp');
  var W=num('yww',1920,160,1920);
  var H=num('ywh',1080,90,1080);
  var X=num('ywx',0,0,Math.max(0,1920-W));
  var Y=num('ywy',0,0,Math.max(0,1080-76-H));
  var full=(W>=1920&&H>=1080);
  vp.style.left=X+'px'; vp.style.top=Y+'px';
  vp.style.width=W+'px';  vp.style.height=H+'px';
  vp.dataset.frame=full?'0':'1';
  document.getElementById('gVp').style.cssText=
    'left:'+X+'px;top:'+Y+'px;width:'+W+'px;height:'+H+'px';

  /* ── chrome ── */
  var wmExtra=[];
  /* dy defaults to 0 because in the default layout the player is the
     background, not another app's window. When you DO lay this over a raw
     Meet capture, Meet owns the top 72px with the meeting title in it, so pass
     ?wmdy=64 to drop the mark clear of that bar. */
  wmExtra.push('dy='+num('wmdy',0,-400,400));
  /* a scrim by default: in full frame the gold mark sits on live video and
     will vanish over anything bright without it */
  if(q('scrim','1')!=='0')wmExtra.push('scrim=1');
  var wsize=q('wsize',''); if(wsize!=='') wmExtra.push('size='+wsize);
  var wcorner=q('wcorner',''); if(wcorner!=='') wmExtra.push('corner='+wcorner);
  var wmFrame=document.getElementById('wmFrame');
  wmFrame.style.display=(q('wm','1')==='0')?'none':'';
  wmFrame.src='watermark.html?'+wmExtra.join('&');

  var tkFrame=document.getElementById('tkFrame');
  tkFrame.style.display=(q('tk','1')==='0')?'none':'';
  /* pad=0 here: in the meet scene the strip sits over a full-frame video, and
     a 12px inset on each side reads as a floating bar rather than a dock.
     ?tpad= overrides it if you want the inset back. */
  var tkParams=[];
  if(q('tklive','')==='0')tkParams.push('live=0');
  tkParams.push('pad='+num('tpad',0,0,120));
  tkFrame.src='ticker.html?'+tkParams.join('&');

  /* ── the video, or a set of them ──
     Authored here rather than as a YouTube playlist id so the order, the
     names and the start offsets live in this file next to everything else. */
  var SETS={
    hdf:  [['hdf presidential','_d-dOByD1L0',0],
           ['hdf wash','GwH8tCJrWLQ',0],
           ['hdf collins','PHb3YR8kgps',0]],
    menta:[['menta · motivation','tROW0yRgQK8',0]],
    almond:[['almond','XxV3jDM6KNs',0]],
    all:  [['hdf presidential','_d-dOByD1L0',0],
           ['hdf wash','GwH8tCJrWLQ',0],
           ['hdf collins','PHb3YR8kgps',0],
           ['menta · motivation','tROW0yRgQK8',0],
           ['almond','XxV3jDM6KNs',0]]
  };
  var NAMES={hdf:'HDF',menta:'Menta',almond:'Almond',all:'all channels'};

  function idOf(raw){
    if(!raw)return '';
    var m=String(raw).match(/(?:v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{6,})/);
    if(m)return m[1];
    var v=dec(raw).trim();
    return /^[A-Za-z0-9_-]{6,}$/.test(v)?v:'';
  }

  var plName=dec(q('pl','')).trim().toLowerCase();
  var set=SETS[plName]||null;
  var raw=dec(q('yt','')).trim();
  /* A set loads its first entry and queues the rest, which is the form the
     embed actually supports. Passing only ?playlist= with an empty path loads
     nothing at all. */
  var id=set?set[0][1]:idOf(raw);
  /* ?start= offsets a single video, but MEASURED: it stops autoplay working.
     PHb3YR8kgps rendered 265KB of playing video with no start param and 5.5KB
     of dead play-button with start=1 AND start=14 — so it is the parameter
     itself, not the value. A stuck play button mid-presentation is far worse
     than a missing 14s skip, so the sets carry 0 and autoplay is the default.
     Kept available for deliberate manual playback; do not add it before a show.
     A real skip would need the IFrame API's loadVideoById({startSeconds}),
     which autoplays correctly — say the word and it is a contained change. */
  var start=parseInt(q('start',''),10);
  if(isNaN(start))start=0;

  var lab=dec(q('lab','')).trim()||(set?NAMES[plName]||plName:'now playing');
  var sub=dec(q('cap','')).trim();
  document.getElementById('tagLab').textContent=lab;
  var subEl=document.getElementById('tagSub');
  subEl.textContent=sub; subEl.hidden=!sub;

  if(id){
    /* A set becomes YouTube's comma-list, which plays through in order. Its
       per-item start offsets cannot be expressed that way — the embed takes
       one start for the whole list — so Collins' 14s applies when it is played
       alone via ?yt=PHb3YR8kgps&start=14. */
    var listIds=set?set.map(function(r){return r[1]}):[];
    var src='https://www.youtube.com/embed/'+encodeURIComponent(id)+
      (!isNaN(start)&&start>0?'&start='+start:'')+
      '?autoplay='+(q('play','1')!=='0'?1:0)+
      '&mute='+(q('mute','1')!=='0'?1:0)+
      '&playsinline=1&rel=0&modestbranding=1'+
      '&controls='+(q('ctl','0')!=='0'?1:0)+
      (listIds.length?'&playlist='+encodeURIComponent(listIds.join(',')):'')+
      (q('list','')!==''?'&playlist='+encodeURIComponent(dec(q('list',''))):'');
    var f=document.createElement('iframe');
    f.src=src; f.allow='autoplay; encrypted-media; picture-in-picture';
    f.allowFullscreen=true; f.title=lab;
    document.querySelector('.vp .screen').appendChild(f);
    document.getElementById('empty').hidden=true;
    document.getElementById('tag').hidden=false;
  }
})();
</script>
</body>
</html>

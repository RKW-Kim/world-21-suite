<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SMILE · end · AMBIENT CINEMA</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="smile-core.css">
  <style>
    /* ================= AMBIENT CINEMA — the premium idle =================
       The scene is always alive but almost imperceptibly: a slow celebratory
       light sweep crossing the stage, confetti drifting on three depth planes
       (far layers blurred), the disc breathing with a glow tide, the backdrop
       grid in slow parallax drift. Entrances 1.5s expo, long-staggered. Every
       loop is symmetric ease-in-out — any two frames 10s apart look composed. */

    .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center}
    h1{font-family:var(--font-display);font-weight:800;font-size:148px;letter-spacing:-.035em;line-height:.95}
    h1 .y{color:var(--yellow)}
    .discbig{width:150px;height:150px;margin:2px 0 4px;filter:drop-shadow(0 20px 50px rgba(255,193,7,.26))}
    .sub{font-size:26px;font-weight:500;color:#a8a8a8;max-width:760px;line-height:1.45}
    .socials{display:flex;gap:16px;margin-top:8px}.next{font-size:15px;margin-top:6px}

    /* ---- slow, long-staggered entrances ---- */
    @keyframes riseIn{from{opacity:0;transform:translate3d(0,34px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
    .rise{animation-duration:1.5s;animation-timing-function:cubic-bezier(.19,1,.22,1)}

    /* ---- celebratory light sweep (crosses, then holds offstage: seamless) ---- */
    .stage::before{content:"";position:absolute;top:-25%;bottom:-25%;left:0;width:44vw;z-index:5;pointer-events:none;
      mix-blend-mode:screen;will-change:transform;
      background:linear-gradient(78deg,transparent 8%,rgba(255,193,7,.05) 36%,rgba(255,255,255,.075) 50%,rgba(255,193,7,.05) 64%,transparent 92%);
      transform:translateX(-130vw) skewX(-10deg);
      animation:sweep 18s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-130vw) skewX(-10deg)}36%{transform:translateX(150vw) skewX(-10deg)}100%{transform:translateX(150vw) skewX(-10deg)}}

    /* ---- backdrop parallax: grid drift + aurora tide ---- */
    .bg::after{animation:gridDrift 32s ease-in-out infinite alternate;will-change:transform}
    @keyframes gridDrift{from{transform:translate3d(-12px,-10px,0)}to{transform:translate3d(14px,12px,0)}}
    .bg::before{content:"";position:absolute;inset:-12%;will-change:transform,opacity;
      background:radial-gradient(42% 34% at 30% 26%,rgba(255,193,7,.05),transparent 70%),radial-gradient(36% 30% at 72% 74%,rgba(14,203,129,.04),transparent 70%);
      animation:aurora 24s ease-in-out infinite alternate}
    @keyframes aurora{from{transform:translate3d(-2%,1%,0) scale(1);opacity:.7}to{transform:translate3d(2%,-1.5%,0) scale(1.12);opacity:1}}

    /* ---- disc: eased spin on arrival, then the 8s glow tide (breathes forever) ---- */
    svg.disc.smile-anim.spin{animation:exSpin 1.7s cubic-bezier(.19,1,.22,1) 1.05s both,tide 8s ease-in-out 3s infinite;will-change:transform,filter}
    @keyframes exSpin{from{transform:rotate(-360deg) scale(.66)}to{transform:rotate(0deg) scale(1)}}
    @keyframes tide{0%,100%{transform:scale(1);filter:drop-shadow(0 20px 50px rgba(255,193,7,.26))}50%{transform:scale(1.035);filter:drop-shadow(0 30px 70px rgba(255,193,7,.5))}}

    /* ---- confetti: three depth planes (far blurred) — the drift ---- */
    .cf{position:absolute;top:-60px;border-radius:4px;animation:fall linear infinite;will-change:transform}
    .cf.far{filter:blur(2.2px)}
    .cf.mid{filter:blur(1px)}
    @keyframes fall{to{transform:translate3d(var(--sx,0px),1260px,0) rotate(var(--rr,560deg))}}
  </style>
</head>
<body>
<div class="stage">
  <div class="bg"></div><div id="confetti"></div>
  <div class="wrap">
    <span class="chip ghost rise" style="--rd:.1s">✓ MARKET CLOSED</span>
    <h1 class="rise" style="--rd:.6s">session <span class="y">closed</span>.</h1>
    <div class="rise" style="--rd:1.1s"><svg class="discbig disc" data-mood="spin" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="50" fill="#FFC107"/>
      <ellipse cx="41" cy="40" rx="6.5" ry="7.6" fill="#0b0b0b"/>
      <ellipse cx="59" cy="40" rx="6.5" ry="7.6" fill="#0b0b0b"/>
      <path d="M32 55 C 35 77, 65 77, 68 55" fill="none" stroke="#0b0b0b" stroke-width="10.5" stroke-linecap="round"/>
    </svg></div>
    <p class="sub rise" style="--rd:1.6s">Asante for trading with us today — books balanced, smile intact. Same desk next time.</p>
    <div class="socials rise" style="--rd:2.1s"><span class="chip dark">▶ YouTube · /smileke</span><span class="chip dark">◉ Twitch · /smileke</span><span class="chip dark">♪ TikTok · @smileke</span></div>
    <span class="chip solid next rise" style="--rd:2.6s">NEXT SESSION · FRIDAY 8PM EAT</span>
  </div>
</div>
<script src="smile-mark.js"></script>
<script>
  /* confetti: 42 pieces on three parallax planes — 18 far / 14 mid / 10 near */
  const cols=['#FFC107','#0ECB81','#F6465D','#FFFFFF','#3FB6FF'],box=document.getElementById('confetti');
  for(let i=0;i<42;i++){
    const lane=i%21<9?'far':(i%21<16?'mid':'near'),s=document.createElement('span');
    s.className='cf'+(lane==='far'?' far':(lane==='mid'?' mid':''));
    s.style.left=Math.random()*100+'%';
    s.style.background=cols[i%cols.length];
    s.style.animationDuration=(lane==='far'?9.5+Math.random()*4:lane==='mid'?6.5+Math.random()*3:4.5+Math.random()*2.5)+'s';
    s.style.animationDelay=-(Math.random()*12)+'s';
    s.style.width=(lane==='far'?6+Math.random()*5:lane==='mid'?9+Math.random()*6:13+Math.random()*9)+'px';
    s.style.height=(lane==='far'?12+Math.random()*7:lane==='mid'?18+Math.random()*9:24+Math.random()*12)+'px';
    s.style.setProperty('--sx',(lane==='far'?Math.random()*140-70:lane==='mid'?Math.random()*240-120:Math.random()*340-170)+'px');
    s.style.setProperty('--rr',(300+Math.random()*(lane==='near'?420:220))+'deg');
    s.style.opacity=(lane==='far'?.3+Math.random()*.2:lane==='mid'?.5+Math.random()*.25:.75+Math.random()*.25).toFixed(2);
    box.appendChild(s);
  }
</script>
</body>
</html>

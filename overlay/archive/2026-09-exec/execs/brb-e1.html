<!doctype html><html lang="en"><head><meta charset="utf-8"><title>SMILE · brb · REFINERY</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile-core.css">
<style>
  /* ================= E1 · REFINERY =================
     The original, executed to its absolute ceiling.
     Zero structural change, zero engine change: the expo-out family on
     every entrance, symmetric ease-in-out on every loop so nothing ever
     "ticks", one orchestrated arrival rhythm (0 → .22 → .38 → .54s),
     hairline glows, even spark phasing, tabular-nums locked.            */

  /* --- skeleton: identical geometry to the frozen design --- */
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding-bottom:60px}
  .buffer{position:relative;width:340px;height:340px;display:grid;place-items:center;margin-bottom:44px}
  h1{font-family:var(--font-display);font-weight:800;font-size:118px;letter-spacing:-.03em;line-height:1}
  h1 .y{color:var(--yellow)}
  .sub{margin-top:22px;font-size:26px;font-weight:500;color:#a8a8a8}
  .bnc{margin-top:34px;display:flex;gap:14px}
  .bnc span{width:14px;height:14px;border-radius:50%;background:var(--yellow)}
  .bnc span:nth-child(2){background:var(--up)}
  .bnc span:nth-child(3){background:var(--down)}

  /* --- buffer arrives on one breath (transparent box — no plate, like the original) --- */
  .buffer{animation:bufIn 1.05s cubic-bezier(.19,1,.22,1) both}
  @keyframes bufIn{from{opacity:0;transform:translateY(18px) scale(.965)}to{opacity:1;transform:none}}

  /* --- arc spinner: eased dash with a comet tail; loop is symmetric --- */
  .buffer::before{content:"";position:absolute;inset:0;border-radius:50%;
    border:7px solid rgba(255,255,255,.07);border-top-color:var(--yellow);
    border-right-color:rgba(255,193,7,.26);
    animation:spin 1.5s cubic-bezier(.63,.05,.37,.95) infinite;will-change:transform}
  .buffer::after{content:"";position:absolute;inset:16px;border-radius:50%;
    border:2px dashed rgba(255,193,7,.22);
    animation:spinRev 14s linear infinite;will-change:transform}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinRev{to{transform:rotate(-360deg)}}

  /* --- face: breathe with a halo riding the exact same clock --- */
  .buffer .face{width:216px;height:216px;animation:faceBreathe 3.4s cubic-bezier(.45,0,.55,1) infinite;will-change:transform}
  .face::before{content:"";position:absolute;inset:-14%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,193,7,.17),transparent 62%);
    opacity:0;animation:halo 3.4s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes faceBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes halo{0%,100%{opacity:0}50%{opacity:1}}

  /* --- entrance rhythm: one timeline, no dead air, no crowding --- */
  .rise{animation-duration:1s;animation-timing-function:cubic-bezier(.19,1,.22,1)}
  h1.rise{animation-delay:.22s}
  .sub.rise{animation-delay:.38s}
  .bnc.rise{animation-delay:.54s}

  /* --- type polish: hairline depth on white, light on the accent word --- */
  h1{text-shadow:0 3px 26px rgba(0,0,0,.38)}
  h1 .y{text-shadow:0 0 38px rgba(255,193,7,.30)}
  .sub{text-shadow:0 1px 14px rgba(0,0,0,.30)}

  /* --- dots: traveling wave phase, squash & stretch, color-matched glow --- */
  .bnc span{animation:b 1.2s cubic-bezier(.45,0,.55,1) infinite;will-change:transform;transform-origin:50% 100%}
  .bnc span:nth-child(2){animation-delay:.15s;box-shadow:0 0 12px rgba(14,203,129,.45)}
  .bnc span:nth-child(3){animation-delay:.3s;box-shadow:0 0 12px rgba(246,70,93,.45)}
  .bnc span:nth-child(1){box-shadow:0 0 12px rgba(255,193,7,.45)}
  @keyframes b{0%,100%{transform:translateY(0) scale(1,.92)}18%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(.96,1.06)}}

  /* --- sparks: even 6s phase coverage (perfect stagger, loop never gaps) --- */
  .stage .spark:nth-of-type(1){animation-delay:.1s}
  .stage .spark:nth-of-type(2){animation-delay:1.6s}
  .stage .spark:nth-of-type(3){animation-delay:3.1s}
  .stage .spark:nth-of-type(4){animation-delay:4.6s}

  /* --- ticker: numerals locked, march stays linear --- */
  .tk{font-variant-numeric:tabular-nums}
</style></head><body>
<div class="stage">
  <div class="bg"></div>
  <span class="spark" style="left:14%;top:20%;--d:.4s"></span><span class="spark" style="left:84%;top:26%;--d:1.8s;background:var(--up)"></span><span class="spark" style="left:76%;top:78%;--d:3s"></span><span class="spark" style="left:24%;top:72%;--d:2.3s;background:var(--sky)"></span>
  <div class="wrap">
    <div class="buffer"><div class="face"><span class="eye l"></span><span class="eye r"></span><svg class="mouth" viewBox="0 0 150 70"><path d="M12 12 C 45 62, 105 62, 138 12"/></svg></div></div>
    <h1 class="rise" style="--rd:.1s">positions <span class="y">paused</span>.</h1>
    <p class="sub rise" style="--rd:.2s">Trader stepped away — charts secured, smile intact.</p>
    <div class="bnc rise" style="--rd:.3s"><span></span><span></span><span></span></div>
  </div>
  <div class="ticker" style="--tk-speed:38s">
    <div class="tk"><span>✦ BE RIGHT BACK</span><span>positions secured</span><span>don't close the tab</span><span>@smileke</span><span>smile.co.ke</span><span>#SmileSquad</span></div>
    <div class="tk"><span>✦ BE RIGHT BACK</span><span>positions secured</span><span>don't close the tab</span><span>@smileke</span><span>smile.co.ke</span><span>#SmileSquad</span></div>
  </div>
</div>
<script src="smile-mark.js"></script>
</body></html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SMILE · countdown · AMBIENT CINEMA</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="smile-core.css">
  <style>
    /* ================= frozen scene layout (countdown-original) ================= */
    .topbar{position:absolute;top:88px;left:120px;right:120px;display:flex;justify-content:space-between;align-items:center;z-index:5}
    .topbar .brand{font-size:34px}.topbar .brand .dw{width:42px;height:42px}
    .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:40px}
    .halo{position:absolute;left:50%;top:46%;width:760px;height:760px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,193,7,.07) 0%,transparent 62%);pointer-events:none}
    .ring{position:relative;width:560px;height:560px;filter:drop-shadow(0 0 34px rgba(255,193,7,.18))}
    .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
    .ring circle{fill:none;stroke-width:13;stroke-linecap:round}
    .ring .tr{stroke:rgba(255,255,255,.07)}
    .ring .pr{stroke:var(--yellow);stroke-dasharray:1609;transition:stroke-dashoffset 1s linear}
    .tickrow{position:absolute;inset:14px;border-radius:50%;pointer-events:none}
    .tickrow i{position:absolute;left:50%;top:0;width:2px;height:10px;margin-left:-1px;background:rgba(255,255,255,.14);transform-origin:50% 266px}
    .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:292px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;will-change:transform}
    .num.pop{animation:pop .9s var(--ease-spring)}
    @keyframes pop{0%{transform:scale(1.26);opacity:.12;color:var(--yellow)}60%{transform:scale(.97)}100%{transform:scale(1)}}
    .label{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.42em;margin-right:-.42em;text-transform:uppercase;color:var(--muted);margin-top:36px}
    .flash{position:absolute;inset:0;background:var(--yellow);opacity:0;pointer-events:none}.flash.go{animation:fl 1s ease forwards}
    @keyframes fl{0%{opacity:0}16%{opacity:1}100%{opacity:0}}
    .endlogo{position:absolute;inset:0;display:grid;place-items:center;opacity:0}.endlogo.go{animation:endp 1.1s var(--ease-spring) forwards}
    .endlogo .brand{font-size:190px;background:rgba(20,20,20,.9);padding:.16em .32em;border-radius:.16em;border:1px solid var(--line);box-shadow:0 40px 120px rgba(0,0,0,.6)}
    .endlogo .brand .dw{width:150px;height:150px}
    @keyframes endp{0%{opacity:0;transform:scale(.72)}35%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}

    /* ================= E5 · AMBIENT CINEMA execution layer =================
       The scene is always alive, almost imperceptibly: layered parallax
       (grid ↔ sparks ↔ ring ↔ halo), a 40s light sweep crossing the stage,
       halo tide, deeper spark orbits — and in the last 3 seconds the light
       tightens: shimmer accelerates, a warm glow rises behind the dial.   */

    /* --- 40s light sweep (off-stage at loop ends → seamless) --- */
    .sweep{position:absolute;inset:-10%;pointer-events:none;z-index:0;transform:translateX(-135%);will-change:transform;
      background:linear-gradient(103deg,transparent 40%,rgba(255,255,255,.028) 49%,rgba(255,193,7,.035) 51%,rgba(255,255,255,.02) 55%,transparent 63%);
      animation:stageSweep 40s ease-in-out infinite}
    @keyframes stageSweep{0%{transform:translateX(-135%)}52%{transform:translateX(135%)}100%{transform:translateX(135%)}}

    /* --- parallax layer 1: the grid breathes against the stage --- */
    .bg::after{animation:gridDrift 46s ease-in-out infinite alternate;will-change:transform}
    @keyframes gridDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-16px,12px,0)}}

    /* --- deeper spark orbits (depth layer) --- */
    .spark{animation:floatSparkDeep 9s ease-in-out infinite var(--d,0s)}
    @keyframes floatSparkDeep{0%,100%{transform:translate(0,0) scale(1);opacity:0}12%{opacity:.9}50%{transform:translate(26px,-54px) scale(1.7);opacity:.5}88%{opacity:.75}}

    /* --- slow cinematic entrances (1.2–1.6s expo, long stagger) --- */
    .topbar{animation:tbIn 1.3s cubic-bezier(.19,1,.22,1) .15s both}
    @keyframes tbIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
    .wrap .ring{animation:ringIn 1.6s cubic-bezier(.19,1,.22,1) .25s both,ringFloat 12s ease-in-out 2.1s infinite}
    @keyframes ringIn{from{opacity:0;transform:translateY(12px) scale(.955)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes ringFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
    .halo{animation:haloIn 1.6s cubic-bezier(.19,1,.22,1) .3s both,tide 10s ease-in-out 2.1s infinite}
    @keyframes haloIn{from{opacity:0;transform:translate(-50%,-50%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    @keyframes tide{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(1.07);opacity:.72}}
    .label{animation:lbIn 1.3s cubic-bezier(.19,1,.22,1) .55s both}
    @keyframes lbIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

    /* --- last-3-seconds tension: glow rises, shimmer accelerates --- */
    .glowT{position:absolute;left:50%;top:46%;width:900px;height:900px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:0;transition:opacity 1s ease;
      background:radial-gradient(circle,rgba(255,193,7,.13) 0%,rgba(255,193,7,.05) 34%,transparent 62%)}
    .stage.tense .glowT{opacity:1}
    .numGlow{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:292px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--yellow);opacity:0;transition:opacity .9s ease;filter:blur(26px);pointer-events:none}
    .stage.tense .numGlow{opacity:.5}
    .numGlow.pop{animation:popGlow .9s var(--ease-spring)}
    @keyframes popGlow{0%{transform:scale(1.26);opacity:.12}100%{transform:scale(1);opacity:.5}}
    .shim{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;transition:opacity .8s ease;
      background:conic-gradient(from 0deg,transparent 0 20deg,rgba(255,255,255,.20) 34deg,rgba(255,193,7,.30) 40deg,rgba(255,255,255,.20) 46deg,transparent 60deg,transparent 360deg);
      -webkit-mask:radial-gradient(circle at 50% 50%,transparent 0 246px,#000 252px 278px,transparent 284px);
      mask:radial-gradient(circle at 50% 50%,transparent 0 246px,#000 252px 278px,transparent 284px);
      will-change:transform,opacity}
    .shimA{animation:shimRot 15s linear infinite;opacity:.7}
    .shimB{animation:shimRot 4.6s linear infinite;opacity:0}
    .stage.tense .shimA{opacity:0}
    .stage.tense .shimB{opacity:.85}
    @keyframes shimRot{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <div class="sweep" aria-hidden="true"></div>
  <span class="spark" style="left:14%;top:18%;--d:.3s"></span>
  <span class="spark" style="left:82%;top:24%;--d:1.6s;background:var(--up)"></span>
  <span class="spark" style="left:76%;top:80%;--d:2.8s"></span>
  <span class="spark" style="left:22%;top:74%;--d:3.7s;background:var(--sky)"></span>
  <div class="glowT" aria-hidden="true"></div>
  <div class="topbar">
    <span class="brand"><span class="dw"><svg class="disc" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#FFC107"/><ellipse cx="41" cy="40" rx="6.5" ry="7.6" fill="#0b0b0b"/><ellipse cx="59" cy="40" rx="6.5" ry="7.6" fill="#0b0b0b"/><path d="M32 55 C 35 77, 65 77, 68 55" fill="none" stroke="#0b0b0b" stroke-width="10.5" stroke-linecap="round"/></svg></span><b>smile</b></span>
    <div class="chip dark">● OPENING BELL</div>
  </div>
  <div class="halo"></div>
  <div class="wrap">
    <div class="ring">
      <svg viewBox="0 0 560 560"><circle class="tr" cx="280" cy="280" r="256"/><circle class="pr" id="pr" cx="280" cy="280" r="256"/></svg>
      <div class="tickrow" id="ticks"></div>
      <div class="shim shimA" aria-hidden="true"></div>
      <div class="shim shimB" aria-hidden="true"></div>
      <div class="numGlow" id="glow" aria-hidden="true">10</div>
      <div class="num" id="num">10</div>
    </div>
    <div class="label">opening bell in</div>
  </div>
  <div class="endlogo" id="end">
    <span class="brand" data-mood="bounce">
      <span class="dw">
        <svg class="disc" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="50" fill="#FFC107"/>
          <ellipse cx="41" cy="40" rx="6.5" ry="7.6" fill="#0b0b0b"/>
          <ellipse cx="59" cy="40" rx="6.5" ry="7.6" fill="#0b0b0b"/>
          <path d="M32 55 C 35 77, 65 77, 68 55" fill="none" stroke="#0b0b0b" stroke-width="10.5" stroke-linecap="round"/>
        </svg>
      </span><b>smile</b>
    </span>
  </div>
  <div class="flash" id="flash"></div>
</div>
<script src="smile-mark.js"></script>
<script>
  const q=new URLSearchParams(location.search);const total=+(q.get('from')||10);let n=total,AC;
  const num=document.getElementById('num'),pr=document.getElementById('pr'),C=1609;
  const stage=document.querySelector('.stage'),glow=document.getElementById('glow');
  (function(){const row=document.getElementById('ticks');for(let i=0;i<60;i++){const t=document.createElement('i');t.style.transform=`rotate(${i*6}deg)`;if(i%5===0)t.style.height='16px';row.appendChild(t);}})();
  function beep(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.18);o.start();o.stop(AC.currentTime+.2);}catch(e){}}
  (function tick(){if(n>0){
    num.textContent=n;glow.textContent=n;
    num.classList.remove('pop');glow.classList.remove('pop');void num.offsetWidth;num.classList.add('pop');glow.classList.add('pop');
    if(n<=3)stage.classList.add('tense');
    pr.style.strokeDashoffset=C*(1-n/total);beep(n<=3?988:660);n--;setTimeout(tick,1000);
  }else{beep(1319);document.getElementById('flash').classList.add('go');document.getElementById('end').classList.add('go');}})();
</script>
</body>
</html>

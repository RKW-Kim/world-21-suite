<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>qa-wanna — smile kit3 — mono queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFCE00; --yellow-hot:#E8A800; --ink:#0A0900;
  --page:#0A0900; --panel:#141210; --card:#1C1914; --card-lift:#25221D;
  --hair:#2A251C; --paper:#F5F1E6; --muted:#9C9484;
  --glide:cubic-bezier(.2,.9,.25,1); --snap:cubic-bezier(.85,0,.15,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--page);overflow:hidden}
body{font-family:'Archivo',sans-serif;color:var(--paper)}
.fit{position:fixed;inset:0;display:grid;place-items:center}
.stage{width:1920px;height:1080px;position:relative;background:var(--page);overflow:hidden;flex:none}
.stage::before{content:'';position:absolute;inset:0;background:radial-gradient(1100px 720px at 68% 42%,rgba(245,241,230,.028),rgba(245,241,230,0) 62%);pointer-events:none;z-index:1}
body.obs{background:transparent}
body.obs .stage{background:transparent}
body.obs .stage::before{display:none}

/* ---- rolling digit cells ---- */
.cells{display:inline-flex;align-items:center;font:600 15px/1 'IBM Plex Mono',monospace;color:var(--paper);font-variant-numeric:tabular-nums}
.cell{position:relative;display:inline-block;width:1ch;height:1em;overflow:hidden}
.g{position:absolute;inset:0;text-align:center;line-height:1em;transition:transform .42s var(--glide)}
.colon{display:inline-flex;align-items:center;height:1em;color:var(--muted);padding:0 1px}

/* ---- HUD chips ---- */
.chip{display:inline-flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:11px 18px}
.hud{position:absolute;top:40px;display:flex;gap:16px;z-index:30}
.hud-l{left:48px}
.hud-r{right:48px}
.lbl{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.livebig{display:inline-flex;align-items:center;gap:10px;font:800 13px/1 'Archivo',sans-serif;letter-spacing:.16em;color:var(--paper)}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--paper);animation:pulse 2.4s ease-in-out infinite}
.chip.slam{animation:slam .5s var(--spring)}

/* ---- left rail ---- */
.rail{position:absolute;left:48px;top:120px;width:420px;height:864px;background:var(--panel);border:1px solid var(--hair);border-radius:16px;padding:36px;display:flex;flex-direction:column;z-index:10}
.headline{font:800 56px/1.05 'Archivo',sans-serif;letter-spacing:.02em;color:var(--paper);text-transform:uppercase}
.headline.small{font-size:44px}
.hl{display:block}
.facewrap{width:120px;height:120px;margin-top:44px;border-radius:50%;border:1px solid var(--hair);padding:0}
.facewrap svg{width:100%;height:100%;display:block}
.meta{margin-top:44px}
.mrow{padding:15px 0;border-top:1px solid var(--hair);font:600 12px/1.5 'IBM Plex Mono',monospace;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.qchip{margin-top:24px;display:inline-flex;align-items:flex-end;gap:14px;align-self:flex-start;border:1px solid rgba(245,241,230,.55);border-radius:12px;padding:14px 18px}
.qlbl{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;color:var(--muted);padding-bottom:5px}
.qnum.cells{font-size:36px}

/* ---- just-answered mini-card ---- */
.jacard{margin-top:auto;border:1px solid var(--hair);border-radius:12px;padding:13px 16px 12px}
.jalbl{font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.jaq{margin-top:9px;font:600 15px/1.35 'Archivo',sans-serif;color:#DDD5C2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jaq.idle{font:500 11px/1.5 'IBM Plex Mono',monospace;letter-spacing:.18em;color:var(--muted)}
.jafoot{margin-top:9px;display:flex;align-items:center;gap:8px;min-height:13px}
.jachk{width:13px;height:13px;flex:none;opacity:.3}
.jah{font:500 12px/1 'IBM Plex Mono',monospace;color:#8A8172;letter-spacing:.06em}
.jacard.pop{animation:jaIn .5s var(--glide) both}
.jacard.pop .jachk{animation:chkIn .5s var(--spring) .06s both}

/* ---- queue wall ---- */
.wall{position:absolute;left:516px;top:120px;width:1356px;height:864px;overflow:hidden;z-index:5}
.qrow{position:absolute;left:0;top:0;width:100%;height:124px;background:var(--fill,var(--card));border:1px solid var(--hair);border-radius:16px;display:flex;align-items:center;gap:24px;padding:0 28px;will-change:transform}
.rank{font:500 15px/1 'IBM Plex Mono',monospace;color:#78715F;width:44px;flex:none;letter-spacing:.08em;transition:opacity .18s ease}
.qrow.rk-swap .rank{opacity:0}
.qtext{font:600 22px/1.25 'Archivo',sans-serif;color:var(--tone,#F5F1E6);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtext .ch{white-space:pre;opacity:0;animation:chIn .16s ease both;animation-delay:calc(var(--i)*18ms)}
.handle{font:500 13px/1 'IBM Plex Mono',monospace;color:#8A8172;flex:none}
.tagchip{flex:none;min-width:96px;text-align:center;font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:var(--muted);border:1px solid var(--hair);background:transparent;border-radius:10px;padding:8px 12px}
.onair{display:none;position:absolute;right:28px;top:50%;transform:translateY(-50%);align-items:center;justify-content:center;gap:9px;font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.18em;color:var(--paper)}
.oadot{width:8px;height:8px;border-radius:50%;background:var(--yellow);animation:pulse 2.4s ease-in-out infinite}
.qrow.live{background:var(--card-lift);box-shadow:0 10px 26px rgba(255,206,0,.16)}
.qrow.live::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--yellow);border-radius:16px 0 0 16px}
.qrow.live .onair{display:flex}
.qrow.live .tagchip{visibility:hidden}

/* ---- ticker ---- */
.ticker{position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--panel);border-top:1px solid var(--hair);overflow:hidden;display:flex;align-items:center;z-index:20;animation:fadeIn .6s ease .2s both}
.ttrack{display:flex;width:max-content;animation:tick 36s linear infinite}
.tseg{display:flex;align-items:center}
.ti{font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;padding:0 14px;white-space:nowrap}
.dia{color:#5C5546;font-size:10px;line-height:1}

/* ---- furniture ---- */
.wm{position:absolute;right:48px;bottom:72px;width:42px;height:42px;opacity:.18;z-index:25;animation:fadeIn .8s ease .3s both}
.wm svg{width:100%;height:100%;display:block}
.help{position:absolute;left:48px;bottom:72px;font:500 11px/1.4 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--muted);opacity:.7;transition:opacity .6s ease;z-index:25}
.help.off{opacity:0}
.sweep{position:absolute;top:0;left:0;width:10px;height:1080px;background:var(--yellow);transform:translateX(-40px);opacity:0;z-index:40;pointer-events:none}
.sweep.go{animation:sweepGo .62s cubic-bezier(.5,0,.2,1) forwards}

/* ---- entry keyframes ---- */
.hud .chip{animation:hudIn .52s var(--glide) both}
.hud-l .chip{animation-delay:.02s}
.hud-r .chip{animation-delay:.1s}
.hl{animation:riseIn .6s var(--glide) both}
#hl1{animation-delay:.08s}
#hl2{animation-delay:.16s}
.facewrap{animation:faceIn .7s var(--spring) .14s both}
.mrow{animation:riseIn .55s var(--glide) both}
.mrow:nth-of-type(1){animation-delay:.3s}
.mrow:nth-of-type(2){animation-delay:.38s}
.qchip{animation:riseIn .55s var(--glide) .46s both}

@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes hudIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes faceIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes chIn{to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}45%{opacity:.5;transform:scale(.78)}58%{opacity:.85;transform:scale(.92)}}
@keyframes slam{0%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes tick{to{transform:translateX(-50%)}}
@keyframes sweepGo{0%{transform:translateX(-40px);opacity:.9}100%{transform:translateX(1960px);opacity:.9}}
@keyframes jaIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes chkIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

body.rm .stage::before{display:none}
body.rm *{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0ms!important}
</style>
</head>
<body>
<div class="fit">
  <div class="stage" id="stage">

    <div class="hud hud-l">
      <div class="chip" id="cdchip"><span class="lbl" id="cdlbl">STAND BY</span><span class="cells" id="cdcells"></span></div>
    </div>
    <div class="hud hud-r">
      <div class="chip"><span class="lbl">EAT &middot; NAIROBI DESK</span><span class="cells" id="clock"></span></div>
    </div>

    <aside class="rail">
      <h1 class="headline" id="headline"><span class="hl" id="hl1" data-title>ASK US</span><span class="hl" id="hl2">ANYTHING</span></h1>
      <div class="facewrap">
        <svg viewBox="0 0 100 100" role="img" aria-label="Smile mark"><circle cx="50" cy="50" r="48" fill="#1C1914"/><circle cx="31" cy="35" r="5.5" fill="#F5F1E6"/><circle cx="69" cy="35" r="5.5" fill="#F5F1E6"/><path d="M 20 48 A 30 30 0 0 0 80 48" fill="none" stroke="#FFCE00" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="meta">
        <div class="mrow">Q&amp;A &mdash; EP <span data-ep>128</span></div>
        <div class="mrow" data-sub>DROP QUESTIONS IN CHAT</div>
      </div>
      <div class="jacard" id="jacard" aria-live="polite">
        <div class="jalbl">JUST ANSWERED</div>
        <p class="jaq idle" id="jaq">AWAITING FIRST ANSWER</p>
        <div class="jafoot"><svg class="jachk" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="#0ECB81" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="jah" id="jah"></span></div>
      </div>
      <div class="qchip"><span class="qlbl">QUEUE</span><span class="qnum cells" id="qnum"></span></div>
    </aside>

    <section class="wall" id="wall" aria-label="Question queue"></section>

    <footer class="ticker"><div class="ttrack" id="ttrack"></div></footer>

    <div class="wm" id="wm">
      <svg viewBox="0 0 100 100" aria-label="Smile mark"><circle cx="50" cy="50" r="48" fill="#FFC107"/><circle cx="31" cy="35" r="5.5" fill="#0a0a0a"/><circle cx="69" cy="35" r="5.5" fill="#0a0a0a"/><path d="M 20 48 A 30 30 0 0 0 80 48" fill="none" stroke="#0a0a0a" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="help off" id="help">?t=&lt;sec|ISO&gt; &middot; ?ep= &middot; ?title= &middot; ?obs=1 &middot; ?wm=0 &mdash; H hides</div>
    <div class="sweep" id="sweep"></div>

  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var P=new URLSearchParams(location.search);
var RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(RM)document.body.classList.add('rm');

/* scale-to-fit */
var stage=$('#stage');
var fit=function(){var s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+s+')'};
addEventListener('resize',fit);fit();

/* URL contract: ep / title / sub / obs / wm */
var ep=(P.get('ep')||'128').replace(/[^\w.-]/g,'')||'128';
$$('[data-ep]').forEach(function(n){n.textContent=ep});
var tOv=P.get('title');
if(tOv&&tOv.trim()){
  var w=tOv.trim().split(/\s+/),mid=Math.ceil(w.length/2);
  $('#hl1').textContent=w.slice(0,mid).join(' ');
  var rest=w.slice(mid).join(' ');
  if(rest){$('#hl2').textContent=rest}else{$('#hl2').style.display='none'}
  if(tOv.trim().length>16)$('#headline').classList.add('small');
}
var sOv=P.get('sub');
if(sOv)$$('[data-sub]').forEach(function(n){n.textContent=sOv});
if(P.get('obs')==='1')document.body.classList.add('obs');
if(P.get('wm')==='0')$('#wm').style.display='none';

/* ticker */
var seg='';
for(var k=0;k<4;k++){
  seg+='<span class="ti">EPISODE '+ep+'</span><span class="dia">&#9670;</span>'
      +'<span class="ti">@smileke</span><span class="dia">&#9670;</span>'
      +'<span class="ti">smile.co.ke</span><span class="dia">&#9670;</span>'
      +'<span class="ti">#SmileSquad</span><span class="dia">&#9670;</span>';
}
$('#ttrack').innerHTML='<div class="tseg">'+seg+'</div><div class="tseg" aria-hidden="true">'+seg+'</div>';

/* rolling digit cells */
function makeCells(host,n){
  host.textContent='';var cells=[];
  for(var i=0;i<n;i++){
    var c=document.createElement('span');c.className='cell';
    var g=document.createElement('span');g.className='g';g.textContent='0';
    c.appendChild(g);host.appendChild(c);cells.push({el:c,g:g});
  }
  return cells;
}
function setRoll(cells,str,stagger,instant){
  stagger=(stagger==null)?40:stagger;
  Array.prototype.forEach.call(str,function(ch,i){
    var c=cells[i];if(!c||c.g.textContent===ch)return;
    if(instant||RM){c.g.textContent=ch;return}
    var oldG=c.g,nw=document.createElement('span');
    nw.className='g';nw.textContent=ch;
    nw.style.transform='translateY(112%)';
    nw.style.transitionDelay=(i*stagger)+'ms';
    oldG.style.transitionDelay=(i*stagger)+'ms';
    c.el.appendChild(nw);c.g=nw;
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      oldG.style.transform='translateY(-112%)';nw.style.transform='translateY(0)';
    })});
    setTimeout(function(){oldG.remove();nw.style.transitionDelay='0ms'},560+i*stagger);
  });
}

/* time cell builder: 2-digit groups joined by real colon glyphs */
function buildTime(host,groups){
  host.textContent='';var cells=[];
  var mk=function(){var c=document.createElement('span');c.className='cell';
    var g=document.createElement('span');g.className='g';g.textContent='0';
    c.appendChild(g);host.appendChild(c);cells.push({el:c,g:g})};
  var col=function(){var s=document.createElement('span');s.className='colon';s.textContent=':';host.appendChild(s)};
  for(var gi=0;gi<groups.length;gi++){mk();mk();if(gi<groups.length-1)col()}
  return cells;
}
var clkCells=buildTime($('#clock'),[2,2,2]);
function tickClock(){
  var t=new Date(Date.now()+3*3600e3),p2=function(n){return String(n).padStart(2,'0')};
  setRoll(clkCells,p2(t.getUTCHours())+p2(t.getUTCMinutes())+p2(t.getUTCSeconds()));
}
tickClock();setInterval(tickClock,1000);

/* countdown (?t=<sec|ISO>; default stand-by 3s then 10:00) */
var cdLbl=$('#cdlbl'),cdCells=buildTime($('#cdcells'),[2,2]),cdChip=$('#cdchip'),sweep=$('#sweep');
var mode='standby',target=null,remain=600;
var qp=P.get('t');
if(qp!=null&&qp.trim()!==''){
  var qs=qp.trim();
  if(/^\d+$/.test(qs)){remain=parseInt(qs,10);target=Date.now()+remain*1000;mode='run'}
  else{var dt=Date.parse(qs);if(!isNaN(dt)){target=dt;remain=Math.max(0,Math.ceil((dt-Date.now())/1000));mode='run'}}
}
setRoll(cdCells,'----',0,true);
function renderCd(){
  var p2=function(n){return String(n).padStart(2,'0')};
  var mm=Math.min(99,Math.floor(remain/60)),ss=remain%60;
  setRoll(cdCells,p2(mm)+p2(ss));
}
function fireLive(){
  if(mode==='live')return;mode='live';
  cdLbl.textContent='';
  cdChip.innerHTML='<span class="livebig"><i class="livedot"></i>WE\u2019RE LIVE</span>';
  void cdChip.offsetWidth;cdChip.classList.add('slam');
  setTimeout(function(){cdChip.classList.remove('slam')},650);
  if(!RM){sweep.classList.add('go');setTimeout(function(){sweep.classList.remove('go')},900)}
}
if(mode==='run'){
  cdLbl.textContent='ON AIR IN';renderCd();
  if(remain<=0)setTimeout(fireLive,700);
}
setTimeout(function(){
  if(mode==='standby'){mode='run';target=Date.now()+600000;remain=600;cdLbl.textContent='ON AIR IN';renderCd()}
},3000);
setInterval(function(){
  if(mode!=='run')return;
  remain=Math.max(0,Math.ceil((target-Date.now())/1000));
  renderCd();
  if(remain<=0)fireLive();
},250);

/* question queue */
var PITCH=148;
var QUESTIONS=[
  {q:'How do you size a position?',h:'@wanjiku',t:'LIVE'},
  {q:'Best desk setup for under 30K KES?',h:'@brian.ke',t:'HOT TAKES'},
  {q:'What\u2019s the plan for Friday\u2019s stream?',h:'@otieno_x',t:'MAILBAG'},
  {q:'Coffee or chai while charting?',h:'@njeri.trades',t:'HOT TAKES'},
  {q:'What broker do you actually use?',h:'@kariuki_',t:'MAILBAG'},
  {q:'When does the podcast drop?',h:'@zawadi.ke',t:'MAILBAG'}
];
var TONES=['#F5F1E6','#E8E1CF','#CDC5B2','#B2AA97','#9A927F','#847C6A'];
/* grey-ramp step-down: card fill drops ~4-5 luminance pts per queue step, row 02 lightest -> row 06 dimmest */
var FILLS=['#25221D','#211E18','#1C1914','#17140F','#121009','#0E0C07'];
var wall=$('#wall');
var slots=QUESTIONS.map(function(d,i){
  var r=document.createElement('article');r.className='qrow';
  r.innerHTML='<span class="rank">'+String(i+1).padStart(2,'0')+'</span>'
    +'<p class="qtext"></p>'
    +'<span class="handle">'+d.h+'</span>'
    +'<span class="tagchip">'+d.t+'</span>'
    +'<span class="onair"><i class="oadot"></i>ON AIR</span>';
  r.querySelector('.qtext').textContent=d.q;
  r.dataset.q=d.q;r.dataset.h=d.h;
  r.style.transform='translateY('+(i*PITCH)+'px)';
  r.style.setProperty('--tone',TONES[i]);
  r.style.setProperty('--fill',FILLS[i]);
  wall.appendChild(r);
  return r;
});
slots[0].classList.add('live');
var qCells=makeCells($('#qnum'),2);
setRoll(qCells,'07',0,true);
var qCount=7;

function typewriter(p,text){
  if(RM){p.textContent=text;return}
  p.textContent='';
  Array.prototype.forEach.call(text,function(ch,i){
    var s=document.createElement('span');s.className='ch';s.textContent=ch;
    s.style.setProperty('--i',i);p.appendChild(s);
  });
}

/* entry: hard-snap rows, 80ms stagger; live question types itself */
if(RM){
  slots.forEach(function(r,i){r.style.transform='translateY('+(i*PITCH)+'px)';r.style.opacity='1'});
  typewriter(slots[0].querySelector('.qtext'),slots[0].dataset.q);
}else{
  slots.forEach(function(r,i){r.style.opacity='0';r.style.transform='translateY('+(i*PITCH+34)+'px)'});
  void wall.offsetWidth;
  slots.forEach(function(r,i){
    r.style.transition='transform .55s cubic-bezier(.85,0,.15,1) '+(380+i*80)+'ms, opacity .3s ease '+(380+i*80)+'ms';
    r.style.transform='translateY('+(i*PITCH)+'px)';
    r.style.opacity='1';
  });
  setTimeout(function(){slots.forEach(function(r){r.style.transition=''})},1500);
  setTimeout(function(){typewriter(slots[0].querySelector('.qtext'),slots[0].dataset.q)},950);
}

/* carousel: every 9s the queue deals one row */
var animating=false;
function setRank(r,n){
  var el=r.querySelector('.rank');
  if(RM){el.textContent=String(n).padStart(2,'0');return}
  r.classList.add('rk-swap');
  setTimeout(function(){el.textContent=String(n).padStart(2,'0');r.classList.remove('rk-swap')},180);
}
/* JUST ANSWERED mini-card: mirrors the question that just left row 01 */
var jaCard=$('#jacard'),jaQ=$('#jaq'),jaH=$('#jah');
function setJustAnswered(q,h){
  jaQ.textContent=q;jaQ.classList.remove('idle');
  jaH.textContent=h;
  jaCard.classList.remove('pop');void jaCard.offsetWidth;jaCard.classList.add('pop');
}
function advance(){
  if(animating)return;animating=true;
  var out=slots[0],top=slots[1];
  top.classList.add('live');
  out.style.zIndex=20;
  if(!RM){
    out.style.transition='transform .62s cubic-bezier(.85,0,.15,1) .04s, opacity .4s ease .2s';
    out.style.transform='translateY(0px) translateX(-114%) rotate(-1.4deg)';
    out.style.opacity='0';
    for(var i=1;i<slots.length;i++){
      var r=slots[i];
      r.style.transition='transform .66s cubic-bezier(.34,1.56,.64,1), background-color .45s ease';
      r.style.transform='translateY('+((i-1)*PITCH)+'px)';
    }
  }else{
    out.style.transform='translateY(0px) translateX(-114%)';
    out.style.opacity='0';
    for(var j=1;j<slots.length;j++){slots[j].style.transform='translateY('+((j-1)*PITCH)+'px)'}
  }
  slots.push(slots.shift());
  slots.forEach(function(r,i){setRank(r,i+1);r.style.setProperty('--tone',TONES[i]);r.style.setProperty('--fill',FILLS[i])});
  setJustAnswered(out.dataset.q,out.dataset.h);
  qCount=(qCount<=1)?7:qCount-1;
  setRoll(qCells,String(qCount).padStart(2,'0'));
  setTimeout(function(){typewriter(top.querySelector('.qtext'),top.dataset.q)},RM?0:420);
  setTimeout(function(){
    out.classList.remove('live');out.style.zIndex='';
    out.style.transition='none';
    out.style.transform='translateY('+(5*PITCH)+'px) translateX(52px) rotate(.6deg)';
    out.style.opacity='0';
    void out.offsetWidth;
    if(!RM){
      out.style.transition='transform .66s cubic-bezier(.34,1.56,.64,1), opacity .28s ease';
      requestAnimationFrame(function(){
        out.style.transform='translateY('+(5*PITCH)+'px) translateX(0) rotate(0deg)';
        out.style.opacity='1';
      });
    }else{
      out.style.transform='translateY('+(5*PITCH)+'px)';
      out.style.opacity='1';
    }
    setTimeout(function(){out.style.transition='';animating=false},RM?0:780);
  },RM?0:700);
}
setTimeout(function(){advance();setInterval(advance,9000)},9000);

/* help: hidden by default, H toggles */
var helpEl=$('#help');
addEventListener('keydown',function(e){if(e.key==='h'||e.key==='H')helpEl.classList.toggle('off')});
})();
</script>

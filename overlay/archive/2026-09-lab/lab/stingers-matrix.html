<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STINGERS — MATRIX · every platform interaction · smile.co.ke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/liquid-glass.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0A0C14;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif; }

  /* ?obs=1 — truly transparent capture: html AND body, chrome gone */
  html.obs, body.obs { background:transparent !important; }
  body.obs #chart, body.obs #bgLayer, body.obs #help, body.obs #tabs { display:none !important; }

  #stage { position:absolute; inset:0; }
  #chart { position:absolute; inset:0; }
  #bgLayer { position:absolute; inset:0; display:none; }
  #bgLayer.bright { display:block; background:linear-gradient(135deg,#F7F3EA,#E8DFC9 45%,#D9CBA6); }
  #bgLayer.dark   { display:block; background:linear-gradient(160deg,#0E1118,#131720 50%,#0B0D12); }

  /* ================= platform tabs (top center) ================= */
  #tabs { position:absolute; top:16px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; z-index:9; }
  .tab { font:600 10px "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.16em;
    color:rgba(255,255,255,.50); background:rgba(10,12,18,.55); border:0; cursor:pointer;
    padding:8px 13px 8px 11px; border-radius:999px; backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px); box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
    transition:color .25s, background .25s, box-shadow .25s; }
  .tab i { display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--pa,#FFCE00); margin-right:7px; vertical-align:1px; opacity:.75; transition:opacity .25s; }
  .tab:hover { color:rgba(255,255,255,.85); }
  .tab.on { color:#fff; background:rgba(32,36,46,.74); box-shadow:inset 0 0 0 1px rgba(255,255,255,.17); }
  .tab.on i { opacity:1; }

  /* ================= help (bottom left) ================= */
  #help { position:absolute; left:20px; bottom:20px; z-index:9; max-width:560px;
    font:600 10px/1.7 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.05em;
    color:rgba(255,255,255,.55); background:rgba(10,12,18,.55); padding:9px 13px; border-radius:12px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
  #help .k { color:#FFCE00; font-weight:600; }
  #help .sep { font-style:normal; color:rgba(255,255,255,.28); margin:0 6px; }
  #help .hint { display:block; margin-top:2px; color:rgba(255,255,255,.38); }

  /* ================= dock (bottom right, one shared anchor) ================= */
  #dock { position:absolute; right:44px; bottom:48px; display:grid; }
  .stgw { grid-area:1 / 1; justify-self:end; position:relative; }

  /* ================= THE CARD ================= */
  .stg { display:none; align-items:center; cursor:pointer; opacity:0;
    padding:14px 26px 14px 14px; border-radius:999px;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif; }
  .stg.on { display:flex; }
  .stg.in, .stg.out { opacity:1; }
  /* LG.glass lifts children into .lg-content — keep the row intact in there */
  .stg .lg-content { display:flex; align-items:center; gap:16px; }
  /* money heroes animate themselves — suppress the core rise on their stage */
  .lg.in .lg-content > .obj-stage { animation:none; opacity:1; }

  /* ONE accent per card — platform color in the BOTTOM rim only (core rule) */
  body[data-theme="obsidian"]  .stg { --acc-o:.60; }
  body[data-theme="chameleon"] .stg { --acc-o:.48; }
  body[data-theme="frost"]     .stg { --acc-o:.34; }

  /* heavier shadow when planted over the bright stage */
  body.bg-bright .stg.lg { box-shadow:
    0 30px 74px rgba(12,9,0,.44), 0 8px 20px rgba(12,9,0,.34), 0 2px 8px rgba(12,9,0,.30); }

  /* icon circle — dark inset on dark glass, lifted light disc on frost */
  .stg .ic { width:48px; height:48px; border-radius:50%; flex:none; display:grid; place-items:center;
    position:relative;
    background:
      radial-gradient(135% 135% at 30% 16%, rgba(255,255,255,.14), rgba(255,255,255,.03) 50%, rgba(0,0,0,.28) 100%),
      rgba(8,10,14,.50);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 1px rgba(0,0,0,.55),
      inset 0 0 0 1px rgba(255,255,255,.08),
      0 2px 9px rgba(0,0,0,.35); }
  body[data-theme="frost"] .stg .ic {
    background:
      radial-gradient(135% 135% at 30% 16%, rgba(255,255,255,.65), rgba(255,255,255,.28) 50%, rgba(30,26,12,.22) 100%),
      rgba(250,249,246,.6);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.8),
      inset 0 -1px 2px rgba(60,50,10,.14),
      inset 0 0 0 1px rgba(120,105,40,.10),
      0 2px 9px rgba(60,50,20,.25); }
  .stg .ic > svg { width:26px; height:26px; display:block; filter:drop-shadow(0 1px 3px rgba(0,0,0,.22)); }
  body[data-theme="frost"] .stg .ic > svg { filter:drop-shadow(0 1px 2px rgba(60,48,10,.18)); }

  /* text */
  .stg .tx { display:flex; flex-direction:column; min-width:0; margin-top:-2px; }
  .ttl { font-size:18.5px; font-weight:700; line-height:1.1; letter-spacing:-.026em; white-space:nowrap; }
  body[data-theme="obsidian"] .ttl, body[data-theme="chameleon"] .ttl { color:#fff; text-shadow:0 1px 10px rgba(0,0,0,.35); }
  body[data-theme="frost"] .ttl { color:#17140A; }
  .sub { font-size:12.5px; font-weight:500; line-height:1.25; letter-spacing:-.006em; white-space:nowrap; margin-top:4px; }
  body[data-theme="obsidian"] .sub, body[data-theme="chameleon"] .sub { color:rgba(255,255,255,.62); }
  body[data-theme="frost"] .sub { color:rgba(38,33,18,.62); }
  .sub b { font-weight:800; }

  /* money spine — hero cards: hairline, amount, context */
  .subrow { display:flex; align-items:baseline; gap:10px; margin-top:8px; padding-top:7px;
    border-top:1px solid rgba(255,255,255,.12); }
  body[data-theme="frost"] .subrow { border-top-color:rgba(31,23,2,.16); }
  .subrow .sub { margin-top:0; }
  .mp { font-weight:800; letter-spacing:.04em; }
  body[data-theme="obsidian"] .mp, body[data-theme="chameleon"] .mp { color:#5BCB3F; }
  body[data-theme="frost"] .mp { color:#2E801D; }

  /* amount — tabular figures, locked width (zero reflow during count) */
  .amt { display:inline-block; font-size:15.5px; font-weight:700; letter-spacing:-.026em;
    font-variant-numeric:tabular-nums; white-space:nowrap; text-align:left; }
  body[data-theme="obsidian"] .amt, body[data-theme="chameleon"] .amt { color:#fff; }
  body[data-theme="frost"] .amt { color:#17140A; }
  .amt--usd   { min-width:56px; }
  .amt--kes   { min-width:64px; }
  .amt--bits  { min-width:78px; }
  .amt--coins { min-width:80px; }
  .amt--stars { min-width:80px; }
  .amt--view  { min-width:34px; }

  /* YouTube-red micro-chip (super thanks sub-line) */
  .yt { display:inline-block; width:17px; height:12px; border-radius:3px; background:#FF0033;
    margin-right:7px; vertical-align:-1px; position:relative; }
  .yt::after { content:""; position:absolute; left:6.5px; top:3px;
    border-left:5px solid #fff; border-top:3px solid transparent; border-bottom:3px solid transparent; }

  /* hype meter — segments light sequentially to level 3 */
  .meter { display:inline-flex; gap:4px; align-self:center; transform:translateY(-1px); }
  .meter i { width:20px; height:9px; border-radius:3px; background:var(--acc,#FFCE00);
    opacity:.13; box-shadow:0 0 7px rgba(0,0,0,.0); }
  .stg.in .meter i:nth-child(-n+3) { animation:segOn .32s var(--lg-ease) both; }
  .stg.in .meter i:nth-child(1) { animation-delay:.55s; }
  .stg.in .meter i:nth-child(2) { animation-delay:.87s; }
  .stg.in .meter i:nth-child(3) { animation-delay:1.19s; }
  @keyframes segOn { from { opacity:.13; } to { opacity:1; } }

  /* ================= icon motion — the gesture IS the event ================= */
  [data-mo="pop"]   .ic > svg { animation:icPop .68s var(--lg-spring) .14s both; }
  [data-mo="press"] .ic > svg { animation:pressPop .66s var(--lg-spring) .16s both; transform-origin:50% 60%; }
  [data-mo="pulse"] .ic > svg { animation:heartBeat 1.5s cubic-bezier(.36,.07,.19,.97) .3s 1;
    transform-origin:50% 55%; }
  [data-mo="ring"]  .ic > svg { animation:bellRing 1.7s cubic-bezier(.45,.05,.35,1) .3s both;
    transform-origin:50% 12%; }
  [data-mo="snip"]  .ic > svg { animation:snipCut .95s cubic-bezier(.45,.05,.35,1) .3s both;
    transform-origin:50% 50%; }
  [data-mo="chug"]  .ic > svg { animation:icPop .68s var(--lg-spring) .14s both,
    trainWiggle .5s ease-in-out 1.1s 3; transform-origin:50% 50%; }
  .stg.in .halo { animation:haloPulse 1.15s cubic-bezier(.22,.61,.36,1) .5s both; }
  @keyframes icPop {
    0% { transform:scale(.35); opacity:0; } 62% { transform:scale(1.14); opacity:1; } 100% { transform:scale(1); } }

  /* ============ the smile — brand guest (round 7 logo verdicts: A draw, D glowline) ============ */
  .face { display:block; }
  .face svg { width:100%; height:100%; display:block; }
  .face .f-eye, .face .f-mouth { transform-box:fill-box; transform-origin:center; }
  [data-mo="face"] .ic > svg { animation:none; }   /* the face has its own choreography */
  .ic .face { width:36px; height:36px; }
  /* THE DRAW — eyes fade in 60ms ahead of the mouth wipe (verbatim smile-face paths) */
  .f-draw .f-eye { opacity:0; }
  .f-draw.eyes-in .f-eye { animation:fEyeIn 260ms var(--lg-ease) both; }
  .f-draw:not(.f-glow) .f-mouth { clip-path:inset(-8% 100% -8% -2%); }
  .f-draw.mouth-draw .f-mouth { animation:fMouthDraw 480ms var(--lg-ease) both; }
  @keyframes fEyeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes fMouthDraw {
    from { clip-path:inset(-8% 100% -8% -2%); }
    to   { clip-path:inset(-8% -2% -8% -2%); } }
  /* THE GLOWLINE — ink groove carved, gold traces the verbatim mouth, fill pours, gold melts.
     Lives at the card's right end (money cards whose hero carries no face). Matte glow only. */
  .face--end { position:absolute; right:19px; top:50%; width:34px; height:34px; margin-top:-17px;
    opacity:0; z-index:4; pointer-events:none; }
  .face--end.eyes-in { opacity:1; }
  .stg.has-face-end { padding-right:64px; }   /* reserved zone — text never reaches the face */
  .f-glow .f-groove { fill:none; stroke:rgba(10,9,0,.88); stroke-width:2.4;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:var(--ml, 0); stroke-dashoffset:var(--ml, 0); }
  .f-glow .f-mouth { fill-opacity:0; stroke:#FFCE00; stroke-width:1.2;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:var(--ml, 0); stroke-dashoffset:var(--ml, 0);
    filter:drop-shadow(0 0 2.2px rgba(255,206,0,.55)); }
  .f-glow.resolve .f-groove { animation:fGrooveResolve 1100ms var(--lg-ease) forwards; }
  .f-glow.resolve .f-mouth  { animation:fGlowResolve 1100ms var(--lg-ease) forwards; }
  @keyframes fGrooveResolve {
    0%   { stroke-dashoffset:var(--ml, 0); stroke-opacity:1; }
    58%  { stroke-dashoffset:0;            stroke-opacity:1; }
    82%  { stroke-opacity:0; }
    100% { stroke-dashoffset:0;            stroke-opacity:0; } }
  @keyframes fGlowResolve {
    0%   { stroke-dashoffset:var(--ml, 0); fill-opacity:0; stroke-opacity:1; }
    58%  { stroke-dashoffset:0;            fill-opacity:0; stroke-opacity:1; }
    82%  { fill-opacity:.86; stroke-opacity:.5; }
    100% { fill-opacity:1; stroke-opacity:0; filter:drop-shadow(0 0 0 rgba(255,206,0,0)); } }
  @keyframes pressPop {
    0% { transform:translateY(2px) scale(.72) rotate(-10deg); opacity:0; }
    55% { transform:translateY(-2px) scale(1.16) rotate(4deg); opacity:1; }
    78% { transform:translateY(0) scale(.97) rotate(-2deg); }
    100% { transform:none; } }
  @keyframes heartBeat {
    0% { transform:scale(1); } 14% { transform:scale(1.28); } 28% { transform:scale(1); }
    42% { transform:scale(1.18); } 60% { transform:scale(1); } 100% { transform:scale(1); } }
  @keyframes snipCut {
    0% { transform:rotate(-24deg); } 30% { transform:rotate(15deg); }
    55% { transform:rotate(-7deg); } 78% { transform:rotate(3deg); } 100% { transform:rotate(0deg); } }
  @keyframes trainWiggle {
    0%,100% { transform:translateX(0); } 25% { transform:translateX(-2px); } 75% { transform:translateX(2px); } }

  /* reaction cycle — like → love → wow (JS swaps, spring flip in) */
  .rx { position:absolute; inset:0; display:grid; place-items:center; opacity:0; }
  .rx svg { width:26px; height:26px; display:block; }
  .rx.on { animation:rxIn .55s var(--lg-spring) both; }
  @keyframes rxIn { 0% { opacity:0; transform:scale(.3) rotate(-12deg); } 100% { opacity:1; transform:scale(1) rotate(0deg); } }

  /* bell halo ring — emanates from the icon circle */
  .halo { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px;
    border-radius:50%; border:2px solid rgba(255,206,0,.55); opacity:0; pointer-events:none;
    box-shadow:0 0 10px rgba(255,206,0,.22), inset 0 0 8px rgba(255,206,0,.16); }
  @keyframes haloPulse {
    0% { transform:scale(.55); opacity:0; } 25% { opacity:.55; } 100% { transform:scale(1.6); opacity:0; } }

  /* subscribe: one thin red light-line sweeps under the card */
  .pline { position:absolute; left:9%; right:9%; bottom:-5px; height:1.5px; border-radius:2px;
    background:linear-gradient(90deg, rgba(255,0,51,0), rgba(255,0,51,.85) 24%, rgba(255,64,92,.9) 76%, rgba(255,0,51,0));
    box-shadow:0 0 5px rgba(255,0,51,.35);
    opacity:0; transform:scaleX(.02); transform-origin:left center; pointer-events:none; z-index:6; }
  .stgw.run .pline { animation:plineRun 2.4s cubic-bezier(.25,.6,.2,1) .4s both; }
  @keyframes plineRun {
    0% { opacity:0; transform:scaleX(.02); } 14% { opacity:.9; }
    76% { opacity:.9; transform:scaleX(1); } 100% { opacity:0; transform:scaleX(1); } }

  /* share: accent streak + the send glyph flies off the card */
  .streak { position:absolute; left:9%; right:9%; bottom:-5px; height:1.5px; border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--acc,#fff) 26%, var(--acc,#fff) 74%, transparent);
    opacity:0; transform:scaleX(.05); transform-origin:left center; pointer-events:none; z-index:6; }
  .stgw.run .streak { animation:streakRun 1.3s cubic-bezier(.25,.6,.2,1) .35s both; }
  @keyframes streakRun {
    0% { opacity:0; transform:scaleX(.05); } 18% { opacity:.8; }
    70% { opacity:.8; transform:scaleX(1); } 100% { opacity:0; transform:scaleX(1); } }
  .plane { position:absolute; left:14px; top:50%; width:18px; height:18px; margin-top:-9px;
    color:#fff; opacity:0; z-index:7; pointer-events:none; }
  .plane svg { width:100%; height:100%; display:block; filter:drop-shadow(0 1px 4px rgba(0,0,0,.3)); }
  body[data-theme="frost"] .plane { color:#17140A; }
  .stgw.run .plane { animation:planeFly 1.15s cubic-bezier(.3,.6,.3,1) .45s both; }
  @keyframes planeFly {
    0% { opacity:0; transform:translate(0,2px) rotate(0deg); } 15% { opacity:1; }
    100% { opacity:0; transform:translate(242px,-18px) rotate(-6deg); } }

  /* ================= 3D HERO OBJECTS (64px slot, left of text) ================= */
  .obj-stage { position:relative; width:64px; height:64px; flex:none;
    display:grid; place-items:center; transform-style:preserve-3d; }
  .oshadow { position:absolute; left:50%; bottom:-2px; width:46px; height:9px;
    transform:translateX(-50%); border-radius:50%; opacity:.42;
    background:radial-gradient(50% 50% at 50% 50%, rgba(10,7,0,.45), transparent 68%); }
  .pop { transform-style:preserve-3d; }
  .tok { position:relative; transform-style:preserve-3d; }
  .tok-edge { position:absolute; inset:0; }
  .tok-face { position:absolute; inset:0; backface-visibility:hidden; }
  .tok-face svg { width:100%; height:100%; display:block; }

  /* COIN: flip in, land (squash + drop), rest on a barely-there float */
  .pop--coin { animation:coinLand 1.05s both; }
  @keyframes coinLand {
    0% { transform:translateY(12px) scale(.74); opacity:0; }
    32% { transform:translateY(-7px) scale(1.015); opacity:1; }
    55% { transform:translateY(1px) scale(1.008,.988); }
    63% { transform:translateY(2px) scale(1.017,.978); }
    76% { transform:translateY(-.5px) scale(.995,1.004); }
    100% { transform:translateY(0) scale(1); } }
  .coin { animation:lgCoinFlip .62s cubic-bezier(.3,.62,.3,1) both,
    idleFloat 4.6s ease-in-out 1.35s infinite; }
  .oshadow--coin { animation:shadowLand 1.05s linear both, shadowIdle 4.6s ease-in-out 1.35s infinite; }
  @keyframes shadowLand {
    0% { transform:translateX(-50%) scale(.55); opacity:0; }
    32% { transform:translateX(-50%) scale(.92); opacity:.30; }
    55% { transform:translateX(-50%) scale(.80); opacity:.40; }
    63% { transform:translateX(-50%) scale(.72); opacity:.55; }
    76% { transform:translateX(-50%) scale(.80); opacity:.44; }
    100% { transform:translateX(-50%) scale(.78); opacity:.48; } }
  @keyframes shadowIdle {
    0%,100% { transform:translateX(-50%) scale(.78); opacity:.48; }
    50% { transform:translateX(-50%) scale(.71); opacity:.38; } }

  /* GEM: one refractive tick + settle */
  .pop--gem { animation:gemTick .95s both; }
  @keyframes gemTick {
    0% { transform:rotateY(30deg) scale(.72); opacity:0; }
    42% { transform:rotateY(-9deg) scale(1.03); opacity:1; }
    64% { transform:rotateY(4deg) scale(.99); }
    84% { transform:rotateY(-1.5deg) scale(1.003); }
    100% { transform:rotateY(0deg) scale(1); } }
  .gem { animation:idleFloat 4.6s ease-in-out 1.4s infinite; }
  .glint { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg, transparent 44%, rgba(255,255,255,.5) 50%, transparent 56%) no-repeat;
    background-size:38% 100%; background-position:-45% 0;
    animation:glintSweep 1.1s cubic-bezier(.32,.72,0,1) .24s 1 both; }
  @keyframes glintSweep { from { background-position:-45% 0; } to { background-position:145% 0; } }

  /* M-PESA tile: matte ceramic squircle, spring tilt in */
  .pop--tile { animation:tileIn .95s both; }
  @keyframes tileIn {
    0% { transform:rotateY(-22deg) scale(.72); opacity:0; }
    46% { transform:rotateY(5deg) scale(1.035); opacity:1; }
    68% { transform:rotateY(-2deg) scale(.996); }
    100% { transform:rotateY(0deg) scale(1); } }
  .tile { width:64px; height:64px; border-radius:20px; position:relative; display:grid; place-items:center;
    background:linear-gradient(165deg,#52BE3F,#43B02A 58%,#2F871E);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.20), inset 0 -3px 8px rgba(10,40,5,.30),
      inset 0 0 0 1px rgba(255,255,255,.10), inset 0 -1px 0 rgba(255,255,255,.08),
      0 0 0 1px rgba(18,54,8,.32), 0 7px 16px rgba(16,52,8,.30);
    animation:idleFloat 4.4s ease-in-out 1.3s infinite; }
  .tile::before { content:""; position:absolute; inset:0; border-radius:inherit;
    background:radial-gradient(125% 125% at 32% 20%,
      rgba(255,255,255,.20), rgba(255,255,255,0) 48%, rgba(8,40,4,.20) 100%); }
  .tile svg { width:64px; height:64px; display:block; position:relative; }

  /* generic token (bubble / gift / star): one tick + float */
  .pop--tok { animation:tokTick .95s cubic-bezier(.25,.8,.3,1) both; }
  @keyframes tokTick {
    0% { transform:rotateY(26deg) scale(.7); opacity:0; }
    45% { transform:rotateY(-8deg) scale(1.04); opacity:1; }
    70% { transform:rotateY(3deg) scale(.99); }
    100% { transform:rotateY(0deg) scale(1); } }
  .toki { animation:idleFloat 4.6s ease-in-out 1.35s infinite; }

  /* badge: stamped in from above */
  .pop--stamp { animation:stampIn .78s cubic-bezier(.25,.8,.3,1) both; }
  @keyframes stampIn {
    0% { transform:scale(1.55) translateY(-6px); opacity:0; }
    55% { transform:scale(.94) translateY(1px); opacity:1; }
    78% { transform:scale(1.02); }
    100% { transform:scale(1); } }
  .stampT { animation:idleFloat 4.6s ease-in-out 1.2s infinite; }

  @keyframes idleFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-2px); } }

  /* sparks — round only */
  .lg-spark { z-index:6; }
</style>
</head>
<body data-theme="obsidian">
<div id="stage">
  <canvas id="chart" width="1920" height="1080"></canvas>
  <div id="bgLayer"></div>
  <div id="tabs"></div>
  <div id="help"><span id="keys"></span><span class="hint">B background &middot; M material &middot; tabs auto-cycle + chips filter &middot; click a card refires</span></div>
  <div id="dock"></div>
</div>

<script src="assets/liquid-glass.js"></script>
<script>
var Q = new URLSearchParams(location.search);

/* ---------- material: obsidian default · frost · chameleon · clear->frost ---------- */
var qt = Q.get('theme');
var THEME = qt === 'frost' ? 'frost' : qt === 'chameleon' ? 'chameleon' :
  (qt === 'clear' ? 'frost' : 'obsidian');
document.body.dataset.theme = THEME;

/* ---- token builder (N edge layers + front/back faces) — reused from spectacle ---- */
function makeToken(stage, o) {
  var pop = document.createElement('div'); pop.className = 'pop' + (o.popCls ? ' ' + o.popCls : '');
  var tok = document.createElement('div'); tok.className = 'tok ' + (o.cls || '');
  tok.style.width = o.w + 'px'; tok.style.height = o.h + 'px';
  var n = o.layers || 9;
  for (var i = 0; i < n; i++) {
    var e = document.createElement('i'); e.className = 'tok-edge';
    e.style.transform = 'translateZ(' + (-o.thick / 2 + o.thick * i / (n - 1)).toFixed(2) + 'px)';
    e.style.background = i % 2 ? o.edgeB : o.edgeA;
    if (o.round) e.style.borderRadius = o.round;
    if (o.clip) e.style.clipPath = o.clip;
    tok.appendChild(e);
  }
  var f = document.createElement('div'); f.className = 'tok-face tok-face--front';
  f.style.transform = 'translateZ(' + (o.thick / 2 + .5) + 'px)'; f.innerHTML = o.front;
  var b = document.createElement('div'); b.className = 'tok-face';
  b.style.transform = 'rotateY(180deg) translateZ(' + (o.thick / 2 + .5) + 'px)'; b.innerHTML = o.back;
  tok.appendChild(f); tok.appendChild(b);
  pop.appendChild(tok); stage.appendChild(pop);
  return tok;
}

/* ================= count-up: expo-out solver, locked-width chips ================= */
function bez(x1, y1, x2, y2) {
  var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  var cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  function sx(t) { return ((ax * t + bx) * t + cx) * t; }
  function sy(t) { return ((ay * t + by) * t + cy) * t; }
  function dx(t) { return (3 * ax * t + 2 * bx) * t + cx; }
  return function (x) {
    var t = x, e, j;
    for (j = 0; j < 6; j++) { e = sx(t) - x; if (Math.abs(e) < 1e-5) break; t -= e / dx(t); }
    t = Math.min(1, Math.max(0, t));
    return sy(t);
  };
}
var EASE = bez(.16, 1, .3, 1);
function countUp(el, target, fmt, dur) {
  if (!el) return;
  var t0 = performance.now();
  var fr = function (t) {
    var p = Math.min(1, (t - t0) / dur), v = EASE(p);
    el.textContent = fmt(target * v);
    if (p < 1) requestAnimationFrame(fr);
  };
  requestAnimationFrame(fr);
}

    var r = REC[id], el = r && r.el; if (!el) return;
    ['lg-backdrop', 'lg-tint', 'lg-rim', 'lg-spec', 'lg-grain'].forEach(function (c) {
      Array.prototype.forEach.call(el.querySelectorAll(':scope > ' + c), function (n) { n.remove(); });
    });
    el._ref = LG.glass(el, glassOpts(id));
    if (!r.hero) renderIcon(r, el);
  });
}

/* ================= build ================= */
/* ---- THE SMILE — verbatim face from assets/smile-face.svg, paths byte-true.
     Round-7 logo verdicts: A THE DRAW (follow/subscribe resolve) + D THE GLOWLINE
     (M-PESA tip gratitude). B blink / E watch were killed by the studies page. ---- */
var FACE_INNER =
  '<svg viewBox="5 10.8 23.8 23.8" aria-hidden="true">' +
  '<path class="f-disc" d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>' +
  '<path class="f-eye f-eye-l" d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#0A0900"/>' +
  '<path class="f-eye f-eye-r" d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#0A0900"/>' +
  '<path class="f-mouth" d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0A0900"/>' +
  '</svg>';
function makeFace(mode) {
  var span = document.createElement('span');
  span.className = 'face';
  if (mode === 'draw' || mode === 'glow') span.classList.add('f-draw');
  if (mode === 'glow') span.classList.add('f-glow');
  span.innerHTML = FACE_INNER;
  if (mode === 'glow') {
    var m = span.querySelector('.f-mouth');
    span.style.setProperty('--ml', m.getTotalLength().toFixed(2));
    var groove = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    groove.setAttribute('class', 'f-groove');
    groove.setAttribute('d', m.getAttribute('d'));
    groove.setAttribute('aria-hidden', 'true');
    m.parentNode.insertBefore(groove, m);
  }
  return span;
}
function faceReset(el) {
  el.querySelectorAll('.face').forEach(function (fc) {
    fc.classList.remove('eyes-in', 'mouth-draw', 'resolve');
  });
}
function faceRun(el) {                 /* A: eyes 540 → mouth 600 · D: arrive 600 → trace 720 */
  var fc = el.querySelector('.face'); if (!fc) return;
  if (fc.classList.contains('f-glow')) {
    el._t4 = setTimeout(function () { fc.classList.add('eyes-in'); }, 600);
    el._t5 = setTimeout(function () { fc.classList.add('resolve'); }, 720);
  } else {
    el._t4 = setTimeout(function () { fc.classList.add('eyes-in'); }, 540);
    el._t5 = setTimeout(function () { fc.classList.add('mouth-draw'); }, 600);
  }
}

var dock = document.getElementById('dock');
ORDER.forEach(function (id) {
  var r = REC[id]; r.id = id;
  r.wrap = document.createElement('div'); r.wrap.className = 'stgw';
  r.wrap.style.setProperty('--acc', ACC[r.plat]);
  var el = document.createElement('div'); el.className = 'stg';
  el.dataset.id = id; el.dataset.mo = r.mo || 'pop';
  var h = '';
  if (r.hero) h += '<span class="obj-stage lg-scene"><i class="oshadow"></i></span>';
  else h += '<span class="ic"></span>';
  h += '<span class="tx"><b class="ttl">' + r.verb + '</b>';
  if (r.meter) h += '<span class="subrow"><span class="meter"><i></i><i></i><i></i><i></i><i></i></span><span class="sub">' + r.sub + '</span></span>';
  else if (r.amt) h += '<span class="subrow"><b class="amt ' + r.amt.cls + '">' + r.amt.zero + '</b><span class="sub">' + r.sub + '</span></span>';
  else h += '<span class="sub">' + r.sub + '</span>';
  h += '</span>';
  el.innerHTML = h;
  if (r.hero) r.hero(el.querySelector('.obj-stage'));
  if (r.face === 'glow') {
    var fe = makeFace('glow'); fe.classList.add('face--end'); el.appendChild(fe);
    el.classList.add('has-face-end');
  }
  renderIcon(r, el);
  r.el = el;
  r.wrap.appendChild(el);
  if (r.fx === 'pline') r.wrap.insertAdjacentHTML('beforeend', '<i class="pline"></i>');
  if (r.fx === 'streak') r.wrap.insertAdjacentHTML('beforeend', '<i class="streak"></i><span class="plane">' + PLANE_SVG + '</span>');
  el.addEventListener('click', function () { userFire(id); });
  el._ref = LG.glass(el, glassOpts(id));
  dock.appendChild(r.wrap);
});
function renderIcon(r, el) {
  var ic = (el || r.el).querySelector('.ic'); if (!ic) return;
  if (r.face === 'draw') {           /* THE DRAW: smile replaces the glyph in the circle */
    ic.innerHTML = ''; ic.appendChild(makeFace('draw'));
    el.dataset.mo = 'face';
    return;
  }
  ic.innerHTML = r.icon(THEME === 'frost');
  if (r.mo === 'ring') ic.insertAdjacentHTML('beforeend', '<i class="halo"></i>');
}

/* ================= chameleon eyes on the animated canvas ================= */
var CHAM = null;
function chamStart() {
  if (CHAM || !ORDER) return;
  var st = document.getElementById('stage');
  CHAM = ORDER.map(function (id) {
    return LG.chameleon(REC[id].el, { source: C, stage: st, interval: 420, hue: 224, sat: 22 });
  });
}
function chamStop() { if (CHAM) { CHAM.forEach(function (c) { c.stop(); }); CHAM = null; } }
var CHAM_PRESET = { bright: { h: 46, s: 34, e: .05 }, dark: { h: 222, s: 12, e: 0 } };
function chamSync() {
  if (THEME !== 'chameleon') { chamStop(); return; }
  if (bgMode === 'chart' || bgMode === 'wash') { chamStop(); chamStart(); }
  else {
    chamStop();
    var p = CHAM_PRESET[bgMode];
    ORDER.forEach(function (id) {
      var el = REC[id].el; if (!el || !p) return;
      el.style.setProperty('--ch-h', p.h);
      el.style.setProperty('--ch-s', p.s);
      el.style.setProperty('--ch-e', p.e);
    });
  }
}

/* ================= reaction cycle (like -> love -> wow) ================= */
function runCycle(el) {
  var rxs = el.querySelectorAll('.rx');
  (el._rxT || []).forEach(clearTimeout); el._rxT = [];
  rxs.forEach(function (n) { n.classList.remove('on'); });
  function show(i) { rxs.forEach(function (n, k) { if (k !== i) n.classList.remove('on'); }); rxs[i].classList.add('on'); }
  show(0);
  el._rxT.push(setTimeout(function () { show(1); }, 800));
  el._rxT.push(setTimeout(function () { show(2); }, 1600));
}

/* ================= fire / kill / spine (.in — sheen — 4600 hold — .out — 5150 tuck) ================= */
var active = null;
function clearT(r) {
  var el = r.el;
  clearTimeout(el._t1); clearTimeout(el._t2); clearTimeout(el._t3);
  clearTimeout(el._t4); clearTimeout(el._t5);
  (el._rxT || []).forEach(clearTimeout);
}
function kill(r) {
  if (!r) return;
  clearT(r);
  faceReset(r.el);
  r.el.classList.remove('in', 'out', 'sheen', 'on');
  r.wrap.classList.remove('run');
}
function fire(id) {
  var r = REC[id]; if (!r) return;
  var el = r.el, wasOn = (active === r);
  if (active && active !== r) kill(active);
  clearT(r);
  active = r;
  el.classList.remove('on');
  if (wasOn) void el.offsetWidth;      /* true unrender: restarts hero animations */
  el.classList.add('on');
  if (wasOn) void el.offsetWidth;
  if (r.fx) { r.wrap.classList.remove('run'); void r.wrap.offsetWidth; r.wrap.classList.add('run'); }
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    if (el._ref) el._ref.refresh();    /* displacement map at true size */
    el.classList.remove('in', 'out', 'sheen');
    void el.offsetWidth;
    el.classList.add('in', 'sheen');
  }); });
  faceReset(el);
  faceRun(el);
  if (r.mo === 'cycle') runCycle(el);
  el._t1 = setTimeout(function () {
    if (r.sparks) burst(el, r.sparks.c, r.sparks.n);
    if (r.amt) countUp(el.querySelector('.amt'), r.amt.target, r.amt.fmt, 840);
  }, r.fxd || 600);
  el._t2 = setTimeout(function () { el.classList.remove('in'); el.classList.add('out'); }, 4600);
  el._t3 = setTimeout(function () { el.classList.remove('out', 'on'); if (active === r) active = null; }, 5150);
}
function userFire(id) { if (TYPE) { fire(id); } else { stopDemo(); fire(id); } }

/* ================= tabs (filter + auto-cycle) ================= */
var TABS = [
  { id: 'all', label: 'ALL', dot: '#FFCE00' },
  { id: 'youtube', label: 'YOUTUBE', dot: '#FF0033' },
  { id: 'twitch', label: 'TWITCH', dot: '#9146FF' },
  { id: 'tiktok', label: 'TIKTOK', dot: '#FE2C55' },
  { id: 'facebook', label: 'FACEBOOK', dot: '#1877F2' },
  { id: 'kick', label: 'KICK', dot: '#53FC18' }
];
var TABIDS = TABS.map(function (t) { return t.id; });
var activeTab = 'all';
var tabsEl = document.getElementById('tabs');
TABS.forEach(function (t) {
  var b = document.createElement('button'); b.className = 'tab'; b.dataset.tab = t.id;
  b.style.setProperty('--pa', t.dot);
  b.innerHTML = '<i></i>' + t.label;
  b.addEventListener('click', function () {
    if (TYPE) return;
    setTab(t.id); stopDemo(); startDemo(true);
  });
  tabsEl.appendChild(b);
});
function setTab(id) {
  activeTab = id;
  tabsEl.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === id); });
  demoIdx = 0; renderHelp();
}
function visibleIds() {
  return ORDER.filter(function (id) { return activeTab === 'all' || REC[id].plat === activeTab; });
}

/* ================= help chip (live key mapping) ================= */
var KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'q', 'w', 'e', 'r', 't', 'y', 'u'];
var keysEl = document.getElementById('keys');
function renderHelp() {
  var vis = visibleIds();
  var html = vis.slice(0, KEYS.length).map(function (id, i) {
    return '<span class="k">' + KEYS[i] + '</span> ' + REC[id].verb;
  }).join('<i class="sep">&middot;</i>');
  if (vis.length > KEYS.length) html += '<i class="sep">&middot;</i>+' + (vis.length - KEYS.length) + ' more &mdash; click a card';
  keysEl.innerHTML = html;
}
renderHelp();

/* ================= demo cycle: ~6.8s through visible recipes, tabs rotate every 4 ================= */
var demoTimer = null, demoIdx = 0, fireCount = 0, cycling = false;
function tickDemo() {
  var vis = visibleIds();
  if (!vis.length) return;
  fire(vis[demoIdx++ % vis.length]);
  if (++fireCount % 4 === 0) setTab(TABIDS[(TABIDS.indexOf(activeTab) + 1) % TABIDS.length]);
}
function startDemo(fireNow) {
  stopDemo(); cycling = true;
  if (fireNow) tickDemo();
  demoTimer = setInterval(tickDemo, 6800);
}
function stopDemo() {
  cycling = false;
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
}

/* ================= keys ================= */
var THEMES = ['frost', 'obsidian', 'chameleon'];
addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === 'b') { curBg = (curBg + 1) % BGS.length; bg(BGS[curBg]); return; }
  if (k === 'm') { setTheme(THEMES[(THEMES.indexOf(THEME) + 1) % THEMES.length]); return; }
  if (TYPE) return;
  var i = KEYS.indexOf(k);
  if (i > -1) {
    var vis = visibleIds();
    if (i < vis.length) { stopDemo(); fire(vis[i]); }
  }
});
function setTheme(t) {
  THEME = t;
  document.body.dataset.theme = t;
  rematerial(); chamSync();
}

/* ================= boot ================= */
chamSync();
var TYPE = Q.get('type');
var typeTimer = null;
if (TYPE && REC[TYPE]) {
  fire(TYPE);
  typeTimer = setInterval(function () { fire(TYPE); }, 7000);
} else {
  TYPE = null;
  setTimeout(function () { startDemo(true); }, 400);
}
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE — end credits</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23ffd100'/%3E%3Cpath d='M4.16 12.91a7.9 7.9 0 0015.68 0' fill='none' stroke='%230a0900' stroke-width='1.32' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='8' r='1.5' fill='%230a0900'/%3E%3Ccircle cx='17' cy='8' r='1.5' fill='%230a0900'/%3E%3C/svg%3E">
<style>
/* END CREDITS — the card the channel rests on.

   Left: the mark, the sign-off, the call to action. Right: the roll, which is
   the part that has to earn its keep.

   The roll is a carousel, not a scroller. Each category takes the stage: its
   people arrive one at a time as large overlapping cards with the centre one
   dominant, then the whole set spreads into a grid so you can see everyone at
   once before the next category takes over. The single bar at the top is the
   time left on whatever is currently on stage. */
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0A0A0A;
  --fg:#FAFAFA; --muted:#A1A1AA; --faint:#9B9BA4;
  --line:rgba(255,255,255,.08);
  --fd:'Inter',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --dock:76px;
  --eo:cubic-bezier(.32,.72,0,1);
  --card-ms:3500;
  --grid-ms:3200;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--fg);
  font-family:var(--fd);-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--fg);color:var(--ink)}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden}

/*** background DNA — identical to starting.html ***/
.bg{position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.09) 1.1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 100%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 100%)}
.aura{position:absolute;left:34%;top:42%;width:900px;height:580px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,193,7,.08),transparent 64%)}

.rise{opacity:0;animation:riseIn .9s var(--eo) forwards;animation-delay:var(--rd,0s)}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* ── left column: orbit + sign-off ── */
.bwrap{position:absolute;left:5.4%;top:0;bottom:var(--dock);display:flex;align-items:center;
  gap:clamp(30px,3.6vw,64px);z-index:3}
.orbitB{position:relative;width:clamp(250px,34vh,360px);aspect-ratio:1;flex:none;
  display:grid;place-items:center}
.orbitB::before{content:"";position:absolute;inset:0;border:2px dashed rgba(255,193,7,.45);
  border-radius:50%;animation:spinCW 24s linear infinite}
.orbitB::after{content:"";position:absolute;inset:26px;border:1.5px dashed rgba(255,193,7,.2);
  border-radius:50%;animation:spinCCW 16s linear infinite}
.orbitB .glow{position:absolute;inset:-56px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,193,7,.12),transparent 62%)}
.orbitB .face{width:62%;aspect-ratio:1;animation:faceBob 5.6s ease-in-out infinite;
  filter:drop-shadow(0 0 48px rgba(255,193,7,.62))}
.orbitB .face svg{width:100%;height:100%}

/* ---- headline: starting.html's treatment, exactly ----
   The previous pass carried a text-shadow on the h1 and a dark drop-shadow on
   .g. Both were wrong here and nowhere else in the kit: the glyphs are filled by
   a clipped gradient with color:transparent, so a text-shadow has nothing to
   paint, and the drop-shadow only muddied the silver into something greyer than
   every other headline in the kit. line-height was also 1 where the kit uses
   1.02, which on two stacked lines set them too tight to read as one phrase. */
h1{font-family:var(--fd);font-weight:800;font-size:clamp(56px,5.4vw,116px);
  line-height:1.02;letter-spacing:-.045em}
h1 .w{display:block;opacity:0;transform:translateY(40px);animation:wordup .85s var(--eo) both}
h1 .w1{animation-delay:.06s}
h1 .w2{animation-delay:.16s}
@keyframes wordup{to{opacity:1;transform:none}}
h1 .g{background:linear-gradient(180deg,#fafafa 25%,#86868e 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
h1 .y{background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,193,7,.25))}

.follow{margin-top:34px;position:relative;overflow:hidden;display:inline-block}
.follow::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 62%);
  transform:translateX(-130%);animation:sheenX 4.5s ease-in-out 2s infinite}
@keyframes sheenX{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}

.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:999px;
  font-family:var(--fd);font-weight:800;font-size:14px;letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap}
.chip.solid{background:linear-gradient(135deg,var(--yellow),var(--hot));color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 28px rgba(255,193,7,.28)}

.nextrow{display:none;margin-top:22px}
html[data-next="1"] .nextrow{display:block}
.nc{border-left:2px solid rgba(255,193,7,.55);padding:2px 0 2px 18px;
  display:flex;flex-direction:column;gap:6px;max-width:520px}
.nc .nk{font-family:var(--fm);font-weight:600;font-size:9px;letter-spacing:.32em;
  color:var(--yellow);text-transform:uppercase}
.nc .nw{font-family:var(--fd);font-weight:800;font-size:clamp(20px,2.1vw,32px);
  letter-spacing:-.02em;color:var(--fg);line-height:1.12}
.nc .nh{font-family:var(--fm);font-weight:600;font-size:11px;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase}
.nc .nh b{color:var(--faint);font-weight:600}
.nc .nh .sep{color:rgba(255,193,7,.55);margin:0 8px}

.bellrow{display:inline-flex;margin-top:22px;align-items:center;gap:10px}
html[data-next="1"] .bellrow{display:none}
.bellrow svg{width:13px;height:13px;stroke:var(--yellow);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:none;transform-origin:top center;
  animation:ring 5.2s ease-in-out 2.4s infinite}
.bellrow span{font-family:var(--fm);font-weight:600;font-size:11px;letter-spacing:.18em;
  color:var(--muted);text-transform:uppercase}
.bellrow b{color:var(--faint);font-weight:600}
@keyframes ring{0%,84%,100%{transform:rotate(0)}86%{transform:rotate(12deg)}88%{transform:rotate(-10deg)}
  90%{transform:rotate(7deg)}92%{transform:rotate(-5deg)}94%{transform:rotate(3deg)}96%{transform:rotate(0)}}

/* ══ the credits panel ══ */
.credits{position:absolute;right:3.4%;top:clamp(80px,10vh,116px);
  bottom:calc(var(--dock) + 54px);width:min(812px,46vw);z-index:3;
  display:flex;flex-direction:column;padding:26px 30px 24px;border-radius:26px;
  border:1px solid rgba(255,255,255,.10);
  background:
    linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.014) 42%,rgba(255,255,255,.03)),
    radial-gradient(120% 70% at 50% 0%,rgba(255,193,7,.07),transparent 60%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.4),
    0 40px 110px rgba(0,0,0,.62)}
.chead{display:flex;align-items:center;gap:18px;font-family:var(--fd);font-weight:800;
  font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#E4E4EA}
.chead .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.22),transparent)}
.chead .ep{color:var(--muted);letter-spacing:.18em}
.chead .ep b{color:var(--yellow);font-weight:800}

/* ---- category indicator: icon over name, centred ---- */
.cat{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
.cat .ci{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;
  border:1px solid rgba(255,193,7,.26);background:rgba(255,193,7,.075);
  box-shadow:0 0 22px rgba(255,193,7,.14),inset 0 1px 0 rgba(255,255,255,.09)}
.cat .ci svg{width:26px;height:26px;fill:none;stroke:var(--yellow);stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.cat .cn{font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:.2em;
  text-transform:uppercase;color:#EDEDF2;text-align:center}
.cat .cn small{display:block;font-family:var(--fm);font-weight:500;font-size:9.5px;
  letter-spacing:.28em;color:var(--faint);margin-top:5px}

/* ---- the single bar: time remaining on whatever is on stage ----
   It DRAINS. Full means the card has just started, empty means it is about to
   advance. That is the literal reading of "time remaining", and it is why the
   eye can tell the difference between "this one is nearly done" and "this one
   has not really started". */
.bar{margin-top:14px;height:7px;border-radius:999px;overflow:hidden;flex:none;
  background:rgba(255,255,255,.07);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;width:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--hot),var(--yellow) 62%,#FFE9A8);
  box-shadow:0 0 16px rgba(255,193,7,.6)}

/* ---- the stage: carousel, then grid ---- */
.box{position:relative;margin-top:18px;flex:1;min-height:0}

/* carousel: absolutely placed, overlapping, centre dominant.
   --d is the signed distance from the active card and --ad its magnitude, both
   written by JS. Everything below is derived from those two numbers, so the
   whole formation is one transform rather than N. */
.box.car{height:100%}
/* Gap and falloff are sized so the widest category still fits the panel: three
   cards at d=0,+1,+2 need 2*gap + half of the outermost card to stay inside
   half the content width. At gap 168 the last card ran 53px past the edge and
   was visibly clipped. */
.box.car .card{position:absolute;left:50%;top:50%;width:252px;
  transform:translate(-50%,-50%) translateX(calc(var(--d) * 128px))
                     scale(calc(1 - var(--ad) * .17));
  opacity:calc(1 - var(--ad) * .17);
  z-index:calc(60 - var(--ad));
  transition:transform .78s var(--eo),opacity .78s var(--eo),box-shadow .5s ease}

.card{pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:24px 18px 22px;border-radius:22px;text-align:center;
  border:1px solid rgba(255,255,255,.09);
  background:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.014));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 22px 48px rgba(0,0,0,.5)}
.box.car .card.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),
  0 0 0 1px rgba(255,193,7,.28),0 26px 64px rgba(0,0,0,.6),0 0 44px rgba(255,193,7,.12)}

/* ---- the avatar slot
   A circle filled with a three-stop gradient drawn from --c1/--c2/--c3, with a
   conic sheen over the top and an inset highlight, so it reads as a machined
   metal disc rather than a flat colour chip — the same trick the bronze/silver/
   gold handles use in the chat bubbles, but the three stops are free so there
   are as many combinations as you care to author. The palette is deliberately
   low-chroma and cool-to-earthy: no pinks, no pastels, nothing that reads a
   gender, and the mid-tones stay masculine without going monochrome. */
.av{position:relative;width:126px;height:126px;border-radius:50%;overflow:hidden;
  display:grid;place-items:center;flex:none;
  background:
    conic-gradient(from 210deg,rgba(255,255,255,.17),transparent 30%,
      rgba(255,255,255,.11) 56%,transparent 76%,rgba(255,255,255,.08)),
    linear-gradient(145deg,var(--c1) 0%,var(--c2) 54%,var(--c3) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.20),
    inset 0 -7px 16px rgba(0,0,0,.52),
    0 0 0 2px rgba(255,255,255,.06),
    0 14px 34px rgba(0,0,0,.55)}
.av svg{width:70px;height:70px;filter:drop-shadow(0 3px 7px rgba(0,0,0,.6))}

.card .rl,.card .nm{transition:opacity .45s var(--eo)}
.card .rl{font-family:var(--fd);font-weight:800;font-size:10px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--muted)}
.card .nm{font-family:var(--fd);font-weight:800;font-size:26px;letter-spacing:-.02em;
  line-height:1.12;color:#F2F2F6;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Only the centre card shows its text. The cards overlap by design, and two
   names at once collide into something that reads as a layout fault rather than
   as depth — so the trailing cards become a stack of avatars peeking out from
   behind the one that matters. It also states the hierarchy without needing the
   eye to work it out. */
.box.car .card:not(.on) .rl,.box.car .card:not(.on) .nm{opacity:0}
.box.car .card:not(.on) .av{box-shadow:inset 0 2px 0 rgba(255,255,255,.16),
  inset 0 -7px 16px rgba(0,0,0,.52),0 0 0 2px rgba(255,255,255,.05),
  0 12px 28px rgba(0,0,0,.5)}

/* ---- grid mode
   Identical aspect ratio on every cell — a grid of mixed shapes is the fastest
   way to make a credits board look amateur. Cells carry avatar + name always,
   and the role too when the set is small enough to earn the extra line. */
/* Columns are a FIXED width and the grid is centred, not stretched to fill the
   panel. Letting three cells divide 750px gave each one a 375x435 box with all
   the content in the top third — a wall of empty card. Identical aspect ratio is
   guaranteed by the fixed column width plus the ratio below, so nothing depends
   on how many columns there happen to be. */
.box.grid{display:grid;gap:15px;align-content:center;justify-content:center;
  grid-template-columns:repeat(var(--cols,3),166px)}
.box.grid .card{position:static;width:auto;aspect-ratio:1/1.24;
  transform:none;opacity:1;z-index:auto;
  gap:9px;padding:16px 12px 14px;border-radius:18px;
  transition:transform .78s var(--eo),opacity .78s var(--eo),box-shadow .5s ease}
.box.grid .card .av{width:72px;height:72px}
.box.grid .card .av svg{width:40px;height:40px}
.box.grid .card .nm{font-size:15px;letter-spacing:-.01em}
.box.grid .card .rl{font-size:8.5px;letter-spacing:.22em}
/* ranked: the first name in a category is the lead, and it looks like it */
.box.grid .card:first-child{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),
  0 0 0 1px rgba(255,193,7,.26),0 18px 40px rgba(0,0,0,.5)}
.box.grid .card:first-child .nm{color:#fff}
.box.grid.no-role .rl{display:none}

.sig{position:absolute;left:0;right:0;bottom:calc(var(--dock) + 14px);z-index:5;text-align:center;
  font-family:var(--fm);font-weight:600;font-size:11px;letter-spacing:.46em;
  color:rgba(250,250,250,.38);animation:riseIn .9s var(--eo) .7s both}
.sig b{font-weight:600;color:rgba(255,193,7,.62)}

@keyframes spinCW{to{transform:rotate(360deg)}}
@keyframes spinCCW{to{transform:rotate(-360deg)}}
@keyframes faceBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

@media (max-width:1400px){
  .bwrap{left:4.4%;gap:30px}
  .credits{width:min(660px,47vw);padding:20px 22px 20px}
  .cat .ci{width:42px;height:42px}
  .cat .ci svg{width:21px;height:21px}
  .cat .cn{font-size:17px}
  .box.car .card{width:206px;transform:translate(-50%,-50%) translateX(calc(var(--d) * 106px))
    scale(calc(1 - var(--ad) * .17))}
  .av{width:104px;height:104px}
  .av svg{width:58px;height:58px}
}
@media (max-width:980px){
  .credits{right:auto;left:5%;top:auto;bottom:calc(var(--dock) + 20px);width:90vw;height:36vh}
  .bwrap{bottom:46vh}
  h1{font-size:clamp(40px,7vh,64px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition:none !important;animation-delay:0s !important}
  .orbitB::before,.orbitB::after,.orbitB .face,.follow::after,.bellrow svg{animation:none !important}
  h1 .w{opacity:1;transform:none}
  .rise{opacity:1;transform:none}
  .card{transition:none !important;opacity:1 !important}
}
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <div class="aura"></div>

  <div class="bwrap">
    <div class="orbitB rise" style="--rd:.3s">
      <span class="glow" aria-hidden="true"></span>
      <div class="face" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="12" fill="#ffd100"/><path d="M4.16 12.91a7.9 7.9 0 0015.68 0" fill="none" stroke="#0a0900" stroke-width="1.32" stroke-linecap="round"/><circle cx="7" cy="8" r="1.5" fill="#0a0900"/><circle cx="17" cy="8" r="1.5" fill="#0a0900"/></svg>
      </div>
    </div>

    <div class="btxt">
      <h1>
        <span class="w w1"><span class="g">That's all</span></span>
        <span class="w w2"><span class="y">folks.</span></span>
      </h1>

      <div class="rise" style="--rd:.55s">
        <span class="chip solid follow">follow so you don't miss the next one</span>
      </div>

      <div class="nextrow rise" style="--rd:.6s">
        <div class="nc">
          <span class="nk">next session</span>
          <span class="nw" id="nw">tba</span>
          <span class="nh" id="nh" hidden></span>
        </div>
      </div>

      <div class="bellrow rise" style="--rd:.62s">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg>
        <span><b>Notifications on</b>&nbsp;— never miss a session</span>
      </div>
    </div>
  </div>

  <div class="credits rise" style="--rd:.5s">
    <div class="chead"><span>Credits</span><i class="rule"></i><span class="ep">ep <b class="num" data-ep>128</b></span></div>

    <div class="cat" id="cat">
      <span class="ci" id="catIcon"></span>
      <span class="cn"><span id="catName">Host</span><small id="catCount"></small></span>
    </div>

    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

    <div class="box car" id="box"></div>
  </div>

  <p class="sig">smile<b>.co.ke</b></p>
</div>

<script>
/* ============================================================
   THE ROLL.

   Data is categories, not a flat list. Each category owns an icon and a list of
   people, and the machine walks: category -> each person's card -> the category
   as a grid -> next category. That is why the grid earns its place rather than
   decorating: it is the "and everyone else in this department" beat between
   two categories.

   Placeholder names are written the way real credits are written — the desk,
   the crew, the cameras — so the board is legible before anybody is replaced.
   ============================================================ */
(function(){
  function get(k){return (location.search.match(new RegExp('[?&]'+k+'=([^&]*)'))||[])[1]}
  function dec(v){try{return decodeURIComponent(String(v).replace(/\+/g,' '))}catch(e){return v}}
  function trim(v){return dec(v||'').trim()}

  var ICON={
    mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3.2M9 21.2h6"/>',
    users:'<circle cx="9" cy="8" r="3.3"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/><path d="M16.2 5.2a3.3 3.3 0 0 1 0 6.1"/><path d="M17.4 14.6A6.2 6.2 0 0 1 21.2 20"/>',
    clap:'<path d="M3 9.2h18V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m2.6 8.6 1.6-4.3a1 1 0 0 1 1.2-.6l13.8 2.8a1 1 0 0 1 .7 1.3l-.5 1.2"/><path d="m7.6 4.9-1.2 3.7M12 4.1l-1.2 3.7M16.4 5.3l-1.2 3.7"/>',
    doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.6 13h6.8M8.6 16.6h4.6"/>',
    layers:'<path d="m12 2.8 8.4 4.6L12 12 3.6 7.4z"/><path d="m3.6 12 8.4 4.6L20.4 12"/><path d="m3.6 16.6 8.4 4.6 8.4-4.6"/>',
    cast:'<circle cx="12" cy="12" r="2.1"/><path d="M8.1 8.1a5.5 5.5 0 0 0 0 7.8"/><path d="M15.9 15.9a5.5 5.5 0 0 0 0-7.8"/><path d="M5.4 5.4a9.4 9.4 0 0 0 0 13.2"/><path d="M18.6 18.6a9.4 9.4 0 0 0 0-13.2"/>',
    cam:'<rect x="2" y="6.4" width="13" height="11.2" rx="2.2"/><path d="m15 10.6 6.6-3.4v9.2L15 13z"/><circle cx="7" cy="12" r="1.6"/>',
    check:'<path d="M12 2.8 4.8 5.9v5.6c0 4.6 3.1 8.6 7.2 9.7 4.1-1.1 7.2-5.1 7.2-9.7V5.9z"/><path d="m9 12 2.2 2.2L15.4 10"/>',
    music:'<path d="M9 17.6V5.4l10-2v12"/><circle cx="6.4" cy="17.6" r="2.6"/><circle cx="16.4" cy="15.4" r="2.6"/>',
    chat:'<path d="M20.6 12a7.6 7.6 0 0 1-7.6 7.6H8.4L4 22.6v-4.3A7.6 7.6 0 0 1 3.4 12 7.6 7.6 0 0 1 11 4.4h2a7.6 7.6 0 0 1 7.6 7.6z"/><path d="M8.6 11.6h6.8M8.6 14.6h4"/>',
    spark:'<path d="M12 3.4v3M12 17.6v3M3.4 12h3M17.6 12h3"/><circle cx="12" cy="12" r="3.2"/><path d="M6.6 6.6 8.6 8.6M15.4 15.4l2 2M17.4 6.6l-2 2M8.6 15.4l-2 2"/>',
    cal:'<rect x="3" y="5" width="18" height="16" rx="2.2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9.6 15.4 1.7 1.7 3.3-3.4"/>'
  };
  var MARK='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#F2F2F6"/><path d="M4.16 12.91a7.9 7.9 0 0015.68 0" fill="none" stroke="#0a0900" stroke-width="1.32" stroke-linecap="round"/><circle cx="7" cy="8" r="1.5" fill="#0a0900"/><circle cx="17" cy="8" r="1.5" fill="#0a0900"/></svg>';

  /* The avatar palette. Low-chroma, cool-to-earthy: no pinks, no pastels,
     nothing that reads a gender, with the mid-tones kept masculine without
     collapsing into monochrome. Each person gets a TRIPLE rather than a single
     colour, so the number of combinations is effectively unlimited — swap any
     triple for any other. The set is curated rather than truly random, because
     a board where two cards land on near-identical greys looks accidental and
     an end card is the one place that must not look accidental. */
  function C(a,b,c){return {c1:a,c2:b,c3:c}}

  var CATS=[
    {n:'Host',i:'mic',p:[{r:'Host',v:'you',k:C('#3D4F5C','#2E3A46','#55666F')}]},
    {n:'Co-hosts',i:'users',p:[
      {r:'Lead co-host',v:'the smile squad',k:C('#45506B','#2F4A5C','#5A6472')},
      {r:'Co-host',v:'the night desk',k:C('#4A5A3E','#3A4A3E','#6B5B3E')},
      {r:'Co-host',v:'field desk',k:C('#3E5A54','#334155','#6E6455')}]},
    {n:'Producers',i:'clap',p:[
      {r:'Executive producer',v:'smile crew',k:C('#5A4A3C','#3B4652','#7B6D4F')},
      {r:'Producer',v:'the desk',k:C('#45506B','#33474F','#5C6B62')},
      {r:'Producer',v:'production',k:C('#4E5A63','#3A4450','#6B6250')}]},
    {n:'Script',i:'doc',p:[
      {r:'Script editor',v:'the words',k:C('#4A5568','#2E3A46','#5F6C7B')},
      {r:'Copy',v:'the desk',k:C('#3E5A54','#4A5A3E','#55666F')}]},
    {n:'Assets & graphics',i:'layers',p:[
      {r:'Graphics',v:'the toolkit',k:C('#6B5B3E','#45506B','#3E5A54')},
      {r:'Motion',v:'motion',k:C('#3D4F5C','#5A4A3C','#55666F')},
      {r:'Brand',v:'brand',k:C('#4E5A63','#2F4A5C','#6B6250')}]},
    {n:'On-air talent',i:'cast',p:[
      {r:'Presenter',v:'the voices',k:C('#2F4A5C','#45506B','#5C6B72')},
      {r:'Reader',v:'readers',k:C('#4A5A3E','#5A4A3C','#55666F')},
      {r:'Correspondent',v:'stringer',k:C('#3E5A54','#334155','#6E6455')}]},
    {n:'Field reporting',i:'cam',p:[
      {r:'Camera',v:'the cameras',k:C('#3B4652','#4A5A3E','#6B5B3E')},
      {r:'Sound',v:'stringer',k:C('#45506B','#33474F','#5C6B62')}]},
    {n:'Fact check',i:'check',p:[
      {r:'Verifier',v:'the desk',k:C('#3A4A3E','#4A5568','#6B6250')},
      {r:'Standards',v:'verification',k:C('#4E5A63','#3E5A54','#55666F')}]},
    {n:'Music',i:'music',p:[{r:'Music',v:'licensed',k:C('#3D4F5C','#2E3A46','#5C6B72')}]},
    {n:'Questions',i:'chat',p:[{r:'Questions',v:'the chat',k:C('#45506B','#4A5A3E','#55666F')}]},
    {n:'Closing',i:'spark',p:[{r:'Everyone',v:'everyone',k:C('#6B5B3E','#3D4F5C','#5A6472')}]},
    {n:'Next session',i:'cal',p:[{r:'Next session',v:'tba',k:C('#FFC107','#C98A12','#8A5E0C')}]}
  ];

  /* ---- overrides ---- */
  var eps=trim(get('ep'));
  if(eps)document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps});

  var host=trim(get('host'));
  if(host){ CATS[0].p[0].v=host; CATS[0].p[0].r='Host' }

  var nx=trim(get('next'));
  if(nx){
    document.documentElement.dataset.next='1';
    document.getElementById('nw').textContent=nx;
    var lp=CATS[CATS.length-1].p[0];
    if(lp.v==='tba') lp.v=nx;
    var what=trim(get('what'));
    if(host||what){
      var nh=document.getElementById('nh');
      nh.hidden=false;nh.textContent='';
      if(host){nh.appendChild(document.createTextNode('Hosted by '));var b=document.createElement('b');b.textContent=host;nh.appendChild(b);}
      if(what){if(host){var sp=document.createElement('span');sp.className='sep';sp.textContent='·';nh.appendChild(sp);}var b2=document.createElement('b');b2.textContent=what;nh.appendChild(b2);}
    }
  }

  var box=document.getElementById('box');
  var barFill=document.getElementById('barFill');
  var catIcon=document.getElementById('catIcon');
  var catName=document.getElementById('catName');
  var catCount=document.getElementById('catCount');

  function fill(c,p){
    c.querySelector('.rl').textContent=p.r;
    c.querySelector('.nm').textContent=p.v;
    c.style.setProperty('--c1',p.k.c1);
    c.style.setProperty('--c2',p.k.c2);
    c.style.setProperty('--c3',p.k.c3);
  }
  function makeCard(p){
    var d=document.createElement('div');
    d.className='card';
    d.innerHTML='<span class="av">'+MARK+'</span><span class="rl"></span><span class="nm"></span>';
    fill(d,p);
    return d;
  }

  var CARD=parseFloat(get('cardms'))||3500;
  var GRID=parseFloat(get('gridms'))||3200;
  var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  var ci=0, pi=0, phase='card', stepStart=0, cards=[], lastKey='';

  /* FLIP between carousel and grid.
     Without this the spread is a jump cut: cards leave one layout and appear in
     another inside the same frame, which is exactly the moment a credits board
     stops feeling expensive. Measure where each card is, switch the layout,
     then hand each card its old position back as a transform and let the
     transition carry it across. */
  function morph(to){
    var wantCar=(to==='car');
    if(box.classList.contains('car')===wantCar) return;
    var before=cards.map(function(c){return c.getBoundingClientRect()});
    box.className='box '+to;
    if(!wantCar){
      var n=cards.length;
      box.style.setProperty('--cols', n<=1?1:(n<=2?2:(n<=3?3:(n<=4?2:3))));
      /* the role line only earns its place while the board is small enough to
         read. Past four people the grid is faces and names, nothing more. */
      box.classList.toggle('no-role', n>4);
    }else{
      box.classList.remove('no-role');
    }
    cards.forEach(function(c,i){
      var b=before[i];
      var a=c.getBoundingClientRect();
      if(!b||!b.width||!a.width){c.style.transition='none';c.style.transform='';return}
      var dx=(b.left+b.width/2)-(a.left+a.width/2);
      var dy=(b.top+b.height/2)-(a.top+a.height/2);
      c.style.transition='none';
      c.style.transform='translate('+dx+'px,'+dy+'px) scale('+(b.width/a.width)+')';
    });
    void box.offsetWidth;                 /* commit, or the browser coalesces */
    cards.forEach(function(c){c.style.transition='';c.style.transform=''});
  }

  function layout(){
    cards.forEach(function(c,i){
      var d=i-pi;
      c.style.setProperty('--d',d);
      c.style.setProperty('--ad',Math.abs(d));
      c.classList.toggle('on',i===pi);
    });
  }

  function enter(){
    var key=ci+':'+pi+':'+phase;
    if(key===lastKey) return;
    lastKey=key;
    var cat=CATS[ci], people=cat.p;

    catIcon.innerHTML='<svg viewBox="0 0 24 24">'+ICON[cat.i]+'</svg>';
    catName.textContent=cat.n;
    catCount.textContent=people.length>1?people.length+' in '+cat.n.toLowerCase():'';

    /* pool: enough nodes for the biggest category, reused forever. Cards are
       never destroyed between categories, so there is nothing to flicker. */
    people.forEach(function(p,i){
      if(!cards[i]){ cards[i]=makeCard(p); box.appendChild(cards[i]) }
      else fill(cards[i],p);
    });
    /* park anything the current category does not need */
    for(var j=people.length;j<cards.length;j++){ if(cards[j].parentNode) cards[j].remove() }

    if(phase==='card'){ morph('car'); layout() }
    else{
      morph('grid');
      cards.forEach(function(c){ c.classList.remove('on');
        c.style.removeProperty('--d'); c.style.removeProperty('--ad') });
    }
    stepStart=performance.now();
  }

  function advance(){
    var cat=CATS[ci];
    if(phase==='card'){
      if(pi<cat.p.length-1) pi++;
      else { phase='grid'; pi=0 }
    }else{
      ci=(ci+1)%CATS.length; pi=0; phase='card';
    }
    enter();
  }

  if(reduced){
    /* no choreography: hold the last category as a board, bar full */
    ci=CATS.length-1; phase='grid'; pi=0; enter();
    barFill.style.width='100%';
  }else{
    enter();
    setInterval(function(){
      var dur=(phase==='card'?CARD:GRID);
      var el=performance.now()-stepStart;
      if(el>=dur){ advance(); el=0 }
      /* drains: full means just started, empty means about to move on */
      barFill.style.width=(Math.max(0,1-el/dur)*100).toFixed(2)+'%';
    },70);
  }
})();
</script>

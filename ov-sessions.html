<!doctype html>
<html><head>
<meta charset="utf-8"><title>SMILE · Sessions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile.css"><link rel="stylesheet" href="_shared.css">
<style>
/* VARS: --corner --mx --my --scale --w */
:root{--corner:tr;--mx:68;--my:146;--scale:1;--w:462;}
.widget{width:calc(var(--u)*var(--w,462));}
.sess-row{display:flex;padding:calc(var(--u)*12) calc(var(--u)*10);}
.sess{flex:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*6);}
.sess .sc{display:flex;align-items:center;gap:calc(var(--u)*7);font-family:var(--font-display);font-weight:800;
  font-size:calc(var(--u)*9.5);letter-spacing:.24em;color:var(--faint);}
.sess .sc i{width:calc(var(--u)*6);height:calc(var(--u)*6);border-radius:50%;background:#3f3f46;transition:.4s;}
.sess.open .sc{color:var(--muted-fg);}
.sess.open .sc i{background:var(--up);box-shadow:0 0 calc(var(--u)*8) rgba(14,203,129,.6);}
.sess .st{font-family:var(--font-display);font-weight:800;font-size:calc(var(--u)*20);color:var(--fg);}
</style>
</head>
<body class="ov">
<div class="card fx" id="root">
  <div class="widget">
    <div class="w-head">
      <span class="w-idx">02</span>
      <svg class="w-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <h3>MARKET SESSIONS</h3>
    </div>
    <div class="sess-row">
      <div class="sess" data-tz="Asia/Tokyo"><span class="sc"><i></i>TOKYO</span><span class="st num">--:--</span></div>
      <div class="sess" data-tz="Europe/London"><span class="sc"><i></i>LONDON</span><span class="st num">--:--</span></div>
      <div class="sess" data-tz="America/New_York"><span class="sc"><i></i>NEW YORK</span><span class="st num">--:--</span></div>
    </div>
  </div>
</div>
<script src="_shared.js"></script>
<script>
SMILE.mount(document.getElementById('root'),{corner:'tr',mx:68,my:146,scale:1});
var ranges={'Asia/Tokyo':[0,9],'Europe/London':[7,16],'America/New_York':[13,22]};
function tick(){
  var now=new Date(),utcH=now.getUTCHours();
  document.querySelectorAll('.sess').forEach(function(el){
    var tz=el.dataset.tz;
    try{el.querySelector('.st').textContent=new Intl.DateTimeFormat('en-GB',
      {timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(now);}catch(e){}
    var r=ranges[tz];el.classList.toggle('open',!!(r&&utcH>=r[0]&&utcH<r[1]));
  });
}
setInterval(tick,1000);tick();
</script>
</body></html>

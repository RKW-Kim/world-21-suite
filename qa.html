<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · Q&amp;A</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0a0a0a;
  --bg:#09090b; --border:#27272a; --fg:#fafafa; --muted:#a1a1aa; --faint:#82828b;
  --up:#0ECB81; --down:#F6465D; --live:#F6465D;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --safe-b:96px; /* bottom module zone — the ticker module docks here */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--yellow);color:var(--ink)}
.page{position:relative;display:flex;flex-direction:column;height:100%}

.ambient{position:absolute;inset:0;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%);
          mask-image:radial-gradient(ellipse at 50% 44%,#000 28%,transparent 82%)}
.spot{position:absolute;inset:0;background:radial-gradient(ellipse 64% 44% at 50% -10%,rgba(255,255,255,.09),transparent 70%)}
.aura{position:absolute;left:50%;top:40%;width:720px;height:480px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(14,203,129,.05),transparent 64%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 56%,rgba(0,0,0,.5) 100%)}

.topbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:22px clamp(18px,4vw,48px)}
.brand{display:inline-flex;align-items:center}
.brand svg{height:clamp(20px,2.6vh,28px);width:auto}
.livechip{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(246,70,93,.45);
  border-radius:999px;padding:8px 16px;font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:var(--fg)}
.livechip .ld{position:relative;width:8px;height:8px;border-radius:50%;background:var(--live)}
.livechip .ld::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;
  animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.6);opacity:0}}
.livechip b{color:var(--live);letter-spacing:.24em}
.livechip .num{color:var(--muted)}

.hero{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(12px,2.2vh,22px);text-align:center;padding:0 24px var(--safe-b);min-height:0}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:9px;border-radius:999px;
  border:1px solid rgba(14,203,129,.4);background:rgba(14,203,129,.07);color:var(--up);
  padding:7px 16px;font-family:var(--fm);font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .05s both}

.qa-row{display:flex;align-items:center;gap:clamp(16px,3vw,34px);animation:rise .9s cubic-bezier(.2,.9,.3,1) .12s both}
.qa-row .face{width:clamp(84px,13vh,118px);height:clamp(84px,13vh,118px);flex:none;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.5));animation:bob 4.5s ease-in-out 1s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.qa-row svg{width:100%;height:100%}
.qmark{font-family:var(--fd);font-weight:700;font-size:clamp(88px,20vh,190px);line-height:.9;
  background:linear-gradient(180deg,#FFDE7A 10%,var(--yellow) 55%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(255,193,7,.2))}

h1{font-family:var(--fd);font-weight:700;font-size:clamp(40px,8.5vh,80px);line-height:1.02;
  letter-spacing:-.035em;animation:rise .9s cubic-bezier(.2,.9,.3,1) .22s both}
h1 .g{background:linear-gradient(180deg,#fafafa 25%,#86868e 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
h1 .u{background:linear-gradient(180deg,#8ff5cf 10%,var(--up) 60%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:600px;font-size:clamp(14px,2.3vh,19px);font-weight:500;color:var(--muted);
  line-height:1.5;animation:rise .8s cubic-bezier(.2,.9,.3,1) .3s both}

.howto{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  animation:rise .8s cubic-bezier(.2,.9,.3,1) .4s both}
.how{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:12px;
  background:rgba(14,14,17,.62);padding:10px 16px}
.how .ix{font-family:var(--fm);font-weight:600;font-size:10px;color:var(--yellow)}
.how b{font-family:var(--fm);font-weight:600;font-size:10.5px;letter-spacing:.2em;color:var(--fg)}
.how span{font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;color:var(--faint)}

.stats{display:flex;gap:clamp(24px,4vw,54px);animation:rise .8s cubic-bezier(.2,.9,.3,1) .5s both}
.stat .n{font-family:var(--fm);font-weight:600;font-size:clamp(20px,3.8vh,30px);color:var(--fg);
  font-variant-numeric:tabular-nums}
.stat .n.y{color:var(--yellow)}
.stat .t{margin-top:4px;font-family:var(--fm);font-size:9px;letter-spacing:.26em;color:var(--faint);
  text-transform:uppercase}


@media (max-width:720px){.qmark{display:none}.how span{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="page">
  <div class="ambient" aria-hidden="true">
    <div class="dots"></div><div class="spot"></div><div class="aura"></div><div class="vig"></div>
  </div>

  <header class="topbar">
    <span class="brand" aria-label="smile">
      <svg viewBox="5 7.4 118 28" xmlns="http://www.w3.org/2000/svg" role="img">
        <style>.cls-0{fill:#E6E6E6}.cls-2{fill:#0A0900}</style>
        <path class="cls-0" d="m46.9 18-6 0.7c-0.3-0.7-0.4-1.7-1.7-1.7-0.9 0-1.4 0.6-1.4 1.5s0.4 1.1 2.2 1.2c3.9 0.2 7.9 1.3 7.9 5.3 0 3.7-3.9 5.3-8.8 5.3-4.8 0-8.2-1.3-8.6-4.6l6.1-0.8c0.3 0.9 0.7 2.4 2.5 2.4 1.3 0 2.3-0.4 2.3-1.5 0-1.2-0.7-1.6-2.6-1.8-3.8-0.4-7.8-1.1-7.8-5.1 0-3.7 4.1-5 8.1-5 3.9 0 6.9 0.7 7.9 4"/>
        <path class="cls-0" d="m70.7 14.6c0.9-0.4 1.9-0.6 3.1-0.6 3.2 0 5.5 1.5 5.5 5.6v10.7h-6.4v-10.4c-0.5-0.7-1-1.3-1.9-1.3-1.3 0-2.4 0.8-2.7 2.6v9.1h-6.3v-10.4c-0.4-0.6-1-1.2-1.9-1.3-1.3 0-2.4 0.7-2.7 2.6v9.1h-6.5v-16.3h5.9v2.2h0.2c1.4-1.4 3.2-2.2 5.7-2.3 1.9-0.1 3.9 0.7 4.9 2.3h0.4c0.9-0.7 1.7-1.3 2.7-1.6"/>
        <path class="cls-0" d="m83.5 13.9h6.2v16.4h-6.2v-16.4zm0-6.4h6.2v4.1h-6.3l0.1-4.1z"/>
        <polygon class="cls-0" points="93.8 7.5 100.4 7.5 100.4 30.3 93.8 30.3"/>
        <path class="cls-0" d="m112.1 17.7c-1.7-0.1-2.9 1-3 2.5h6.2c-0.2-1.6-1.3-2.4-3.2-2.5m3.3 7.1 6.7 0.9c-1.3 2.5-3.7 4.6-9 4.6-4.8 0-9.5-1.7-9.5-8.1 0-3.2 1.8-8.3 9.2-8.2 7.8 0 9.3 4.4 9.3 9.1h-12.7c0 1.8 1.4 3.4 3.2 3.3 1.4 0 2.5-0.6 2.8-1.6"/>
        <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>
        <path class="cls-2" d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z"/>
        <path class="cls-2" d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z"/>
        <path class="cls-2" d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z"/>
      </svg>
    </span>
    <span class="livechip"><span class="ld"></span><b>LIVE</b><span class="num" id="up">00:00</span></span>
  </header>

  <main class="hero">
    <span class="eyebrow">Open Floor · Q&amp;A</span>

    <div class="qa-row">
      <span class="face" aria-hidden="true">
        <svg viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg">
          <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>
          <path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#0A0900"/>
          <path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#0A0900"/>
          <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0A0900"/>
        </svg>
      </span>
      <span class="qmark" aria-hidden="true">?</span>
    </div>

    <h1><span class="g">ask me</span> <span class="u">anything.</span></h1>
    <p class="sub">Charts, setups, MT5, the Kenya market, or why the desk mascot won't stop smiling — the floor is open until the questions run out.</p>

    <div class="howto">
      <span class="how"><span class="ix">01</span><b>TYPE IN CHAT</b><span>anytime</span></span>
      <span class="how"><span class="ix">02</span><b>USE !Q</b><span>join the queue</span></span>
      <span class="how"><span class="ix">03</span><b>SUPER CHAT</b><span>skip the line</span></span>
    </div>

    <div class="stats">
      <div class="stat"><div class="n y num" id="answered">12</div><div class="t">ANSWERED</div></div>
      <div class="stat"><div class="n num" id="queue">4</div><div class="t">IN QUEUE</div></div>
      <div class="stat"><div class="n num" id="viewers">318</div><div class="t">IN THE ROOM</div></div>
    </div>
  </main>

</div>

<script>
/* one gated interval — live timer + gentle counter drift. that's all. */
(function(){
  var upEl=document.getElementById('up'),aEl=document.getElementById('answered'),
      qEl=document.getElementById('queue'),vEl=document.getElementById('viewers');
  var answered=12,queue=4,viewers=318,next=20;
  function two(n){return String(n).padStart(2,'0')}
  function tick(){
    if(document.hidden)return;
    var s=Math.floor(Date.now()/1000)-START;
    upEl.textContent=two(Math.floor(s/60))+':'+two(s%60);
    if(s>=next){
      next=s+18+Math.floor(Math.random()*24);
      if(Math.random()<.8){answered++;if(queue>0)queue--;}
      else{queue++;}
      viewers+=Math.floor(Math.random()*7-2);
      aEl.textContent=answered;qEl.textContent=queue;vEl.textContent=viewers;
    }
  }
  var START=Math.floor(Date.now()/1000);
  tick();setInterval(tick,1000);
  document.addEventListener('visibilitychange',tick);
})();
</script>
</body>
</html>

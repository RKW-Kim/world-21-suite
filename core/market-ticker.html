<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Market Ticker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:76px; overflow:hidden; background:transparent;
    font-family:'Inter','Segoe UI',system-ui,sans-serif; }
  .bar { position:absolute; inset:0; display:flex; align-items:stretch;
    background:linear-gradient(90deg, rgba(10,14,18,0.94), rgba(10,14,18,0.86));
    border-top:1px solid rgba(99,220,150,0.35); }
  .clock { flex:0 0 auto; display:flex; flex-direction:column; justify-content:center;
    padding:0 26px; border-right:1px solid rgba(255,255,255,0.12);
    background:rgba(99,220,150,0.08); }
  .clock .time { font-size:26px; font-weight:700; color:#fff; letter-spacing:1px;
    font-variant-numeric:tabular-nums; line-height:1.1; }
  .clock .date { font-size:11px; color:rgba(255,255,255,0.55); letter-spacing:1.5px;
    text-transform:uppercase; }
  .marquee { flex:1 1 auto; overflow:hidden; position:relative; display:flex;
    align-items:center;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent); }
  .track { display:flex; align-items:center; white-space:nowrap;
    animation:scroll 45s linear infinite; will-change:transform; }
  @keyframes scroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  .item { display:inline-flex; align-items:baseline; gap:10px; padding:0 26px; }
  .item .sym { font-size:15px; font-weight:700; color:rgba(255,255,255,0.92); letter-spacing:0.5px; }
  .item .px  { font-size:15px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; }
  .item .chg { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  .up .chg { color:#3ddc84; } .down .chg { color:#ff5c5c; }
  .up .px::after { content:" \25B2"; color:#3ddc84; font-size:10px; }
  .down .px::after { content:" \25BC"; color:#ff5c5c; font-size:10px; }
  .sep { color:rgba(255,255,255,0.22); font-size:12px; }
</style>
</head>
<body>
<div class="bar">
  <div class="clock">
    <div class="time" id="time">--:--:--</div>
    <div class="date" id="date">&mdash;</div>
  </div>
  <div class="marquee"><div class="track" id="track"></div></div>
</div>
<script>
(function(){
  function pad(n){ return String(n).padStart(2,'0'); }
  function tickClock(){
    var d = new Date();
    document.getElementById('time').textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    document.getElementById('date').textContent = d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  }
  tickClock(); setInterval(tickClock, 1000);

  var track = document.getElementById('track');
  function fmtPx(v){ return v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function render(data){
    if(!data || !data.length) return;
    var html = data.map(function(t){
      var cls = t.direction === 'up' ? 'up' : 'down';
      var sign = t.change_pct >= 0 ? '+' : '';
      return '<span class="item '+cls+'"><span class="sym">'+t.symbol+'</span>'+
        '<span class="px">'+fmtPx(t.price)+'</span>'+
        '<span class="chg">'+sign+t.change_pct.toFixed(2)+'%</span></span><span class="sep">&bull;</span>';
    }).join('');
    track.innerHTML = html + html;
  }

  function connect(){
    var ws = new WebSocket('ws://' + location.host + '/api/market/ws');
    ws.onmessage = function(e){ render(JSON.parse(e.data)); };
    ws.onclose = function(){ setTimeout(connect, 3000); };
    ws.onerror = function(){ ws.close(); };
  }
  function poll(){
    fetch('/api/market/ticker').then(function(r){ return r.json(); }).then(render).catch(function(){});
  }
  poll(); setInterval(poll, 5000); connect();
})();
</script>
</body>
</html>

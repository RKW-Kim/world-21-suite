<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden;
    font-family:'Inter','Segoe UI',system-ui,sans-serif; }
  body { display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% 40%, hsl(var(--hue) 45% 26%), hsl(var(--hue) 50% 10%));
    color:#fff; position:relative; }
  .avatar { width:34%; aspect-ratio:1; border-radius:50%;
    background:hsl(var(--hue) 55% 42%);
    box-shadow:0 0 0 6px hsl(var(--hue) 55% 52% / 0.35);
    display:flex; align-items:center; justify-content:center;
    font-size:min(9vw,64px); font-weight:800; animation:breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }
  .cam-label { position:absolute; top:5%; left:6%; font-size:min(4vw,28px);
    font-weight:800; letter-spacing:1px; opacity:0.9; }
  .rec { position:absolute; top:6%; right:6%; font-size:min(2.4vw,15px); font-weight:700;
    color:#ff5c5c; display:flex; align-items:center; gap:6px; }
  .rec::before { content:""; width:0.7em; height:0.7em; border-radius:50%;
    background:#ff5c5c; animation:blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0.15; } }
  .foot { position:absolute; bottom:6%; left:0; right:0; text-align:center;
    font-size:min(2.2vw,13px); color:hsl(var(--hue) 30% 80%); letter-spacing:2px;
    text-transform:uppercase; opacity:0.7; }
</style>
</head>
<body>
  <div class="cam-label" id="lbl">CAM</div>
  <div class="rec">TEST</div>
  <div class="avatar" id="av">?</div>
  <div class="foot">simulated feed</div>
<script>
  var p = new URLSearchParams(location.search);
  var cam = p.get('cam') || '1';
  var hue = p.get('hue') || '210';
  document.documentElement.style.setProperty('--hue', hue);
  document.body.style.setProperty('--hue', hue);
  document.getElementById('lbl').textContent = 'CAM ' + cam;
  document.getElementById('av').textContent = cam;
</script>
</body>
</html>

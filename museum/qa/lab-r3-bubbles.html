<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · Q&amp;A</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Q&A — restored: the original "rising bubbles" board (lab R3, 63197D0) ──
   The take the room asked for by name: dark transparent comment bubbles
   drifting from the bottom edge to the top, past the smile hub in its
   dashed orbit ring. Not the cream-card take — THIS one. The spine (bg,
   sparks, candle skyline) ships inline; watermark + ticker stay outside
   the page as their own OBS modules (bottom 96px + corners stay clear). */
:root{
  --yellow:#FFC107; --yellow-hot:#F5A623; --ink:#0a0a0a;
  --line:#2a2a2a; --muted:#8c8c8c; --paper:#ffffff;
  --up:#0ECB81; --down:#F6465D; --sky:#3FB6FF;
  --font-display:'Manrope',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--font-body);
  overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
svg{display:block}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden}
.bg{position:absolute;inset:0;z-index:-2;background:
  radial-gradient(1100px 640px at 74% 18%,rgba(255,193,7,.05),transparent 62%),
  radial-gradient(900px 560px at 12% 88%,rgba(14,203,129,.04),transparent 60%),
  radial-gradient(circle at 50% 38%,#171717 0%,var(--ink) 78%)}
.bg::after{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:96px 96px;
  -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 78%);
          mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 78%)}

.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:999px;
  font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap}
.chip.dark{background:rgba(20,20,20,.86);border:1px solid var(--line);color:var(--paper);
  box-shadow:0 6px 24px rgba(0,0,0,.35)}
.chip.ghost{background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.55);color:var(--yellow)}
.chip.solid{background:linear-gradient(135deg,var(--yellow),var(--yellow-hot));color:var(--ink);
  box-shadow:0 8px 28px rgba(255,193,7,.28)}

.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 14px rgba(255,193,7,.9),0 0 4px rgba(255,193,7,1);opacity:0;
  animation:floatSpark 6s infinite ease-in-out var(--d,0s)}
@keyframes floatSpark{0%,100%{transform:translate(0,0) scale(1);opacity:0}
  12%{opacity:.85}50%{transform:translate(18px,-36px) scale(1.45);opacity:.55}88%{opacity:.7}}

#skyline{position:absolute;left:0;right:0;bottom:0;height:330px;z-index:1;opacity:.55;
  -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.72) 55%,#000),linear-gradient(180deg,transparent,#000 34%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.72) 55%,#000),linear-gradient(180deg,transparent,#000 34%);
  mask-composite:intersect}
.cndl{position:absolute;bottom:0;border-radius:4px;opacity:0;transform-origin:50% 100%;
  animation:cndlRise .9s var(--ease-out) forwards var(--d,0s),
            cndlSway 4.2s ease-in-out infinite calc(var(--d,0s) + .9s)}
.cndl::before{content:"";position:absolute;left:50%;top:-16%;bottom:-9%;width:4px;
  transform:translateX(-50%);background:inherit;filter:brightness(.5);border-radius:2px}
@keyframes cndlRise{from{opacity:0;transform:scaleY(.2)}to{opacity:.62;transform:scaleY(1)}}
@keyframes cndlSway{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.045)}}

.rise{opacity:0;animation:riseIn .9s var(--ease-out) forwards;animation-delay:var(--rd,0s)}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}

.scn{position:absolute;inset:0;z-index:2;overflow:hidden}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.55);opacity:.5}}
@keyframes spinCW{to{transform:rotate(360deg)}}
@keyframes faceBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.topbar{position:absolute;top:60px;left:90px;right:90px;display:flex;
  justify-content:flex-end;align-items:center;z-index:6} /* top-left stays clear: watermark module docks here */
.livechip .dot{width:9px;height:9px;border-radius:50%;background:var(--up);animation:dotPulse 1.7s ease-in-out infinite}

[data-take="a"] .head{position:absolute;top:148px;left:0;right:0;text-align:center;z-index:5}
[data-take="a"] h1{font-family:var(--font-display);font-weight:800;font-size:76px;
  letter-spacing:-.03em;line-height:1;color:var(--paper)}
[data-take="a"] h1 .y{color:var(--yellow)}
[data-take="a"] .row{margin-top:26px;display:flex;gap:14px;justify-content:center}
.hubA{position:absolute;top:366px;left:calc(50% - 180px);width:360px;height:360px;
  display:grid;place-items:center;z-index:3}
.hubA::before{content:"";position:absolute;inset:0;border:2.5px dashed rgba(255,193,7,.45);
  border-radius:50%;animation:spinCW 24s linear infinite}
.hubA::after{content:"";position:absolute;inset:24px;border:1px solid rgba(255,193,7,.14);border-radius:50%}
.hubA .face{width:260px;height:260px;animation:faceBob 5.6s ease-in-out infinite;
  filter:drop-shadow(0 18px 60px rgba(255,193,7,.22))}
.hubA .face svg{width:100%;height:100%}

/* the comment bubbles — dark, transparent, tails — rising bottom → top */
.bub{position:absolute;z-index:2;max-width:280px;background:rgba(20,20,20,.9);
  border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:13px 18px 15px;
  box-shadow:0 12px 34px rgba(0,0,0,.42);
  animation:bubRise var(--bd,14s) linear infinite var(--bdel,0s)}
.bub::after{content:"";position:absolute;bottom:-7px;left:18px;width:13px;height:13px;
  background:rgba(20,20,20,.9);border-radius:2px;transform:rotate(45deg);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.bub.flip{border-radius:18px 18px 4px 18px}
.bub.flip::after{left:auto;right:18px;border:0;border-left:1px solid var(--line);
  border-bottom:1px solid var(--line)}
.bub .h{display:block;font-family:var(--font-display);font-weight:700;font-size:12px;
  letter-spacing:.1em;color:var(--yellow);margin-bottom:5px;text-transform:uppercase}
.bub .q{font-family:var(--font-body);font-weight:600;font-size:17px;line-height:1.35;color:var(--paper)}
@keyframes bubRise{
  0%{transform:translateY(430px) rotate(var(--tilt,0deg));opacity:0}
  10%{opacity:1}
  80%{opacity:1}
  100%{transform:translateY(-830px) rotate(var(--tilt,0deg));opacity:0}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .rise{animation-delay:0s!important}
  .bub{animation:none;opacity:1}
  .spark{opacity:.7}
}
</style></head><body>
<div class="stage">
  <div class="bg"></div>
  <div id="skyline"></div>

  <section class="scn" data-take="a">
    <span class="spark" style="left:7%;top:20%;--d:0s"></span>
    <span class="spark" style="left:40%;top:12%;--d:1.2s;background:var(--up)"></span>
    <span class="spark" style="left:93%;top:22%;--d:.6s;background:var(--down)"></span>
    <span class="spark" style="left:88%;top:62%;--d:2.4s"></span>
    <span class="spark" style="left:30%;top:74%;--d:3.2s;background:var(--sky)"></span>
    <span class="spark" style="left:63%;top:80%;--d:1.8s"></span>

    <div class="topbar">
      <span class="chip dark livechip rise" style="--rd:.15s"><i class="dot"></i>Q&amp;A · FLOOR OPEN</span>
    </div>

    <div class="head">
      <h1 class="rise" style="--rd:.1s">the floor is <span class="y">yours</span>.</h1>
      <div class="row">
        <span class="chip solid rise" style="--rd:.2s">drop questions in chat</span>
        <span class="chip ghost rise" style="--rd:.3s">ep <span data-ep>128</span></span>
      </div>
    </div>

    <div class="hubA rise" style="--rd:.25s"><div class="face" aria-hidden="true">
      <!-- smile face — verbatim crop of the real logo (same 4 paths, tight viewBox) -->
      <svg viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg">
        <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>
        <path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#0A0900"/>
        <path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#0A0900"/>
        <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0A0900"/>
      </svg>
    </div></div>

    <div class="bub" style="left:110px;top:520px;--bd:14s;--bdel:-3s;--tilt:-2deg">
      <span class="h">@wanjiku</span><span class="q">how did the show start?</span>
    </div>
    <div class="bub flip" style="left:330px;top:710px;--bd:17s;--bdel:-9s;--tilt:2deg">
      <span class="h">@denno</span><span class="q">screen share setup tour?</span>
    </div>
    <div class="bub" style="left:524px;top:420px;--bd:11.5s;--bdel:-5s;--tilt:-1.5deg">
      <span class="h">@kimanzi</span><span class="q">best part of today's ep?</span>
    </div>
    <div class="bub flip" style="left:1235px;top:440px;--bd:12.5s;--bdel:-1.5s;--tilt:1.5deg">
      <span class="h">@achieng</span><span class="q">hot takes round when?</span>
    </div>
    <div class="bub" style="left:1465px;top:630px;--bd:16s;--bdel:-11s;--tilt:-2deg">
      <span class="h">@biru</span><span class="q">what are you drinking?</span>
    </div>
    <div class="bub flip" style="left:1650px;top:450px;--bd:13s;--bdel:-7s;--tilt:2deg">
      <span class="h">@njoro</span><span class="q">next guest?</span>
    </div>
  </section>
</div>
<script>
/* one tiny job: episode number from ?ep= — nothing else runs here.
   every moving part on this page is pure CSS on the compositor. */
(function(){
  var eps=(location.search.match(/[?&]ep=([^&]+)/)||[])[1];
  if(!eps)return;
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
})();
</script>
</body></html>

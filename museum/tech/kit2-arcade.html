<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · TECH · arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D14; --panel:rgba(15,20,32,.88); --line:#1E293B;
    --cy:#22D3EE; --mg:#F43F8E; --wht:#F8FAFC; --slt:#94A3B8; --ok:#4ADE80;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background-color:var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:64px 64px;
    font-family:'Chakra Petch','Segoe UI',sans-serif; color:var(--wht);
  }
  [hidden]{display:none!important}

  .vignette{position:fixed; inset:0; z-index:60; pointer-events:none;
    background:radial-gradient(120% 130% at 50% 50%, transparent 55%, rgba(0,0,0,.25) 100%)}
  .scan{position:fixed; inset:0; z-index:61; pointer-events:none; opacity:.35;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px)}

  .brand{position:fixed; top:42px; left:48px; z-index:10; font-weight:700; font-size:13px;
    letter-spacing:.18em; text-transform:uppercase; color:var(--wht)}
  .brand span{color:var(--slt); font-weight:500}
  .wm{position:fixed; top:36px; right:48px; width:72px; height:72px; z-index:12;
    filter:drop-shadow(4px 4px 0 rgba(0,0,0,.5))}

  /* header: cyan bar + title + pixel reticle */
  .head{position:fixed; top:96px; left:48px; z-index:10; display:flex; align-items:center;
    gap:24px}
  .cbar{width:10px; height:52px; background:var(--cy); box-shadow:6px 6px 0 rgba(34,211,238,.18)}
  h1{margin:0; font-family:'Unbounded','Chakra Petch',sans-serif; font-weight:700;
    font-size:clamp(30px,4.3vw,48px); line-height:1; color:var(--wht); letter-spacing:.01em}
  .reticle-wrap{position:relative; width:72px; height:72px; flex:none; margin-left:12px}
  .reticle{position:absolute; top:0; left:0; width:8px; height:8px; background:transparent;
    box-shadow:
    0px 0px 0 0 #22D3EE,
    32px 0px 0 0 #22D3EE,
    64px 0px 0 0 #22D3EE,
    32px 8px 0 0 #22D3EE,
    32px 16px 0 0 #22D3EE,
    0px 32px 0 0 #22D3EE,
    8px 32px 0 0 #22D3EE,
    56px 32px 0 0 #22D3EE,
    64px 32px 0 0 #22D3EE,
    32px 48px 0 0 #22D3EE,
    32px 56px 0 0 #22D3EE,
    0px 64px 0 0 #22D3EE,
    32px 64px 0 0 #22D3EE,
    64px 64px 0 0 #22D3EE;
  }
  .rdot{position:absolute; left:32px; top:32px; width:8px; height:8px; background:var(--mg);
    animation:rdot 1.2s steps(1,end) infinite}
  @keyframes rdot{0%,54%{opacity:1}55%,100%{opacity:.15}}

  /* equipment slots — vertical stack with dashed connectors */
  .stack{position:fixed; left:50%; top:54%; transform:translate(-50%,-50%); z-index:5;
    display:flex; flex-direction:column; align-items:center; width:min(680px,74vw)}
  .slot{width:100%; display:flex; align-items:center; gap:20px; padding:19px 26px;
    border:2px solid var(--line); border-radius:4px; background:var(--panel);
    transition:border-color .3s, box-shadow .3s}
  .nm{display:flex; flex-direction:column; gap:3px}
  .nm b{font-weight:700; font-size:17px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--wht)}
  .nm small{font-weight:500; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--slt)}
  .st{margin-left:auto; display:flex; align-items:center; gap:10px; font-weight:600;
    font-size:14px; letter-spacing:.08em; text-transform:uppercase}
  .tst{color:var(--slt)}
  .tst::after{content:''; display:inline-block; width:8px; height:14px; background:var(--cy);
    margin-left:8px; vertical-align:-2px; animation:cur 1s steps(1,end) infinite}
  @keyframes cur{0%,54%{opacity:1}55%,100%{opacity:0}}
  .lck{display:none; align-items:center; gap:9px; color:var(--ok)}
  .ck{position:relative; width:18px; height:14px; flex:none}
  .ck::before{content:''; position:absolute; width:4px; height:8px; background:var(--ok);
    transform:rotate(-45deg); left:2px; top:5px}
  .ck::after{content:''; position:absolute; width:4px; height:15px; background:var(--ok);
    transform:rotate(45deg); left:9px; top:0}
  .slot.locked{border-color:var(--cy); box-shadow:8px 8px 0 rgba(34,211,238,.16)}
  .slot.locked .tst{display:none}
  .slot.locked .lck{display:flex; animation:stamp .32s steps(2,end)}
  @keyframes stamp{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
  .con{width:0; height:24px; border-left:2px dashed var(--line)}

  /* FPS-style meter strip */
  .fps{position:fixed; bottom:48px; left:50%; transform:translateX(-50%); z-index:10;
    display:flex; align-items:flex-end; gap:22px; padding:16px 26px; min-width:560px;
    border:2px solid var(--line); border-radius:4px; background:var(--panel)}
  .fps .side{display:flex; flex-direction:column; gap:5px; padding-bottom:2px}
  .micro{font-weight:700; font-size:12px; letter-spacing:.18em; text-transform:uppercase}
  .fps .micro{color:var(--cy)}
  .fps .val{font-weight:700; font-size:20px; color:var(--wht); line-height:1;
    font-variant-numeric:tabular-nums}
  .bars{display:flex; align-items:flex-end; gap:6px; height:44px}
  .bars i{width:10px; height:var(--h1); background:var(--cy);
    animation:fps var(--d) steps(1,end) infinite; animation-delay:var(--dl)}
  @keyframes fps{0%{height:var(--h1)}25%{height:var(--h2)}50%{height:var(--h3)}
    75%{height:var(--h4)}100%{height:var(--h1)}}
  .fps .up{margin-left:auto; align-self:flex-start; font-weight:600; font-size:12px;
    letter-spacing:.14em; color:var(--slt); font-variant-numeric:tabular-nums; padding-top:2px}
  .fps .up b{color:var(--wht); font-weight:700}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
    .tst::after{animation:none;opacity:1}
    .rdot{animation:none;opacity:1}
  }
</style>
</head>
<body>
  <div class="vignette"></div>

  <header class="brand">SMILE <span>— live podcast + screen share · EP <b data-ep>128</b></span></header>
  <img class="wm" src="../assets/smile-mark.svg" alt="SMILE">

  <div class="head">
    <div class="cbar"></div>
    <h1>CALIBRATING LOADOUT</h1>
    <div class="reticle-wrap"><div class="reticle"></div><div class="rdot"></div></div>
  </div>

  <main class="stack">
    <div class="slot" data-slot>
      <div class="nm"><b>MIC</b><small>SHURE MV7 — USB</small></div>
      <div class="st">
        <span class="tst">testing</span>
        <span class="lck"><span class="ck"></span>LOCKED</span>
      </div>
    </div>
    <div class="con"></div>
    <div class="slot" data-slot>
      <div class="nm"><b>CAMERA</b><small>1080P60 — HDMI IN</small></div>
      <div class="st">
        <span class="tst">testing</span>
        <span class="lck"><span class="ck"></span>LOCKED</span>
      </div>
    </div>
    <div class="con"></div>
    <div class="slot" data-slot>
      <div class="nm"><b>SCREEN SHARE</b><small>DISPLAY 1 — 2560×1440</small></div>
      <div class="st">
        <span class="tst">testing</span>
        <span class="lck"><span class="ck"></span>LOCKED</span>
      </div>
    </div>
  </main>

  <footer class="fps">
    <div class="side">
      <span class="micro">RENDER</span>
      <span class="val">60 FPS</span>
    </div>
    <div class="bars">
      <i style="--h1:55%;--h2:85%;--h3:40%;--h4:70%;--d:.9s;--dl:-.2s"></i>
      <i style="--h1:35%;--h2:60%;--h3:90%;--h4:50%;--d:1.2s;--dl:-.6s"></i>
      <i style="--h1:80%;--h2:45%;--h3:65%;--h4:95%;--d:.8s;--dl:-.1s"></i>
      <i style="--h1:60%;--h2:95%;--h3:30%;--h4:75%;--d:1.4s;--dl:-.9s"></i>
      <i style="--h1:45%;--h2:70%;--h3:85%;--h4:35%;--d:1s;--dl:-.4s"></i>
      <i style="--h1:90%;--h2:40%;--h3:55%;--h4:65%;--d:1.1s;--dl:-.8s"></i>
      <i style="--h1:30%;--h2:75%;--h3:95%;--h4:50%;--d:1.3s;--dl:-.3s"></i>
      <i style="--h1:70%;--h2:35%;--h3:60%;--h4:85%;--d:.85s;--dl:-.7s"></i>
      <i style="--h1:65%;--h2:90%;--h3:45%;--h4:30%;--d:1.15s;--dl:-.5s"></i>
      <i style="--h1:50%;--h2:65%;--h3:80%;--h4:95%;--d:1.35s;--dl:-1s"></i>
    </div>
    <span class="up">T+<b data-elapsed>00:00</b></span>
  </footer>

  <div class="scan"></div>

<script>
(function(){
  var q=new URLSearchParams(location.search);
  function P(n){return String(n).padStart(2,'0')}
  var target=Date.now()+600000, tp=q.get('t');
  if(tp){ if(/^\d+$/.test(tp)){target=Date.now()+parseInt(tp,10)*1000;} else {var d=new Date(tp); if(!isNaN(d.getTime())) target=d.getTime();} }
  var eps=q.get('ep')||'128';
  document.querySelectorAll('[data-ep]').forEach(function(e){e.textContent=eps;});
  var el0=q.get('elapsed')?parseInt(q.get('elapsed'),10):0, t0=Date.now();
  function tick(){
    var s=Math.max(0,Math.round((target-Date.now())/1000));
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
    document.querySelectorAll('[data-cd]').forEach(function(e){ e.textContent=(h>0?P(h)+':':'')+P(m)+':'+P(x); });
    var el=el0+Math.floor((Date.now()-t0)/1000);
    document.querySelectorAll('[data-elapsed]').forEach(function(e){ e.textContent=P(Math.floor(el/60))+':'+P(el%60); });
    if(s<=0){
      document.querySelectorAll('[data-when-live]').forEach(function(e){e.removeAttribute('hidden');});
      document.querySelectorAll('[data-cd-wrap]').forEach(function(e){e.setAttribute('data-done','1');});
    }
  }
  tick(); setInterval(tick,250);
  /* calibration choreography: all slots test at 0s, then lock in sequence */
  var slots=document.querySelectorAll('[data-slot]');
  [1500,3000,4500].forEach(function(ms,i){
    setTimeout(function(){ if(slots[i]) slots[i].classList.add('locked'); }, ms);
  });
})();
</script>
</body>
</html>

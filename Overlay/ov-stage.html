<!doctype html>
<html><head>
<meta charset="utf-8"><title>SMILE · Main Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile.css"><link rel="stylesheet" href="_shared.css">
<style>
/* PARAMS: ?clean=1 (hide everything) · ?badges=0 · ?ticks=0 · ?cross=0 · ?hint=0
   VARS:   --pair-label  · pair text also comes from state.json            */
.tick{position:absolute;width:calc(var(--u)*20);height:calc(var(--u)*20);
  border:calc(var(--u)*1.5) solid rgba(255,255,255,.22);}
.tick.tl{top:calc(var(--u)*18);left:calc(var(--u)*18);border-right:0;border-bottom:0;}
.tick.tr{top:calc(var(--u)*18);right:calc(var(--u)*18);border-left:0;border-bottom:0;}
.tick.bl{bottom:calc(var(--u)*18);left:calc(var(--u)*18);border-right:0;border-top:0;}
.tick.br{bottom:calc(var(--u)*18);right:calc(var(--u)*18);border-left:0;border-top:0;}
.center-cross{position:absolute;left:50%;top:50%;width:calc(var(--u)*24);height:calc(var(--u)*24);
  transform:translate(-50%,-50%);opacity:.12;}
.center-cross::before,.center-cross::after{content:"";position:absolute;background:var(--fg);}
.center-cross::before{left:50%;top:0;width:1px;height:100%;}
.center-cross::after{top:50%;left:0;height:1px;width:100%;}
.stage-top{position:absolute;top:calc(var(--u)*26);left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:calc(var(--u)*10);}
.main-drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--u)*16);color:var(--muted-fg);text-align:center;}
.main-drop .ico{width:calc(var(--u)*54);height:calc(var(--u)*54);color:var(--faint);}
.main-drop h2{font-size:calc(var(--u)*24);letter-spacing:.44em;}
.main-drop p{font-size:calc(var(--u)*13);color:var(--faint);letter-spacing:.04em;line-height:1.8;}
.main-drop p b{color:var(--yellow);font-weight:600;}
body.no-ticks .tick{display:none;} body.no-cross .center-cross{display:none;}
body.no-badges .stage-top{display:none;} body.no-hint .main-drop{display:none;}
</style>
</head>
<body class="ov">
<span class="tick tl"></span><span class="tick tr"></span>
<span class="tick bl"></span><span class="tick br"></span>
<div class="center-cross"></div>

<div class="stage-top fx">
  <span class="badge"><span class="dot y"></span>Main Stage</span>
  <span class="badge accent">Today · <b>&nbsp;<span id="pair">EUR/USD</span></b>&nbsp;▲</span>
</div>

<div class="main-drop fx" style="--dl:.15s">
  <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8.5 21h7M12 17v4"/>
  </svg>
  <h2 class="shimmer">MAIN STAGE</h2>
  <p>drop your display / browser source here — it takes the whole screen<br>
  everything streams live from <b>smile.co.ke</b></p>
</div>

<script src="_shared.js"></script>
<script>
if(SMILE.opt('clean','0')==='1') document.body.classList.add('no-ticks','no-cross','no-badges','no-hint');
if(SMILE.opt('ticks','1')==='0') document.body.classList.add('no-ticks');
if(SMILE.opt('cross','1')==='0') document.body.classList.add('no-cross');
if(SMILE.opt('badges','1')==='0')document.body.classList.add('no-badges');
if(SMILE.opt('hint','1')==='0')  document.body.classList.add('no-hint');
var pairEl=document.getElementById('pair');
var pParam=SMILE.param('pair',null), pVar=SMILE.cssVar('--pair-label','');
if(pParam)pairEl.textContent=pParam; else if(pVar)pairEl.textContent=pVar;
SMILE.watchState(function(s){ if(s.pair)pairEl.textContent=s.pair; },3000);
</script>
</body></html>

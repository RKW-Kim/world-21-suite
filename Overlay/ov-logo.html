<!doctype html>
<html><head>
<meta charset="utf-8"><title>SMILE · Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="smile-mark.svg">
<link rel="stylesheet" href="smile.css"><link rel="stylesheet" href="_shared.css">
<style>
/* PARAMS: ?corner=tl|tr|bl|br · ?mode=mark (logo only) · ?scale=1.2
   VARS:   --corner --mx --my --scale · --title:none / --sub:none to hide parts
   e.g. Custom CSS:  :root{ --corner:br; --mx:44; --my:96; --scale:.9; }     */
:root{--corner:tl;--mx:44;--my:30;--scale:1;}
.wm{display:flex;align-items:center;gap:calc(var(--u)*13);
  padding:calc(var(--u)*9) calc(var(--u)*18) calc(var(--u)*9) calc(var(--u)*12);
  border-radius:calc(var(--u)*14);border:1px solid var(--border);
  background:linear-gradient(180deg,rgba(24,24,27,.85),rgba(9,9,11,.8));
  box-shadow:0 calc(var(--u)*12) calc(var(--u)*30) rgba(0,0,0,.45);backdrop-filter:blur(12px);}
.wm .dw{width:calc(var(--u)*42);height:calc(var(--u)*42);display:block;}
.wm .bt b{display:var(--title,block);font-family:var(--font-display);font-weight:800;
  font-size:calc(var(--u)*23);line-height:1;letter-spacing:.02em;color:var(--fg);}
.wm .bt small{display:var(--sub,block);margin-top:calc(var(--u)*5);font-weight:500;
  font-size:calc(var(--u)*9.5);letter-spacing:.28em;text-transform:uppercase;color:var(--faint);}
.wm .bt small em{font-style:normal;color:var(--yellow);}
.wm.mark{padding:calc(var(--u)*9);border-radius:50%;}
.wm.mark .bt{display:none;}
.wm.mark .dw{width:calc(var(--u)*38);height:calc(var(--u)*38);}
</style>
</head>
<body class="ov">
<!-- the mark below is smile-mark.svg, exactly as authored -->
<div class="brand wm fx" id="root">
  <span class="dw" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <circle cx="50" cy="50" r="48" fill="#FFC800"/>
    <circle cx="31" cy="35" r="5.5" fill="#000000"/>
    <circle cx="69" cy="35" r="5.5" fill="#000000"/>
    <path d="M 20 48 A 30 30 0 0 0 80 48" fill="none" stroke="#000000" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg></span>
  <span class="bt"><b>SMILE</b><small>live from <em>smile.co.ke</em></small></span>
</div>
<script src="smile-mark.js"></script>
<script src="_shared.js"></script>
<script>
var root=document.getElementById('root');
if(SMILE.opt('mode','full')==='mark') root.classList.add('mark');
SMILE.mount(root,{corner:'tl',mx:44,my:30,scale:1});
setTimeout(function(){ if(window.smileMood)smileMood('bounce',900); },700);
</script>
</body></html>

<!doctype html>
<html><head>
<meta charset="utf-8"><title>SMILE · Chat Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile.css"><link rel="stylesheet" href="_shared.css">
<style>
/* PARAMS: ?zone=0 (hide drop zone)
   VARS:   --corner --mx --my --scale --w --h · --head:none / --foot:none hide bars
   Place your real chat browser source directly behind/over this frame.      */
:root{--corner:tr;--mx:68;--my:492;--scale:1;--w:462;--h:472;}
.widget{width:calc(var(--u)*var(--w,462));height:calc(var(--u)*var(--h,472));display:flex;flex-direction:column;}
.w-head{display:var(--head,flex);}
.chat-body{flex:1;margin:calc(var(--u)*12);border:1px dashed var(--border-2);border-radius:calc(var(--u)*12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--u)*12);color:var(--muted-fg);text-align:center;}
.chat-body .ico{width:calc(var(--u)*34);height:calc(var(--u)*34);color:var(--faint);}
.chat-body h4{font-family:var(--font-display);font-weight:700;font-size:calc(var(--u)*12);letter-spacing:.3em;}
.chat-body p{font-size:calc(var(--u)*10.5);color:var(--faint);}
.skel{width:72%;display:flex;flex-direction:column;gap:calc(var(--u)*9);}
.skel i:nth-child(2){animation-delay:.25s;} .skel i:nth-child(3){animation-delay:.5s;}
body.no-zone .chat-body{border-color:transparent;}
body.no-zone .chat-body .ico,body.no-zone .chat-body h4,body.no-zone .chat-body p,body.no-zone .skel{display:none;}
.chat-foot{display:var(--foot,flex);justify-content:center;gap:calc(var(--u)*9);
  padding:calc(var(--u)*11) calc(var(--u)*13);border-top:1px solid var(--border);}
.chat-foot .badge{font-size:calc(var(--u)*10);padding:calc(var(--u)*6) calc(var(--u)*12);}
</style>
</head>
<body class="ov">
<div class="card fx" id="root">
  <div class="widget">
    <div class="w-head">
      <span class="w-idx">04</span>
      <svg class="w-ico" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1 0-2-.17-2.9-.5L4 21l1.6-4.3A8.5 8.5 0 1 1 21 11.5Z"/></svg>
      <h3>TRADING FLOOR CHAT</h3>
    </div>
    <div class="chat-body">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1 0-2-.17-2.9-.5L4 21l1.6-4.3A8.5 8.5 0 1 1 21 11.5Z"/></svg>
      <h4>CHAT WIDGET HERE</h4>
      <div class="skel" aria-hidden="true"><i style="width:64%"></i><i style="width:88%"></i><i style="width:46%"></i></div>
      <p>drop your chat widget / browser source into this zone</p>
    </div>
    <div class="chat-foot">
      <span class="badge accent">drop a 🙂 if you're new</span>
      <span class="badge">@smileke</span>
    </div>
  </div>
</div>
<script src="_shared.js"></script>
<script>
if(SMILE.opt('zone','1')==='0')document.body.classList.add('no-zone');
SMILE.mount(document.getElementById('root'),{corner:'tr',mx:68,my:492,scale:1});
</script>
</body></html>

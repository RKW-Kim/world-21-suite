<!doctype html>
<html><head>
<meta charset="utf-8"><title>SMILE · Ambient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smile.css"><link rel="stylesheet" href="_shared.css">
<style>
/* VARS: --dots --beams --chart --axis --gridlines  (1 = show, 0 = hide)
   PARAMS: ?dots=0&beams=0&chart=0&axis=0&lines=0                     */
:root{--dots:1;--beams:1;--chart:1;--axis:1;--lines:1;}
.bg{position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 50% 38%,#101013 0%,var(--bg) 80%);}
.dots{position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:calc(var(--u)*26) calc(var(--u)*26);
  -webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 30%,transparent 84%);
          mask-image:radial-gradient(ellipse at 50% 42%,#000 30%,transparent 84%);}
.spotlight{position:absolute;inset:0;background:radial-gradient(ellipse 64% 44% at 50% -10%,rgba(255,255,255,.09),transparent 70%);}
.beam{position:absolute;top:-25%;width:calc(var(--u)*170);height:150%;
  background:linear-gradient(180deg,transparent 8%,rgba(255,255,255,.05) 46%,transparent 88%);
  filter:blur(calc(var(--u)*22));animation:breathe 9s ease-in-out infinite;}
.beam.b1{left:16%;transform:rotate(14deg);}
.beam.b2{left:52%;transform:rotate(-10deg);animation-delay:3s;opacity:.7;}
.beam.b3{left:82%;transform:rotate(12deg);animation-delay:5.5s;opacity:.55;}
@keyframes breathe{0%,100%{opacity:.5;}50%{opacity:.95;}}
.sess-line{position:absolute;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.07) 22%,rgba(255,255,255,.07) 78%,transparent);}
.band-tag{position:absolute;top:calc(var(--u)*104);transform:translateX(-50%);
  font-family:var(--font-display);font-weight:800;font-size:calc(var(--u)*9);letter-spacing:.4em;color:rgba(255,255,255,.16);}
.chart-glow{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*300);opacity:.5;}
.chart-glow svg{display:block;width:100%;height:100%;}
.chart-glow .line,.chart-glow .glowl{fill:none;stroke:url(#lg);stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1900;stroke-dashoffset:1900;animation:draw 2.8s cubic-bezier(.4,0,.2,1) .4s forwards;}
.chart-glow .line{stroke-width:2;}
.chart-glow .glowl{stroke-width:4;filter:url(#blur);opacity:.55;}
.chart-glow .area{opacity:0;animation:fadein 1.4s ease 2.2s forwards;}
.chart-glow .enddot{opacity:0;animation:fadein .5s ease 3s forwards;}
.chart-glow .ring{transform-box:fill-box;transform-origin:center;animation:ringp 2s ease-out 3s infinite;}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes fadein{to{opacity:1;}}
@keyframes ringp{0%{transform:scale(.4);opacity:.8;}100%{transform:scale(2.2);opacity:0;}}
.axis{position:absolute;right:calc(var(--u)*14);top:26%;bottom:32%;
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;}
.axis .lv{display:flex;align-items:center;gap:calc(var(--u)*8);}
.axis .dash{width:calc(var(--u)*16);height:1px;background:rgba(255,255,255,.1);}
.axis .pl{font-family:var(--font-display);font-weight:700;font-size:calc(var(--u)*10);color:rgba(255,255,255,.16);}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%);}
body.no-dots .dots,body.no-beams .beam,body.no-chart .chart-glow,
body.no-axis .axis,body.no-lines .sess-line,body.no-lines .band-tag{display:none;}
</style>
</head>
<body class="ov">
<div class="bg"></div>
<div class="dots"></div>
<div class="spotlight"></div>
<div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
<div class="sess-line" style="left:33.3%"></div>
<div class="sess-line" style="left:66.6%"></div>
<span class="band-tag" style="left:14%">TOKYO</span>
<span class="band-tag" style="left:33.3%">LONDON</span>
<span class="band-tag" style="left:66.6%">NEW YORK</span>

<div class="chart-glow">
  <svg viewBox="0 0 1200 260" preserveAspectRatio="none">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFC107" stop-opacity="0"/>
        <stop offset=".35" stop-color="#FFC107" stop-opacity=".85"/>
        <stop offset="1" stop-color="#FFDE7A"/>
      </linearGradient>
      <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFC107" stop-opacity=".14"/>
        <stop offset="1" stop-color="#FFC107" stop-opacity="0"/>
      </linearGradient>
      <filter id="blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>
    <path class="area" fill="url(#ag)" d="M0,208 L60,200 L120,206 L180,184 L240,190 L300,168 L360,176 L420,150 L480,158 L540,132 L600,142 L660,118 L720,126 L780,102 L840,110 L900,86 L960,96 L1020,72 L1080,80 L1140,58 L1200,64 L1200,260 L0,260 Z"/>
    <path class="glowl" d="M0,208 L60,200 L120,206 L180,184 L240,190 L300,168 L360,176 L420,150 L480,158 L540,132 L600,142 L660,118 L720,126 L780,102 L840,110 L900,86 L960,96 L1020,72 L1080,80 L1140,58 L1200,64"/>
    <path class="line" d="M0,208 L60,200 L120,206 L180,184 L240,190 L300,168 L360,176 L420,150 L480,158 L540,132 L600,142 L660,118 L720,126 L780,102 L840,110 L900,86 L960,96 L1020,72 L1080,80 L1140,58 L1200,64"/>
    <g class="enddot">
      <circle class="ring" cx="1200" cy="64" r="9" fill="none" stroke="#FFDE7A" stroke-width="1.5"/>
      <circle cx="1200" cy="64" r="3.5" fill="#FFDE7A"/>
    </g>
  </svg>
</div>

<div class="axis">
  <span class="lv"><span class="dash"></span><span class="pl num">1.0960</span></span>
  <span class="lv"><span class="dash"></span><span class="pl num">1.0920</span></span>
  <span class="lv"><span class="dash"></span><span class="pl num">1.0880</span></span>
  <span class="lv"><span class="dash"></span><span class="pl num">1.0840</span></span>
  <span class="lv"><span class="dash"></span><span class="pl num">1.0800</span></span>
  <span class="lv"><span class="dash"></span><span class="pl num">1.0760</span></span>
</div>
<div class="vignette"></div>

<script src="_shared.js"></script>
<script>
[['dots','dots'],['beams','beams'],['chart','chart'],['axis','axis'],['lines','lines']]
.forEach(function(t){ if(SMILE.opt(t[0],'1')==='0') document.body.classList.add('no-'+t[1]); });
</script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SMILE · up next — the coming-up stinger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5.39 10.7 23.91 23.91'%3E%3Cpath d='m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z' fill='%23ffd100'/%3E%3Cpath d='m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z' fill='%230A0900'/%3E%3Cpath d='m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z' fill='%230A0900'/%3E%3Cpath d='m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z' fill='%230A0900'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   THE COMING-UP STINGER — a transient bumper, the kit's fifth module.
   Fires center stage, says what's coming, and clears itself: a one-shot
   CSS sequence (entrance → hold ~6s → exit to fully transparent), zero
   timers, zero rAF. Add as a 1920×1080 transparent OBS browser source;
   Streamer.bot (or you) reloads it to fire again. ?hold=1 pins it.

   Params: ?next=Trivia Night  ?who=Alice  ?when=8PM EAT  ?hold=1  ?preview=1
   The page background is transparent — no backdrop blur anywhere (nothing
   behind a transparent source to sample); the card carries its own glass.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --yellow:#FFC107; --hot:#F5A623; --ink:#0a0a0a;
  --border:#27272a; --fg:#fafafa; --muted:#a1a1aa;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
svg{display:block}
::selection{background:var(--yellow);color:var(--ink)}
body.preview{background:#09090b;
  background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:26px 26px}

.stage{position:absolute;inset:0;display:grid;place-items:center;padding:0 4vw}

.bumper{position:relative;width:min(880px,92vw);border-radius:20px;
  border:1px solid rgba(255,193,7,.45);background:rgba(10,10,13,.9);
  box-shadow:0 34px 90px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);
  padding:clamp(22px,4.5vh,40px) clamp(26px,4.5vw,52px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(9px,1.8vh,16px);
  text-align:center;overflow:hidden;
  animation:bIn .62s cubic-bezier(.2,.9,.3,1) .3s both,
            bOut .6s cubic-bezier(.6,.05,.75,.4) 7.4s forwards}

/* the one-shot entrance */
@keyframes bIn{from{opacity:0;transform:translateY(44px) scale(.96)}to{opacity:1;transform:none}}
/* the exit — the card leaves, the source returns to fully transparent */
@keyframes bOut{to{opacity:0;transform:translateY(30px) scale(.97);visibility:hidden}}
html[data-hold="1"] .bumper{animation:bIn .62s cubic-bezier(.2,.9,.3,1) .3s both}

/* flare — a light band sweeps the card once as it lands */
.flare{position:absolute;top:-20%;bottom:-20%;left:0;width:34%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,224,138,.16) 45%,rgba(255,224,138,.05) 60%,transparent);
  transform:translateX(-140%);animation:flare 1.1s cubic-bezier(.3,.6,.4,1) .55s forwards}
@keyframes flare{to{transform:translateX(440%)}}

.row1{display:inline-flex;align-items:center;gap:12px;
  animation:pop .5s cubic-bezier(.34,1.56,.64,1) .42s both}
@keyframes pop{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:scale(1)}}
.row1 .face{width:clamp(26px,4.4vh,34px);height:clamp(26px,4.4vh,34px);
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
  animation:faceIn .8s cubic-bezier(.34,1.56,.64,1) .34s both}
@keyframes faceIn{from{opacity:0;transform:rotate(-160deg) scale(.2)}to{opacity:1;transform:none}}
.row1 .un{font-family:var(--fm);font-weight:600;font-size:clamp(10px,1.7vh,12px);
  letter-spacing:.34em;color:var(--ink);background:linear-gradient(135deg,var(--yellow),var(--hot));
  border-radius:8px;padding:7px 15px 7px 18px;text-transform:uppercase}

.title{font-family:var(--fd);font-weight:700;font-size:clamp(30px,6.4vh,58px);
  line-height:1.04;letter-spacing:-.03em;color:var(--fg);
  background:linear-gradient(180deg,#ffffff 30%,#c9c9cf 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:tIn .55s cubic-bezier(.2,.9,.3,1) .62s both;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@keyframes tIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.rule{width:min(320px,60%);height:2px;border-radius:2px;transform-origin:center;
  background:linear-gradient(90deg,transparent,var(--yellow),transparent);
  transform:scaleX(0);animation:rule .6s cubic-bezier(.2,.9,.3,1) .95s forwards}
@keyframes rule{to{transform:scaleX(1)}}

.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
  font-family:var(--fm);font-size:clamp(10px,1.9vh,13px);letter-spacing:.22em;
  color:var(--muted);text-transform:uppercase;animation:mIn .5s cubic-bezier(.2,.9,.3,1) 1.12s both}
.meta b{color:var(--yellow);font-weight:600}
.meta .sep{width:4px;height:4px;border-radius:50%;background:rgba(255,193,7,.5)}
@keyframes mIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* reduced motion: no sequence — the card simply is, and it stays */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important}
  .bumper,.row1,.row1 .face,.title,.meta{opacity:1;transform:none}
  .rule{transform:scaleX(1)}
  .flare{display:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="bumper" id="bump" role="status">
    <i class="flare" aria-hidden="true"></i>
    <div class="row1">
      <span class="face" aria-hidden="true">
        <!-- smile face — verbatim crop of the real logo (same 4 paths, tight viewBox) -->
        <svg viewBox="5.39 10.7 23.91 23.91" xmlns="http://www.w3.org/2000/svg">
          <path d="m16.8 11c-5.8 0-11.4 4.5-11.2 11.7 0.1 6.2 4.5 11.5 11.4 11.6 6.4 0 12-4.7 12.1-11.5-0.2-6.6-5.2-11.8-12.3-11.8z" fill="#ffd100"/>
          <path d="m12.3 17.2c-0.7 0-1.3 0.6-1.3 1.3s0.6 1.3 1.3 1.3 1.3-0.6 1.3-1.3c0.1-0.6-0.5-1.3-1.3-1.3z" fill="#0A0900"/>
          <path d="m22.3 17.2c-0.7 0-1.4 0.6-1.4 1.4 0 0.7 0.7 1.3 1.4 1.3s1.3-0.6 1.3-1.3c0-0.8-0.6-1.4-1.3-1.4z" fill="#0A0900"/>
          <path d="m24.5 22.4c-0.4 0-0.6 0.5-0.6 1-0.3 3.5-3 6.1-6.7 6.1s-6.5-2.5-6.8-6.2c-0.1-0.4-0.4-0.8-0.7-0.8s-0.9 0.3-0.8 1c0.5 3.8 3.2 7.5 8.3 7.5 5.2-0.1 8-3.8 8.3-7.8 0.1-0.6-0.4-1-1-0.8z" fill="#0A0900"/>
        </svg>
      </span>
      <span class="un">Up Next</span>
    </div>
    <div class="title" id="tTitle">Something good</div>
    <div class="rule" aria-hidden="true"></div>
    <div class="meta" id="tMeta"><span>the smile squad returns</span></div>
  </div>
</div>

<script>
/* one-shot param bake — textContent everywhere, zero timers, zero intervals. */
(function(){
  function get(k){return (location.search.match(new RegExp('[?&]'+k+'=([^&]+)'))||[])[1]}
  function dec(v){try{return decodeURIComponent(String(v).replace(/\+/g,' '))}catch(e){return v}}

  if(get('hold')==='1')document.documentElement.dataset.hold='1';
  if(get('preview')==='1')document.body.classList.add('preview');

  var title=dec(get('next')||'').trim();
  if(title)document.getElementById('tTitle').textContent=title;

  var who=dec(get('who')||'').trim(),when=dec(get('when')||'').trim();
  var meta=document.getElementById('tMeta');
  meta.textContent='';
  var parts=[];
  if(who)parts.push({pre:'with ',txt:who,b:true});
  if(when)parts.push({pre:'',txt:when,b:true});
  if(parts.length){
    parts.forEach(function(p,i){
      if(i>0){var s=document.createElement('i');s.className='sep';meta.appendChild(s);}
      var sp=document.createElement('span');
      if(p.pre)sp.appendChild(document.createTextNode(p.pre));
      var b=document.createElement('b');b.textContent=p.txt;sp.appendChild(b);
      meta.appendChild(sp);
    });
  }else{
    var sp=document.createElement('span');sp.textContent='the smile squad returns';meta.appendChild(sp);
  }
})();
</script>
</body>
</html>

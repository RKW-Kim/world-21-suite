<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmileTV — Scene Browser</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#08080b;overflow:hidden}

  /* Every scene renders at a fixed 1920x1080 then scales to fit, so the six
     look identical on any window, any projector, any aspect. */
  #wrap{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform:translate(-50%,-50%) scale(.5);transform-origin:center center}
  iframe{width:1920px;height:1080px;border:0;display:block;background:#0a0a0d}

  /* Reference notes. Off by default — the stage is the screen. */
  #notes{position:fixed;top:0;right:0;bottom:0;width:min(46vw,780px);z-index:5;
    background:rgba(9,9,13,.97);border-left:1px solid rgba(255,255,255,.09);
    overflow-y:auto;transform:translateX(100%);
    transition:transform .26s cubic-bezier(.4,0,.2,1);
    font-family:'Inter',system-ui,sans-serif;color:#e8e8ee;
    padding:30px 34px 60px;-webkit-font-smoothing:antialiased}
  #notes.on{transform:translateX(0)}
  #notes h1{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:#ffd100;font-weight:500;
    padding-bottom:14px;margin-bottom:22px;border-bottom:1px solid rgba(255,255,255,.09)}
  #notes h2{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;color:#ffd100;font-weight:500;
    margin:30px 0 12px}
  #notes h2:first-of-type{margin-top:0}
  #notes p{font-size:14.5px;line-height:1.7;color:#c9c9d2;margin-bottom:12px;max-width:64ch}
  #notes p b{color:#fff;font-weight:600}
  #notes ul{margin:0 0 14px 17px}
  #notes li{font-size:14.5px;line-height:1.7;color:#c9c9d2;margin-bottom:5px;max-width:62ch}
  #notes li::marker{color:#ffd100}
  #notes code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;
    background:rgba(255,255,255,.07);padding:2px 6px;border-radius:3px;color:#ffd100}
  #notes .spec{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;
    line-height:1.85;color:#a1a1aa;background:rgba(255,255,255,.035);
    border-left:2px solid rgba(255,209,0,.4);padding:14px 16px;border-radius:0 3px 3px 0;
    margin:14px 0;white-space:pre-wrap}

  /* one-time hint, then it gets out of the way */
  #hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:6;
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;
    letter-spacing:.06em;color:#a1a1aa;background:rgba(8,8,11,.9);
    border:1px solid rgba(255,255,255,.09);border-radius:3px;padding:9px 16px;
    transition:opacity .8s;pointer-events:none}
  #hint.gone{opacity:0}
</style>
</head>
<body>

<div id="wrap">
  <iframe id="frame" src="overlay/starting.html" title="scene" allow="autoplay; fullscreen"></iframe>
</div>

<aside id="notes"></aside>
<div id="hint">1–6 jump &nbsp;·&nbsp; ← → move &nbsp;·&nbsp; Enter next &nbsp;·&nbsp; N notes &nbsp;·&nbsp; F fullscreen</div>

<script>
/* Six scenes in presentation order, with the notes as generic streaming
   reference: what the scene type is for in a broadcast, when you reach for it,
   what it looks like in other shows, and the technical contract. Written to be
   edited — nothing here is locked to one brand. */
const SCENES = [

    notes: `
<h1>Pre-show holding screen / countdown slate</h1>

<h2>What it is</h2>
<p>The card that sits on Program before anyone is talking. Broadcast calls it a
<b>holding screen</b>, a <b>countdown</b>, or a <b>slate</b>. Its entire job is to
make an empty channel look deliberate, and to tell a viewer who just walked in
that something starts in a known number of minutes.</p>
<p>It is the first thing your audience ever sees, and the last thing they see
before they decide whether to stay. It carries no information that cannot be
read in one glance.</p>

<h2>What it is for</h2>
<ul>
<li><b>Filling dead air.</b> Ten minutes of black before a stream reads as
broken. This reads as "we start at nine".</li>
<li><b>Absorbing the awkward minute.</b> The gap between "the show starts now"
and "someone is actually talking" — camera warm-up, audio check, waiting for
the third person to join.</li>
<li><b>Setting tone.</b> The visual identity of the whole channel is established
here before a single word is spoken.</li>
<li><b>A natural loop.</b> If it runs longer than planned, it can sit for hours.</li>
</ul>

<h2>What you will see in other shows</h2>
<p>Esports broadcasts run a countdown with team logos and a match clock. Talk
shows run a "we begin shortly" card with the guest list. News channels run a
static clock over a wide establishing shot. Twitch and YouTube live often run a
looping stinger. All of them are this same idea: a claim that time is accounted
for.</p>

<h2>Design notes</h2>
<ul>
<li>Headline is the single most important element and is deliberately the
largest type in the entire kit — nothing else on the scene competes with it.</li>
<li>The headline animates word by word on entry, and each word is filled with a
vertical gradient: pale grey into darker grey, with the final word in gold and
a soft glow. Grey first, gold last, so the eye is pulled to the word carrying
the meaning.</li>
<li>Clock and date sit small and tabular-figured, never competing with the
headline.</li>
<li>The logo is above the headline, never beside it.</li>
<li>Everything is centred on one axis. A holding screen with two competing
focal points reads as a mistake.</li>
</ul>

<div class="spec">1920x1080 · no canvas · no rAF
?scale=      scale the mark (0.4 - 1.6)
?title=...   override the headline words
?date=...    override the date line
One gated interval drives the clock only.</div>

<h2>When not to use it</h2>
<p>Do not cut to a holding screen mid-show. It reads as an error, not as
politeness. Hold before you start and hold after you stop — never in the middle.</p>`

    name: 'Tech diffs',

<h1>Segment opener with a completion bar</h1>

<h2>What it is</h2>
<p>A recurring segment card. The pattern is borrowed straight from software:
a <b>diff</b> is what changed between one version and the next. This card names
the change and runs a bar to full as you talk through it. The bar filling is the
show's built-in "we finished this" signal.</p>
<p>It is the broadcast equivalent of a chapter title, and it does the job a
chapter title does on Netflix — except live, where you do not know in advance
where a section will end.</p>

<h2>What it is for</h2>
<ul>
<li><b>Naming the thing.</b> When a team ships something every week, "we shipped
X" needs a consistent home or it gets lost in a chat thread.</li>
<li><b>Showing progress without a slide deck.</b> The card replaces the bullet
list. You talk; the card holds the title.</li>
<li><b>Marking completion.</b> A segment that fills its bar is finished. A
segment still filling is in progress. Audiences learn this in one show.</li>
<li><b>Teachable structure.</b> Same frame every week means the regular viewer
knows what is happening without being told.</li>
</ul>

<h2>What you will see in other shows</h2>
<p>Build/dev livestreams open each feature with a title card and a progress
bar. Bug bounty and patch-note shows open each fix the same way. Sports shows
use the same visual grammar for "quarter two" — a named section with a clock.
Any serialised show benefits from an identical chapter card.</p>

<h2>Design notes</h2>
<ul>
<li>Headline uses the same gradient-clip treatment as the opening slate:
grey words with one gold word carrying the emphasis, plus the glow.</li>
<li>Sentence case throughout — first letter capitalised, connectors left lower
case. "Minor technical difficulties", not "Minor Technical Difficulties".</li>
<li>The bar is thin, horizontal, and reads left to right. It fills once over the
length of the segment rather than per word, so a long discussion does not make
it strobe.</li>
<li>Keep the card on screen for the whole segment. It is the segment's anchor,
not an intro that gets cut away after two seconds.</li>
</ul>

<div class="spec">1920x1080 · no canvas · no rAF
The completion bar is a single CSS transform on a fixed track.
Repeat by reloading the file — no sequence state to reset.</div>

<h2>Failure modes worth avoiding</h2>
<ul>
<li><b>Listing too much.</b> If the card carries a bullet list it becomes a
slide deck and people start reading instead of listening.</li>
<li><b>Starting a new card mid-sentence.</b> The bar restarting mid-thought
breaks the "section finished" contract.</li>
<li><b>A different card every week.</b> The repetition is the value.</li>
</ul>`

<h1>Live chat overlay / engagement layer</h1>

<h2>What it is</h2>
<p>A permanent on-screen chat. Not a picture of a chat — a working one. Messages
arrive, move through the field, and age out. This is the layer that turns a
one-way broadcast into something a viewer can be <i>in</i>.</p>
<p>The central design claim is that participation is recorded. Every message
carries a handle, and the handle is styled — bronze, silver, gold — so
contribution leaves a visible mark that does not scroll away with the message.</p>

<h2>What it is for</h2>
<ul>
<li><b>Proving the channel is alive at any hour.</b> Movement on screen while
nobody is talking is the strongest possible "we are on" signal.</li>
<li><b>Making the audience part of the programme.</b> The viewer list on the
right is the product.</li>
<li><b>Handling questions without a producer.</b> Questions arrive sorted by
tier rather than by who shouted loudest.</li>
<li><b>Filling the frame during dead air.</b> Cheaper and better than a holding
screen because it looks like content.</li>
</ul>

<h2>What you will see in other shows</h2>
<p>Every live news stream, every gaming tournament, every late-night show with a
chat overlay. The premium version — the one worth copying — puts the chat in the
frame permanently rather than revealing it at the end. Twitch's busiest channels
treat chat as a second programme running alongside the first.</p>

<h2>Design notes</h2>
<ul>
<li>Bubbles are dark so they never compete with the face or the headline. Each
carries a thin platform-coloured outline and a matching tail, so messages read
as belonging to a platform without a logo being needed.</li>
<li>Handles use a metallic vertical gradient — bronze, silver, gold — with no
medal icon. Colour and material carry the tier; an icon would cheapen it.</li>
<li>The face is the calm centre. It breathes slowly and nothing else moves
larger than a bubble. Movement that competes with reading is movement that
destroys reading.</li>
<li>The paper aeroplane launches on an irregular random flight and lands at the
centre mark. It is the one deliberately aimless element — it exists so the scene
never sits perfectly still.</li>
<li>Message depth is varied: some bubbles sit behind the face, some in front,
some half off the edge. A flat grid of identical cards reads as a spreadsheet.</li>
</ul>

<div class="spec">1920x1080 · no canvas · random flight is a rAF loop (the one
exception in the kit, because genuinely unpredictable motion needs per-frame

?scale= 0.4 - 1.6
Runs silently with no JavaScript parameters.</div>

<h2>Failure modes worth avoiding</h2>
<ul>
<li><b>Bubbles clipped mid-word at the edges.</b> Half a bubble bleeding off

<li><b>Too much motion.</b> Every message animating hard competes with reading.
Entries should be quiet.</li>
<li><b>Fake chat.</b> Static screenshots of chat are the oldest trick in
streaming and audiences now read them as dishonest.</li>
<li><b>Showing the chat but never reading it.</b> Visible, ignored chat is worse
than no chat.</li>
<li><b>Blocking the face.</b> The face is the anchor; anything that crosses it
reads as a mistake.</li>`

  {
    file: 'overlay/offair.html',
    name: 'Off air',
    notes: `
<h1>Off-air card / standby state (dead air card)</h1>

<h2>What it is</h2>
<p>The screen shown when the channel is not broadcasting. It is the safety state,
not an entertainment state, and that distinction drives every choice in it.</p>
<p>Broadcast engineers would call this a <b>standby slate</b> or a
<b>dead air card</b>. Its purpose is to guarantee that a viewer arriving at any
moment can tell, in one frame, that <i>nothing is live</i> — and to guarantee
that whoever is operating the stream cannot accidentally leave the wrong thing
on Program.</p>

<h2>What it is for</h2>
<ul>
<li><b>Making the transition safe.</b> If the last thing on Program was a
captured meeting window — a video call with a join code visible in it — and
anyone hits "start streaming" or leaves OBS encoding, that room goes out.
Switching to this scene is a one-action fix that removes the whole class of
accident.</li>
<li><b>Telling viewers the channel still exists.</b> A branded dead-air screen is
infinitely better than black. It is the difference between "offline" and
"broken".</li>
<li><b>Advertising the next session.</b> A clock and a countdown to the next
scheduled broadcast means the dead screen is still doing work.</li>
</ul>

<h2>What you will see in other shows</h2>
<p>A test card with a countdown. A "we'll be right back" card with the return
time. Most professional channels run an off-air slate for exactly the safety
reason above — it is the reason television has never accidentally broadcast a
green room. Streaming channels mostly do not, which is why so many of them
accidentally broadcast private meetings.</p>

<h2>Design notes</h2>
<ul>
<li><b>Nothing here is yellow and nothing glows.</b> Yellow is the kit's live
signal. If off-air contains a single lit yellow pixel, an operator glancing at
Program can misread the state. This is the single most important rule on the
scene.</li>
<li>It is the same design language as the opening slate with the lights down —
same dot field, same gradients, same type — so it still reads as the same
channel. Just switched off.</li>
<li>The signal glyph is a broadcast emitter with its transmission struck
through, not an electrical plug. A plug reads as <i>household power</i>, which
is the wrong register for a broadcast channel entirely.</li>
<li>Movement is slow and ambient. Motion here is for whoever is sitting in an
empty studio at 2am, not for an audience.</li>
<li>The message is explicit: not transmitting, safe to leave on Program.</li>
</ul>

<div class="spec">1920x1080 · no canvas · no rAF
?next=21:00             countdown to the next occurrence, read as LOCAL time
?next=2026-10-06T21:00  a full local wall-clock stamp
?note=...               replace the safety line
One gated interval drives the clock.
Local time on purpose: a UTC stamp here would silently miscount by hours, which
is the worst possible failure in the one scene you must be able to trust.</div>

<h2>Failure modes worth avoiding</h2>
<ul>
<li><b>Any accent colour that means "live" elsewhere.</b> The rule above is not
negotiable.</li>
<li><b>Ambient life.</b> No carousels, no animations that imply content is about
to start.</li>
<li><b>A countdown that can go negative or wrap.</b> Past the target time, it
should say the session should be open, not count into negatives.</li>
<li><b>Leaving it on air for hours.</b> It is a safety state, not a filler.</li>`

<h1>Video panel / full-frame media scene</h1>

<h2>What it is</h2>
<p>A full-frame video surface with the channel's furniture floating over it: logo,
ticker, and a now-playing label. Whatever the video happens to be — a meeting, a
screen share, a recorded segment — it becomes part of the channel rather than a
window opened on someone's desktop.</p>
<p>This is the scene that does the heaviest lifting for the least work. The same
file handles every video you will ever need to show, because the content lives in
a URL, not in the layout.</p>

<h2>What it is for</h2>
<ul>
<li><b>Turning a working meeting into a broadcast.</b> Same room, same people,
same conversation — but it looks like a channel instead of a video call.</li>
<li><b>Carrying every video in the set.</b> Authored sets play through in order,
so the scene can run unattended for a whole block.</li>
<li><b>Filling the schedule between live segments.</b> Pre-recorded material,
talking-head pieces, anything.</li>
<li><b>Not looking like a browser tab.</b> The chrome is what separates a
stream from someone sharing their screen.</li>
</ul>

<h2>What you will see in other shows</h2>
<p>Every professional streamer and broadcaster uses exactly this layout: the video
at full bleed, the channel mark in a corner, and a lower strip. The premium detail
is that <i>nothing on screen belongs to the video player</i> — no progress bar,
no suggested-video card, no logo overlay from the source platform.</p>

<h2>Design notes</h2>
<ul>
<li>The player chrome is off. Progress bar, suggested-video end cards and
platform watermarks are all suppressed. The channel's furniture replaces them.</li>
<li>The mark carries a scrim behind it, because it sits over live video where
contrast is not guaranteed. Over flat colour it would not need one.</li>
<li>The ticker strip is inset from the left edge and runs the full width, so it
reads as broadcast furniture rather than a web element.</li>
<li>Nothing about the furniture moves much. Over moving video, animated chrome
competes with the content and reads as a screensaver.</li>
<li>Volume defaults to half and unmute is armed on the first keypress — audible
autoplay is blocked by every current browser, so the frame sits muted until you
touch a key, then comes up at half.</li>
<li>Captions are off by default. Captions on an already-quiet room is a fight
nobody needs; turn them on deliberately for silent footage.</li>
</ul>

<div class="spec">1920x1080 · no canvas · no rAF
?pl=hdf|menta|almond|all   which set plays (default: all)
?yt=<url or id>            a single video, overrides the set
?start=<sec>               offset — MEASURED to break autoplay, leave at 0
?vol=0-100                 volume, default 50
?mute=1                    start muted instead
?ctl=1                     restore the player controls
?lab=... ?cap=...          override the label and subtitle

Keys: PageUp / PageDown skip the set. Space plays.
Works standalone or embedded in the scene browser — the browser re-broadcasts
PageUp/PageDown, because the focused element is the cross-origin player.</div>

<h2>Failure modes worth avoiding</h2>
<ul>
<li><b>Player controls over the top of channel furniture.</b> Two competing
transport bars read as a cheap screen share.</li>
<li><b>Muted by default.</b> An audience cannot tell muted from broken. This is
the single most common complaint about streaming scenes.</li>
<li><b>Autoplay blocked.</b> If you see a dead play button, nothing is wrong with
the video — press any key.</li>
<li><b>Bright chrome over bright content.</b> The scrim exists for this reason;
remove it and the mark disappears on white slides.</li>
<li><b>Letterboxing a 4:3 source in a 16:9 frame.</b> Let the player letterbox
inside the frame rather than stretching. It looks like broadcast video; the

<h1>End card + credits roll</h1>

<h2>What it is</h2>
<p>The card the channel rests on after the programme. Two halves: a farewell
message with a call to action, and a credits panel that names everyone involved
with a completion bar of its own.</p>
<p>The credits roll is borrowed from film and television, where the names are the
point — a hundred people made the thing and the audience is being told their
names. Online that habit has mostly been lost. Putting it back does two things:
it credits people who are rarely credited, and it makes the channel feel like a
production rather than a webcam.</p>

<h2>What it is for</h2>
<ul>
<li><b>Closing on the call to action.</b> The last thing on screen is the one
thing you want remembered. Not the credits.</li>
<li><b>Naming the people who did the work.</b> This is the motivation engine.
Being named on the end card is a real, visible, permanent acknowledgement.</li>
<li><b>Signalling "this was a complete show".</b> Without an end card, a stream
just stops. With one, it finished.</li>
<li><b>Filling the tail.</b> The minutes after the last person says goodbye
before the next thing starts.</li>
<li><b>Driving the follow.</b> Notifications, next session, where to go next.</li>
</ul>

<h2>What you will see in other shows</h2>
<p>Talk shows with large ensembles end on a credits roll over a still or a loop.
Gaming channels run production credits on a static card. Studio albums, films and
television all end the same way — the roll exists to credit and to let a
production feel finished. On the web the equivalent is a "thanks" card, and the
premium version always has names on it.</p>

<h2>Design notes</h2>
<ul>
<li>Headline follows the same gradient treatment as every other scene: grey
words, one gold word carrying the meaning, soft glow.</li>
<li>Names are set large and tabular. This panel is read, not glanced at.</li>
<li>Roles are small, uppercase, wide-tracked, and grey. Names dominate; titles
support. Getting this backwards makes the card look like a directory.</li>
<li>The completion bar repeats the segment idiom from the chapter card, so the
whole kit has one visual language for "finished".</li>
<li>The call to action sits under the headline, brighter than anything else, and
it is the last thing the eye lands on.</li>
<li>The channel signature sits small and low, the way a station ident does.</li>
</ul>

<div class="spec">1920x1080 · no canvas · no rAF
No parameters. It is a fixed card and should never need updating.</div>

<h2>Failure modes worth avoiding</h2>
<ul>
<li><b>Generic credits.</b> "Production team", "editing", "special thanks" with
no names is worse than no credits at all — it looks like a template nobody
filled in.</li>
<li><b>Crediting the same six people every time.</b> Rotate the board.</li>
<li><b>Letting the roll scroll too fast to read.</b> If it cannot be read, it is

<li><b>Credits over the call to action.</b> The CTA is what converts; do not

<li><b>It is still running.</b> Cut to off-air when the programme genuinely ends.
The end card is for the tail, not for the whole night.</li>`

/* ---------- rendering ---------- */
const wrap = document.getElementById('wrap');
const frame = document.getElementById('frame');
const notes = document.getElementById('notes');

function fit(){
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  wrap.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
}
addEventListener('resize', fit); fit();

/* Wrap in both directions. Nothing is a dead end: you can always go back,
   including back off the first scene, because someone will always ask to see
   the thing you just showed them again. */
function go(i){
  cur = ((i % SCENES.length) + SCENES.length) % SCENES.length;
  const s = SCENES[cur];
  if (frame.src.indexOf(s.file) < 0) frame.src = s.file;
  else frame.contentWindow.location.reload();   // re-fire the intro animation
  notes.innerHTML = s.notes;
  history.replaceState(null, '', '#' + (cur + 1));
  hideHint();
  try{
    frame.contentDocument.addEventListener('keydown', e => keys(e), true);
  }catch(_){}
  // The player iframe is cross-origin and swallows keys. Re-broadcast the
  // transport keys so PageUp/PageDown still work while the deck is driving.
  try{ frame.contentWindow.addEventListener('message', e => {
    if(e.data && e.data.type === 'smiletv-key') {
      const el = frame.contentDocument;
      if (el) el.dispatchEvent(new KeyboardEvent('keydown', {key:e.data.key}));
    }
  }); }catch(_){}
}

function hideHint(){ const h=document.getElementById('hint'); if(h) h.classList.add('gone'); }

let cur = -1;
function keys(e){
  const k = e.key;
  if (k >= '1' && k <= String(SCENES.length)) { e.preventDefault(); go(+k - 1); return; }
  if (k === 'Enter' || k === 'ArrowRight' || k === ' ') {
    e.preventDefault(); go(cur + 1); return;
  }
  if (k === 'ArrowLeft' || k === 'Backspace') { e.preventDefault(); go(cur - 1); return; }
  if (k === 'n' || k === 'N') { notes.classList.toggle('on'); hideHint(); return; }
  if (k === '?' || k === '/') { notes.classList.toggle('on'); return; }
  if (k === 'f' || k === 'p' || k === 'F') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
    return;
  }
  /* PageUp / PageDown belong to the scene, not to this browser — the meet
     scene uses them to skip video. Forward them and change nothing here. */
  if (k === 'PageUp' || k === 'PageDown') {
    e.preventDefault();
    try{ frame.contentWindow.postMessage({type:'smiletv-key', key:k}, '*'); }catch(_){}
    return;
  }
}
addEventListener('keydown', keys);
addEventListener('pointerdown', hideHint, {once:true});
setTimeout(hideHint, 6500);

/* Reload-safe: #3 opens the third scene. */
const start = (parseInt(location.hash.replace('#',''),10) || 1) - 1;
cur = -1;
go(start);
</script>
</body>
</html>

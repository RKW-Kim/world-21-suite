<!doctype html><meta charset=utf-8>
<style>
body{background:#0a0a0d;margin:0;padding:40px;font-family:system-ui;color:#aaa;display:flex;gap:70px}
.z{transform:scale(2.6);transform-origin:top left;margin-right:230px}
/* exact rules from overlay/q&a.html */
.bcard{position:relative;border:1.5px solid transparent;border-radius:20px;border-bottom-left-radius:12.5px;padding:13px 18px 15px;
  background:linear-gradient(#121216,#0e0e12) padding-box,
    conic-gradient(from var(--a0),rgba(255,255,255,.05) 0 58%,var(--pc) 76%,rgba(255,255,255,.05) 94%) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px color-mix(in srgb,var(--pc) 16%,transparent),
    0 0 22px color-mix(in srgb,var(--pc) 13%,transparent),0 14px 36px rgba(0,0,0,.5);width:300px}
.bcard.yt{--pc:rgba(255,45,72,.95);--a0:20deg}
.bcard.fb{--pc:rgba(48,138,245,.95);--a0:150deg}
.bcard.flip{border-radius:20px;border-bottom-right-radius:12.5px}
.bcard::before,.bcard::after{content:"";position:absolute;width:0;height:0;border-style:solid;pointer-events:none;z-index:0}
.bcard::before{bottom:-16px;left:28px;border-width:17px 11px 0 11px;border-color:var(--pc) transparent transparent transparent}
.bcard::after{bottom:-16px;left:32px;border-width:13px 7px 0 7px;border-color:#101014 transparent transparent transparent}
.bcard.flip::before{left:auto;right:28px}
.bcard.flip::after{left:auto;right:32px}
.h b{color:#ffd100;font:800 12px system-ui;letter-spacing:.08em}
.q{color:#e8e8ee;font:600 17px system-ui;line-height:1.35;display:block;margin-top:7px}
</style>
<div class="z"><div class="bcard yt"><span class="h"><b>@MARKETNOTES</b></span>
<span class="q">How do I keep up when I miss a day of the market?</span></div></div>
<div class="z"><div class="bcard fb flip"><span class="h"><b>@GROWTHFAN88</b></span>
<span class="q">Where does everyone here get their news from?</span></div></div>
